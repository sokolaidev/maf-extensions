apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hyperlight-pod-controller
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods/attach"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "update", "delete"]
