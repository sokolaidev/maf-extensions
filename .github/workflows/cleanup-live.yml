name: Cleanup (live)

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview sandboxes stopped for over 24 hours without deleting them"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cleanup-live
  cancel-in-progress: false

jobs:
  acas-cleanup:
    name: Delete ACAS sandboxes stopped for over one day
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: live-verify
    permissions:
      contents: read
      id-token: write
    env:
      ACAS_SANDBOX_ENDPOINT: ${{ vars.ACAS_SANDBOX_ENDPOINT }}
      ACAS_SANDBOX_SUBSCRIPTION_ID: ${{ secrets.ACAS_SANDBOX_SUBSCRIPTION_ID }}
      ACAS_SANDBOX_RESOURCE_GROUP: ${{ secrets.ACAS_SANDBOX_RESOURCE_GROUP }}
      ACAS_SANDBOX_GROUP: ${{ secrets.ACAS_SANDBOX_GROUP }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Check the live configuration is present
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            ACAS_SANDBOX_ENDPOINT ACAS_SANDBOX_SUBSCRIPTION_ID \
            ACAS_SANDBOX_RESOURCE_GROUP ACAS_SANDBOX_GROUP; do
            if [ -z "${!name}" ]; then
              echo "::error::the live-verify environment is missing $name"
              exit 1
            fi
          done

      - name: Sign in to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sweep the configured sandbox group
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          set -euo pipefail
          args=(--stopped-for-hours 24 --summary "$GITHUB_STEP_SUMMARY")
          if [ "$DRY_RUN" != true ]; then
            args+=(--apply)
          fi
          uv run --no-project scripts/cleanup_acas_sandboxes.py "${args[@]}"

  report-failure:
    name: Report cleanup live failure
    needs: acas-cleanup
    if: always() && needs.acas-cleanup.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Open or notify the cleanup live tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/report_workflow_failure.py
          --marker '<!-- cleanup-live-failure-tracker -->'
          --title 'ACAS live cleanup failed'
          --reproduce 'Inspect the linked run summary and sweep logs. Dispatch cleanup-live.yml with dry_run enabled to preview the inventory before retrying deletion.'
          --expected 'The sweep accounts for every sandbox and deletes eligible sandboxes stopped for over 24 hours when deletion is enabled.'
          --context 'ACAS sandboxes stopped for over 24 hours may remain unreclaimed and continue costing money. The run summary shows counts; the sweep log lists eligible, deleted, already_absent, retained, and failures. Inspect failures for resources whose deletion was not confirmed; retained resources changed state and were intentionally kept. If setup or inventory failed, the unreclaimed inventory is unknown. A manual dry run previews only and reclaims nothing.'
          --packages maf-sandbox-acas
