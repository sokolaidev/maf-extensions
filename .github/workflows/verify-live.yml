    name: samples/11_router_two_backends against a live container
    # The router's own job — which backend serves, what it refuses, what it lets a workload
    # reach, who disposal reaches, and which backend a spec routes to. Acts 1, 2, 3, 5 and 6
    # exercise the router (maf-sandbox) and the backend it selects (maf-sandbox-docker) and
    # nothing else, and all six are required — the sample's floor names the core that carries
    # `Selection`, so act 6 has nothing to feature-detect and a skipped one is a failure.
    # Act 4 adds the Bicep kind,
    # because the only honest way to show egress deciding an outcome is a workload that cannot
    # do its job without the network it asked for — so a maf-sandbox-bicep release can change
