          # Two halves, and neither carries it alone: a read whose result was the bytes landed
          # under this call's folder, and the grand total in the reply. The exit bit a withheld
          # result still carries is a road the total on its own cannot rule out.
          # stdlib-only, so the runner's own python3 runs it.
          python3 "$HARNESS"/scripts/check_live_codeact_outputs_store_sample.py /tmp/sample16-out.txt

      - name: Assert the published version the sample resolved
        if: ${{ always() && inputs.version != '' }}
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 "$HARNESS"/scripts/check_live_versions.py /tmp/sample16-out.txt "$PACKAGE" "$VERSION"
  acas-e2e:
    name: maf-sandbox-acas conformance against a live sandbox group
    # **The one job here that is not a sample**, and the one that does not install published
    # wheels: it runs the workspace suite from this checkout, because it tests a backend rather
    # than what a reader can install. Everything below it in this file answers "does the
    # published set still work"; this one answers "does the real service still do what this
    # backend believes", which no sample can (#306). A sample proves a happy path with a model
    # in the loop and covers no refusal at all — not the symlinked-parent walk, not the cap,
    # not teardown read back from the service instead of from process memory.
    #
    # It is also the only place four of the shared FILES_OUT probes meet the real service: they
    # require Capability.FILES_LIST and maf-sandbox-acas is the only backend declaring it, so
    # they skip in docker's suite, the one a pull request can run. A fake answers them on every
    # pull request in test_acas_backend.py — which is not the same claim, and #139 and #142 are
    # what the difference costs. The suite asserts nothing skipped rather than trusting a green
    # summary, since a skipped listing probe reports exactly like a passing one.
    #
    # **The fifth billable job**, and the cheapest of them per assertion: four sandboxes acquired
    # over the run — at most two alive at once — for nineteen tests, no model, no tokens. It needs
    # no model configuration and so reads neither AZURE_OPENAI variable — the rule stated on the
    # header applies, a job reads what it uses.
    #
    # maf-sandbox and maf-sandbox-acas only: the conformance probes live in the core and the
    # backend under test is the other, and no kind is involved.
    if: >-
      inputs.package == ''
      || contains(fromJSON('["maf-sandbox", "maf-sandbox-acas"]'), inputs.package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: live-verify
    permissions:
      # Mints the OIDC token azure/login exchanges. No secret is involved.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      # The five the suite reads plus the three azure/login consumes. No model variables: this
      # job calls no model. BICEP_SANDBOX_IMAGE is here because it supplies the guest below —
      # any Linux image in the registry with sh, ln, cat, mkfifo and, for the egress leg, curl
      # would do, and this is the one already known to pull.
      - name: Check the live configuration is present
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ACAS_SANDBOX_ENDPOINT: ${{ vars.ACAS_SANDBOX_ENDPOINT }}
          ACAS_SANDBOX_SUBSCRIPTION_ID: ${{ secrets.ACAS_SANDBOX_SUBSCRIPTION_ID }}
          ACAS_SANDBOX_RESOURCE_GROUP: ${{ secrets.ACAS_SANDBOX_RESOURCE_GROUP }}
          ACAS_SANDBOX_GROUP: ${{ secrets.ACAS_SANDBOX_GROUP }}
          ACAS_SANDBOX_REGISTRY: ${{ secrets.ACAS_SANDBOX_REGISTRY }}
          BICEP_SANDBOX_IMAGE: ${{ vars.BICEP_SANDBOX_IMAGE }}
        run: |
          set -euo pipefail
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            ACAS_SANDBOX_ENDPOINT ACAS_SANDBOX_SUBSCRIPTION_ID ACAS_SANDBOX_RESOURCE_GROUP \
            ACAS_SANDBOX_GROUP ACAS_SANDBOX_REGISTRY BICEP_SANDBOX_IMAGE; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::the live-verify environment is missing: ${missing[*]}. See docs/maintainers.md."
            exit 1
          fi

      - name: Sign in to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sync workspace
        run: uv sync --locked

      # `-ra` because this suite skips itself when a variable it gates on is empty, and the
      # check above has already made that impossible for every required one: a skip here is a
      # bug rather than a configuration gap, and without the summary it reads identically to a
      # pass. One leg is deliberately optional — the non-root gate needs an image whose USER is
      # not root, which a deployment need not have imported — and it names itself in the
      # summary when it skips.
      - name: Run the ACAS live suite
        env:
          ACAS_SANDBOX_ENDPOINT: ${{ vars.ACAS_SANDBOX_ENDPOINT }}
          ACAS_SANDBOX_SUBSCRIPTION_ID: ${{ secrets.ACAS_SANDBOX_SUBSCRIPTION_ID }}
          ACAS_SANDBOX_RESOURCE_GROUP: ${{ secrets.ACAS_SANDBOX_RESOURCE_GROUP }}
          ACAS_SANDBOX_GROUP: ${{ secrets.ACAS_SANDBOX_GROUP }}
          ACAS_SANDBOX_REGISTRY: ${{ secrets.ACAS_SANDBOX_REGISTRY }}
          MAF_SANDBOX_ACAS_E2E_IMAGE: ${{ vars.BICEP_SANDBOX_IMAGE }}
          MAF_SANDBOX_ACAS_E2E_NONROOT_IMAGE: ${{ vars.ACAS_SANDBOX_NONROOT_IMAGE }}
        run: |
          set -euo pipefail
          uv run pytest packages/maf-sandbox-acas/tests/test_acas_e2e.py -q -ra
