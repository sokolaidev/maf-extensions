    # ACAS microVM. It bills nothing and needs no sandbox configuration — a container on the runner
    # and a model reached with a federated credential, the same economics as samples 06 and 08.
    # Docker declares HOST_TOOLS and FILES_OUT, so the dispatch transport runs; it declares no
    # FILES_LIST, so the check runs with `--docker`, which drops the act-5 leftover enumeration the
    # sample takes only on ACAS. Runs for the router (maf-sandbox), the docker backend
    # (maf-sandbox-docker) and the kind that owns the dispatch wiring (maf-sandbox-codeact).
