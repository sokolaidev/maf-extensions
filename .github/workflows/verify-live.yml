      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Only when `HARNESS` points at it — see the `env` block above for why the checks come
      # from somewhere other than the samples. Sparse, because `scripts/` is all that is read.
      - name: Check out the checks from the default branch
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          path: .harness
          sparse-checkout: scripts

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Wait for this runner's PyPI edge to serve the release
        if: ${{ inputs.version != '' }}
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # uv is the probe rather than a request of our own: a different client reads a
          # different CDN cache object, and polling the index passed while the sample resolved
          # the release before this one 0.7s later on the same runner (#595).
          python3 "$HARNESS"/scripts/await_live_version.py "$PACKAGE" "$VERSION"

      - name: Run sample 12 and assert every sandbox was reclaimed
        run: |
          set -euo pipefail
          uv run --no-project samples/12_purge_lifecycle/agent.py | tee /tmp/sample12-out.txt
          # Two assertions carry it: no container left behind, and the purger finding 1 on the
          # abandoned thread — a purger wired to nothing reports 0 everywhere, so the tidy
          # thread's expected 0 cannot be the only zero checked. stdlib-only, so the runner's
          # own python3 runs it.
          python3 "$HARNESS"/scripts/check_live_purge_sample.py /tmp/sample12-out.txt

      - name: Assert the published version the sample resolved
