name: Verify (live)

# Installs the PUBLISHED wheels into a clean environment and runs the samples below, each
# asserting that its own workload ran rather than that the program exited zero.
#
# **One job is not a sample and does not install published wheels**: `acas-e2e` runs
# `maf-sandbox-acas`'s live suite from this checkout. Everything else here asks "does the
# published set still work"; that one asks "does the real service still do what the backend
# believes" — refusals, confinement, teardown read back from the service — which a sample with a
# model in the loop cannot ask (#306). It is listed here rather than in its own workflow because
# this is where the `live-verify` environment, the OIDC login and the billable-run gating already
# live, and splitting it would duplicate all three.
#
# **No check here can be satisfied by the model's prose.** A sample that judges a tool's answer
# prints a fenced block of what the tool returned, closed by a line tagged `[measured]`, and its
# check reads that. A sample that judges a landed file prints no block — it reads the file, and
# off the tag it reads what the host counted: what the router disposed, and for 08 and 14 what
# the sink took. Several checks additionally require the answer to appear in the reply, which is
# a claim about the round trip reaching the model and is never the condition carrying a verdict.
# The alternative was wrong in both directions: a model that never called the tool could satisfy
# a check made over prose, and three healthy releases went red over a run writing `**error**`
# where the pattern wanted `[error]` (#314).
#
# Half are paired: one workload against a billable Azure microVM and the same workload against
# a container, so a red on one side alone names the backend. 01 and 05 report the compiler's
# diagnostics; 03 and 06 return the 100th Fibonacci number from code run in the sandbox; 08 and
# 14 land a declared summary on disk and gate on the file, not on the account of it; 15
# dispatches a host tool from a program in the sandbox back into the host and gates on which route
# carried the data, run on either backend via SAMPLE_BACKEND (the `sample-15` and
# `sample-15-docker` jobs) — its leftover-traffic act the one part docker cannot supply. 07 lands
# one too, through a kind written in the sample instead of the packaged one, and pairs with 08 on
# this side of the machine rather than across backends. 09 runs 01's bicep workload against the
# CLI on the runner itself, so it pairs with nothing and names no backend. 13 is the only job
# that runs more than one turn: a model writes a file, the compiler reports on it, and a second
# turn repairs it against the same sandbox.
#
# This is the half of issue #33 that runs after a release rather than on a pull request. The
# ACAS jobs each create a billable Azure sandbox and need a subscription; the docker jobs create
# a container on the runner and need no sandbox configuration; 09 needs neither. **A job that
# calls no model and reads no variable carries no `environment:` and no `permissions:` block**,
# because it mints no token — stated as the rule rather than a list, which is what went stale
# here before. It runs on demand, and once after each release that could change what a sample
# exercises (dispatched by publish-packages.yml).
#
# Samples 02 and 04 are the two with no job, and structurally: `wslc` needs Windows with a WSL
# that ships it, which the Linux runners are not.
#
# Authentication is OIDC federation to Azure — no stored secret, matching how publishing works.
# Everything each sample reads is non-secret configuration (endpoints and ids), held as
# environment variables on the `live-verify` environment. The ACAS jobs read the sandbox
# configuration as well as the model's; every other job that calls a model reads only the
# model's, whether its guest is built here or pulled; a job that calls no model reads nothing.
# See docs/maintainers.md.
#
# PEP 723 metadata is the single dependency source; `--no-project` ensures uv resolves its
# published packages rather than this checkout's workspace.
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package whose release to verify (empty runs every sample)"
        required: false
        type: string
        default: ""
      version:
        description: "Version of the package just published (empty skips the installed-version assertion)"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      package:
        description: "Package whose release to verify (empty runs every sample)"
        required: false
        type: string
        default: ""
      version:
        description: "Version of the package just published (empty skips the installed-version assertion)"
        required: false
        type: string
        default: ""

# Key by package because GitHub retains only one pending run per concurrency group; a global group
# silently drops checks from parallel package releases. Keep same-package runs serialized and never
# cancel an in-flight run so it can dispose its sandbox itself (#325).
concurrency:
  group: verify-live-${{ inputs.package || 'all' }}
  cancel-in-progress: false

permissions:
  contents: read

# Where the `scripts/check_live_*.py` assertions are read from, which is not where the samples
# are read from. The samples are the thing under test and belong at the ref that triggered the
# run — for a post-release call that is the release tag, so they are the code that shipped. The
# checks are the *test*, and a test has no business being frozen with its subject: a tagged run
# would otherwise assert with the checker as it stood at the tag, so a fix to it could never
# reach a release already cut, and a checker bug found mid-train keeps costing for the rest of
# that train. `.` for any other ref, so dispatching from a branch still runs that branch's
# checks — which is how a change to one gets tried out. (#318.)
env:
  HARNESS: ${{ startsWith(github.ref, 'refs/tags/') && '.harness' || '.' }}

jobs:
  sample-01:
    name: samples/01_acas_bicep against a live sandbox
    # Empty input (verify-everything) or a package sample-01 actually exercises: the router
    # (maf-sandbox) and the backend it runs on (maf-sandbox-acas) both affect it, and so does
    # its own package (maf-sandbox-bicep); a maf-sandbox-codeact or maf-sandbox-wslc release
    # cannot change anything this sample does.
    if: >-
      inputs.package == ''
      || contains(fromJSON('["maf-sandbox", "maf-sandbox-acas", "maf-sandbox-bicep"]'), inputs.package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Half of the federated-credential subject Azure checks, and where the non-secret sandbox
    # and model configuration lives. `live-verify` is deliberately ungated: the post-release
    # call must not wait on a human, and there is no credential to protect while it does.
    environment: live-verify
    permissions:
      # Mints the OIDC token azure/login exchanges. No secret is involved.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Only when `HARNESS` points at it — see the `env` block above for why the checks come
      # from somewhere other than the samples. Sparse, because `scripts/` is all that is read.
      - name: Check out the checks from the default branch
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          path: .harness
          sparse-checkout: scripts

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      # Fail early and by name if the environment was never configured — azure/login's own
      # error for an empty client-id does not say which field is missing.
      - name: Check the live configuration is present
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ACAS_SANDBOX_ENDPOINT: ${{ vars.ACAS_SANDBOX_ENDPOINT }}
          ACAS_SANDBOX_SUBSCRIPTION_ID: ${{ secrets.ACAS_SANDBOX_SUBSCRIPTION_ID }}
          ACAS_SANDBOX_RESOURCE_GROUP: ${{ secrets.ACAS_SANDBOX_RESOURCE_GROUP }}
          ACAS_SANDBOX_GROUP: ${{ secrets.ACAS_SANDBOX_GROUP }}
          ACAS_SANDBOX_REGISTRY: ${{ secrets.ACAS_SANDBOX_REGISTRY }}
          BICEP_SANDBOX_IMAGE: ${{ vars.BICEP_SANDBOX_IMAGE }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_MODEL: ${{ vars.AZURE_OPENAI_CHAT_MODEL }}
        run: |
          set -euo pipefail
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            ACAS_SANDBOX_ENDPOINT ACAS_SANDBOX_SUBSCRIPTION_ID ACAS_SANDBOX_RESOURCE_GROUP \
            ACAS_SANDBOX_GROUP ACAS_SANDBOX_REGISTRY BICEP_SANDBOX_IMAGE \
            AZURE_OPENAI_ENDPOINT AZURE_OPENAI_CHAT_MODEL; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::the live-verify environment is missing: ${missing[*]}. See docs/maintainers.md."
            exit 1
          fi

      - name: Sign in to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Wait for this runner's PyPI edge to serve the release
        if: ${{ inputs.version != '' }}
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # uv is the probe rather than a request of our own: a different client reads a
          # different CDN cache object, and polling the index passed while the sample resolved
          # the release before this one 0.7s later on the same runner (#595).
          python3 "$HARNESS"/scripts/await_live_version.py "$PACKAGE" "$VERSION"

      # Runs the sample as a consumer would, then asserts on the block it prints from what
      # bicep_validate returned. The sample authenticates with DefaultAzureCredential, which
      # the az login above satisfies — the AZURE_CLIENT_ID/TENANT/SUBSCRIPTION values are login
      # inputs only and are deliberately not exported here, so DefaultAzureCredential resolves
      # cleanly through the CLI rather than a half-populated EnvironmentCredential.
      - name: Run sample 01 and assert the diagnostics came back
        env:
          ACAS_SANDBOX_ENDPOINT: ${{ vars.ACAS_SANDBOX_ENDPOINT }}
          ACAS_SANDBOX_SUBSCRIPTION_ID: ${{ secrets.ACAS_SANDBOX_SUBSCRIPTION_ID }}
          ACAS_SANDBOX_RESOURCE_GROUP: ${{ secrets.ACAS_SANDBOX_RESOURCE_GROUP }}
          ACAS_SANDBOX_GROUP: ${{ secrets.ACAS_SANDBOX_GROUP }}
          ACAS_SANDBOX_REGISTRY: ${{ secrets.ACAS_SANDBOX_REGISTRY }}
          BICEP_SANDBOX_IMAGE: ${{ vars.BICEP_SANDBOX_IMAGE }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_MODEL: ${{ vars.AZURE_OPENAI_CHAT_MODEL }}
        run: |
          set -euo pipefail
          uv run --no-project samples/01_acas_bicep/agent.py | tee /tmp/sample-out.txt
          # stdlib-only, so the runner's own python3 runs it — uv run's env is not on its path.
          python3 "$HARNESS"/scripts/check_live_sample.py /tmp/sample-out.txt

      - name: Assert the published version the sample resolved
        if: ${{ always() && inputs.version != '' }}
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 "$HARNESS"/scripts/check_live_versions.py /tmp/sample-out.txt "$PACKAGE" "$VERSION"
  sample-03:
    name: samples/03_acas_codeact against a live sandbox
    # No `needs: sample-01` — the two never had a data dependency (each creates its own
    # sandbox and reads disjoint configuration); the `needs` edge existed only to keep this
    # run's billable sandboxes from being up at the same time. That trade is deliberately
    # flipped now: the jobs run concurrently, so for the few minutes the ACAS samples are live
    # their sandboxes are up at once, in exchange for the run taking one sample's time instead
    # of all of them in turn. A failure still names which sample broke.
    # Four per run since sample-15 joined — 01, 03, 14 and 15 — and four per run is not four
    # overall: the workflow-level `concurrency` block above is keyed per package, so a release
    # train verifying several packages has several runs in flight and each holds its own. What
    # each package costs is the number of billable jobs its `if` admits: `maf-sandbox` and
    # `maf-sandbox-acas` five (01, 03, 14, 15 and `acas-e2e`), `maf-sandbox-codeact` three (03,
    # 14 and 15), `maf-sandbox-bicep` one (01), everything else none. Count sandboxes rather than
    # jobs, and count them twice, because spend and concurrency are different numbers here.
    # `acas-e2e` **acquires four sandboxes over its run** — one shared by its probes, one the
    # lifecycle test disposes as the thing under test, one the prebuilt-image test boots from the
    # catalogue, one the egress leg acquires under an allowlist — but **holds at most two at
    # once**: the shared one plus whichever of the other three is alive, because the lifecycle
    # test disposes its own inside the test, the prebuilt one hangs off a *class*-scoped fixture
    # pytest finalises when that class ends, and the egress one comes from a module-scoped fixture
    # first requested by the class after it. sample-15 holds two, a sandbox per route. So a train
    # releasing all four peaks at nineteen concurrent billable sandboxes (7 + 7 + 4 + 1) for the
    # twenty minutes the timeout allows, where this note said thirteen before sample 15, nine
    # before the live suite and six before sample 14. Total spend is unchanged by the concurrency;
    # only the peak moved. (#325.)
    # Empty input (verify-everything) or a package sample-03 actually exercises: the router
    # (maf-sandbox) and the backend it runs on (maf-sandbox-acas) both affect it, and so does
    # its own package (maf-sandbox-codeact); a maf-sandbox-bicep or maf-sandbox-wslc release
    # cannot change anything this sample does.
    if: >-
      inputs.package == ''
      || contains(fromJSON('["maf-sandbox", "maf-sandbox-acas", "maf-sandbox-codeact"]'), inputs.package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Half of the federated-credential subject Azure checks, and where the non-secret sandbox
    # and model configuration lives. `live-verify` is deliberately ungated: the post-release
    # call must not wait on a human, and there is no credential to protect while it does.
    environment: live-verify
    permissions:
      # Mints the OIDC token azure/login exchanges. No secret is involved.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Only when `HARNESS` points at it — see the `env` block above for why the checks come
      # from somewhere other than the samples. Sparse, because `scripts/` is all that is read.
      - name: Check out the checks from the default branch
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          path: .harness
          sparse-checkout: scripts

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      # Fail early and by name if the environment was never configured — azure/login's own
      # error for an empty client-id does not say which field is missing, which is the whole
      # reason the login triple is checked here too and not only the six variables
      # samples/03_acas_codeact itself reads. No registry and no image variable among those
      # six: CODEACT_IMAGE is a hardcoded bare prebuilt name (python-3.13) the group resolves
      # from its catalogue, so nothing is imported and no registry is configured for it.
      # The triple is checked and deliberately *not* exported to the run step below — see the
      # note there about EnvironmentCredential.
      - name: Check the live configuration is present
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ACAS_SANDBOX_ENDPOINT: ${{ vars.ACAS_SANDBOX_ENDPOINT }}
          ACAS_SANDBOX_SUBSCRIPTION_ID: ${{ secrets.ACAS_SANDBOX_SUBSCRIPTION_ID }}
          ACAS_SANDBOX_RESOURCE_GROUP: ${{ secrets.ACAS_SANDBOX_RESOURCE_GROUP }}
          ACAS_SANDBOX_GROUP: ${{ secrets.ACAS_SANDBOX_GROUP }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_MODEL: ${{ vars.AZURE_OPENAI_CHAT_MODEL }}
        run: |
          set -euo pipefail
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            ACAS_SANDBOX_ENDPOINT ACAS_SANDBOX_SUBSCRIPTION_ID ACAS_SANDBOX_RESOURCE_GROUP \
            ACAS_SANDBOX_GROUP AZURE_OPENAI_ENDPOINT AZURE_OPENAI_CHAT_MODEL; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::the live-verify environment is missing: ${missing[*]}. See docs/maintainers.md."
            exit 1
          fi

      - name: Sign in to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Wait for this runner's PyPI edge to serve the release
        if: ${{ inputs.version != '' }}
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # uv is the probe rather than a request of our own: a different client reads a
          # different CDN cache object, and polling the index passed while the sample resolved
          # the release before this one 0.7s later on the same runner (#595).
          python3 "$HARNESS"/scripts/await_live_version.py "$PACKAGE" "$VERSION"

      # Runs the sample as a consumer would, then asserts on the interpreter's own stdout,
      # which the sample prints from the tool result rather than from the reply. The sample
      # authenticates with DefaultAzureCredential, which the az login above satisfies — the
      # AZURE_CLIENT_ID/TENANT/SUBSCRIPTION values are login inputs only and are deliberately
      # not exported here, so DefaultAzureCredential resolves cleanly through the CLI rather
      # than a half-populated EnvironmentCredential.
      - name: Run sample 03 and assert the computed answer came back
        env:
          ACAS_SANDBOX_ENDPOINT: ${{ vars.ACAS_SANDBOX_ENDPOINT }}
          ACAS_SANDBOX_SUBSCRIPTION_ID: ${{ secrets.ACAS_SANDBOX_SUBSCRIPTION_ID }}
          ACAS_SANDBOX_RESOURCE_GROUP: ${{ secrets.ACAS_SANDBOX_RESOURCE_GROUP }}
          ACAS_SANDBOX_GROUP: ${{ secrets.ACAS_SANDBOX_GROUP }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_MODEL: ${{ vars.AZURE_OPENAI_CHAT_MODEL }}
        run: |
          set -euo pipefail
          uv run --no-project samples/03_acas_codeact/agent.py | tee /tmp/sample03-out.txt
          # stdlib-only, so the runner's own python3 runs it — uv run's env is not on its path.
          python3 "$HARNESS"/scripts/check_live_codeact_sample.py /tmp/sample03-out.txt

      - name: Assert the published version the sample resolved
        if: ${{ always() && inputs.version != '' }}
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 "$HARNESS"/scripts/check_live_versions.py /tmp/sample03-out.txt "$PACKAGE" "$VERSION"
  sample-05:
    name: samples/05_docker_bicep against a live container
    # Sample 01's workload and its `main.bicep`, in a Docker container on this runner instead of
    # a billable Azure microVM — so the assertion is sample 01's too, and a red here while
    # sample-01 is green is a statement about the backend rather than about the compiler. Runs
    # for the router (maf-sandbox), the backend (maf-sandbox-docker) and its own kind
    # (maf-sandbox-bicep); an acas, codeact or wslc release cannot change what this sample does.
    if: >-
      inputs.package == ''
      || contains(fromJSON('["maf-sandbox", "maf-sandbox-bicep", "maf-sandbox-docker"]'), inputs.package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # For the model only: `live-verify` holds the non-secret Azure OpenAI configuration and is
    # half the federated-credential subject. The image this sample runs is built below rather
    # than configured, so there is no sandbox variable to read.
    environment: live-verify
    permissions:
      # Mints the OIDC token azure/login exchanges. No secret is involved.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Only when `HARNESS` points at it — see the `env` block above for why the checks come
      # from somewhere other than the samples. Sparse, because `scripts/` is all that is read.
      - name: Check out the checks from the default branch
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          path: .harness
          sparse-checkout: scripts

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Check the live configuration is present
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_MODEL: ${{ vars.AZURE_OPENAI_CHAT_MODEL }}
        run: |
          set -euo pipefail
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            AZURE_OPENAI_ENDPOINT AZURE_OPENAI_CHAT_MODEL; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::the live-verify environment is missing: ${missing[*]}. See docs/maintainers.md."
            exit 1
          fi

      - name: Sign in to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Where samples 06 and 08 run an MCR image that `docker run` pulls, this one's guest is
      # built from this repository — the same context sample 01 imports into an Azure sandbox
      # group, so the two jobs compile with one Bicep CLI and one rule set. The tag is local and
      # unqualified because the backend runs what is already on the machine.
      - name: Build the sandbox image
        run: docker build -t bicep-sandbox:local images/bicep-sandbox

      - name: Wait for this runner's PyPI edge to serve the release
        if: ${{ inputs.version != '' }}
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # uv is the probe rather than a request of our own: a different client reads a
          # different CDN cache object, and polling the index passed while the sample resolved
          # the release before this one 0.7s later on the same runner (#595).
          python3 "$HARNESS"/scripts/await_live_version.py "$PACKAGE" "$VERSION"

      - name: Run sample 05 and assert the diagnostics came back
        env:
          BICEP_SANDBOX_IMAGE: bicep-sandbox:local
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_MODEL: ${{ vars.AZURE_OPENAI_CHAT_MODEL }}
        run: |
          set -euo pipefail
          uv run --no-project samples/05_docker_bicep/agent.py | tee /tmp/sample05-out.txt
          # Sample 01's assertion, unchanged: the same file compiled by the same CLI produces
          # the same two rule ids, whatever ran it — and both samples print them the same way.
          python3 "$HARNESS"/scripts/check_live_sample.py /tmp/sample05-out.txt

      - name: Assert the published version the sample resolved
        if: ${{ always() && inputs.version != '' }}
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 "$HARNESS"/scripts/check_live_versions.py /tmp/sample05-out.txt "$PACKAGE" "$VERSION"
  sample-06:
    name: samples/06_docker_codeact against a live container
    # The same task and assertion as sample-03, but the sandbox is a Docker container on this
    # runner rather than a billable Azure microVM — so this job needs no sandbox subscription
    # and creates no billable resource; the only cloud dependency is the model, reached with a
    # federated credential. Runs for an empty input or a package it actually exercises: the
    # router (maf-sandbox), the backend (maf-sandbox-docker) and its own kind (maf-sandbox-
    # codeact); an acas, bicep or wslc release cannot change what this sample does.
    if: >-
      inputs.package == ''
      || contains(fromJSON('["maf-sandbox", "maf-sandbox-codeact", "maf-sandbox-docker"]'), inputs.package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # For the model only: `live-verify` holds the non-secret Azure OpenAI configuration and is
    # half the federated-credential subject. There is no sandbox configuration to hold — the
    # docker backend reads none.
    environment: live-verify
    permissions:
