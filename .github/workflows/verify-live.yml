          set -euo pipefail
          python3 "$HARNESS"/scripts/check_live_versions.py /tmp/sample12-out.txt "$PACKAGE" "$VERSION"
  sample-13:
    name: samples/13_bicep_fix_loop against a live container
    # The only sample that runs more than one turn, and the only one whose store starts empty:
    # the model writes `main.bicep` in turn 1 and repairs it in turn 2, both against one
    # sandbox. Sample 05's workload, arrived at by a brief rather than checked in. Runs
    # for the router (maf-sandbox), the backend it acquires through (maf-sandbox-docker) and the
    # kind that supplies the tool (maf-sandbox-bicep) — the same three sample 05 answers to,
    # because it is the same stack with a second turn on top.
    if: >-
      inputs.package == ''
      || contains(fromJSON('["maf-sandbox", "maf-sandbox-bicep", "maf-sandbox-docker"]'), inputs.package)
    runs-on: ubuntu-latest
    # Longer than sample 05's 20: two model turns, and the fix turn does several tool calls of
    # its own before it answers.
    timeout-minutes: 25
    # For the model only, as in sample 05 — `live-verify` holds the non-secret Azure OpenAI
    # configuration and is half the federated-credential subject. The image is built below.
    environment: live-verify
    permissions:
      # Mints the OIDC token azure/login exchanges. No secret is involved.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Only when `HARNESS` points at it — see the `env` block above for why the checks come
      # from somewhere other than the samples. Sparse, because `scripts/` is all that is read.
      - name: Check out the checks from the default branch
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          path: .harness
          sparse-checkout: scripts

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Check the live configuration is present
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_MODEL: ${{ vars.AZURE_OPENAI_CHAT_MODEL }}
        run: |
          set -euo pipefail
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            AZURE_OPENAI_ENDPOINT AZURE_OPENAI_CHAT_MODEL; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::the live-verify environment is missing: ${missing[*]}. See docs/maintainers.md."
            exit 1
          fi

      - name: Sign in to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Built here rather than pulled, exactly as sample 05 does it, and the freshness matters
      # more for this sample than for that one: `bicepconfig.json` lives in the image, so a
      # stale one reports fewer diagnostics at their built-in severities and the fix turn is
      # handed a smaller problem — a run that goes green having tested less than it says.
      - name: Build the sandbox image
        run: docker build -t bicep-sandbox:local images/bicep-sandbox

      - name: Wait for this runner's PyPI edge to serve the release
        if: ${{ inputs.version != '' }}
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # uv is the probe rather than a request of our own: a different client reads a
          # different CDN cache object, and polling the index passed while the sample resolved
          # the release before this one 0.7s later on the same runner (#595).
          python3 "$HARNESS"/scripts/await_live_version.py "$PACKAGE" "$VERSION"

      - name: Run sample 13 and assert the file was repaired against one sandbox
        env:
          BICEP_SANDBOX_IMAGE: bicep-sandbox:local
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_MODEL: ${{ vars.AZURE_OPENAI_CHAT_MODEL }}
        run: |
          set -euo pipefail
          # Three claims, and the check needs all of them: turn 1 wrote a file with a real fault
          # in it, one container served all four acquires, and the compiler agrees the file
          # turn 2 left is repaired. Any one alone passes on a broken sample — perfect reuse of
          # a sandbox that fixed nothing, or a fix that quietly booted a second container to
          # make it. stdlib-only, so the runner's own python3 runs it.
          #
          # Retry only exit 3, which marks model-only non-convergence; deterministic failures exit.
          # Annotate retries and summarize attempts so intermittent failures remain visible.
          #
          # One number, read three times below, because copies drift and the summary is what a
          # reader trusts. Six from measurement: two attempts passed 59% of 27 runs, so one is
          # near 36% and six near 93%. A rate, not a fix — the fix turn is a live model.
          allowed=6
          attempts=0
          status=0
          while [ "$attempts" -lt "$allowed" ]; do
            attempts=$((attempts + 1))
            # Captured rather than left to `set -e`: a sample that dies here would otherwise
            # take the whole step with it, before the attempt count is written. It is also not
            # the model's half — nothing was measured — so it breaks without a second loop.
            status=0
            uv run --no-project samples/13_bicep_fix_loop/agent.py | tee /tmp/sample13-out.txt || status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error title=sample 13 did not run::the sample exited $status, so the check saw nothing"
              break
            fi
            python3 "$HARNESS"/scripts/check_live_fix_loop_sample.py /tmp/sample13-out.txt || status=$?
            [ "$status" -eq 3 ] || break
            if [ "$attempts" -lt "$allowed" ]; then
              note="the model's half did not converge on attempt $attempts of $allowed and every"
              note="$note other measurement passed, so the two-turn loop runs again (#421)"
              echo "::warning title=sample 13 retried::$note"
            fi
          done
          said="samples/13_bicep_fix_loop: exit $status after $attempts attempt(s), $allowed allowed."
          echo "$said" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Assert the published version the sample resolved
        if: ${{ always() && inputs.version != '' }}
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 "$HARNESS"/scripts/check_live_versions.py /tmp/sample13-out.txt "$PACKAGE" "$VERSION"
  sample-14:
    name: samples/14_acas_codeact_files against a live sandbox
    # The pull surface on a second backend, which is the whole reason this job exists (#300).
