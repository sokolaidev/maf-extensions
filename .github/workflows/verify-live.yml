name: Verify (live)

# Installs the PUBLISHED wheels into a clean environment and runs seven samples, each asserting its
# own workload actually ran: samples/01_acas_bicep and samples/05_docker_bicep (the compiler's
# diagnostics came back), samples/03_acas_codeact and samples/06_docker_codeact (the 100th
# Fibonacci number came back from code run in the sandbox), and samples/07_docker_diagram and
# samples/08_docker_codeact_files (a file came back out — a rendered PNG and a declared summary,
# the two that assert on something other than stdout). Sample 09 runs the same bicep workload as
# 01 and 05 against a backend that shells out to the bicep CLI on the runner itself — no
# container, no sandbox — so it pairs with nothing and names no backend. Each pair is one
# workload against a billable Azure microVM and against a container, so a red on one side alone
# names the backend.
# This is the half of issue #33 that runs after a release rather than on a pull request. The two
# ACAS jobs each create a billable Azure sandbox and need a subscription; the four docker jobs
# and sample 09 create no billable sandbox — a container on the runner, or for 09 the host
# itself — and need no sandbox configuration at all. It runs on demand, and once after each
# release that could change what a
# sample exercises (dispatched by publish-packages.yml).
#
# Samples 02 and 04 are the two with no job, and structurally: `wslc` needs Windows with a WSL
# that ships it, which the Linux runners are not.
#
# Authentication is OIDC federation to Azure — no stored secret, matching how publishing works.
# Everything each sample reads is non-secret configuration (endpoints and ids), held as
# environment variables on the `live-verify` environment; the docker jobs read only the model's,
# and the two whose guest is built here read not even that.
# See docs/maintainers.md.
#
# PEP 723 metadata is the single dependency source; `--no-project` ensures uv resolves its
# published packages rather than this checkout's workspace.
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package whose release to verify (empty runs every sample)"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      package:
        description: "Package whose release to verify (empty runs every sample)"
        required: false
        type: string
        default: ""

# One billable run at a time; let a run in flight finish and dispose its sandbox rather than
# cancelling it half-way and leaving the sandbox to the backend's auto-delete timer.
concurrency:
  group: verify-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sample-01:
    name: samples/01_acas_bicep against a live sandbox
    # Empty input (verify-everything) or a package sample-01 actually exercises: the router
    # (maf-sandbox) and the backend it runs on (maf-sandbox-acas) both affect it, and so does
    # its own package (maf-sandbox-bicep); a maf-sandbox-codeact or maf-sandbox-wslc release
    # cannot change anything this sample does.
    if: >-
      inputs.package == ''
      || contains(fromJSON('["maf-sandbox", "maf-sandbox-acas", "maf-sandbox-bicep"]'), inputs.package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Half of the federated-credential subject Azure checks, and where the non-secret sandbox
    # and model configuration lives. `live-verify` is deliberately ungated: the post-release
    # call must not wait on a human, and there is no credential to protect while it does.
    environment: live-verify
    permissions:
      # Mints the OIDC token azure/login exchanges. No secret is involved.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      # Fail early and by name if the environment was never configured — azure/login's own
      # error for an empty client-id does not say which field is missing.
      - name: Check the live configuration is present
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ACAS_SANDBOX_ENDPOINT: ${{ vars.ACAS_SANDBOX_ENDPOINT }}
          ACAS_SANDBOX_SUBSCRIPTION_ID: ${{ vars.ACAS_SANDBOX_SUBSCRIPTION_ID }}
          ACAS_SANDBOX_RESOURCE_GROUP: ${{ vars.ACAS_SANDBOX_RESOURCE_GROUP }}
          ACAS_SANDBOX_GROUP: ${{ vars.ACAS_SANDBOX_GROUP }}
          ACAS_SANDBOX_REGISTRY: ${{ vars.ACAS_SANDBOX_REGISTRY }}
          BICEP_SANDBOX_IMAGE: ${{ vars.BICEP_SANDBOX_IMAGE }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_MODEL: ${{ vars.AZURE_OPENAI_CHAT_MODEL }}
        run: |
          set -euo pipefail
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            ACAS_SANDBOX_ENDPOINT ACAS_SANDBOX_SUBSCRIPTION_ID ACAS_SANDBOX_RESOURCE_GROUP \
            ACAS_SANDBOX_GROUP ACAS_SANDBOX_REGISTRY BICEP_SANDBOX_IMAGE \
            AZURE_OPENAI_ENDPOINT AZURE_OPENAI_CHAT_MODEL; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::the live-verify environment is missing variables: ${missing[*]}. See docs/maintainers.md."
            exit 1
          fi

      - name: Sign in to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Runs the sample as a consumer would, then asserts loosely on its output. The sample
      # authenticates with DefaultAzureCredential, which the az login above satisfies — the
      # AZURE_CLIENT_ID/TENANT/SUBSCRIPTION values are login inputs only and are deliberately
      # not exported here, so DefaultAzureCredential resolves cleanly through the CLI rather
      # than a half-populated EnvironmentCredential.
      - name: Run sample 01 and assert the diagnostics came back
        env:
          ACAS_SANDBOX_ENDPOINT: ${{ vars.ACAS_SANDBOX_ENDPOINT }}
          ACAS_SANDBOX_SUBSCRIPTION_ID: ${{ vars.ACAS_SANDBOX_SUBSCRIPTION_ID }}
          ACAS_SANDBOX_RESOURCE_GROUP: ${{ vars.ACAS_SANDBOX_RESOURCE_GROUP }}
          ACAS_SANDBOX_GROUP: ${{ vars.ACAS_SANDBOX_GROUP }}
          ACAS_SANDBOX_REGISTRY: ${{ vars.ACAS_SANDBOX_REGISTRY }}
          BICEP_SANDBOX_IMAGE: ${{ vars.BICEP_SANDBOX_IMAGE }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_MODEL: ${{ vars.AZURE_OPENAI_CHAT_MODEL }}
        run: |
          set -euo pipefail
          uv run --no-project samples/01_acas_bicep/agent.py | tee /tmp/sample-out.txt
          # stdlib-only, so the runner's own python3 runs it — uv run's env is not on its path.
          python3 scripts/check_live_sample.py /tmp/sample-out.txt

  sample-03:
    name: samples/03_acas_codeact against a live sandbox
    # No `needs: sample-01` — the two never had a data dependency (each creates its own
    # sandbox and reads disjoint configuration); the `needs` edge existed only to keep this
    # run's two billable sandboxes from being up at the same time. That trade is deliberately
    # flipped now: the jobs run concurrently, so for the few minutes both samples are live
    # there are two billable sandboxes at once, in exchange for the run taking one sample's
    # time instead of two. The workflow-level `concurrency` block above still serialises whole
    # RUNS of this workflow, so at most one *run* is ever in flight. A failure still names
    # which sample broke.
    # Empty input (verify-everything) or a package sample-03 actually exercises: the router
    # (maf-sandbox) and the backend it runs on (maf-sandbox-acas) both affect it, and so does
    # its own package (maf-sandbox-codeact); a maf-sandbox-bicep or maf-sandbox-wslc release
    # cannot change anything this sample does.
    if: >-
      inputs.package == ''
      || contains(fromJSON('["maf-sandbox", "maf-sandbox-acas", "maf-sandbox-codeact"]'), inputs.package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Half of the federated-credential subject Azure checks, and where the non-secret sandbox
    # and model configuration lives. `live-verify` is deliberately ungated: the post-release
    # call must not wait on a human, and there is no credential to protect while it does.
    environment: live-verify
    permissions:
      # Mints the OIDC token azure/login exchanges. No secret is involved.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      # Fail early and by name if the environment was never configured — azure/login's own
      # error for an empty client-id does not say which field is missing. Only the six
      # variables samples/03_acas_codeact itself reads: no registry and no image variable —
      # CODEACT_IMAGE is a hardcoded, fully-qualified MCR reference in the sample.
      - name: Check the live configuration is present
        env:
          ACAS_SANDBOX_ENDPOINT: ${{ vars.ACAS_SANDBOX_ENDPOINT }}
          ACAS_SANDBOX_SUBSCRIPTION_ID: ${{ vars.ACAS_SANDBOX_SUBSCRIPTION_ID }}
          ACAS_SANDBOX_RESOURCE_GROUP: ${{ vars.ACAS_SANDBOX_RESOURCE_GROUP }}
          ACAS_SANDBOX_GROUP: ${{ vars.ACAS_SANDBOX_GROUP }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_MODEL: ${{ vars.AZURE_OPENAI_CHAT_MODEL }}
        run: |
          set -euo pipefail
          missing=()
          for name in ACAS_SANDBOX_ENDPOINT ACAS_SANDBOX_SUBSCRIPTION_ID ACAS_SANDBOX_RESOURCE_GROUP \
            ACAS_SANDBOX_GROUP AZURE_OPENAI_ENDPOINT AZURE_OPENAI_CHAT_MODEL; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::the live-verify environment is missing variables: ${missing[*]}. See docs/maintainers.md."
            exit 1
          fi

      - name: Sign in to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Runs the sample as a consumer would, then asserts exactly on its output. The sample
      # authenticates with DefaultAzureCredential, which the az login above satisfies — the
      # AZURE_CLIENT_ID/TENANT/SUBSCRIPTION values are login inputs only and are deliberately
      # not exported here, so DefaultAzureCredential resolves cleanly through the CLI rather
      # than a half-populated EnvironmentCredential.
      - name: Run sample 03 and assert the computed answer came back
        env:
          ACAS_SANDBOX_ENDPOINT: ${{ vars.ACAS_SANDBOX_ENDPOINT }}
          ACAS_SANDBOX_SUBSCRIPTION_ID: ${{ vars.ACAS_SANDBOX_SUBSCRIPTION_ID }}
          ACAS_SANDBOX_RESOURCE_GROUP: ${{ vars.ACAS_SANDBOX_RESOURCE_GROUP }}
          ACAS_SANDBOX_GROUP: ${{ vars.ACAS_SANDBOX_GROUP }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_MODEL: ${{ vars.AZURE_OPENAI_CHAT_MODEL }}
        run: |
          set -euo pipefail
          uv run --no-project samples/03_acas_codeact/agent.py | tee /tmp/sample03-out.txt
          # stdlib-only, so the runner's own python3 runs it — uv run's env is not on its path.
          python3 scripts/check_live_codeact_sample.py /tmp/sample03-out.txt

  sample-05:
    name: samples/05_docker_bicep against a live container
    # Sample 01's workload and its `main.bicep`, in a Docker container on this runner instead of
    # a billable Azure microVM — so the assertion is sample 01's too, and a red here while
    # sample-01 is green is a statement about the backend rather than about the compiler. Runs
    # for the router (maf-sandbox), the backend (maf-sandbox-docker) and its own kind
    # (maf-sandbox-bicep); an acas, codeact or wslc release cannot change what this sample does.
    if: >-
      inputs.package == ''
      || contains(fromJSON('["maf-sandbox", "maf-sandbox-bicep", "maf-sandbox-docker"]'), inputs.package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # For the model only: `live-verify` holds the non-secret Azure OpenAI configuration and is
    # half the federated-credential subject. The image this sample runs is built below rather
    # than configured, so there is no sandbox variable to read.
    environment: live-verify
    permissions:
      # Mints the OIDC token azure/login exchanges. No secret is involved.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Check the live configuration is present
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_MODEL: ${{ vars.AZURE_OPENAI_CHAT_MODEL }}
        run: |
          set -euo pipefail
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            AZURE_OPENAI_ENDPOINT AZURE_OPENAI_CHAT_MODEL; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::the live-verify environment is missing variables: ${missing[*]}. See docs/maintainers.md."
            exit 1
          fi

      - name: Sign in to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Where samples 06 and 08 run an MCR image that `docker run` pulls, this one's guest is
      # built from this repository — the same context sample 01 imports into an Azure sandbox
      # group, so the two jobs compile with one Bicep CLI and one rule set. The tag is local and
      # unqualified because the backend runs what is already on the machine.
      - name: Build the sandbox image
        run: docker build -t bicep-sandbox:local images/bicep-sandbox

      - name: Run sample 05 and assert the diagnostics came back
        env:
          BICEP_SANDBOX_IMAGE: bicep-sandbox:local
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_MODEL: ${{ vars.AZURE_OPENAI_CHAT_MODEL }}
        run: |
          set -euo pipefail
          uv run --no-project samples/05_docker_bicep/agent.py | tee /tmp/sample05-out.txt
          # Sample 01's assertion, unchanged: the same file compiled by the same CLI produces
          # the same two rule ids, whatever ran it.
          python3 scripts/check_live_sample.py /tmp/sample05-out.txt

  sample-06:
    name: samples/06_docker_codeact against a live container
    # The same task and assertion as sample-03, but the sandbox is a Docker container on this
    # runner rather than a billable Azure microVM — so this job needs no sandbox subscription
    # and creates no billable resource; the only cloud dependency is the model, reached with a
    # federated credential. Runs for an empty input or a package it actually exercises: the
    # router (maf-sandbox), the backend (maf-sandbox-docker) and its own kind (maf-sandbox-
    # codeact); an acas, bicep or wslc release cannot change what this sample does.
    if: >-
      inputs.package == ''
      || contains(fromJSON('["maf-sandbox", "maf-sandbox-codeact", "maf-sandbox-docker"]'), inputs.package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # For the model only: `live-verify` holds the non-secret Azure OpenAI configuration and is
    # half the federated-credential subject. There is no sandbox configuration to hold — the
    # docker backend reads none.
    environment: live-verify
    permissions:
      # Mints the OIDC token azure/login exchanges. No secret is involved.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      # The federation inputs azure/login needs and the two model variables the sample reads —
      # there is no sandbox configuration for this backend. azure/login's own error for an empty
      # client-id does not say which field is missing, so this checks the login variables too,
      # by name, before the login step reaches them.
      - name: Check the live configuration is present
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_MODEL: ${{ vars.AZURE_OPENAI_CHAT_MODEL }}
        run: |
          set -euo pipefail
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            AZURE_OPENAI_ENDPOINT AZURE_OPENAI_CHAT_MODEL; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::the live-verify environment is missing variables: ${missing[*]}. See docs/maintainers.md."
            exit 1
          fi

      - name: Sign in to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ubuntu-latest ships a running Docker daemon, so the sandbox is free and local. The
      # sample authenticates the model with DefaultAzureCredential, which the az login above
      # satisfies — the AZURE_CLIENT_ID/TENANT/SUBSCRIPTION values are login inputs only and are
      # deliberately not exported here, so DefaultAzureCredential resolves through the CLI.
      - name: Run sample 06 and assert the computed answer came back
        env:
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_MODEL: ${{ vars.AZURE_OPENAI_CHAT_MODEL }}
        run: |
          set -euo pipefail
          uv run --no-project samples/06_docker_codeact/agent.py | tee /tmp/sample06-out.txt
          # The same assertion as sample 03: same task, same one right answer, same disposal line.
          python3 scripts/check_live_codeact_sample.py /tmp/sample06-out.txt

  sample-07:
    name: samples/07_docker_diagram against a live container
    # The pull surface driven by a kind defined in the sample rather than installed from a
    # package — `sandboxed_tool`, `collect_outputs`, `OutputSink` and `DeclaredOutput` used the
    # way a third party writing a kind uses them. That is what this job gates and sample-08
    # does not. No kind package is involved, so a codeact, acas, bicep or wslc release cannot
    # change what it does; the router and the backend can.
    if: >-
      inputs.package == ''
      || contains(fromJSON('["maf-sandbox", "maf-sandbox-docker"]'), inputs.package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # For the model only, as in sample-05: the guest image is built below, not configured.
    environment: live-verify
    permissions:
      # Mints the OIDC token azure/login exchanges. No secret is involved.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Check the live configuration is present
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_MODEL: ${{ vars.AZURE_OPENAI_CHAT_MODEL }}
        run: |
          set -euo pipefail
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            AZURE_OPENAI_ENDPOINT AZURE_OPENAI_CHAT_MODEL; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::the live-verify environment is missing variables: ${missing[*]}. See docs/maintainers.md."
            exit 1
          fi

      - name: Sign in to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Graphviz on a Debian base, built from this repository like sample-05's guest. Nothing
      # pushes it anywhere: the backend runs what is on the machine.
      - name: Build the sandbox image
        run: docker build -t diagram-sandbox:local images/diagram-sandbox

      - name: Run sample 07 and assert a rendered PNG came back out
        env:
          DIAGRAM_SANDBOX_IMAGE: diagram-sandbox:local
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_MODEL: ${{ vars.AZURE_OPENAI_CHAT_MODEL }}
        run: |
          set -euo pipefail
          # As in sample-08: an image left behind by an earlier run would satisfy the on-disk
          # half without this run having rendered anything.
          rm -rf samples/07_docker_diagram/out
          uv run --no-project samples/07_docker_diagram/agent.py | tee /tmp/sample07-out.txt
          # The model's prose is not evidence a renderer ran, so the assertion is the disposal
          # line and the PNG itself.
          python3 scripts/check_live_diagram_sample.py \
            /tmp/sample07-out.txt samples/07_docker_diagram/out/diagram.png

  sample-08:
    name: samples/08_docker_codeact_files against a live container
    # Both of the packaged CodeAct kind's file channels, in one turn: a file store file in and a
    # declared output back out. Sample-07 gates the same pull surface through a hand-written
    # kind; this one gates what an adopter reaches for first, the channels the package itself
    # exposes. Same runner economics as sample-06: a Docker container costs nothing and the
    # model is reached with a federated credential. Runs for the same three packages, since it
    # is the same router, backend and kind.
    if: >-
      inputs.package == ''
      || contains(fromJSON('["maf-sandbox", "maf-sandbox-codeact", "maf-sandbox-docker"]'), inputs.package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: live-verify
    permissions:
      # Mints the OIDC token azure/login exchanges. No secret is involved.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Check the live configuration is present
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_MODEL: ${{ vars.AZURE_OPENAI_CHAT_MODEL }}
        run: |
          set -euo pipefail
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            AZURE_OPENAI_ENDPOINT AZURE_OPENAI_CHAT_MODEL; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::the live-verify environment is missing variables: ${missing[*]}. See docs/maintainers.md."
            exit 1
          fi

      - name: Sign in to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run sample 08 and assert a file went in and a file came out
        env:
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_MODEL: ${{ vars.AZURE_OPENAI_CHAT_MODEL }}
        run: |
          set -euo pipefail
          # A fresh checkout has no `out/`, but deleting it is what makes the on-disk half of
          # the assertion mean anything: a summary left by an earlier run would pass it without
          # this run having landed a thing.
          rm -rf samples/08_docker_codeact_files/out
          uv run --no-project samples/08_docker_codeact_files/agent.py | tee /tmp/sample08-out.txt
          # Two halves, and the second is the point: the right total in stdout, and the declared
          # summary actually on disk under its declared name.
          python3 scripts/check_live_codeact_files_sample.py \
            /tmp/sample08-out.txt samples/08_docker_codeact_files/out/summary.md

  sample-09:
    name: samples/09_inprocess_bicep against the host
    # The one sample whose backend is not a sandbox at all: a backend the sample defines
    # (`NoIsolationBackend` in `no_isolation_backend.py`) that shells out to the real bicep CLI on this runner.
    # No container, no VM, no image — but the bicep binary has to be on PATH, so this job installs
    # it. It creates no billable resource; the only cloud dependency is the model, reached with a
    # federated credential the way sample-06 does. Runs for an empty input or a package it actually
    # exercises: the router lives in maf-sandbox and the workload in maf-sandbox-bicep; a codeact,
    # acas, docker or wslc release cannot change what this sample does.
    if: >-
      inputs.package == ''
      || contains(fromJSON('["maf-sandbox", "maf-sandbox-bicep"]'), inputs.package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # For the model only, as in sample-06: `live-verify` holds the non-secret Azure OpenAI
    # configuration and is half the federated-credential subject. There is no sandbox
    # configuration to hold — the backend runs the bicep binary already on this runner.
    environment: live-verify
    permissions:
      # Mints the OIDC token azure/login exchanges. No secret is involved.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      # The backend shells out to the real bicep CLI on this runner, so the binary must be on
      # PATH — the container images bake it in (`images/bicep-sandbox/Dockerfile` pins v0.46.1);
      # this job installs the same version onto the runner. `bicep --version` fails fast if the
      # runner is missing an ICU the binary needs, rather than failing later inside the workload.
      - name: Install the bicep CLI
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/bicep \
            "https://github.com/Azure/bicep/releases/download/v0.46.1/bicep-linux-x64"
          sudo install -m 0755 /tmp/bicep /usr/local/bin/bicep
          bicep --version

      - name: Check the live configuration is present
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_MODEL: ${{ vars.AZURE_OPENAI_CHAT_MODEL }}
        run: |
          set -euo pipefail
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            AZURE_OPENAI_ENDPOINT AZURE_OPENAI_CHAT_MODEL; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::the live-verify environment is missing variables: ${missing[*]}. See docs/maintainers.md."
            exit 1
          fi

      - name: Sign in to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # No container to build and no sandbox to configure — the backend runs the bicep binary on
      # this runner. The sample authenticates the model with DefaultAzureCredential, which the az
      # login above satisfies; the AZURE_CLIENT_ID/TENANT/SUBSCRIPTION values are login inputs
      # only and are deliberately not exported here, so DefaultAzureCredential resolves through
      # the CLI.
      - name: Run sample 09 and assert the diagnostics came back
        env:
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_MODEL: ${{ vars.AZURE_OPENAI_CHAT_MODEL }}
        run: |
          set -euo pipefail
          uv run --no-project samples/09_inprocess_bicep/agent.py | tee /tmp/sample09-out.txt
          # Sample 01's assertion, unchanged: the same file compiled by the same CLI produces the
          # same two rule ids, whatever ran it. stdlib-only, so the runner's own python3 runs it.
          python3 scripts/check_live_sample.py /tmp/sample09-out.txt
