        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          path: .harness
          sparse-checkout: scripts

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      # The federation inputs azure/login needs and the two model variables the sample reads —
      # there is no sandbox configuration for this backend. azure/login's own error for an empty
      # client-id does not say which field is missing, so this checks the login variables too,
      # by name, before the login step reaches them.
