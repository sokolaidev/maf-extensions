          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Wait for this runner's PyPI edge to serve the release
        if: ${{ inputs.version != '' }}
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # uv is the probe rather than a request of our own: a different client reads a
          # different CDN cache object, and polling the index passed while the sample resolved
          # the release before this one 0.7s later on the same runner (#595).
          python3 "$HARNESS"/scripts/await_live_version.py "$PACKAGE" "$VERSION"

      - name: Run sample 15 and assert a program really called back out
        env:
          ACAS_SANDBOX_ENDPOINT: ${{ vars.ACAS_SANDBOX_ENDPOINT }}
          ACAS_SANDBOX_SUBSCRIPTION_ID: ${{ secrets.ACAS_SANDBOX_SUBSCRIPTION_ID }}
          ACAS_SANDBOX_RESOURCE_GROUP: ${{ secrets.ACAS_SANDBOX_RESOURCE_GROUP }}
          ACAS_SANDBOX_GROUP: ${{ secrets.ACAS_SANDBOX_GROUP }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_MODEL: ${{ vars.AZURE_OPENAI_CHAT_MODEL }}
        run: |
          set -euo pipefail
          uv run --no-project samples/15_acas_codeact_host_tools/agent.py | tee /tmp/sample15-out.txt
          # Both routes compute in the sandbox, so both are held to the totals their programs
          # printed; what the check compares is how many tool-calling rounds each road cost and
          # which of them carried the data. stdlib-only, so the runner's own python3 runs it.
          python3 "$HARNESS"/scripts/check_live_host_tools_call_sample.py /tmp/sample15-out.txt

      - name: Assert the published version the sample resolved
        if: ${{ always() && inputs.version != '' }}
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 "$HARNESS"/scripts/check_live_versions.py /tmp/sample15-out.txt "$PACKAGE" "$VERSION"
  sample-15-docker:
    name: samples/15_acas_codeact_host_tools on docker against a live container
    # The docker half of the live host-tools dispatch pair (#519): the SAME sample as sample-15
