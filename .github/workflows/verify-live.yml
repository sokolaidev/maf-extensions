    # sample's.
    if: >-
      inputs.package == ''
      || contains(fromJSON('["maf-sandbox", "maf-sandbox-bicep", "maf-sandbox-docker"]'), inputs.package)
    runs-on: ubuntu-latest
    # Two container runs with a real `br/public` module restore in one of them, plus two model
    # turns. The cap is here to catch a hang, not to allow for work.
    timeout-minutes: 25
    # For the model only, as in sample-05: `live-verify` holds the non-secret Azure OpenAI
    # configuration and is half the federated-credential subject. Both images this sample runs
    # are built below rather than configured, so there is no sandbox variable to read.
    #
    # This job used to have neither block, because sample 11 used to call no model. Act 4 is
    # why it does now, and the cost is real: two inference turns where there were none. It buys
    # the one thing a unit test cannot say — that a deployment's egress posture decides whether
    # real work succeeds — and the containers it creates are still free.
    environment: live-verify
    permissions:
      # Mints the OIDC token azure/login exchanges. No secret is involved.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Only when `HARNESS` points at it — see the `env` block above for why the checks come
      # from somewhere other than the samples. Sparse, because `scripts/` is all that is read.
      - name: Check out the checks from the default branch
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          path: .harness
          sparse-checkout: scripts

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Check the live configuration is present
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_MODEL: ${{ vars.AZURE_OPENAI_CHAT_MODEL }}
        run: |
          set -euo pipefail
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            AZURE_OPENAI_ENDPOINT AZURE_OPENAI_CHAT_MODEL; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::the live-verify environment is missing: ${missing[*]}. See docs/maintainers.md."
            exit 1
          fi

      - name: Sign in to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Act 4's guest, built from this repository like sample-05's — the same Bicep CLI and the
      # same `bicepconfig.json`, so a difference between the two jobs is about egress rather
      # than about the compiler. The tag is local and unqualified because the backend runs what
      # is already on the machine.
      - name: Build the sandbox image
        run: docker build -t bicep-sandbox:local images/bicep-sandbox

      # Act 4 enforces an allowlist and needs something to enforce it with. Built from the
      # *published* package's own recipe, the way the sample tells a reader to — `uv run
      # --no-project` resolves maf-sandbox-docker from the index, and `proxy_build_context()`
      # points at the copy inside it, so this builds what a reader would build rather than
      # this checkout's source. Without the image the act skips itself, and a skipped
      # allowlist reads exactly like an enforced one; the check refuses that.
      - name: Build the egress proxy from the published package
        run: |
          set -euo pipefail
          context="$(uv run --no-project --with maf-sandbox-docker python -c \
            'from maf_sandbox_docker import proxy_build_context; print(proxy_build_context())')"
          docker build -t maf-egress-proxy:ci "$context"

      - name: Wait for this runner's PyPI edge to serve the release
        if: ${{ inputs.version != '' }}
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # uv is the probe rather than a request of our own: a different client reads a
          # different CDN cache object, and polling the index passed while the sample resolved
          # the release before this one 0.7s later on the same runner (#595).
          python3 "$HARNESS"/scripts/await_live_version.py "$PACKAGE" "$VERSION"

      - name: Run sample 11 and assert the router chose, refused, confined and disposed
        env:
          BICEP_SANDBOX_IMAGE: bicep-sandbox:local
          MAF_EGRESS_PROXY_IMAGE: maf-egress-proxy:ci
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_MODEL: ${{ vars.AZURE_OPENAI_CHAT_MODEL }}
        run: |
          set -euo pipefail
          uv run --no-project samples/11_router_two_backends/agent.py | tee /tmp/sample11-out.txt
          # Strict, like sample 10's, and for the same reason: every line the check reads
          # carries the `[measured]` tag, which the sample takes away from anything the model
          # said before printing it. Four assertions carry the job — the disposal count, 2 when
          # only one of the two registered backends was serving; act 4's restore pair, where the
          # module must fail to restore under `closed` and succeed under the allowlist, because
          # either verdict alone is consistent with a sandbox that confines nothing; and act 6's
          # routed pair, where the refused spec must reach `docker` and the servable one must
          # stay on the first registered backend, because the first alone is consistent with a
          # router that just prefers the stronger one; and act 6's cleanup line, since
          # `dispose_scope` reports a failure rather than raising one and an act that dropped
          # that answer would leave a container running while the job read clean. stdlib-only,
          # so the runner's own python3 runs it.
          python3 "$HARNESS"/scripts/check_live_router_sample.py /tmp/sample11-out.txt

      - name: Assert the published version the sample resolved
        if: ${{ always() && inputs.version != '' }}
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 "$HARNESS"/scripts/check_live_versions.py /tmp/sample11-out.txt "$PACKAGE" "$VERSION"
  sample-12:
    name: samples/12_purge_lifecycle against a live container
