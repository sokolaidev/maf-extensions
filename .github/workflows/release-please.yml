name: Release Please

# Keeps a Release PR open per package: version bump, changelog section, manifest. Merging one
# releases it — tag, then publish — with no further step. Merging is the decision.
on:
  push:
    branches: [main]
  # Nothing else can start this: without it, recovering from a failed run means pushing to
  # main or re-running a run from the UI.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare releases
    runs-on: ubuntu-latest
    permissions:
      # Opens and updates the Release PR, and creates the Release and tag on merge. Scoped to
      # this job; the workflow default above stays read-only.
      contents: write
      pull-requests: write
      # Labels are an Issues-API concept even on a PR, and release-please creates its own
      # `autorelease:*` pair on first run. Without this it 403s and every release wedges.
      issues: write
      # Dispatching publish-packages.yml below. It cannot approve anything: publishing
      # still waits on the `pypi` environment's reviewer.
      actions: write
    steps:
      - name: Run release-please
        # Pinned to the commit v4 resolves to: a moving tag is a supply-chain hole, and this
        # job can write to the repository.
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A tag created by GITHUB_TOKEN starts no workflow, so `on: push: tags` never fires.
      # Dispatch does fire — it is a documented exception — and needs no stored credential.
      - name: Publish each released package
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # This job checks nothing out, so gh cannot infer the repository from a git
          # remote. Without this it fails with "not a git repository".
          GH_REPO: ${{ github.repository }}
          PATHS: ${{ steps.release.outputs.paths_released }}
          OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          set -euo pipefail
          for path in $(echo "$PATHS" | jq -r '.[]'); do
            tag="$(echo "$OUTPUTS" | jq -r --arg k "${path}--tag_name" '.[$k]')"
            # At the tag, never at main: main may already have moved past the release commit.
            gh workflow run publish-packages.yml --ref "$tag" \
              -f package="${path##*/}" -f target=pypi
            echo "dispatched publish for ${path##*/} at ${tag}" >> "$GITHUB_STEP_SUMMARY"
          done

      # Unconditional, because the two steps below both read the checkout and both run on
      # runs that release nothing. Behind release-please rather than in front of it: those
      # steps work over the API and want no workspace, so a checkout that fails must not be
      # able to stop a release from being cut.
      - name: Check out
        if: always()
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # After maf-sandbox publishes, its dependents' range moves at both ends: the floor to the
      # version that just published, in the packages that look like they need it, and the
      # ceiling two minors up so the release after it needs nobody's permission. The post-release
      # step of RELEASING.md's release order, which lived only in prose until #41 and #178.
      #
      # One step, because the two bounds are one string. They were two steps opening two pull
      # requests, and since each rewrote the whole constraint, whichever merged second reverted
      # the other's half (#195). The separation was never real; only the collision was.
      - name: Propose the dependents' range
        if: >-
          steps.release.outputs.releases_created == 'true'
          && contains(steps.release.outputs.paths_released, '"packages/maf-sandbox"')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs['packages/maf-sandbox--version'] }}
        run: |
          set -euo pipefail
          # The title first, because it names the bounds that are *about* to move and the
          # script has nothing left to report once it has moved them. From the script rather
          # than rebuilt here: a second implementation of the rule is how a pull request comes
          # to advertise one thing while its commit does another.
          title="$(python3 scripts/set_dependents_range.py --print-title "$VERSION")"
          # Fails if a dependent's constraint has drifted from the shape it edits by pattern —
          # a release step that quietly does nothing is worse than one that stops. Runs on the
          # runner's own python3: the script is stdlib-only, and the range lives in pyproject
          # alone (uv.lock records the workspace edge without a specifier, so it does not move).
          python3 scripts/set_dependents_range.py "$VERSION"
          if git diff --quiet; then
            echo "every dependent's range and every sample floor already covers maf-sandbox ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$title" ]; then
            echo "the range changed but --print-title named nothing; refusing to commit an" \
                 "unlabelled release-type change" >&2
            exit 1
          fi
          branch="chore/maf-sandbox-range-${VERSION}"
          # Skip only when the proposal is already open; a branch left behind by a create that
          # failed after the push is rebuilt below rather than stranding the change forever.
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "a PR for ${branch} is already open; leaving it" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git push origin --delete "$branch" 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "$title"
          git push -u origin "$branch"
          # The body is written to a file through a *quoted* heredoc, so the shell expands
          # nothing in it. It used to be a double-quoted assignment, and the quotes around
          # "Approve and run" in the last paragraph closed the string early: the shell read the
          # rest as commands and the step died with `and: command not found` (run 31603351228).
          # That fired after the tag and after the publish dispatch, so the release itself was
          # intact and only the proposal was lost — a branch pushed with no pull request on it.
          # This prose is long, grows every release, and is written in the same register as the
          # docs, which means quotes and backticked identifiers will keep arriving in it. Both
          # are inert here. The version is the one thing that has to vary, so it is substituted
          # afterwards from a placeholder rather than by letting the whole body expand.
          cat > "${RUNNER_TEMP}/range-body.md" <<'BODY'
          Automated by the release workflow when maf-sandbox @VERSION@ was released. **Check that it actually published before merging this.** The upload is dispatched separately and may still be waiting on the pypi environment, or have failed; a floor pointing at a version that never reached PyPI is unresolvable for every consumer.

          It carries both ends of the range, because they are one string and two pull requests editing it each reverted the other's half (#195). The two ends are not the same kind of claim, so read them differently:

          **The ceiling is uniform and is a claim about nobody's code.** It widens to admit the minor after @VERSION@, before that minor exists — which holds either way, since a ceiling admits a version whether or not it has been released. Widening only enlarges an accepted set, so it cannot make a resolution fail. What it buys is that the next core minor can be released without leaving the index unresolvable as a set (#175) and without anyone having to remember step 1 (#177). Nothing here needs your judgement.

          **The floor is a guess, and usually a wrong one.** It moves in every dependent whose ceiling already admitted @VERSION@ and whose floor was a minor behind — a shape, not evidence that a package's code uses this release. Ceilings are widened for everyone at once, so admitting a version says nothing about needing it. A floor should move only for a package that relies on API or behaviour this release introduced or changed; a new import is the obvious case, but a fixed bug in an existing call counts too. For the rest it pins a version they do not need and over-constrains their consumers.

          **The samples' floor is neither, and it is the one thing here you should not decline.** Every `samples/*/agent.py` declares the same `maf-sandbox>=<minor>` and all of them move to @VERSION@'s minor together. Nothing under `samples/` is packaged, so this constrains no consumer: a sample documents the current library, and the version it is actually run against is the only claim it can honestly make. Declining leaves it pointing at a core nothing here runs it on — which never fails, because `uv` resolves the newest admissible version anyway, and so goes unnoticed until a reader whose resolution is capped elsewhere gets a plausible wrong answer (#343).

          **To decline a floor without losing its ceiling**, edit that line back to the floor it had and leave the new upper bound alone — the two now live in one hunk, so dropping the hunk wholesale would give up the widening too. Retitle it feat:/breaking if adopting the version is more than a patch for a dependent; the title says fix: so the bot does not choose the bump.

          **Then merge it, and let the dependent releases it cuts publish.** The widening is only worth anything once it is on PyPI: that is what the next core release checks before it uploads. Its checks are held at "Approve and run", the same as a Release PR's; clearing them is what starts them.
          BODY
          sed -i "s|@VERSION@|${VERSION}|g" "${RUNNER_TEMP}/range-body.md"
          gh pr create --base main --head "$branch" \
            --title "$title" \
            --body-file "${RUNNER_TEMP}/range-body.md"
          echo "opened ${branch}" >> "$GITHUB_STEP_SUMMARY"

      # Every run ends here, red or green. A merged Release PR still labelled
      # `autorelease: pending` once release-please has run is one it could not finish, and it
      # takes the oldest of those and stops there — so until that one is cleared no package
      # releases, whatever commit triggers the next run. A red run does not carry that on its
      # own, because nothing sends anyone to open it; the tracking issue does (#661).
      - name: Name any release this run left stuck
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          # gh reads the repository from a git remote, and the steps above may have left the
          # checkout on a branch of their own; naming it costs nothing and cannot drift.
          GH_REPO: ${{ github.repository }}
          RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The marker comes from the script so there is one definition of it: this step has to
          # find the issue the script wrote, and a second copy here would drift and duplicate.
          marker="$(python3 scripts/report_stuck_releases.py --marker)"
          # GraphQL rather than `gh search`, whose index lags a merge by minutes — and minutes
          # after a merge is exactly when this runs. Paginated rather than a page of N: the
          # `gh pr list` this replaced answered newest-first, so its cap dropped the oldest,
          # which is the one release-please stops at and the only one the report is about.
          pending="$(gh api graphql --paginate -F owner="${GH_REPO%%/*}" \
            -F repo="${GH_REPO##*/}" -f query='
              query($owner:String!,$repo:String!,$endCursor:String){
                repository(owner:$owner,name:$repo){
                  pullRequests(states:MERGED, labels:["autorelease: pending"],
                               first:100, after:$endCursor){
                    pageInfo{ hasNextPage endCursor }
                    nodes{ number title url mergedAt mergeCommit{ oid } }
                  }
                }
              }' --jq '.data.repository.pullRequests.nodes[]' | jq -s '.')"
          # The run's own start separates a release this run owed from one that merged while it
          # was in flight — that one belongs to the run its merge triggered, which is queued
          # behind this one on the concurrency group above.
          started="$(gh api "repos/{owner}/{repo}/actions/runs/${GITHUB_RUN_ID}" \
            --jq '.run_started_at')"
          # Author *and* marker. The marker is in a public script, so anyone with an account
          # can open an issue carrying it — and on the marker alone that issue is what gets
          # edited and closed, while the tracker this step exists to raise is never opened at
          # all. The author is pinned to the exact identity this job writes as, not merely to
          # some bot: any app installed here that can open an issue can be asked to carry the
          # marker. Being wrong about the login opens a second tracker, which is visible and
          # harmless; being wrong about the author writes to somebody else's issue.
          #
          # `--paginate` rather than a page of N: a tracker stays open for as long as the train
          # is stuck, so it sinks down a listing as other issues are opened, and a bounded page
          # would stop returning it — after which every run opens a duplicate and none of them
          # can close the first. This endpoint answers with pull requests too, which is what
          # the first `select` drops; editing one of those would rewrite a pull request body.
          issue="$(gh api --paginate "repos/{owner}/{repo}/issues?state=open&per_page=100" \
            | jq -s --arg m "$marker" \
              '[.[][] | select(.pull_request == null)
                      | select(.user.login == "github-actions[bot]")
                      | select(.body // "" | contains($m))]
               | first | if . == null then null else {number: .number} end')"
          # What each package has actually released, from the manifest a Release PR bumps as
          # part of its own diff — so once merged it holds exactly that pull request's version.
          # A merged Release PR's title is editable and this is not, so a title naming a
          # package we do not have, or a version nobody released, renders no recovery at all.
          releases="$(jq -c --slurpfile manifest .release-please-manifest.json '
            .packages | to_entries
            | map({key: .value."package-name", value: ($manifest[0][.key] // null)})
            | from_entries' release-please-config.json)"
          # release-please creates the Release first and flips the label after, so a failure in
          # between leaves a pending pull request whose Release is already there. Without this
          # the recovery would tell a maintainer to create a tag that exists.
          released="$(gh api --paginate "repos/{owner}/{repo}/releases?per_page=100" \
            --jq '.[].tag_name' | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          jq -n --argjson pending "$pending" --argjson issue "$issue" \
            --argjson released "$released" --argjson releases "$releases" \
            --arg started "$started" --arg run_url "$RUN_URL" \
            '{run_started_at: $started, run_url: $run_url, pending: $pending, issue: $issue,
              released_tags: $released, releases: $releases}' \
            | python3 scripts/report_stuck_releases.py > "${RUNNER_TEMP}/plan.json"
          plan="${RUNNER_TEMP}/plan.json"
          action="$(jq -r '.action' "$plan")"
          jq -r '.summary' "$plan" >> "$GITHUB_STEP_SUMMARY"
          case "$action" in
            open)
              jq -r '.body' "$plan" > "${RUNNER_TEMP}/stuck.md"
              gh issue create --title "$(jq -r '.title' "$plan")" \
                --body-file "${RUNNER_TEMP}/stuck.md"
              ;;
            update)
              # Edited rather than commented on: a run happens on every push to `main`, and a
              # comment per run would bury the recovery steps under its own noise.
              jq -r '.body' "$plan" > "${RUNNER_TEMP}/stuck.md"
              gh issue edit "$(jq -r '.issue' "$plan")" --body-file "${RUNNER_TEMP}/stuck.md"
              ;;
            close)
              gh issue close "$(jq -r '.issue' "$plan")" --comment "$(jq -r '.comment' "$plan")"
              ;;
          esac
          # Red even when release-please exited zero. A release left behind by a run that
          # reported success is the shape with no other signal at all.
          if [ "$action" = "open" ] || [ "$action" = "update" ]; then
            echo "::error::$(jq -r '.summary' "$plan")"
            exit 1
          fi
