name: Release Please

# Keeps a Release PR open per package: version bump, changelog section, manifest. Merging one
# releases it — tag, then publish — with no further step. Merging is the decision.
on:
  push:
    branches: [main]
  # Nothing else can start this: without it, recovering from a failed run means pushing to
  # main or re-running a run from the UI.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare releases
    runs-on: ubuntu-latest
    permissions:
      # Opens and updates the Release PR, and creates the Release and tag on merge. Scoped to
      # this job; the workflow default above stays read-only.
      contents: write
      pull-requests: write
      # Labels are an Issues-API concept even on a PR, and release-please creates its own
      # `autorelease:*` pair on first run. Without this it 403s and every release wedges.
      issues: write
      # Dispatching the two workflows below. It cannot approve anything: publishing still
      # waits on the `pypi` environment's reviewer.
      actions: write
    steps:
      - name: Run release-please
        # Pinned to the commit v4 resolves to: a moving tag is a supply-chain hole, and this
        # job can write to the repository.
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A tag created by GITHUB_TOKEN starts no workflow, so `on: push: tags` never fires.
      # Dispatch does fire — it is a documented exception — and needs no stored credential.
      - name: Publish each released package
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # This job checks nothing out, so gh cannot infer the repository from a git
          # remote. Without this it fails with "not a git repository".
          GH_REPO: ${{ github.repository }}
          PATHS: ${{ steps.release.outputs.paths_released }}
          OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          set -euo pipefail
          for path in $(echo "$PATHS" | jq -r '.[]'); do
            tag="$(echo "$OUTPUTS" | jq -r --arg k "${path}--tag_name" '.[$k]')"
            # At the tag, never at main: main may already have moved past the release commit.
            gh workflow run publish-packages.yml --ref "$tag" \
              -f package="${path##*/}" -f target=pypi
            echo "dispatched publish for ${path##*/} at ${tag}" >> "$GITHUB_STEP_SUMMARY"
          done

      # After maf-sandbox publishes, the dependents that already widened their ceiling to build
      # against it can finally point their floor at it — the post-release step of RELEASING.md's
      # release order, which lived only in prose until now.
      - name: Check out to bump the dependents' floor
        if: >-
          steps.release.outputs.releases_created == 'true'
          && contains(steps.release.outputs.paths_released, '"packages/maf-sandbox"')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Propose the dependents' floor bump
        if: >-
          steps.release.outputs.releases_created == 'true'
          && contains(steps.release.outputs.paths_released, '"packages/maf-sandbox"')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs['packages/maf-sandbox--version'] }}
        run: |
          set -euo pipefail
          # Fails if a dependent's constraint has drifted from the shape it edits by pattern —
          # a release step that quietly does nothing is worse than one that stops. Runs on the
          # runner's own python3: the script is stdlib-only, and the floor lives in pyproject
          # alone (uv.lock records the workspace edge without a specifier, so it does not move).
          python3 scripts/bump_dependents_floor.py "$VERSION"
          if git diff --quiet; then
            echo "no dependent has adopted maf-sandbox ${VERSION}; no floor bump" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="chore/require-maf-sandbox-${VERSION}"
          # Skip only when the proposal is already open; a branch left behind by a create that
          # failed after the push is rebuilt below rather than stranding the bump forever.
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "a PR for ${branch} is already open; leaving it" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git push origin --delete "$branch" 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          # `fix:` is the floor of what this is — the reviewer retitles if adopting the version
          # is a bigger change for a dependent than a patch. A bot must not pick the bump.
          git commit -am "fix: require maf-sandbox ${VERSION} in the packages that use it"
          git push -u origin "$branch"
          body="Automated by the release workflow when maf-sandbox ${VERSION} was released. **Check that it actually published before merging this.** The upload is dispatched separately and may still be waiting on the pypi environment, or have failed; a floor pointing at a version that never reached PyPI is unresolvable for every consumer. It raises the floor in every dependent whose ceiling already admits ${VERSION}.

          **That is a guess, and usually a wrong one.** Ceilings are widened for all dependents at once, before the release, so that the published set stays resolvable — see RELEASING.md, Release order. A widened ceiling therefore says nothing about whether a package's code uses ${VERSION}. Move a floor only for a package that relies on API or behaviour this release introduced or changed — a new import is the obvious case, but a fixed bug in an existing call counts too. For the rest this pins a version they do not need and over-constrains their consumers.

          This is a proposal, not a decision, and it is one pull request covering every dependent — so there is nothing to close per package:

          - Keep the hunks for the packages that genuinely rely on ${VERSION}, drop the rest, and merge what remains.
          - Close it whole if none of them do, and move the floor in the pull request that actually adopts the version.
          - Retitle it feat:/breaking if adopting the version is more than a patch for a dependent — the title defaults to fix: so the bot does not choose the bump.

          The ceiling is deliberately untouched: it was widened before the release so the published set stays resolvable, which is a separate decision from whether any package's code needs this version. Clear its held run the way you do for a Release PR: **Approve and run**. A dispatched run reports the required contexts but does not unblock the merge."
          gh pr create --base main --head "$branch" \
            --title "fix: require maf-sandbox ${VERSION} in the packages that use it" \
            --body "$body"
          echo "opened ${branch}" >> "$GITHUB_STEP_SUMMARY"

      # Its own pull request, not a section of the one above. The floor bump asserts that a
      # package needs this version and has to be judged per package; this is uniform, is a
      # claim about nobody's code, and can be merged without that thought. Bundling them
      # would put the judgement behind the same button as the formality.
      - name: Propose the dependents' ceiling widening
        if: >-
          steps.release.outputs.releases_created == 'true'
          && contains(steps.release.outputs.paths_released, '"packages/maf-sandbox"')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs['packages/maf-sandbox--version'] }}
        run: |
          set -euo pipefail
          git checkout -- . && git switch main
          python3 scripts/widen_dependents_ceiling.py "$VERSION"
          if git diff --quiet; then
            echo "every dependent already admits the next minor; no widening" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # From the script, never recomputed here: the branch, title and body all name this
          # bound, and a second implementation of the rule is how they come to advertise one
          # ceiling while the commit edits another.
          target="$(python3 scripts/widen_dependents_ceiling.py --print-target "$VERSION")"
          branch="chore/admit-maf-sandbox-${target}"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "a PR for ${branch} is already open; leaving it" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git push origin --delete "$branch" 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          # `fix:` is required, not stylistic: chore/ci release nothing here, and this widening
          # is only useful once it is *published*, which needs the dependent releases a
          # releasing type cuts. See RELEASING.md, Release order.
          git commit -am "fix: admit maf-sandbox ${target%.*}.$(( ${target##*.} - 1 )) in the dependents' range"
          git push -u origin "$branch"
          body="Automated by the release workflow when maf-sandbox ${VERSION} was released. Its upload is dispatched separately and may still be waiting on the pypi environment, or have failed — this does not wait for it. It widens every dependent's ceiling to <${target}, so the minor after ${VERSION} is admitted before it exists. That holds either way: a ceiling admits a version whether or not it exists.

          Unlike the floor bump alongside it, this is not a claim about any package's code. Widening only enlarges an accepted set, so it cannot make a resolution fail; what it buys is that the next core minor can be released without leaving the index unresolvable as a set (#175) and without anyone having to remember step 1 (#177).

          **Merge it, and let the dependent releases it cuts publish.** The widening is only worth anything once it is on PyPI: that is what the next core release checks before it uploads. Clear its held run the way you do for a Release PR: **Approve and run**. A dispatched run reports the required contexts but does not unblock the merge."
          gh pr create --base main --head "$branch" \
            --title "fix: admit maf-sandbox ${target%.*}.$(( ${target##*.} - 1 )) in the dependents' range" \
            --body "$body"
          echo "opened ${branch}" >> "$GITHUB_STEP_SUMMARY"
      # A bot author trips the approval gate, so the run a bot-opened pull request creates
      # waits at `action_required` and its required check never reports. A dispatched run
      # is not held and lands its checks on the same head SHA, which is what the required
      # contexts are evaluated against.
      #
      # That is the whole of what this buys. The held run still blocks the merge with every
      # context green, so a human still clears it — and clearing it runs these checks again.
      # Whether the step earns its keep is #196; it is left in place until that is decided.
      - name: Start the checks on the pull requests this workflow opened
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Selecting the author rather than passing `--author`, which is not a filter on
          # this query: it switches gh to the search index, and that index will not have a
          # pull request opened seconds ago by the step above. The page is raised because
          # the filter now follows it — the default is 30.
          open_bot_pull_requests="$(gh pr list --state open --limit 100 \
            --json headRefName,headRefOid,author \
            --jq '.[] | select(.author.login == "app/github-actions") | [.headRefName, .headRefOid] | @tsv')"
          # Dispatching nothing is this step's failure mode, so it never exits silent.
          if [ -z "$open_bot_pull_requests" ]; then
            echo "no open pull requests from app/github-actions" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s\n' "$open_bot_pull_requests" \
          | while IFS=$'\t' read -r branch sha; do
              # Skip one already running or already reported: a dispatch per push to main
              # would otherwise re-run every open bot pull request each time.
              live="$(gh run list --workflow=tests.yml --branch "$branch" --limit 20 \
                --json headSha,conclusion \
                --jq "[.[] | select(.headSha == \"$sha\") | select(.conclusion != \"action_required\")] | length")"
              if [ "$live" -gt 0 ]; then
                echo "checks already running or reported for ${branch}" >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
              gh workflow run tests.yml --ref "$branch"
              echo "dispatched tests for ${branch}" >> "$GITHUB_STEP_SUMMARY"
            done
