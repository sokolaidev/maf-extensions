name: Release Please

# Keeps a Release PR open per package: version bump, changelog section, manifest. Merging it
# creates the GitHub Release and its tag; launching the publish is the manual step.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare releases
    runs-on: ubuntu-latest
    permissions:
      # Opens and updates the Release PR, and creates the Release and tag on merge. Scoped to
      # this job; the workflow default above stays read-only.
      contents: write
      pull-requests: write
      # Labels are an Issues-API concept even on a PR, and release-please creates its own
      # `autorelease:*` pair on first run. Without this it 403s and every release wedges.
      issues: write
    steps:
      - name: Run release-please
        # Pinned to the commit v4 resolves to: a moving tag is a supply-chain hole, and this
        # job can write to the repository.
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The tag exists by now, but one created by GITHUB_TOKEN starts no workflow — so the
      # publish is launched by hand, against that tag. docs/maintainers.md has the why.
      - name: Say how to publish
        if: steps.release.outputs.releases_created == 'true'
        env:
          PATHS: ${{ steps.release.outputs.paths_released }}
          OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          set -euo pipefail
          {
            echo "### Released — run Publish to upload each one to PyPI"
            echo
            echo '```bash'
            for path in $(echo "$PATHS" | jq -r '.[]'); do
              tag="$(echo "$OUTPUTS" | jq -r --arg k "${path}--tag_name" '.[$k]')"
              echo "gh workflow run publish-packages.yml --ref ${tag} -f package=${path##*/} -f target=pypi"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
