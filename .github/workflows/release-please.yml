name: Release Please

# Keeps a Release PR open per package: version bump, changelog section, manifest. Merging one
# releases it — tag, then publish — with no further step. Merging is the decision.
on:
  push:
    branches: [main]
  # Nothing else can start this: without it, recovering from a failed run means pushing to
  # main or re-running a run from the UI.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare releases
    runs-on: ubuntu-latest
    permissions:
      # Opens and updates the Release PR, and creates the Release and tag on merge. Scoped to
      # this job; the workflow default above stays read-only.
      contents: write
      pull-requests: write
      # Labels are an Issues-API concept even on a PR, and release-please creates its own
      # `autorelease:*` pair on first run. Without this it 403s and every release wedges.
      issues: write
      # Dispatching publish-packages.yml below. It cannot approve anything: publishing
      # still waits on the `pypi` environment's reviewer.
      actions: write
    steps:
      - name: Run release-please
        # Pinned to the commit v4 resolves to: a moving tag is a supply-chain hole, and this
        # job can write to the repository.
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A tag created by GITHUB_TOKEN starts no workflow, so `on: push: tags` never fires.
      # Dispatch does fire — it is a documented exception — and needs no stored credential.
      - name: Publish each released package
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # This job checks nothing out, so gh cannot infer the repository from a git
          # remote. Without this it fails with "not a git repository".
          GH_REPO: ${{ github.repository }}
          PATHS: ${{ steps.release.outputs.paths_released }}
          OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          set -euo pipefail
          for path in $(echo "$PATHS" | jq -r '.[]'); do
            tag="$(echo "$OUTPUTS" | jq -r --arg k "${path}--tag_name" '.[$k]')"
            # At the tag, never at main: main may already have moved past the release commit.
            gh workflow run publish-packages.yml --ref "$tag" \
              -f package="${path##*/}" -f target=pypi
            echo "dispatched publish for ${path##*/} at ${tag}" >> "$GITHUB_STEP_SUMMARY"
          done

      # After maf-sandbox publishes, its dependents' range moves at both ends: the floor to the
      # version that just published, in the packages that look like they need it, and the
      # ceiling two minors up so the release after it needs nobody's permission. The post-release
      # step of RELEASING.md's release order, which lived only in prose until #41 and #178.
      #
      # One step, because the two bounds are one string. They were two steps opening two pull
      # requests, and since each rewrote the whole constraint, whichever merged second reverted
      # the other's half (#195). The separation was never real; only the collision was.
      - name: Check out to set the dependents' range
        if: >-
          steps.release.outputs.releases_created == 'true'
          && contains(steps.release.outputs.paths_released, '"packages/maf-sandbox"')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Propose the dependents' range
        if: >-
          steps.release.outputs.releases_created == 'true'
          && contains(steps.release.outputs.paths_released, '"packages/maf-sandbox"')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs['packages/maf-sandbox--version'] }}
        run: |
          set -euo pipefail
          # The title first, because it names the bounds that are *about* to move and the
          # script has nothing left to report once it has moved them. From the script rather
          # than rebuilt here: a second implementation of the rule is how a pull request comes
          # to advertise one thing while its commit does another.
          title="$(python3 scripts/set_dependents_range.py --print-title "$VERSION")"
          # Fails if a dependent's constraint has drifted from the shape it edits by pattern —
          # a release step that quietly does nothing is worse than one that stops. Runs on the
          # runner's own python3: the script is stdlib-only, and the range lives in pyproject
          # alone (uv.lock records the workspace edge without a specifier, so it does not move).
          python3 scripts/set_dependents_range.py "$VERSION"
          if git diff --quiet; then
            echo "every dependent's range already covers maf-sandbox ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$title" ]; then
            echo "the range changed but --print-title named nothing; refusing to commit an" \
                 "unlabelled release-type change" >&2
            exit 1
          fi
          branch="chore/maf-sandbox-range-${VERSION}"
          # Skip only when the proposal is already open; a branch left behind by a create that
          # failed after the push is rebuilt below rather than stranding the change forever.
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "a PR for ${branch} is already open; leaving it" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git push origin --delete "$branch" 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "$title"
          git push -u origin "$branch"
          body="Automated by the release workflow when maf-sandbox ${VERSION} was released. **Check that it actually published before merging this.** The upload is dispatched separately and may still be waiting on the pypi environment, or have failed; a floor pointing at a version that never reached PyPI is unresolvable for every consumer.

          It carries both ends of the range, because they are one string and two pull requests editing it each reverted the other's half (#195). The two ends are not the same kind of claim, so read them differently:

          **The ceiling is uniform and is a claim about nobody's code.** It widens to admit the minor after ${VERSION}, before that minor exists — which holds either way, since a ceiling admits a version whether or not it has been released. Widening only enlarges an accepted set, so it cannot make a resolution fail. What it buys is that the next core minor can be released without leaving the index unresolvable as a set (#175) and without anyone having to remember step 1 (#177). Nothing here needs your judgement.

          **The floor is a guess, and usually a wrong one.** It moves in every dependent whose ceiling already admitted ${VERSION} and whose floor was a minor behind — a shape, not evidence that a package's code uses this release. Ceilings are widened for everyone at once, so admitting a version says nothing about needing it. A floor should move only for a package that relies on API or behaviour this release introduced or changed; a new import is the obvious case, but a fixed bug in an existing call counts too. For the rest it pins a version they do not need and over-constrains their consumers.

          **To decline a floor without losing its ceiling**, edit that line back to the floor it had and leave the new upper bound alone — the two now live in one hunk, so dropping the hunk wholesale would give up the widening too. Retitle it feat:/breaking if adopting the version is more than a patch for a dependent; the title says fix: so the bot does not choose the bump.

          **Then merge it, and let the dependent releases it cuts publish.** The widening is only worth anything once it is on PyPI: that is what the next core release checks before it uploads. Its checks are held at "Approve and run", the same as a Release PR's; clearing them is what starts them."
          gh pr create --base main --head "$branch" \
            --title "$title" \
            --body "$body"
          echo "opened ${branch}" >> "$GITHUB_STEP_SUMMARY"
