name: MXC native session, streams and files qualification

on:
  workflow_dispatch:
    inputs:
      mxc_files:
        description: "Qualify bounded MXC files and durable artifacts on Linux and Windows"
        type: boolean
        default: false
      mxc_prelaunch:
        description: "Use format-7 pre-launch recovery for the mxc_files qualification"
        type: boolean
        default: false
      mxc_streams:
        description: "Qualify separate MXC byte streams on Linux KVM and Windows WHP"
        type: boolean
        default: false
      mxc_stream_kernel:
        description: "Build the experimental MXC byte-stream kernel from pinned sources"
        type: boolean
        default: false
      mxc_v1:
        description: 'MXC native session: resolve dependency lock or qualify recovery'
        type: choice
        options: ['off', resolve-lock, qualify]
        default: 'off'

permissions:
  contents: read

jobs:
  mxc-stream-kernel:
    if: inputs.mxc_stream_kernel || inputs.mxc_streams
    name: MXC byte-stream kernel build (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - if: github.event_name == 'workflow_dispatch' && (inputs.mxc_stream_kernel || inputs.mxc_streams)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name == 'workflow_dispatch' && (inputs.mxc_stream_kernel || inputs.mxc_streams)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Build pinned experimental kernel
        if: github.event_name == 'workflow_dispatch' && (inputs.mxc_stream_kernel || inputs.mxc_streams)
        run: uv run --no-project --python 3.12 python -m scripts.experiments.mxc_streams_patch.build_kernel --root "$RUNNER_TEMP/mxc-stream-kernel"
      - name: Retain kernel identity and diagnostics
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.mxc_stream_kernel || inputs.mxc_streams)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mxc-stream-kernel-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mxc-stream-kernel/elfloader_hyperlight-x86_64
            ${{ runner.temp }}/mxc-stream-kernel/kernel-result.json
            ${{ runner.temp }}/mxc-stream-kernel/*.log
          retention-days: 14
          if-no-files-found: error

  mxc-streams:
    if: inputs.mxc_streams
    name: MXC byte streams (${{ matrix.os }})
    needs: [mxc-stream-kernel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - if: github.event_name == 'workflow_dispatch' && inputs.mxc_streams
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name == 'workflow_dispatch' && inputs.mxc_streams
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Permit runner-owned KVM access
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_streams && runner.os == 'Linux'
        run: |
          set -euo pipefail
          test -c /dev/kvm
          printf 'KERNEL=="kvm", OWNER="%s", MODE="0600"\n' "$(id -un)" | sudo tee /etc/udev/rules.d/99-mxc-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install Linux build prerequisites
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_streams && runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libclang-dev
      - name: Install pinned Rust toolchain
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_streams
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Download the shared kernel artifact
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_streams
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mxc-stream-kernel-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mxc-stream-kernel
      - name: Qualify bytes, control and durable replay
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_streams
        shell: bash
        run: uv run --no-project --python 3.12 python -m scripts.experiments.mxc_streams_patch.qualification_runner --root "$RUNNER_TEMP/mxc-streams" --kernel-dir "$RUNNER_TEMP/mxc-stream-kernel"
      - name: Retain byte-stream qualification evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mxc_streams
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mxc-streams-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mxc-streams/*.json
            ${{ runner.temp }}/mxc-streams/*.log
            ${{ runner.temp }}/mxc-streams/build/Cargo.lock
            ${{ runner.temp }}/mxc-streams/native/*.json
            ${{ runner.temp }}/mxc-streams/native/*.stdout
            ${{ runner.temp }}/mxc-streams/native/*.stderr
            ${{ runner.temp }}/mxc-streams/streams/result.json
            ${{ runner.temp }}/mxc-streams/streams/*/native.json
            ${{ runner.temp }}/mxc-streams/streams/*/native.stdout
            ${{ runner.temp }}/mxc-streams/streams/*/native.stderr
            ${{ runner.temp }}/mxc-streams/streams/*/native.stderr.bin
            ${{ runner.temp }}/mxc-streams/durability/result.json
            ${{ runner.temp }}/mxc-streams/durability/*.log
            ${{ runner.temp }}/mxc-streams/durability/quota-*/*.log
          retention-days: 14
          if-no-files-found: error

  mxc-file-kernel:
    if: inputs.mxc_files
    name: MXC bounded-file kernel build (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - if: github.event_name == 'workflow_dispatch' && inputs.mxc_files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name == 'workflow_dispatch' && inputs.mxc_files
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Build pinned experimental kernel
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_files
        run: uv run --no-project --python 3.12 python -m scripts.experiments.mxc_files_patch.build_kernel --root "$RUNNER_TEMP/mxc-file-kernel"
      - name: Retain kernel identity and diagnostics
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mxc_files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mxc-file-kernel-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mxc-file-kernel/elfloader_hyperlight-x86_64
            ${{ runner.temp }}/mxc-file-kernel/kernel-result.json
            ${{ runner.temp }}/mxc-file-kernel/*.log
          retention-days: 14
          if-no-files-found: error

  mxc-files:
    if: inputs.mxc_files
    name: MXC bounded files (${{ matrix.os }})
    needs: [mxc-file-kernel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - if: github.event_name == 'workflow_dispatch' && inputs.mxc_files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name == 'workflow_dispatch' && inputs.mxc_files
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Permit runner-owned KVM access
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_files && runner.os == 'Linux'
        run: |
          set -euo pipefail
          test -c /dev/kvm
          printf 'KERNEL=="kvm", OWNER="%s", MODE="0600"\n' "$(id -un)" | sudo tee /etc/udev/rules.d/99-mxc-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install Linux build prerequisites
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_files && runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libclang-dev
      - name: Install pinned Rust toolchain
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_files
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Download the shared kernel artifact
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mxc-file-kernel-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mxc-file-kernel
      - name: Create native publication exhaustion volume
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_files
        uses: ./.github/actions/mxc-volume
        with:
          phase: create
          volume-mib: '8192'
      - name: Qualify files, quota and durable replay
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_files
        shell: bash
        env:
          MXC_PRELAUNCH: ${{ inputs.mxc_prelaunch }}
        run: |
          args=()
          if [[ "$MXC_PRELAUNCH" == "true" ]]; then args+=(--prelaunch-recovery); fi
          uv run --no-project --python 3.12 python -m scripts.experiments.mxc_files_patch.qualification_runner --root "$RUNNER_TEMP/mxc-files" --kernel-dir "$RUNNER_TEMP/mxc-file-kernel" "${args[@]}"
      - name: Detach native publication exhaustion volume
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mxc_files
        uses: ./.github/actions/mxc-volume
        with:
          phase: cleanup
      - name: Retain bounded-file qualification evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mxc_files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mxc-files-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mxc-files/*.json
            ${{ runner.temp }}/mxc-files/*.log
            ${{ runner.temp }}/mxc-files/build/Cargo.lock
            ${{ runner.temp }}/mxc-files/native/*.json
            ${{ runner.temp }}/mxc-files/native/*.stdout
            ${{ runner.temp }}/mxc-files/native/*.stderr
            ${{ runner.temp }}/mxc-files/files/result.json
            ${{ runner.temp }}/mxc-files/files/*/native.json
            ${{ runner.temp }}/mxc-files/files/*/native.stdout
            ${{ runner.temp }}/mxc-files/files/*/native.stderr
            ${{ runner.temp }}/mxc-files/files/*/native.stderr.bin
            ${{ runner.temp }}/mxc-files/files/*/collected-chart.png
            ${{ runner.temp }}/mxc-files/durability/result.json
            ${{ runner.temp }}/mxc-files/durability/*.log
            ${{ runner.temp }}/mxc-files/durability/quota-*/*.log
            ${{ runner.temp }}/mxc-files/physical/*.json
            ${{ runner.temp }}/mxc-files/physical/*.log
            ${{ runner.temp }}/mxc-files/volume/*.json
            ${{ runner.temp }}/mxc-files/volume/*.log
            ${{ runner.temp }}/mxc-files/checkpoint-volume/result.json
            ${{ runner.temp }}/mxc-files/checkpoint-volume/*/*.json
            ${{ runner.temp }}/mxc-files/checkpoint-volume/*/*.log
            ${{ runner.temp }}/mxc-volume-results/cleanup.json
            ${{ runner.temp }}/mxc-files/idle/result.json
            ${{ runner.temp }}/mxc-files/deletion/result.json
            ${{ runner.temp }}/mxc-files/deletion/*/*.json
            ${{ runner.temp }}/mxc-files/deletion/*/*.log
          retention-days: 14
          if-no-files-found: error

  mxc-v1:
    if: inputs.mxc_v1 != 'off'
    name: MXC native session and recovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - if: github.event_name == 'workflow_dispatch' && inputs.mxc_v1 != 'off'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name == 'workflow_dispatch' && inputs.mxc_v1 != 'off'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Permit runner-owned KVM access
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_v1 != 'off' && runner.os == 'Linux'
        run: |
          set -euo pipefail
          test -c /dev/kvm
          printf 'KERNEL=="kvm", OWNER="%s", MODE="0600"\n' "$(id -un)" | sudo tee /etc/udev/rules.d/99-mxc-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install Linux build prerequisites
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_v1 != 'off' && runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libclang-dev
      - name: Install pinned Rust toolchain
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_v1 != 'off'
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Build and qualify the MXC 1.0 migration
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_v1 != 'off'
        shell: bash
        env:
          MXC_V1_MODE: ${{ inputs.mxc_v1 }}
        run: uv run --no-project --python 3.12 python -m scripts.experiments.mxc_v1_patch.qualification_runner --root "$RUNNER_TEMP/mxc-v1" --mode "$MXC_V1_MODE"
      - name: Retain qualification reports and logs
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mxc_v1 != 'off'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mxc-v1-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mxc-v1/*.json
            ${{ runner.temp }}/mxc-v1/*.log
            ${{ runner.temp }}/mxc-v1/remote-native.xml
            ${{ runner.temp }}/mxc-v1/build/Cargo.lock
            ${{ runner.temp }}/mxc-v1/bounded_probe/result.json
            ${{ runner.temp }}/mxc-v1/baseline/*.log
            ${{ runner.temp }}/mxc-v1/baseline/native/*.json
            ${{ runner.temp }}/mxc-v1/baseline/native/*.stderr
            ${{ runner.temp }}/mxc-v1/native/*.json
            ${{ runner.temp }}/mxc-v1/native/*.stdout
            ${{ runner.temp }}/mxc-v1/native/*.stderr
            ${{ runner.temp }}/mxc-v1/durability_probe/*.log
            ${{ runner.temp }}/mxc-v1/durability_probe/quota-*/*.log
            ${{ runner.temp }}/mxc-v1/durability_probe/result.json
            ${{ runner.temp }}/mxc-v1/storage_probe/result.json
          if-no-files-found: error
          retention-days: 14
