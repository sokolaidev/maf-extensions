name: MXC remote ownership and checkpoint transfer

on:
  pull_request:
    paths:
      - '.github/workflows/mxc-remote.yml'
      - '.github/workflows/mxc-cross-runner.yml'
      - 'scripts/experiments/mxc_session_patch/**'
      - 'tests/test_mxc_remote_authority.py'
      - 'tests/test_mxc_remote_api.py'
      - 'tests/test_mxc_cross_runner.py'
      - 'uv.lock'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Remote ownership and transfer controls (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Record SQLite and Python versions
        run: >-
          uv run python -c "import json, os, platform, sqlite3; from pathlib import Path;
          report = dict(platform=platform.system(), python=platform.python_version(), sqlite=sqlite3.sqlite_version,
          source_commit=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT']);
          print(json.dumps(report));
          (Path(os.environ['RUNNER_TEMP']) / 'mxc-remote-runtime.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')"
      - name: Exercise mutual TLS, transfer, fencing and worker crashes
        env:
          MXC_TRANSFER_BYTES: '1073741824'
        shell: bash
        run: >-
          uv run pytest -q tests/test_mxc_remote_authority.py tests/test_mxc_remote_api.py
          tests/test_mxc_cross_runner.py
          --junitxml="$RUNNER_TEMP/mxc-remote.xml"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mxc-remote-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mxc-remote.xml
            ${{ runner.temp }}/mxc-remote-runtime.json
          if-no-files-found: error
          retention-days: 14
