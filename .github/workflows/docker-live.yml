name: Docker (live)

# Real engines are exercised after merge and on a timer. Keep their daemon and
# registry failures separate from the deterministic pull-request gate.
on:
  push:
    branches: [main]
  schedule:
    # Offset from ACAS conformance at 03:20 UTC.
    - cron: "50 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Serialize failure reports and let each active run finish its cleanup.
concurrency:
  group: docker-live
  cancel-in-progress: false

jobs:
  docker-e2e:
    name: Docker backend live tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # A small MCR image (not Docker Hub, so a shared runner IP is not rate-limited) with sh,
      # cat, ln and curl — everything the round trip and the allowlist controls need. Setting
      # these two variables is what turns the module's skip guard off.
      MAF_SANDBOX_DOCKER_E2E_IMAGE: mcr.microsoft.com/azurelinux/base/core:3.0
      MAF_SANDBOX_DOCKER_E2E_PROXY_IMAGE: maf-sandbox-docker-proxy:ci
      # Five non-root guests, built below, varying along two axes. **Who owns what around
      # `work_dir`**: the image's build (as `images/bicep-sandbox/Dockerfile` leaves it), the
      # image's user (as the hardening advice that produces a non-root `USER` also asks for),
      # or that user all the way up to `/maf-sandbox` — which is the shape `reclaim` checks
      # for, since a guest that can write *above* `work_dir` can swap it. **How `USER` is
      # spelled**: a numeric pair is taken from `Config.User` as-is, while a name has to be
      # resolved against the container's own account files. The last carries no `work_dir` at
      # all, so the write has to send it. Their own column because every other image this
      # repository runs — here, in the samples, in verify-live — is root's, and which principal
      # a file-plane call acts as is invisible against those.
      MAF_SANDBOX_DOCKER_E2E_NONROOT_IMAGE: maf-sandbox-docker-nonroot:ci
      MAF_SANDBOX_DOCKER_E2E_GUEST_OWNED_IMAGE: maf-sandbox-docker-guest-owned:ci
      MAF_SANDBOX_DOCKER_E2E_LOOSE_PARENT_IMAGE: maf-sandbox-docker-loose-parent:ci
      MAF_SANDBOX_DOCKER_E2E_NAMED_USER_IMAGE: maf-sandbox-docker-named-user:ci
      MAF_SANDBOX_DOCKER_E2E_ABSENT_WORK_IMAGE: maf-sandbox-docker-absent-work:ci
      # The CodeAct kind runs a Python program in the guest, so it needs an interpreter the
      # backend suite's image does not carry. Same registry for the same reason — MCR rather
      # than Docker Hub, whose unauthenticated pull limit is per shared-runner IP — and the
      # smallest MCR python there is, 204 MB against the devcontainer image's gigabyte.
      MAF_SANDBOX_CODEACT_E2E_IMAGE: mcr.microsoft.com/azurelinux/base/python:3.12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Sync workspace
        run: uv sync --locked

      - name: Run the live suite
        run: |
          set -euo pipefail
          # Build the egress proxy from the package's own shipped context, so the allowlist
          # topology (internal network + dual-homed proxy) is exercised end to end, not only
          # asserted at the command-line level offline.
          docker build -t maf-sandbox-docker-proxy:ci \
            packages/maf-sandbox-docker/src/maf_sandbox_docker/_proxy
          # Explicitly, because the proxy image above is pinned by digest and the two builds
          # below are otherwise the first thing in this job to resolve the tag.
          docker pull "$MAF_SANDBOX_DOCKER_E2E_IMAGE"
          # Five non-root guests off that base, so each build adds a layer and no download.
          # They vary along two axes. **How `USER` is spelled**: a numeric pair is taken from
          # `Config.User` as-is, while a name has to be resolved against the container's own
          # account files, and only the named image reaches that code — it appends its account
          # rows directly, since this base carries no `useradd`, and its gid is not its uid, so
          # a gid that was read cannot pass for one guessed from the uid. **What the image
          # carries under `/maf-sandbox`**: the first three carry `work_dir` and a file in it —
          # the shape a kind's image has, so a reclaim can be shown to remove its own directory
          # and nothing beside it — and differ in how far up the chain the guest owns: nothing,
          # `work_dir`, or `/maf-sandbox` above it. The last carries no `work_dir` at all, which
          # is the one shape where `write_file` has to send `work_dir` itself as an entry rather
          # than let docker create it.
          printf 'FROM %s\nRUN mkdir -p /maf-sandbox/work && echo "{}" > /maf-sandbox/work/carried.json\nUSER 10001:10001\n' \
            "$MAF_SANDBOX_DOCKER_E2E_IMAGE" \
            | docker build -t "$MAF_SANDBOX_DOCKER_E2E_NONROOT_IMAGE" -
          printf 'FROM %s\nRUN mkdir -p /maf-sandbox/work && echo "{}" > /maf-sandbox/work/carried.json && chown -R 10001:10001 /maf-sandbox/work\nUSER 10001:10001\n' \
            "$MAF_SANDBOX_DOCKER_E2E_IMAGE" \
            | docker build -t "$MAF_SANDBOX_DOCKER_E2E_GUEST_OWNED_IMAGE" -
          printf 'FROM %s\nRUN mkdir -p /maf-sandbox/work && echo "{}" > /maf-sandbox/work/carried.json && chown -R 10001:10001 /maf-sandbox\nUSER 10001:10001\n' \
            "$MAF_SANDBOX_DOCKER_E2E_IMAGE" \
            | docker build -t "$MAF_SANDBOX_DOCKER_E2E_LOOSE_PARENT_IMAGE" -
          # `Config.User` as a name, so both halves come from the account files.
          printf 'FROM %s\nRUN mkdir -p /maf-sandbox/work && echo "{}" > /maf-sandbox/work/carried.json && echo "devs:x:20001:" >> /etc/group && echo "app:x:10001:20001::/home/app:/bin/sh" >> /etc/passwd\nUSER app\n' \
            "$MAF_SANDBOX_DOCKER_E2E_IMAGE" \
            | docker build -t "$MAF_SANDBOX_DOCKER_E2E_NAMED_USER_IMAGE" -
          # `/maf-sandbox` without `work_dir` under it: the branch that sends `work_dir`
          # itself as an explicit entry, which docker would otherwise create as root.
          printf 'FROM %s\nRUN mkdir -p /maf-sandbox && echo "devs:x:20001:" >> /etc/group && echo "app:x:10001:20001::/home/app:/bin/sh" >> /etc/passwd\nUSER app\n' \
            "$MAF_SANDBOX_DOCKER_E2E_IMAGE" \
            | docker build -t "$MAF_SANDBOX_DOCKER_E2E_ABSENT_WORK_IMAGE" -
          # Both live suites in one invocation: the backend's, and the CodeAct kind's on top of
          # it (#397). `-ra` because each skips itself when its image variable is empty, which
          # the env block above has already made impossible — a skip here is a bug, and without
          # the summary it reads exactly like a pass. Serial: one shared Docker daemon.
          uv run pytest -q -ra \
            packages/maf-sandbox-docker/tests/test_docker_e2e.py \
            packages/maf-sandbox-codeact/tests/test_codeact_e2e.py

      - name: Measure confinement on the rootful engine
        env:
          MAF_SANDBOX_DOCKER_E2E_IMAGE: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          MAF_SANDBOX_DOCKER_OBSERVER_IMAGE: python:3.13-slim@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285
        run: |
          set -euo pipefail
          docker pull "$MAF_SANDBOX_DOCKER_E2E_IMAGE"
          docker pull "$MAF_SANDBOX_DOCKER_OBSERVER_IMAGE"
          uv run pytest -q -ra packages/maf-sandbox-docker/tests/test_docker_fingerprint_e2e.py

      - name: Measure Bicep confinement and module cache cleanup
        env:
          MAF_SANDBOX_BICEP_E2E_IMAGE: bicep-sandbox:ci
          MAF_SANDBOX_DOCKER_OBSERVER_IMAGE: python:3.13-slim@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285
        run: |
          set -euo pipefail
          docker build -t "$MAF_SANDBOX_BICEP_E2E_IMAGE" images/bicep-sandbox
          uv run pytest -q -ra \
            packages/maf-sandbox-bicep/tests/test_bicep_cache_e2e.py \
            packages/maf-sandbox-bicep/tests/test_bicep_confinement_e2e.py

      - name: Measure confinement on a rootless engine
        run: |
          set -euo pipefail
          engine="maf-fingerprint-rootless-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          profile="$RUNNER_TEMP/$engine.apparmor"
          trap 'docker logs "$engine" || true; docker rm -fv "$engine" || true; sudo apparmor_parser -R "$profile"' EXIT
          # Ubuntu requires an explicit userns grant for the nested rootless daemon.
          printf 'abi <abi/4.0>,\nprofile %s flags=(unconfined) {\n  userns,\n}\n' "$engine" > "$profile"
          sudo apparmor_parser -r "$profile"
          # Docker's rootless-in-Docker recipe requires this on the outer container only.
          docker run -d --privileged --name "$engine" \
            --security-opt "apparmor=$engine" \
            -e DOCKER_HOST=unix:///run/user/1000/docker.sock \
            docker:29-dind-rootless@sha256:e17fa54c2ffd511d8407c746eec77f7814e6f74fe20caf822dad1870599984c0
          for attempt in {1..30}; do
            if timeout 5 docker exec "$engine" docker info >/dev/null 2>&1; then break; fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$engine")" != true ]; then exit 1; fi
            sleep 1
          done
          docker exec "$engine" docker info --format '{{json .SecurityOptions}}' | grep -q rootless
          docker exec --user root "$engine" apk add --no-cache python3 py3-pytest
          docker exec "$engine" mkdir -p /tmp/core /tmp/backend /tmp/tests
          docker cp packages/maf-sandbox/src/. "$engine:/tmp/core"
          docker cp packages/maf-sandbox-docker/src/. "$engine:/tmp/backend"
          docker cp packages/maf-sandbox-docker/tests/test_docker_fingerprint_e2e.py "$engine:/tmp/tests/"
          workload='alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b'
          observer='python:3.13-slim@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285'
          docker exec "$engine" docker pull "$workload"
          docker exec "$engine" docker pull "$observer"
          docker exec -e PYTHONPATH=/tmp/core:/tmp/backend \
            -e MAF_SANDBOX_DOCKER_E2E_IMAGE="$workload" \
            -e MAF_SANDBOX_DOCKER_OBSERVER_IMAGE="$observer" \
            "$engine" python3 -m pytest -q -ra /tmp/tests/test_docker_fingerprint_e2e.py

  report-failure:
    name: Report Docker live failure
    needs: docker-e2e
    if: always() && needs.docker-e2e.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Open or notify the Docker live tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/report_docker_live_failure.py
