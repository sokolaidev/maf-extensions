name: OpenClaw MXC host qualification

on:
  workflow_dispatch:
    inputs:
      openclaw_mxc:
        description: "Compare official OpenClaw MXC smoke on fresh unprepared and prepared Windows runners"
        type: boolean
        default: false
      openclaw_mxc_phase:
        description: "Select native smoke or only its CLI and unrestricted fixture prerequisites"
        type: choice
        default: smoke
        options: [smoke, prerequisites]

permissions:
  contents: read

jobs:
  openclaw-mxc:
    if: inputs.openclaw_mxc
    name: OpenClaw MXC ${{ inputs.openclaw_mxc_phase || 'smoke' }} (${{ matrix.mode }}, ${{ matrix.preparation }})
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [none, ro, rw]
        preparation: ${{ fromJSON(inputs.openclaw_mxc_phase == 'prerequisites' && '["unprepared"]' || '["unprepared", "prepared"]') }}
    defaults:
      run:
        shell: pwsh
    steps:
      - if: github.event_name == 'workflow_dispatch' && inputs.openclaw_mxc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name == 'workflow_dispatch' && inputs.openclaw_mxc
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - if: github.event_name == 'workflow_dispatch' && inputs.openclaw_mxc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.8.1'
      - name: Install selected published subject without lifecycle scripts
        if: github.event_name == 'workflow_dispatch' && inputs.openclaw_mxc
        run: |
          uv sync --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --prefix "$env:RUNNER_TEMP/oc-mxc-installed" --ignore-scripts --no-audit --no-fund openclaw@2026.10.5 @openclaw/mxc-sandbox@2026.10.5
          exit $LASTEXITCODE
      - name: Record host readiness and selected preparation
        if: github.event_name == 'workflow_dispatch' && inputs.openclaw_mxc
        env:
          PREPARATION: ${{ matrix.preparation }}
        run: |
          $hostArguments = @('--installation', "$env:RUNNER_TEMP/oc-mxc-installed", '--output', "$env:RUNNER_TEMP/oc-mxc-host")
          if ($env:PREPARATION -eq 'prepared') { $hostArguments += '--prepare' }
          uv run --directory scripts python -m openclaw_conformance.mxc_host @hostArguments
          exit $LASTEXITCODE
      - name: Exercise the selected native workspace mode
        if: github.event_name == 'workflow_dispatch' && inputs.openclaw_mxc
        env:
          WORKSPACE_MODE: ${{ matrix.mode }}
          MXC_PHASE: ${{ inputs.openclaw_mxc_phase }}
        run: |
          $smokeArguments = @('--installation', "$env:RUNNER_TEMP/oc-mxc-installed", '--output', "$env:RUNNER_TEMP/oc-mxc-smoke", '--mode', "$env:WORKSPACE_MODE", '--debug-native')
          if ($env:MXC_PHASE -eq 'prerequisites') { $smokeArguments += '--prerequisites-only' }
          uv run --directory scripts python -m openclaw_conformance.mxc_smoke @smokeArguments
          exit $LASTEXITCODE
      - name: Retain Markdown evidence only
        if: always() && github.event_name == 'workflow_dispatch' && inputs.openclaw_mxc
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openclaw-mxc-${{ matrix.mode }}-${{ matrix.preparation }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/oc-mxc-host/host.md
            ${{ runner.temp }}/oc-mxc-smoke/report.md
          if-no-files-found: error
          retention-days: 14
