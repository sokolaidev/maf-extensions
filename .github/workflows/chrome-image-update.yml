name: Chrome image updates

on:
  workflow_run:
    workflows: [Container image monitor]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      deliver:
        description: Open or refresh a security or package-required Chrome PR
        type: boolean
        default: false
      reason:
        description: Why the Chrome update is required (used only for delivery)
        type: choice
        options: [none, security, package]
        default: none
      justification:
        description: Required only for package updates - package and needed browser capability
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: chrome-image-update
  queue: max
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.repository == 'sokolaidev/maf-extensions' && github.ref == 'refs/heads/main' &&
      (vars.IMAGE_REMEDIATION_ENABLED == 'true' || github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.path == '.github/workflows/container-image-monitor.yml'))
    runs-on: ubuntu-latest-m
    timeout-minutes: 120
    outputs:
      source: ${{ steps.acquire.outputs.source }}
      updates: ${{ steps.acquire.outputs.updates }}
      artifact_id: ${{ steps.candidate.outputs.artifact-id }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install repository signature tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnupg gpgv
      - name: Discover and authenticate a stable Chrome update
        id: acquire
        run: uv run --locked python scripts/chrome_update.py acquire --work "$RUNNER_TEMP/chrome-update"
      - uses: ./.github/actions/setup-classic-docker
        if: steps.acquire.outputs.updates == 'true'
      - name: Install pinned scanners
        if: steps.acquire.outputs.updates == 'true'
        run: python3 scripts/install_container_scanners.py --directory "$RUNNER_TEMP/scan-tools"
      - name: Build and qualify the proposed browser
        if: steps.acquire.outputs.updates == 'true'
        run: uv run --locked python scripts/chrome_update.py build --work "$RUNNER_TEMP/chrome-update"
      - name: Check the proposed source
        if: steps.acquire.outputs.updates == 'true'
        run: uv run --locked poe gate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: candidate
        if: always()
        with:
          name: chrome-update-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chrome-update/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

      - name: Retain preparation notification documents
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.acquire.outcome == 'success'
        with:
          name: chrome-update-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/chrome-update/receipt.json
            ${{ runner.temp }}/chrome-update/discovery.json
            ${{ runner.temp }}/chrome-update/deferral.json
          if-no-files-found: warn
          retention-days: 30

  delivery:
    needs: update
    if: >-
      needs.update.outputs.updates == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_run' ||
       (github.event_name == 'workflow_dispatch' && inputs.deliver))
    concurrency:
      group: container-security-catalogue
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      actions: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.update.outputs.source }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.update.outputs.artifact_id }}
          path: ${{ runner.temp }}/chrome-update
      - name: Install repository signature tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnupg gpgv
      - name: Verify the security or package delivery requirement
        id: authorize
        if: >-
          (github.event_name == 'schedule' || github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.deliver))
        env:
          UPDATE_REASON: ${{ inputs.reason || 'none' }}
          UPDATE_JUSTIFICATION: ${{ inputs.justification }}
        run: >-
          uv run --locked python scripts/chrome_update.py authorize --work "$RUNNER_TEMP/chrome-update"
          --reason "$UPDATE_REASON" --justification "$UPDATE_JUSTIFICATION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: retain
        if: always()
        with:
          name: chrome-update-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chrome-update/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

      - name: Mint the dedicated remediation identity
        id: app
        if: >-
          success() &&
          vars.IMAGE_REMEDIATION_ENABLED == 'true' && vars.IMAGE_REMEDIATION_APP_CLIENT_ID != '' &&
          steps.authorize.outputs.deliver == 'true' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.deliver))
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.IMAGE_REMEDIATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.IMAGE_REMEDIATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: maf-extensions
          permission-contents: write
          permission-pull-requests: write
      - name: Open or refresh the owned Chrome PR
        id: deliver
        if: steps.app.outcome == 'success' && steps.app.outputs.token != ''
        env:
          IMAGE_REMEDIATION_TOKEN: ${{ steps.app.outputs.token }}
          IMAGE_REMEDIATION_APP_PRIVATE_KEY: ${{ secrets.IMAGE_REMEDIATION_APP_PRIVATE_KEY }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
          ARTIFACT_ID: ${{ steps.retain.outputs.artifact-id }}
          UPDATE_REASON: ${{ inputs.reason || 'none' }}
          UPDATE_JUSTIFICATION: ${{ inputs.justification }}
        run: >-
          uv run --locked python scripts/chrome_update.py publish --work "$RUNNER_TEMP/chrome-update"
          --bot "$BOT" --artifact-id "$ARTIFACT_ID"
          --reason "$UPDATE_REASON" --justification "$UPDATE_JUSTIFICATION"
      - name: Retain the final Chrome notification documents
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: chrome-update-attention-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/chrome-update/receipt.json
            ${{ runner.temp }}/chrome-update/publication.json
            ${{ runner.temp }}/chrome-update/deferral.json
            ${{ runner.temp }}/chrome-update/delivery-requirement.json
          if-no-files-found: error
          retention-days: 30

  report-attention:
    name: Report findings requiring maintainer action
    needs: [update, delivery]
    if: >-
      always() && github.repository == 'sokolaidev/maf-extensions' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    concurrency:
      group: image-remediation-attention
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Open or update deduplicated maintainer issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/report_remediation_attention.py --kind chrome

  report-failure:
    needs: [update, delivery]
    if: always() && (needs.update.result == 'failure' || needs.delivery.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Report Chrome updater failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/report_workflow_failure.py
          --marker '<!-- chrome-image-update-failure-tracker -->'
          --title 'Automatic Chrome image updates need attention'
          --reproduce 'Inspect the retained Chrome upstream and candidate evidence, then dispatch chrome-image-update.yml from current main; leave deliver disabled for qualification only.'
          --expected 'A newer authenticated stable Chrome package passes rendering, inventory, security and source checks. Scheduled and manual security delivery require verified current published-image High/Critical fixes; manual package delivery requires a package justification.'
          --context 'Signature failures, unavailable packages and failed qualification require investigation. Source updates do not publish replacement images. Main changes and competing PRs defer delivery until fresh evidence can be acquired.'
          --packages maf-sandbox maf-sandbox-document
