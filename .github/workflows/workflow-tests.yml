name: Portable workflow tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Workflow behavior on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: '3.12'
      - name: Sync workspace
        run: |
          uv sync --locked
          exit $LASTEXITCODE
      - name: Run shared behavior and platform shell checks
        run: |
          $python = uv python find
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/check_workflows.ps1 -Python $python -TestArgs '-q', '-ra'
