name: Portable workflow tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hyperlight_provenance:
        description: "Build, attest and verify temporary Hyperlight runtime images in isolated registries"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: workflow-tests-${{ inputs.hyperlight_provenance && 'hyperlight-provenance' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.hyperlight_provenance }}

jobs:
  hyperlight-provenance:
    name: Verify signed Hyperlight runtime
    if: github.event_name == 'workflow_dispatch' && inputs.hyperlight_provenance
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/hyperlight-provenance.yml

  changes:
    name: What affects workflow behavior
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA" HEAD |
            python3 scripts/changed_paths.py --workflows >> "$GITHUB_OUTPUT"

  classic-docker:
    name: Configuration-based Docker IDs on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-classic-docker
      - name: Verify saved configuration identity across a Docker reload
        run: |
          set -euo pipefail
          tar -cf "$RUNNER_TEMP/empty.tar" --files-from /dev/null
          docker image import --platform linux/amd64 "$RUNNER_TEMP/empty.tar" maf-store-probe:ci
          docker image save --output "$RUNNER_TEMP/probe.tar" maf-store-probe:ci
          docker image rm maf-store-probe:ci
          docker image load --input "$RUNNER_TEMP/probe.tar"
          IMAGE_ID=$(docker image inspect --format '{{.Id}}' maf-store-probe:ci)
          export IMAGE_ID
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import tarfile
          from pathlib import Path

          with tarfile.open(Path(os.environ["RUNNER_TEMP"]) / "probe.tar") as archive:
              manifest = json.load(archive.extractfile("manifest.json"))
              config = archive.extractfile(manifest[0]["Config"]).read()
          expected = "sha256:" + hashlib.sha256(config).hexdigest()
          if os.environ["IMAGE_ID"] != expected:
              raise SystemExit("Reloaded Docker image ID does not match its saved configuration")
          print(f"Verified configuration-based image ID: {expected}")
          PY

  portable:
    name: Workflow behavior on ${{ matrix.os }}
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: needs.changes.outputs.code == 'true'
        with:
          python-version: '3.12'
      - name: Sync workspace
        if: needs.changes.outputs.code == 'true'
        run: |
          uv sync --locked
          exit $LASTEXITCODE
      - name: Run shared behavior and platform shell checks
        if: needs.changes.outputs.code == 'true'
        run: |
          $python = uv python find
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/check_workflows.ps1 -Python $python -TestArgs '-q', '-ra'
