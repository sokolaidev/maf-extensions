name: PR title

# This repository squash-merges, so the PR title becomes the commit subject release-please
# reads — the title is what decides the next version. Checked rather than requested.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Conventional commit format
    runs-on: ubuntu-latest
    steps:
      # Every action is pinned to a commit: moving tags are a supply-chain hole.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Anything visible in a changelog releases: `feat` a minor, `fix`/`perf`/`revert`/
          # `docs` a patch. A `!` or BREAKING CHANGE footer bumps the minor, every pkg being 0.x.
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          # Scopes are free-form here: release-please attributes a change to a package by the
          # files it touches, not by the scope.
          requireScope: false

      - name: Title matches changed behavior
        # The four pull request facts are passed so release-please's own Release PRs can be
        # skipped: their title is generated to a fixed format and must not be edited, while
        # their diff — a version bump in pyproject, uv.lock and the manifest — is executable
        # to this check. Each fact rules out a different way of claiming to be one, and none
        # is sufficient alone:
        #
        #   branch      the range pull request shares the bot author, so only the
        #               `release-please--branches--` namespace separates the two
        #   repository  a fork cannot forge it, and a branch name it can choose freely
        #               leaves nothing in the diff for a reviewer to notice
        #   author      a collaborator pushing such a branch here cannot supply it
        #
        # Every value is assigned to an environment variable rather than interpolated into the
        # command. A title, a branch name and a login are attacker-controlled text, and
        # interpolating any of them here would make it shell source.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          python scripts/check_title_diff.py "$BASE_SHA" "$PR_TITLE" \
            --head-ref "$HEAD_REF" --head-repo "$HEAD_REPO" \
            --base-repo "$BASE_REPO" --author "$PR_AUTHOR"

  # Its own job, so the red names this check rather than hiding under the title job's — the
  # point of failing at all is that the consequence gets read, and "Conventional commit format
  # failed" would send the reader to the wrong place.
  #
  # In this workflow rather than `tests.yml` because it reads the pull request *title*, which
  # `edited` is the only trigger for — and keeping it there meant every retitle re-ran the whole
  # suite and the Docker e2e for a check that costs a second.
  release-order:
    name: Release order
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The check diffs against the base commit, which a shallow clone does not have.
          fetch-depth: 0

      - name: What follows if this core lands outside the ceilings
        # **A failure here is not a verdict on the release.** A core version outside the
        # dependents' ceilings is permitted, and for a breaking release it is the point.
        # Merging over this is the expected move — the override is what records that the
        # consequence was read. What decides whether the release is *sound* is
        # `check_core_against_dependents.py` at release time, and the publish gate before an
        # upload; neither is this.
        #
        # It exited zero between #628 and #657, which left the notice in the log of a green
        # job. A notice nobody opens is not delivered, and this is the one channel a pull
        # request cannot scroll past.
        #
        # The `${{ github.event.pull_request.title }}` expression is assigned to an environment
        # variable rather than interpolated into this shell script. A pull request title is
        # attacker-controlled text, and interpolating it here would make it shell source.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD |
            python3 scripts/check_release_order.py "$PR_TITLE"
