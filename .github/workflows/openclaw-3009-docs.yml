name: OpenClaw 3009 documentation
on:
  push:
    branches: [antsok-proof-openclaw-3009-docs]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.5'
          python-version: '3.13.15'
      - run: uv sync --locked
      - run: uv run poe doc-paths
      - run: uv run poe md-blocks
      - run: uv run poe sample-floors
      - run: uv run python scripts/check_doc_trackers.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
