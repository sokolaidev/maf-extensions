name: Diagnose compaction CI 3014
on:
  push:
    branches: [antsok-proof-ci-3014-compaction]
permissions:
  contents: read
jobs:
  diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.5'
          python-version: '3.14.4'
      - run: uv sync --locked
      - run: uv run python -m pytest -q -n auto -p scripts.offline_test_shards --offline-group packages --log-level=INFO
