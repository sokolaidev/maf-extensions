name: Docker Sandboxes (live)

# Real microVMs are exercised after merge and on a timer, like the other live suites, so a
# daemon, registry or login failure stays out of the pull-request gate.
on:
  push:
    branches: [main]
    paths:
      - "packages/maf-sandbox/src/**"
      - "packages/maf-sandbox-docker-sbx/**"
      - ".github/workflows/sbx-live.yml"
      - "tests/test_sbx_codeact_e2e.py"
      - "tests/test_sbx_live_workflow.py"
      - "tests/test_graphviz_sbx_e2e.py"
      - "images/graphviz-sandbox/**"
      - "samples/07_docker_diagram/diagram_kind.py"
      - "packages/maf-sandbox-codeact/src/**"
      - "packages/maf-sandbox-azure-pricing/**"
      - "samples/experimental/azure_pricing/**"
      - "images/azure-pricing-sandbox/**"
      - "scripts/check_live_backend_pricing.py"
      - ".github/actions/setup-sbx/**"
  schedule:
    # Offset from Docker live at 04:50 UTC.
    - cron: "20 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbx-live
  cancel-in-progress: false

jobs:
  sbx-e2e:
    name: Docker Sandboxes backend live tests
    # The hosted image where a sandbox VM boots; the arm64 and macOS images have no usable
    # hypervisor for sbx.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MAF_SANDBOX_SBX_E2E: "1"
      MAF_SANDBOX_SBX_E2E_IMAGE: maf-sbx-e2e-shell:local
      SBX_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Sync workspace
        run: uv sync --locked

      - name: Install and prepare sbx
        uses: ./.github/actions/setup-sbx
        with:
          docker-username: ${{ secrets.DOCKER_USERNAME }}
          docker-pat: ${{ secrets.DOCKER_PAT }}

      - name: Load the test templates
        run: |
          set -euo pipefail
          for image in shell agent root; do
            docker build -q -t "maf-sbx-e2e-$image:local" \
              -f "packages/maf-sandbox-docker-sbx/tests/images/$image.Dockerfile" \
              packages/maf-sandbox-docker-sbx/tests/images
            docker save -o "$RUNNER_TEMP/$image.tar" "maf-sbx-e2e-$image:local"
            sbx template load "$RUNNER_TEMP/$image.tar"
          done
          docker image inspect "$MAF_SANDBOX_SBX_E2E_IMAGE" > shell-image.json
          docker build -q -t graphviz-sandbox:local images/graphviz-sandbox
          docker save -o "$RUNNER_TEMP/graphviz.tar" graphviz-sandbox:local
          sbx template load "$RUNNER_TEMP/graphviz.tar"

      - name: Run the host-state refusals and faults
        env:
          # Each test changes host-wide sbx state and restores it; this runner has no other user.
          MAF_SANDBOX_SBX_E2E_HOST: "1"
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
        run: |
          set -euo pipefail
          # The forwarding tests need a host agent to forward.
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null; rm -f "$RUNNER_TEMP/sbx-agent-key" "$RUNNER_TEMP/sbx-agent-key.pub"' EXIT
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/sbx-agent-key"
          ssh-add "$RUNNER_TEMP/sbx-agent-key"
          export MAF_SANDBOX_SBX_E2E_AGENT_PUBLIC_KEY="$RUNNER_TEMP/sbx-agent-key.pub"
          uv run pytest -q -rs -s packages/maf-sandbox-docker-sbx/tests/test_sbx_e2e_host.py | tee host.log
          ! grep -q '^SKIPPED' host.log

      - name: Run the live suite
        env:
          MAF_SANDBOX_SBX_E2E_IMAGES: maf-sbx-e2e-agent:local,maf-sbx-e2e-root:local
          MAF_GRAPHVIZ_SBX_E2E_IMAGE: graphviz-sandbox:local
        run: |
          set -euo pipefail
          # A skip here is a bug: the module skips itself without MAF_SANDBOX_SBX_E2E.
          # `--durations` records whether the runner is fast enough to keep.
          uv run pytest -q -rs -s --durations=0 packages/maf-sandbox-docker-sbx/tests/test_sbx_e2e.py tests/test_sbx_codeact_e2e.py tests/test_graphviz_sbx_e2e.py | tee suite.log
          ! grep -q '^SKIPPED' suite.log

      - name: Retain live evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbx-live-evidence
          path: |
            suite.log
            host.log
            shell-image.json
          retention-days: 30

      - name: Remove leftover sandboxes
        if: always()
        run: sbx rm --all --force || true

  pricing-e2e:
    name: Docker Sandboxes pricing qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SBX_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Sync workspace
        run: uv sync --locked

      - name: Install and prepare sbx
        uses: ./.github/actions/setup-sbx
        with:
          docker-username: ${{ secrets.DOCKER_USERNAME }}
          docker-pat: ${{ secrets.DOCKER_PAT }}

      - name: Load the pricing template
        id: pricing_template
        run: |
          set -euo pipefail
          docker build -t maf-pricing-base:qualification images/azure-pricing-sandbox
          docker build --target native --build-arg BASE_IMAGE=maf-pricing-base:qualification \
            -t maf-pricing-native:qualification -f images/azure-pricing-sandbox/native.Dockerfile \
            images/azure-pricing-sandbox
          docker image inspect --format '{{.Id}}' maf-pricing-native:qualification | tee pricing-template.id
          docker save -o "$RUNNER_TEMP/pricing.tar" maf-pricing-native:qualification
          sha256sum "$RUNNER_TEMP/pricing.tar" | tee pricing-template.sha256
          sbx template load "$RUNNER_TEMP/pricing.tar"

      - name: Qualify pricing-template host refusals and faults
        if: ${{ !cancelled() && steps.pricing_template.outcome == 'success' }}
        env:
          MAF_SANDBOX_SBX_E2E: "1"
          MAF_SANDBOX_SBX_E2E_HOST: "1"
          MAF_SANDBOX_SBX_E2E_HOST_IMAGE: maf-pricing-native:qualification
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null; rm -f "$RUNNER_TEMP/pricing-agent-key" "$RUNNER_TEMP/pricing-agent-key.pub"' EXIT
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/pricing-agent-key"
          ssh-add "$RUNNER_TEMP/pricing-agent-key"
          export MAF_SANDBOX_SBX_E2E_AGENT_PUBLIC_KEY="$RUNNER_TEMP/pricing-agent-key.pub"
          uv run pytest -q -rs -s packages/maf-sandbox-docker-sbx/tests/test_sbx_e2e_host.py | tee pricing-host.log
          ! grep -q '^SKIPPED' pricing-host.log

      - name: Qualify Azure pricing and per-call disposal
        if: ${{ !cancelled() && steps.pricing_template.outcome == 'success' }}
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          uv run python -u samples/experimental/azure_pricing/agent.py \
            --backend docker-sbx --image maf-pricing-native:qualification \
            --workspace "$RUNNER_TEMP/pricing-workspaces" --source "$SOURCE_SHA" \
            --no-model --qualify 2>&1 | tee pricing.log
          uv run python scripts/check_live_backend_pricing.py pricing.log \
            --backend docker-sbx --no-model --require-probes

      - name: Qualify concurrent call isolation
        if: ${{ !cancelled() && steps.pricing_template.outcome == 'success' }}
        env:
          MAF_SANDBOX_SBX_E2E: "1"
          MAF_SANDBOX_SBX_E2E_IMAGES: maf-pricing-native:qualification
        run: |
          set -euo pipefail
          uv run pytest -q -rs -s 'packages/maf-sandbox-docker-sbx/tests/test_sbx_e2e.py::test_call_scope_conformance[maf-pricing-native:qualification]' | tee pricing-call-scope.log
          ! grep -q '^SKIPPED' pricing-call-scope.log

      - name: Retain live evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbx-pricing-evidence
          path: |
            pricing-call-scope.log
            pricing-host.log
            pricing.log
            pricing-template.id
            pricing-template.sha256
          retention-days: 30

      - name: Remove leftover sandboxes
        if: always()
        run: sbx rm --all --force || true

  report-failure:
    name: Report Docker Sandboxes live failure
    needs: [sbx-e2e, pricing-e2e]
    if: always() && (needs.sbx-e2e.result == 'failure' || needs.pricing-e2e.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open or notify the Docker Sandboxes live tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/report_workflow_failure.py
          --marker '<!-- sbx-live-failure-tracker -->'
          --title 'Docker Sandboxes live checks failed'
          --reproduce 'Re-run the linked attempt, or dispatch sbx-live.yml against the failing commit. Inspect the first failed step for install, login, daemon, or test failures.'
          --expected 'All Docker Sandboxes live checks pass.'
          --packages maf-sandbox maf-sandbox-docker-sbx
