name: Lockfile drift

# Asks two questions about the agent-framework this repository runs on, and they fail
# differently.
#
# **Is `uv.lock` behind the declared ranges?** The offline suite runs under `uv sync --locked`,
# so the locked version is the one it asserts against; an adopter resolves the newest those
# ranges admit. Clearing that red is one `uv lock`.
#
# **Are the declared ranges behind the index?** The question above re-resolves *inside* those
# ranges, so a ceiling below the next minor puts its answer out of reach: while every package
# caps below a minor, nothing a re-resolve can touch goes past the one under it, and the release
# nobody adopted is announced by nothing (#1315). Clearing that red is an adoption — a floor
# raised in every package that declares it, and a release each.
#
# **`.github/dependabot.yml` proposes the refresh; the first question reports whether one
# landed.** What it asks is the lockfile's state, so a Dependabot that proposes nothing reds it
# exactly as an unmerged proposal does — and its uv updater has an open defect on workspace
# repositories (dependabot-core#14004), which is this repository's shape. Monthly against its
# weekly, so a red means a month with nothing landing rather than a proposal a day old. The bot
# is blind to the second question for the same reason the re-resolve is: it rewrites pinned
# versions, and every framework declaration here is a range.
#
# **`uv` decides what the newest admitted release is**, so the first question re-resolves and
# compares two lockfiles rather than re-deriving the range against the index. Nothing is
# committed and no pull request is opened: a branch pushed by this workflow's own token has its
# required checks held at `action_required` (docs/maintainers.md), so a person opens the refresh
# and the full gate runs on it. The second question reads the index directly, because what is
# newest *published* is not something a resolve held inside the ranges can answer.
on:
  schedule:
    # 04:40 UTC on the 1st: off the top of the hour, and clear of the daily conformance run and
    # of the Dependabot window this is measuring.
    - cron: "40 4 1 * *"
  workflow_dispatch:

# Only the failure reporter may write issues.
permissions:
  contents: read

concurrency:
  group: lockfile-drift
  cancel-in-progress: false

jobs:
  framework:
    name: The lockfile and the ranges both keep up with agent-framework
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        # Pinned to the commit v5 resolves to: a moving tag is a supply-chain hole.
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      # The distributions come from the script rather than being spelled again here. Two lists
      # drift, and the one that drifts silently is the one that upgrades nothing.
      - name: Re-resolve the framework
        run: |
          set -euo pipefail
          cp uv.lock "$RUNNER_TEMP/uv.lock.committed"
          upgrades=()
          while read -r distribution; do
            upgrades+=(--upgrade-package "$distribution")
          done < <(python3 scripts/check_locked_framework.py --packages)
          uv lock "${upgrades[@]}"

      # `pipefail` so the script's verdict, not `tee`'s, is the step's.
      - name: Say what moved
        run: |
          set -euo pipefail
          python3 scripts/check_locked_framework.py "$RUNNER_TEMP/uv.lock.committed" uv.lock \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Runs whatever the steps above decided. The two questions are independent, and a lock
      # behind its range is exactly the run where a range behind the index matters most — so
      # neither red may hide the other. This one reads the manifests, which the re-resolve
      # above leaves alone.
      - name: Say whether the index has moved past the declared ceilings
        if: "!cancelled()"
        run: |
          set -euo pipefail
          python3 scripts/check_framework_ceiling.py | tee -a "$GITHUB_STEP_SUMMARY"

  report-failure:
    name: Report lockfile drift failure
    needs: framework
    if: always() && needs.framework.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Open or notify the lockfile drift tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/report_workflow_failure.py
          --marker '<!-- lock-drift-failure-tracker -->'
          --title 'Lockfile drift checks failed'
          --reproduce 'Re-run the linked attempt, or dispatch lock-drift.yml against the failing commit. The job asks two questions and either can fail alone, so read the run summary rather than assuming the first: it carries the version comparison for one and the ceiling table for the other.'
          --expected 'The lockfile holds the newest agent-framework releases admitted by the declared ranges, and no agent-framework release sits above a ceiling those ranges declare.'
          --packages maf-sandbox-bicep maf-sandbox-codeact
