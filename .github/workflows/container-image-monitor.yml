name: Container image monitor

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [1-Container image release, Container image storage recovery]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: container-image-monitor
  queue: max
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONUNBUFFERED: "1"

jobs:
  begin:
    if: github.repository == 'sokolaidev/maf-extensions' && github.ref == 'refs/heads/main' && vars.CONTAINER_IMAGE_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: container-security-catalogue
      queue: max
      cancel-in-progress: false
    outputs:
      has_targets: ${{ steps.begin.outputs.has_targets }}
      matrix: ${{ steps.begin.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Create repository-scoped release-writing token
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CONTAINER_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONTAINER_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: maf-extensions
          permission-contents: write
          permission-workflows: write
      - name: Record the running attempt before scanners start
        id: begin
        env:
          CONTAINER_RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
        run: uv run --locked python scripts/container_release_monitor.py begin --directory "$RUNNER_TEMP/monitor"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monitor-plan
          path: ${{ runner.temp }}/monitor/plan.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  scan:
    needs: begin
    if: needs.begin.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.begin.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: monitor-plan
          path: ${{ runner.temp }}/monitor
      - name: Require configuration-based Docker image IDs
        uses: ./.github/actions/setup-classic-docker
      - name: Install pinned scanners
        run: python3 scripts/install_container_scanners.py --directory "$RUNNER_TEMP/scan-tools"
      - name: Assess every planned digest including unfixed findings
        env:
          BATCH: ${{ matrix.batch }}
        run: uv run --locked python scripts/container_release_monitor.py scan --directory "$RUNNER_TEMP/monitor" --batch "$BATCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: monitor-reports-${{ matrix.batch }}
          path: ${{ runner.temp }}/monitor/reports/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  finish:
    needs: [begin, scan]
    if: always() && needs.begin.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: container-security-catalogue
      queue: max
      cancel-in-progress: false
    outputs:
      attention: ${{ steps.finish.outputs.attention }}
      historical_warnings: ${{ steps.finish.outputs.historical_warnings }}
      notification: ${{ steps.finish.outputs.notification }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: monitor-plan
          path: ${{ runner.temp }}/monitor
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: monitor-reports-*
          path: ${{ runner.temp }}/monitor/reports
          merge-multiple: true
      - name: Create repository-scoped release-writing token
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CONTAINER_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONTAINER_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: maf-extensions
          permission-contents: write
          permission-workflows: write
      - name: Retain evidence and commit outcomes including missing workers
        id: finish
        env:
          CONTAINER_RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
        run: uv run --locked python scripts/container_release_monitor.py finish --directory "$RUNNER_TEMP/monitor"

  result:
    needs: [begin, scan, finish]
    if: always() && needs.begin.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Report historical release warnings
        if: needs.finish.result == 'success'
        env:
          WARNINGS: ${{ needs.finish.outputs.historical_warnings }}
        run: |
          if [ "$WARNINGS" != 0 ]; then
            echo "::warning::$WARNINGS superseded releases need attention. See the finish job summary for replacements and monitoring end dates."
          fi
      - name: Require healthy current releases and complete monitoring delivery
        env:
          BEGIN: ${{ needs.begin.result }}
          SCAN: ${{ needs.scan.result }}
          FINISH: ${{ needs.finish.result }}
          ATTENTION: ${{ needs.finish.outputs.attention }}
          MONITOR_NOTIFICATION: ${{ needs.finish.outputs.notification }}
        run: python3 scripts/check_container_monitor_result.py

  report-failure:
    needs: [begin, scan, finish, result]
    if: always() && needs.begin.result != 'skipped' && needs.begin.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Report monitoring changes or verified recovery
        env:
          GH_TOKEN: ${{ github.token }}
          MONITOR_NOTIFICATION: ${{ needs.finish.outputs.notification }}
          MONITOR_JOB_RESULTS: >-
            {"begin":"${{ needs.begin.result }}","scan":"${{ needs.scan.result }}","finish":"${{ needs.finish.result }}","result":"${{ needs.result.result }}"}
        run: >-
          python3 scripts/report_workflow_failure.py
          --monitor
          --marker '<!-- container-image-monitor-failure-tracker -->'
          --title 'Published container image monitoring needs attention'
          --reproduce 'Inspect the linked attempt and immutable image-monitor evidence release. Re-run all jobs or dispatch container-image-monitor.yml from main; a failed-jobs-only rerun cannot reuse an earlier scan plan.'
          --expected 'Current releases have no High or Critical findings, and every actively monitored digest has complete fresh evidence and durable delivery. Superseded-release findings remain historical warnings throughout their 90-day monitoring window; incomplete or abandoned public candidates still need attention.'
          --context 'Package versions below describe the monitoring checkout, not compatibility with the affected images. Use the catalogue and retained scan evidence for exact image digests, release state, scanner failures and findings.'
          --packages maf-sandbox maf-sandbox-docker maf-sandbox-bicep maf-sandbox-terraform maf-sandbox-document maf-sandbox-drawio maf-sandbox-hyperlight
