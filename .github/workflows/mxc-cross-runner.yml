name: MXC native recovery between compatible runners

on:
  workflow_dispatch:
    inputs:
      execution_os:
        description: Execution host platform (Windows requires file_router)
        type: choice
        default: linux
        options: [linux, windows]
      file_router:
        description: Qualify file-capable router replay and recovery after a lost acknowledgment
        type: boolean
        default: false
      worker_crash:
        description: Kill A's call worker before publication and require verified fencing
        type: boolean
        default: false

      active_guest_crash:
        description: Kill A's worker during guest execution and verify native helper termination
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the configured Tailscale federated identity
        env:
          WORKER_CRASH: ${{ inputs.worker_crash }}
          ACTIVE_GUEST_CRASH: ${{ inputs.active_guest_crash }}
          FILE_ROUTER: ${{ inputs.file_router }}
          EXECUTION_OS: ${{ inputs.execution_os }}
          CLIENT_ID: ${{ secrets.MXC_TAILSCALE_CLIENT_ID }}
          AUDIENCE: ${{ secrets.MXC_TAILSCALE_AUDIENCE }}
        run: |
          set -euo pipefail
          if [ "$EXECUTION_OS" = windows ] && [ "$FILE_ROUTER" != true ]; then
            echo 'Windows qualification requires file_router.'
            exit 1
          fi
          if [ "$WORKER_CRASH" = true ] && [ "$ACTIVE_GUEST_CRASH" = true ]; then
            echo 'Select one crash boundary.'
            exit 1
          fi
          if [ "$FILE_ROUTER" = true ] && { [ "$WORKER_CRASH" = true ] || [ "$ACTIVE_GUEST_CRASH" = true ]; }; then
            echo 'File-router handoff uses the lost-acknowledgment boundary.'
            exit 1
          fi
          test -n "$CLIENT_ID" && test -n "$AUDIENCE" || {
            echo 'Configure repository secrets MXC_TAILSCALE_CLIENT_ID and MXC_TAILSCALE_AUDIENCE before dispatch.'
            exit 1
          }

  windows-kernel:
    needs: preflight
    if: inputs.execution_os == 'windows'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.kernel.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
      - name: Build the file-channel kernel
        run: uv run --locked python -m scripts.experiments.mxc_files_patch.build_kernel --root "$RUNNER_TEMP/mxc-file-kernel"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: kernel
        with:
          name: mxc-file-kernel-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mxc-file-kernel/elfloader_hyperlight-x86_64
            ${{ runner.temp }}/mxc-file-kernel/kernel-result.json
          if-no-files-found: error
          retention-days: 1

  fixture:
    needs: [preflight, windows-kernel]
    if: >-
      ${{ !cancelled() && needs.preflight.result == 'success' &&
          (inputs.execution_os != 'windows' || needs.windows-kernel.result == 'success') }}
    runs-on: ${{ inputs.execution_os == 'windows' && 'windows-latest' || 'ubuntu-24.04' }}
    defaults:
      run:
        shell: bash
    timeout-minutes: ${{ inputs.file_router && 85 || 45 }}
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
      - name: Permit runner-owned KVM access
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          test -c /dev/kvm
          printf 'KERNEL=="kvm", OWNER="%s", MODE="0600"\n' "$(id -un)" | sudo tee /etc/udev/rules.d/99-mxc-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install native build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libclang-dev
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Build the file-channel kernel
        if: inputs.file_router && runner.os == 'Linux'
        run: uv run --locked python -m scripts.experiments.mxc_files_patch.build_kernel --root "$RUNNER_TEMP/mxc-file-kernel"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: runner.os == 'Windows'
        with:
          artifact-ids: ${{ needs.windows-kernel.outputs.artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/mxc-file-kernel
      - name: Build the file-capable helper and startup checkpoint
        if: inputs.file_router
        run: uv run --locked python -m scripts.experiments.mxc_session_patch.cross_fixture --root "$RUNNER_TEMP/mxc-fixture" --file-kernel "$RUNNER_TEMP/mxc-file-kernel"
      - name: Build the common helper and startup checkpoint
        if: ${{ !inputs.file_router }}
        run: uv run --locked python -m scripts.experiments.mxc_session_patch.cross_fixture --root "$RUNNER_TEMP/mxc-fixture"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mxc-native-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mxc-fixture/bundle.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mxc-cross-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mxc-fixture/*.log
            ${{ runner.temp }}/mxc-fixture/build/Cargo.lock
          if-no-files-found: warn
          retention-days: 14

  participants:
    name: Cross-runner participant (${{ matrix.role }})
    needs: fixture
    if: ${{ !cancelled() && needs.fixture.result == 'success' }}
    runs-on: ${{ inputs.execution_os == 'windows' && matrix.role != 'coordinator' && 'windows-latest' || 'ubuntu-24.04' }}
    defaults:
      run:
        shell: bash
    environment: mxc-cross-runner
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        role: [a, b, coordinator]
    env:
      ROLE: ${{ matrix.role }}
      WORKER_CRASH: ${{ inputs.worker_crash }}
      ACTIVE_GUEST_CRASH: ${{ inputs.active_guest_crash }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mxc-native-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mxc-fixture
      - name: Unpack the common native fixture
        run: |
          cd "$RUNNER_TEMP/mxc-fixture"
          tar -xzf bundle.tar.gz
      - name: Permit runner-owned KVM access
        if: matrix.role != 'coordinator' && runner.os == 'Linux'
        run: |
          set -euo pipefail
          test -c /dev/kvm
          printf 'KERNEL=="kvm", OWNER="%s", MODE="0600"\n' "$(id -un)" | sudo tee /etc/udev/rules.d/99-mxc-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm
      - name: Check Windows Hypervisor Platform on the execution host
        if: runner.os == 'Windows'
        run: uv run --locked python -c "from scripts.experiments.mxc_session_patch.qualification_runner import hypervisor; assert hypervisor() == 'WHP'"
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.MXC_TAILSCALE_CLIENT_ID }}
          audience: ${{ secrets.MXC_TAILSCALE_AUDIENCE }}
          tags: tag:mxc-ci
          version: '1.94.2'
          args: --accept-dns=false
          hostname: mxc-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.role }}
      - name: Disable tailnet DNS and subnet routes before discovery
        run: |
          set -euo pipefail
          elevate=()
          if [ "${RUNNER_OS:-Linux}" = Linux ]; then elevate+=(sudo); fi
          "${elevate[@]}" tailscale set --accept-dns=false --accept-routes=false
          "${elevate[@]}" tailscale debug prefs | jq -e '.RouteAll == false and .CorpDNS == false' >/dev/null
      - name: Create runner-local credentials and public discovery
        run: |
          set -euo pipefail
          uv run --locked python -m scripts.experiments.mxc_session_patch.cross_runner bootstrap --root "$RUNNER_TEMP/mxc-cross" --bundle "$RUNNER_TEMP/mxc-fixture/bundle" --role "$ROLE" --address "$(tailscale ip -4)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mxc-peer-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mxc-cross/public/${{ matrix.role }}.json
          if-no-files-found: error
          retention-days: 1
      - name: Discover this run's three independent machines
        run: uv run --locked python -m scripts.experiments.mxc_session_patch.cross_runner discover --root "$RUNNER_TEMP/mxc-cross" --bundle "$RUNNER_TEMP/mxc-fixture/bundle" --role "$ROLE"
      - name: Allow the coordinator to reach the Windows worker over the overlay
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $peers = Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'mxc-cross/peers.json') | ConvertFrom-Json
          New-NetFirewallRule -DisplayName 'MXC coordinator' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 9443 -LocalAddress $peers.($env:ROLE).address -RemoteAddress $peers.coordinator.address
      - name: Exercise native recovery and trusted fencing over mutual TLS
        run: |
          set -euo pipefail
          options=()
          if [ "$WORKER_CRASH" = true ]; then options+=(--worker-crash); fi
          if [ "$ACTIVE_GUEST_CRASH" = true ]; then options+=(--active-guest-crash); fi
          uv run --locked python -m scripts.experiments.mxc_session_patch.cross_runner node --root "$RUNNER_TEMP/mxc-cross" --bundle "$RUNNER_TEMP/mxc-fixture/bundle" --role "$ROLE" "${options[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mxc-cross-report-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mxc-cross/report.json
            ${{ runner.temp }}/mxc-cross/service.log
            ${{ runner.temp }}/mxc-cross/*/scratch/*/native.stdout
            ${{ runner.temp }}/mxc-cross/*/scratch/*/native.stderr
          if-no-files-found: error
          retention-days: 14
