name: MXC native recovery between Linux runners

on:
  workflow_dispatch:
    inputs:
      worker_crash:
        description: Kill A's call worker before publication and require verified fencing
        type: boolean
        default: false

      active_guest_crash:
        description: Kill A's worker during guest execution and verify native helper termination
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the configured Tailscale federated identity
        env:
          WORKER_CRASH: ${{ inputs.worker_crash }}
          ACTIVE_GUEST_CRASH: ${{ inputs.active_guest_crash }}
          CLIENT_ID: ${{ secrets.MXC_TAILSCALE_CLIENT_ID }}
          AUDIENCE: ${{ secrets.MXC_TAILSCALE_AUDIENCE }}
        run: |
          set -euo pipefail
          if [ "$WORKER_CRASH" = true ] && [ "$ACTIVE_GUEST_CRASH" = true ]; then
            echo 'Select one crash boundary.'
            exit 1
          fi
          test -n "$CLIENT_ID" && test -n "$AUDIENCE" || {
            echo 'Configure repository secrets MXC_TAILSCALE_CLIENT_ID and MXC_TAILSCALE_AUDIENCE before dispatch.'
            exit 1
          }

  fixture:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
      - name: Permit runner-owned KVM access
        run: |
          set -euo pipefail
          test -c /dev/kvm
          printf 'KERNEL=="kvm", OWNER="%s", MODE="0600"\n' "$(id -un)" | sudo tee /etc/udev/rules.d/99-mxc-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install native build prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libclang-dev
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Build the common helper and startup checkpoint
        run: uv run --locked python -m scripts.experiments.mxc_session_patch.cross_fixture --root "$RUNNER_TEMP/mxc-fixture"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mxc-native-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mxc-fixture/bundle.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mxc-cross-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mxc-fixture/*.log
            ${{ runner.temp }}/mxc-fixture/build/Cargo.lock
          if-no-files-found: warn
          retention-days: 14

  participants:
    name: Cross-runner participant (${{ matrix.role }})
    needs: fixture
    runs-on: ubuntu-24.04
    environment: mxc-cross-runner
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        role: [a, b, coordinator]
    env:
      ROLE: ${{ matrix.role }}
      WORKER_CRASH: ${{ inputs.worker_crash }}
      ACTIVE_GUEST_CRASH: ${{ inputs.active_guest_crash }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mxc-native-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mxc-fixture
      - name: Unpack the common native fixture
        run: tar -xzf "$RUNNER_TEMP/mxc-fixture/bundle.tar.gz" -C "$RUNNER_TEMP/mxc-fixture"
      - name: Permit runner-owned KVM access
        if: matrix.role != 'coordinator'
        run: |
          set -euo pipefail
          test -c /dev/kvm
          printf 'KERNEL=="kvm", OWNER="%s", MODE="0600"\n' "$(id -un)" | sudo tee /etc/udev/rules.d/99-mxc-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.MXC_TAILSCALE_CLIENT_ID }}
          audience: ${{ secrets.MXC_TAILSCALE_AUDIENCE }}
          tags: tag:mxc-ci
          version: '1.94.2'
          args: --accept-dns=false
          hostname: mxc-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.role }}
      - name: Disable tailnet DNS and subnet routes before discovery
        run: |
          set -euo pipefail
          sudo tailscale set --accept-dns=false --accept-routes=false
          sudo tailscale debug prefs | jq -e '.RouteAll == false and .CorpDNS == false' >/dev/null
      - name: Create runner-local credentials and public discovery
        run: |
          set -euo pipefail
          uv run --locked python -m scripts.experiments.mxc_session_patch.cross_runner bootstrap --root "$RUNNER_TEMP/mxc-cross" --bundle "$RUNNER_TEMP/mxc-fixture/bundle" --role "$ROLE" --address "$(tailscale ip -4)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mxc-peer-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mxc-cross/public/${{ matrix.role }}.json
          if-no-files-found: error
          retention-days: 1
      - name: Discover this run's three independent machines
        run: uv run --locked python -m scripts.experiments.mxc_session_patch.cross_runner discover --root "$RUNNER_TEMP/mxc-cross" --bundle "$RUNNER_TEMP/mxc-fixture/bundle" --role "$ROLE"
      - name: Exercise native recovery and trusted fencing over mutual TLS
        run: |
          set -euo pipefail
          options=()
          if [ "$WORKER_CRASH" = true ]; then options+=(--worker-crash); fi
          if [ "$ACTIVE_GUEST_CRASH" = true ]; then options+=(--active-guest-crash); fi
          uv run --locked python -m scripts.experiments.mxc_session_patch.cross_runner node --root "$RUNNER_TEMP/mxc-cross" --bundle "$RUNNER_TEMP/mxc-fixture/bundle" --role "$ROLE" "${options[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mxc-cross-report-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mxc-cross/report.json
            ${{ runner.temp }}/mxc-cross/service.log
            ${{ runner.temp }}/mxc-cross/*/scratch/*/native.stdout
            ${{ runner.temp }}/mxc-cross/*/scratch/*/native.stderr
          if-no-files-found: error
          retention-days: 14
