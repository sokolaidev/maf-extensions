name: 1-Container image release
run-name: >-
  ${{ inputs.operation == 'abandon' && 'Permanently abandon' || 'Publish' }}
  ${{ inputs.profile }}:${{ inputs.version }}
  ${{ inputs.operation == 'abandon' && 'in public GHCR release history' || 'to public GHCR' }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publish retained candidate or permanently abandon an incomplete version
        type: choice
        options: [release, abandon]
        default: release
        required: true
      profile:
        description: Linux/amd64 image profile
        type: choice
        options:
          - bicep
          - bicep-avm
          - bicep-docker-sbx
          - graphviz
          - document
          - drawio
          - drawio-export
          - shell
          - terraform-random
          - opentofu-random
          - terraform-avm
          - opentofu-avm
          - hyperlight-aks-probe
          - egress-proxy
        required: true
      version:
        description: Unused independent image SemVer, initially 0.1.0
        type: string
        required: true
      reason:
        # Abandonment uses the retained candidate, including its original route.
        description: Required explanation when abandoning an incomplete version
        type: string
      bicep_route:
        description: Bicep compiler acquisition (choose upstream for non-Bicep images; source is unsupported)
        type: choice
        options: [upstream, source]
        default: upstream
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: container-image-publication
  queue: max
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONUNBUFFERED: "1"

jobs:
  policy:
    outputs:
      summary_url: ${{ steps.abandon-summary.outputs.summary_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Require explicit enablement and protected main
        env:
          ENABLED: ${{ vars.CONTAINER_IMAGE_RELEASES_ENABLED }}
          RELEASE_APP_CONFIGURED: ${{ vars.CONTAINER_RELEASE_APP_CLIENT_ID != '' && secrets.CONTAINER_RELEASE_APP_PRIVATE_KEY != '' }}
          PROFILE: ${{ inputs.profile }}
          VERSION: ${{ inputs.version }}
          OPERATION: ${{ inputs.operation }}
          BICEP_ROUTE: ${{ inputs.bicep_route }}
          REASON: ${{ inputs.reason }}
        run: |
          test "$ENABLED" = true
          if [ "$RELEASE_APP_CONFIGURED" != true ]; then
            echo 'Configure CONTAINER_RELEASE_APP_CLIENT_ID and CONTAINER_RELEASE_APP_PRIVATE_KEY before dispatching.'
            exit 1
          fi
          uv run --locked python - <<'PY'
          import os
          import sys
          sys.path.insert(0, "scripts")
          from container_release import profiles, version
          from container_release_publish import context
          from container_release_preflight import preflight
          from build_bicep_image import validate_route
          source, run_id, _ = context()
          if os.environ["PROFILE"] not in profiles():
              raise ValueError("Unknown release profile")
          version(os.environ["VERSION"])
          if os.environ["OPERATION"] == "release":
              validate_route(os.environ["BICEP_ROUTE"], os.environ["PROFILE"])
              preflight(os.environ["PROFILE"], os.environ["VERSION"], source, run_id)
          if os.environ["OPERATION"] == "abandon" and not os.environ["REASON"].strip():
              raise ValueError("Abandonment requires a reason")
          PY

      - name: Present permanent abandonment before approval
        if: inputs.operation == 'abandon'
        id: abandon-summary
        env:
          PROFILE: ${{ inputs.profile }}
          VERSION: ${{ inputs.version }}
          REASON: ${{ inputs.reason }}
        run: |
          uv run --locked python scripts/container_release_approval.py abandon \
            --profile "$PROFILE" --version "$VERSION" --reason "$REASON" \
            --directory "$RUNNER_TEMP/abandon"

  prepare:
    needs: policy
    if: inputs.operation == 'release'
    runs-on: ${{ inputs.profile == 'bicep-docker-sbx' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.profile == 'terraform-avm' && 150 || 60 }}
    outputs:
      approval_name: ${{ steps.approval-summary.outputs.approval_name }}
      summary_url: ${{ steps.approval-summary.outputs.summary_url }}
      mode: ${{ steps.candidate.outputs.mode }}
      lost: ${{ steps.candidate.outputs.lost }}
      candidate_sha256: ${{ steps.candidate.outputs.candidate_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Prepare Docker Sandboxes consumer host
        if: inputs.profile == 'bicep-docker-sbx' && github.run_attempt == 1
        uses: ./.github/actions/setup-sbx
        with:
          docker-username: ${{ secrets.DOCKER_USERNAME }}
          docker-pat: ${{ secrets.DOCKER_PAT }}
      - name: Require configuration-based Docker image IDs
        uses: ./.github/actions/setup-classic-docker
      - name: Make room for the AVM provider toolchain and build cache
        if: inputs.profile == 'terraform-avm' && github.run_attempt == 1
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          df -h /
      - name: Install preparation tools on the initial attempt
        timeout-minutes: 10
        if: github.run_attempt == 1
        run: |
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update --error-on=any
          sudo apt-get "${apt_options[@]}" install --yes skopeo
          python3 scripts/install_container_scanners.py --directory "$RUNNER_TEMP/scan-tools"
      - name: Prepare reusable provider packages
        id: providers
        if: github.run_attempt == 1 && (startsWith(inputs.profile, 'terraform-') || startsWith(inputs.profile, 'opentofu-'))
        uses: ./.github/actions/prepare-provider-cache
        with:
          profile: ${{ inputs.profile }}
      - name: Build once or recover original bytes
        id: candidate
        env:
          PROFILE: ${{ inputs.profile }}
          VERSION: ${{ inputs.version }}
          BICEP_ROUTE: ${{ inputs.bicep_route }}
          MAF_PROVIDER_BUILDS: ${{ steps.providers.outputs.directory }}
        run: |
          uv run --locked python scripts/prepare_container_release_dispatch.py \
            --profile "$PROFILE" --version "$VERSION" \
            --bicep-route "$BICEP_ROUTE" \
            --directory "$RUNNER_TEMP/candidate" --selection "$RUNNER_TEMP/selection"
      - name: Retain provider preparation timings
        if: always() && steps.providers.outputs.directory != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provider-builds/*.json*
          retention-days: 14
      - name: Retain the original OCI candidate
        if: steps.candidate.outputs.mode == 'built'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retained-image-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Retain failed preparation reports
        if: failure() && steps.candidate.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/*.json
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selected-image
          path: ${{ runner.temp }}/selection/
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Present the exact approval and freshness policy
        if: steps.candidate.outputs.mode != 'delivery'
        id: approval-summary
        run: |
          uv run --locked python scripts/container_release_approval.py release \
            --directory "$RUNNER_TEMP/candidate" --candidate "$RUNNER_TEMP/selection/candidate.json"

  approve:
    name: ${{ needs.prepare.outputs.approval_name }}
    needs: prepare
    if: needs.prepare.outputs.mode != 'delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: container-release
      url: ${{ needs.prepare.outputs.summary_url }}
    steps:
      - run: echo 'Approved publication of the retained candidate under the displayed same-bytes refresh policy.'

  reserve:
    needs: [prepare, approve]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.approve.result == 'success' || needs.prepare.outputs.mode == 'delivery')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: container-security-catalogue
      queue: max
      cancel-in-progress: false
    env:
      APPROVED_CANDIDATE_SHA256: ${{ needs.prepare.outputs.candidate_sha256 }}
    outputs:
      completed: ${{ steps.reserve.outputs.completed }}
      delivered: ${{ steps.reserve.outputs.delivered }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: selected-image
          path: ${{ runner.temp }}/candidate
      - name: Create repository-scoped release-writing token
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CONTAINER_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONTAINER_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: maf-extensions
          permission-contents: write
          permission-workflows: write
      - name: Commit pre-write registration
        id: reserve
        env:
          CONTAINER_RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
        run: uv run --locked python scripts/container_release_publish.py reserve --directory "$RUNNER_TEMP/candidate"

  promote:
    needs: [prepare, reserve]
    if: needs.reserve.outputs.completed == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: read
    env:
      APPROVED_CANDIDATE_SHA256: ${{ needs.prepare.outputs.candidate_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Require configuration-based Docker image IDs
        uses: ./.github/actions/setup-classic-docker
      - name: Install pinned scanners and OCI transport
        timeout-minutes: 10
        run: |
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update --error-on=any
          sudo apt-get "${apt_options[@]}" install --yes skopeo
          python3 scripts/install_container_scanners.py --directory "$RUNNER_TEMP/scan-tools"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: retained-image-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - name: Promote the exact freshly assessed OCI bytes
        id: promotion
        run: uv run --locked python scripts/container_release_publish.py promote --directory "$RUNNER_TEMP/candidate"
      - name: Authenticate registry attestation uploads
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Attest provenance for the promoted digest
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.promotion.outputs.image }}
          subject-digest: ${{ steps.promotion.outputs.digest }}
          push-to-registry: true
      - name: Attest the SPDX inventory separately
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.promotion.outputs.image }}
          subject-digest: ${{ steps.promotion.outputs.digest }}
          sbom-path: ${{ runner.temp }}/candidate/sbom.spdx.json
          push-to-registry: true
      - name: Preserve original signature bundles
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE" "$RUNNER_TEMP/candidate/provenance.jsonl"
          cp "$SBOM" "$RUNNER_TEMP/candidate/sbom.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promoted-image-evidence
          path: ${{ runner.temp }}/candidate/*.*
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  qualify:
    needs: [prepare, promote]
    runs-on: ${{ inputs.profile == 'bicep-docker-sbx' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    env:
      APPROVED_CANDIDATE_SHA256: ${{ needs.prepare.outputs.candidate_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Prepare Docker Sandboxes consumer host
        if: inputs.profile == 'bicep-docker-sbx'
        uses: ./.github/actions/setup-sbx
        with:
          docker-username: ${{ secrets.DOCKER_USERNAME }}
          docker-pat: ${{ secrets.DOCKER_PAT }}
      - name: Require configuration-based Docker image IDs
        uses: ./.github/actions/setup-classic-docker
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: promoted-image-evidence
          path: ${{ runner.temp }}/candidate
      - name: Verify signatures before anonymous pull and runtime qualification
        run: uv run --locked python scripts/container_release_publish.py qualify --directory "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualified-image-evidence
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  complete:
    needs: [prepare, reserve, qualify]
    if: >-
      always() && needs.reserve.result == 'success' &&
      needs.reserve.outputs.delivered != 'true' &&
      (needs.qualify.result == 'success' || needs.reserve.outputs.completed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      attestations: read
      actions: read
    concurrency:
      group: container-security-catalogue
      queue: max
      cancel-in-progress: false
    env:
      APPROVED_CANDIDATE_SHA256: ${{ needs.prepare.outputs.candidate_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Restore qualification or the completed selection
        env:
          COMPLETED: ${{ needs.reserve.outputs.completed }}
        run: |
          if [ "$COMPLETED" = true ]; then
            artifact=selected-image
          else
            artifact=qualified-image-evidence
          fi
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$RUNNER_TEMP/candidate"
      - name: Create repository-scoped release-writing token
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CONTAINER_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONTAINER_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: maf-extensions
          permission-contents: write
          permission-workflows: write
      - name: Retain evidence and commit completion before signing
        id: completion
        env:
          CONTAINER_RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
        run: uv run --locked python scripts/container_release_publish.py complete --directory "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: completion-input
          path: ${{ steps.completion.outputs.directory }}/*.*
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  sign-completion:
    needs: [prepare, complete]
    if: always() && needs.prepare.result == 'success' && needs.complete.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      APPROVED_CANDIDATE_SHA256: ${{ needs.prepare.outputs.candidate_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: completion-input
          path: ${{ runner.temp }}/candidate
      - name: Derive the predicate from the committed catalogue
        id: predicate
        run: uv run --locked python scripts/container_release_publish.py predicate --directory "$RUNNER_TEMP/candidate"
      - name: Authenticate registry attestation uploads
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Attest committed completion
        id: completion
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.predicate.outputs.image }}
          subject-digest: ${{ steps.predicate.outputs.digest }}
          predicate-type: https://github.com/sokolaidev/maf-extensions/blob/main/docs/security/container-image-releases.md#release-completion-v1
          predicate-path: ${{ runner.temp }}/candidate/completion-predicate.json
          push-to-registry: true
      - name: Retain the completion bundle
        env:
          BUNDLE: ${{ steps.completion.outputs.bundle-path }}
        run: cp "$BUNDLE" "$RUNNER_TEMP/candidate/completion.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: completion-delivery
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  deliver:
    needs: [prepare, sign-completion]
    if: always() && needs.prepare.result == 'success' && needs.sign-completion.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      attestations: read
    concurrency:
      group: container-security-catalogue
      queue: max
      cancel-in-progress: false
    env:
      APPROVED_CANDIDATE_SHA256: ${{ needs.prepare.outputs.candidate_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: completion-delivery
          path: ${{ runner.temp }}/candidate
      - name: Create repository-scoped release-writing token
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CONTAINER_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONTAINER_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: maf-extensions
          permission-contents: write
          permission-workflows: write
      - name: Verify and publish immutable evidence, then acknowledge delivery
        env:
          CONTAINER_RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
        run: uv run --locked python scripts/container_release_publish.py deliver --directory "$RUNNER_TEMP/candidate"
      - name: Announce verified delivery
        env:
          PROFILE: ${{ inputs.profile }}
          VERSION: ${{ inputs.version }}
        run: |
          printf 'Completed image evidence: https://github.com/sokolaidev/maf-extensions/releases/tag/image-%s-v%s\n' "$PROFILE" "$VERSION" >> "$GITHUB_STEP_SUMMARY"

  abandon:
    name: Permanently abandon ${{ inputs.profile }}:${{ inputs.version }} in public GHCR release history
    needs: policy
    if: inputs.operation == 'abandon'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: container-release
      url: ${{ needs.policy.outputs.summary_url }}
    permissions:
      contents: write
    concurrency:
      group: container-security-catalogue
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Create repository-scoped release-writing token
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CONTAINER_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONTAINER_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: maf-extensions
          permission-contents: write
          permission-workflows: write
      - name: Permanently retire an incomplete version
        env:
          CONTAINER_RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
          PROFILE: ${{ inputs.profile }}
          VERSION: ${{ inputs.version }}
          REASON: ${{ inputs.reason }}
        run: |
          uv run --locked python scripts/container_release_publish.py abandon \
            --directory "$RUNNER_TEMP/abandon" --release "$PROFILE/$VERSION" --reason "$REASON"

  retire-lost-candidate:
    needs: [policy, prepare]
    if: always() && needs.policy.result == 'success' && needs.prepare.outputs.lost == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: container-security-catalogue
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Create repository-scoped release-writing token
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CONTAINER_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONTAINER_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: maf-extensions
          permission-contents: write
          permission-workflows: write
      - name: Retire the version whose retained OCI bytes are irrecoverable
        env:
          CONTAINER_RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
          PROFILE: ${{ inputs.profile }}
          VERSION: ${{ inputs.version }}
        run: |
          uv run --locked python scripts/container_release_publish.py abandon \
            --directory "$RUNNER_TEMP/abandon" --release "$PROFILE/$VERSION" \
            --reason 'The originating workflow confirmed that its retained OCI candidate is missing or expired.'
