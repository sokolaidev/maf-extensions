name: Container image release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publish retained candidate or permanently abandon an incomplete version
        type: choice
        options: [release, abandon]
        default: release
        required: true
      profile:
        description: Linux/amd64 image profile
        type: choice
        options:
          - bicep
          - bicep-prepared
          - sbx-bicep
          - diagram
          - drawio-sandbox
          - drawio-export
          - terraform-random
          - opentofu-random
          - terraform-prepared
          - opentofu-prepared
          - hyperlight
          - egress-proxy
        required: true
      version:
        description: Unused independent image SemVer, initially 0.1.0
        type: string
        required: true
      reason:
        description: Required explanation when abandoning an incomplete version
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: container-image-publication
  queue: max
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONUNBUFFERED: "1"

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Require explicit enablement and protected main
        env:
          ENABLED: ${{ vars.CONTAINER_IMAGE_RELEASES_ENABLED }}
          PROFILE: ${{ inputs.profile }}
          VERSION: ${{ inputs.version }}
          OPERATION: ${{ inputs.operation }}
          REASON: ${{ inputs.reason }}
        run: |
          test "$ENABLED" = true
          uv run --locked python - <<'PY'
          import os
          import sys
          sys.path.insert(0, "scripts")
          from container_release import profiles, version
          from container_release_publish import context
          context()
          if os.environ["PROFILE"] not in profiles():
              raise ValueError("Unknown release profile")
          version(os.environ["VERSION"])
          if os.environ["OPERATION"] == "abandon" and not os.environ["REASON"].strip():
              raise ValueError("Abandonment requires a reason")
          PY

  prepare:
    needs: policy
    if: inputs.operation == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      mode: ${{ steps.candidate.outputs.mode }}
      lost: ${{ steps.candidate.outputs.lost }}
      candidate_sha256: ${{ steps.candidate.outputs.candidate_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install preparation tools on the initial attempt
        if: github.run_attempt == 1
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
          python3 scripts/install_container_scanners.py --directory "$RUNNER_TEMP/scan-tools"
      - name: Build once or recover original bytes
        id: candidate
        env:
          PROFILE: ${{ inputs.profile }}
          VERSION: ${{ inputs.version }}
        run: |
          uv run --locked python scripts/prepare_container_release_dispatch.py \
            --profile "$PROFILE" --version "$VERSION" \
            --directory "$RUNNER_TEMP/candidate" --selection "$RUNNER_TEMP/selection"
      - name: Retain the original OCI candidate
        if: steps.candidate.outputs.mode == 'built'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retained-image-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selected-image
          path: ${{ runner.temp }}/selection/
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Present the exact approval and freshness policy
        env:
          PROFILE: ${{ inputs.profile }}
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
          CONFIG: ${{ steps.candidate.outputs.image_id }}
          CANDIDATE: ${{ steps.candidate.outputs.candidate_sha256 }}
        run: |
          {
            printf '## Image publication approval\n\n'
            printf 'Profile: %s; version: %s; source: %s\n\n' "$PROFILE" "$VERSION" "$GITHUB_SHA"
            printf 'Manifest: %s\n\nConfiguration: %s\n\nCandidate record: %s\n\n' "$DIGEST" "$CONFIG" "$CANDIDATE"
            printf 'Inspect the retained-image artifact for runtime checks, SPDX/Syft inventories and the strict High/Critical report, including unfixed findings.\n\n'
            printf 'Approval authorizes a fresh scan of these same bytes if the assessment is at least 24 hours old before a registry write. A failed refresh blocks publication. Changed bytes, source, version or policy require new approval.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  approve:
    needs: prepare
    if: needs.prepare.outputs.mode != 'delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: container-release
    steps:
      - run: echo 'Approved publication of the retained candidate under the displayed same-bytes refresh policy.'

  reserve:
    needs: [prepare, approve]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.approve.result == 'success' || needs.prepare.outputs.mode == 'delivery')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: container-security-catalogue
      queue: max
      cancel-in-progress: false
    env:
      APPROVED_CANDIDATE_SHA256: ${{ needs.prepare.outputs.candidate_sha256 }}
    outputs:
      completed: ${{ steps.reserve.outputs.completed }}
      delivered: ${{ steps.reserve.outputs.delivered }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: selected-image
          path: ${{ runner.temp }}/candidate
      - name: Commit pre-write registration
        id: reserve
        run: uv run --locked python scripts/container_release_publish.py reserve --directory "$RUNNER_TEMP/candidate"

  promote:
    needs: [prepare, reserve]
    if: needs.reserve.outputs.completed == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: read
    env:
      APPROVED_CANDIDATE_SHA256: ${{ needs.prepare.outputs.candidate_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install pinned scanners and OCI transport
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
          python3 scripts/install_container_scanners.py --directory "$RUNNER_TEMP/scan-tools"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: retained-image-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - name: Promote the exact freshly assessed OCI bytes
        id: promotion
        run: uv run --locked python scripts/container_release_publish.py promote --directory "$RUNNER_TEMP/candidate"
      - name: Authenticate registry attestation uploads
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Attest provenance for the promoted digest
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.promotion.outputs.image }}
          subject-digest: ${{ steps.promotion.outputs.digest }}
          push-to-registry: true
      - name: Attest the SPDX inventory separately
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.promotion.outputs.image }}
          subject-digest: ${{ steps.promotion.outputs.digest }}
          sbom-path: ${{ runner.temp }}/candidate/sbom.spdx.json
          push-to-registry: true
      - name: Preserve original signature bundles
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE" "$RUNNER_TEMP/candidate/provenance.jsonl"
          cp "$SBOM" "$RUNNER_TEMP/candidate/sbom.jsonl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promoted-image-evidence
          path: ${{ runner.temp }}/candidate/*.*
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  qualify:
    needs: [prepare, promote]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    env:
      APPROVED_CANDIDATE_SHA256: ${{ needs.prepare.outputs.candidate_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: promoted-image-evidence
          path: ${{ runner.temp }}/candidate
      - name: Verify signatures before anonymous pull and runtime qualification
        run: uv run --locked python scripts/container_release_publish.py qualify --directory "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-image-evidence
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  complete:
    needs: [prepare, reserve, qualify]
    if: >-
      always() && needs.reserve.result == 'success' &&
      needs.reserve.outputs.delivered != 'true' &&
      (needs.qualify.result == 'success' || needs.reserve.outputs.completed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      attestations: read
      actions: read
    concurrency:
      group: container-security-catalogue
      queue: max
      cancel-in-progress: false
    env:
      APPROVED_CANDIDATE_SHA256: ${{ needs.prepare.outputs.candidate_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Restore qualification or the completed selection
        env:
          COMPLETED: ${{ needs.reserve.outputs.completed }}
        run: |
          if [ "$COMPLETED" = true ]; then
            artifact=selected-image
          else
            artifact=qualified-image-evidence
          fi
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$RUNNER_TEMP/candidate"
      - name: Retain evidence and commit completion before signing
        id: completion
        run: uv run --locked python scripts/container_release_publish.py complete --directory "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: completion-input
          path: ${{ steps.completion.outputs.directory }}/*.*
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  sign-completion:
    needs: [prepare, complete]
    if: always() && needs.prepare.result == 'success' && needs.complete.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      APPROVED_CANDIDATE_SHA256: ${{ needs.prepare.outputs.candidate_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: completion-input
          path: ${{ runner.temp }}/candidate
      - name: Derive the predicate from the committed catalogue
        id: predicate
        run: uv run --locked python scripts/container_release_publish.py predicate --directory "$RUNNER_TEMP/candidate"
      - name: Authenticate registry attestation uploads
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Attest committed completion
        id: completion
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.predicate.outputs.image }}
          subject-digest: ${{ steps.predicate.outputs.digest }}
          predicate-type: https://github.com/sokolaidev/maf-extensions/blob/main/docs/security/container-image-releases.md#release-completion-v1
          predicate-path: ${{ runner.temp }}/candidate/completion-predicate.json
          push-to-registry: true
      - name: Retain the completion bundle
        env:
          BUNDLE: ${{ steps.completion.outputs.bundle-path }}
        run: cp "$BUNDLE" "$RUNNER_TEMP/candidate/completion.jsonl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: completion-delivery
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  deliver:
    needs: [prepare, sign-completion]
    if: always() && needs.prepare.result == 'success' && needs.sign-completion.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      attestations: read
    concurrency:
      group: container-security-catalogue
      queue: max
      cancel-in-progress: false
    env:
      APPROVED_CANDIDATE_SHA256: ${{ needs.prepare.outputs.candidate_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: completion-delivery
          path: ${{ runner.temp }}/candidate
      - name: Verify and publish immutable evidence, then acknowledge delivery
        run: uv run --locked python scripts/container_release_publish.py deliver --directory "$RUNNER_TEMP/candidate"
      - name: Announce verified delivery
        env:
          PROFILE: ${{ inputs.profile }}
          VERSION: ${{ inputs.version }}
        run: |
          printf 'Completed image evidence: https://github.com/sokolaidev/maf-extensions/releases/tag/image-%s-v%s\n' "$PROFILE" "$VERSION" >> "$GITHUB_STEP_SUMMARY"

  abandon:
    needs: policy
    if: inputs.operation == 'abandon'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: container-release
    permissions:
      contents: write
    concurrency:
      group: container-security-catalogue
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Permanently retire an incomplete version
        env:
          PROFILE: ${{ inputs.profile }}
          VERSION: ${{ inputs.version }}
          REASON: ${{ inputs.reason }}
        run: |
          uv run --locked python scripts/container_release_publish.py abandon \
            --directory "$RUNNER_TEMP/abandon" --release "$PROFILE/$VERSION" --reason "$REASON"

  retire-lost-candidate:
    needs: [policy, prepare]
    if: always() && needs.policy.result == 'success' && needs.prepare.outputs.lost == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: container-security-catalogue
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Retire the version whose retained OCI bytes are irrecoverable
        env:
          PROFILE: ${{ inputs.profile }}
          VERSION: ${{ inputs.version }}
        run: |
          uv run --locked python scripts/container_release_publish.py abandon \
            --directory "$RUNNER_TEMP/abandon" --release "$PROFILE/$VERSION" \
            --reason 'The originating workflow confirmed that its retained OCI candidate is missing or expired.'
