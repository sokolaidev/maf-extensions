name: Kind consumer qualification

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [1-Container image release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Published image profile to requalify
        type: choice
        options: [all, azure-pricing, antivirus, document, drawio, drawio-export, shell, bicep, bicep-avm, terraform-random, opentofu-random, terraform-avm]
        default: all

permissions:
  contents: read
  actions: read
  attestations: read

jobs:
  select:
    if: >-
      github.repository == 'sokolaidev/maf-extensions' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected published consumers
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
          PROFILE: ${{ inputs.profile || 'all' }}
        run: python3 scripts/qualify_kind_consumers.py select --before "$BEFORE" --profile "$PROFILE"

  qualify:
    needs: select
    if: needs.select.outputs.matrix != '[]'
    runs-on: ubuntu-latest-m
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Sync locked consumer environment
        run: uv sync --locked
      - name: Verify published image and qualify consumers
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ matrix.package }}
          PROFILE: ${{ matrix.profile }}
          BACKEND: ${{ matrix.backend }}
        run: |
          uv run --locked python scripts/qualify_kind_consumers.py qualify \
            --package "$PACKAGE" --profile "$PROFILE" --backend "$BACKEND" \
            --directory "$RUNNER_TEMP/consumer"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-${{ matrix.profile }}-${{ matrix.backend }}
          path: |
            ${{ runner.temp }}/consumer/consumer-inputs.json
            ${{ runner.temp }}/consumer/consumer-qualification.json
          if-no-files-found: error
          retention-days: 90

  attest:
    needs: [select, qualify]
    if: >-
      always() && !cancelled() && needs.select.result == 'success' &&
      needs.select.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: consumer-${{ matrix.profile }}-${{ matrix.backend }}
          path: ${{ runner.temp }}/consumer
      - name: Validate transferred identity without executing consumer code
        env:
          PACKAGE: ${{ matrix.package }}
          PROFILE: ${{ matrix.profile }}
          BACKEND: ${{ matrix.backend }}
        run: |
          python3 scripts/qualify_kind_consumers.py validate \
            --package "$PACKAGE" --profile "$PROFILE" --backend "$BACKEND" \
            --directory "$RUNNER_TEMP/consumer"
      - name: Attest consumer compatibility independently of image publication
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/consumer/consumer-inputs.json
          predicate-type: https://github.com/sokolaidev/maf-extensions/consumer-qualification/v1
          predicate-path: ${{ runner.temp }}/consumer/consumer-qualification.json
