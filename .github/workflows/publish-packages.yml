name: Publish

# Six packages share this workflow, so the run's own title has to say which one. Without a
# `run-name` every run is called "Publish", and a deployment-review prompt — in the mobile
# app especially, where the reviewer sees the title and the job list and nothing else — asks
# for approval to upload without naming what.
#
# Inputs first, mirroring the resolve step below rather than reading the ref: a dispatch is
# authoritative on its `package`, and the automated path dispatches *at the tag*, so a
# ref-derived title could name a different package than the one that publishes. Only a tag
# push falls through to the ref, and then the whole tag is the best label there is. The
# version is deliberately absent — it is not known until the build resolves it, and the job
# below carries it.
run-name: Publish ${{ inputs.package || github.ref_name }} to ${{ inputs.target || 'pypi' }}

# One package per tag (`maf-sandbox-v0.1.0` -> packages/maf-sandbox), published with
# Trusted Publishing — no token anywhere. Registration values: docs/maintainers.md.
on:
  push:
    tags:
      - "maf-sandbox-v*"
      - "maf-sandbox-acas-v*"
      - "maf-sandbox-bicep-v*"
      - "maf-sandbox-codeact-v*"
      - "maf-sandbox-docker-v*"
      - "maf-sandbox-wslc-v*"
  # Rehearsal path: publish any package to TestPyPI without cutting a real tag.
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        options:
          - maf-sandbox
          - maf-sandbox-acas
          - maf-sandbox-bicep
          - maf-sandbox-codeact
          - maf-sandbox-docker
          - maf-sandbox-wslc
      target:
        description: "Registry"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build + verify
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.resolve.outputs.package }}
      version: ${{ steps.resolve.outputs.version }}
      target: ${{ steps.resolve.outputs.target }}
      # Context only — a breaking release whose dependents still import runs the live check
      # all the same. The dispatch decision is `live_check` on the dispatch job below, read off
      # the post-upload dispatch check (the `pypi` environment can hold while the index moves,
      # and the upload itself is a window, so a verdict frozen here at build can be stale by the
      # time the core is public). See #337 for why the changelog flag is not the gate.
      breaking: ${{ steps.breaking.outputs.breaking }}
    steps:
      # Full history, because this job runs the whole suite and part of that suite reads the
      # repository's tags. A shallow checkout makes those tests answer about the checkout
      # rather than about the code, which is how a green pull request became a failed publish.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install uv
        # Pinned to the commit v5 resolves to: a moving tag is a supply-chain hole, and
        # this workflow mints a publishing credential.
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      # Which package, which version, which registry — derived once so every later step
      # agrees. A tag drives a real release; a manual run is a rehearsal.
      - name: Resolve the release
        id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            package="$INPUT_PACKAGE"
            target="$INPUT_TARGET"
            version="$(grep -m1 '^version = ' "packages/${package}/pyproject.toml" | cut -d'"' -f2)"
          else
            # Strip the trailing -v<version>; what remains is the package directory name.
            package="${REF_NAME%-v*}"
            version="${REF_NAME##*-v}"
            target="pypi"
          fi
          if [ ! -f "packages/${package}/pyproject.toml" ]; then
            echo "::error::tag '${REF_NAME}' resolves to package '${package}', which does not exist under packages/"
            exit 1
          fi
          echo "package=${package}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "target=${target}" >> "$GITHUB_OUTPUT"
          echo "publishing ${package} ${version} to ${target}"

      # The changelog's breaking flag is informational: it does not identify whether published
      # dependents are stranded. The work check below makes the live-check dispatch decision;
      # this step only adds context to the run summary. See #337.
      #
      # Core releases only — a dependent's own publish strands nothing above it — and only for
      # the real index, matching the work check's own gate. A detector that cannot answer writes
      # `breaking=false` and a warning rather than failing the release: the dispatch is not this
      # step's to make, and a guess is not worth refusing an upload over.
      - name: Check whether this release is breaking
        id: breaking
        if: >-
          steps.resolve.outputs.package == 'maf-sandbox'
          && steps.resolve.outputs.target == 'pypi'
        env:
          PACKAGE: ${{ steps.resolve.outputs.package }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          verdict=false
          if answer="$(python3 scripts/check_release_is_breaking.py "$PACKAGE" "$VERSION")"; then
            if [ "$answer" = "breaking=true" ]; then
              verdict=true
            fi
          else
            echo "::warning::could not read whether ${PACKAGE} ${VERSION} declares breaking changes; the dispatch is unaffected"
          fi
          echo "breaking=${verdict}" >> "$GITHUB_OUTPUT"
          if [ "$verdict" = true ]; then
            {
              echo "### This release declares breaking changes"
              echo
              echo "\`${PACKAGE}\` ${VERSION} declares breaking changes in its changelog. Whether that strands the published dependents is a separate question the work check in this job answers; if they still import, the live check runs all the same. See [#337](https://github.com/sokolaidev/maf-extensions/issues/337)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Fails the run rather than the release: PyPI uploads are immutable, so a mismatched
      # tag can't be corrected after the fact.
      # Covers a dispatch at a tag as well as a tag push — the automated path is the former,
      # where package comes from the input and version from the manifest at that commit.
      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
          PACKAGE: ${{ steps.resolve.outputs.package }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          expected="${PACKAGE}-v${VERSION}"
          if [ "$REF_NAME" != "$expected" ]; then
            echo "::error::tag ${REF_NAME} disagrees with ${PACKAGE} ${VERSION}; expected ${expected}"
            exit 1
          fi

      # Reports which published dependents exclude this version; it does not refuse one.
      # A ceiling that excludes the candidate puts that dependent out of reach of it, which
      # for a breaking release is the point — and refusing here is what ordered every core
      # release behind its dependents'. What refuses on evidence is `core-against-dependents`
      # below, which runs the admitting dependents' own suites (#628). Only for maf-sandbox,
      # and only for the real index, so a TestPyPI rehearsal stays frictionless.
      - name: Report which published dependents exclude this version
        if: >-
          steps.resolve.outputs.package == 'maf-sandbox'
          && steps.resolve.outputs.target == 'pypi'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: python3 scripts/check_published_dependents_admit.py "$VERSION"

      # The full gate again, on the exact commit being released. The Tests workflow already
      # ran it on the branch, but a tag can point anywhere.
      - name: Sync workspace
        run: uv sync --locked

      - name: Tests
        run: uv run pytest -q

      - name: Types
        run: uv run pyright -p packages/${{ steps.resolve.outputs.package }}

      - name: Build
        run: uv build --package ${{ steps.resolve.outputs.package }} --out-dir dist

      # Guards against a stale dist/ or a glob that swept up a sibling package: exactly one
      # sdist and one wheel, both named for the package being released.
      - name: Check the artifacts are this package's, and only this package's
        run: |
          set -euo pipefail
          module="$(echo "${{ steps.resolve.outputs.package }}" | tr '-' '_')"
          version="${{ steps.resolve.outputs.version }}"
          ls -la dist/
          count="$(ls dist | wc -l)"
          if [ "$count" -ne 2 ]; then
            echo "::error::expected exactly one sdist and one wheel in dist/, found ${count}"
            exit 1
          fi
          test -f "dist/${module}-${version}.tar.gz"
          test -f "dist/${module}-${version}-py3-none-any.whl"

      - name: Check metadata
        run: uv run twine check dist/*

      # py.typed and the licence travel in the wheel or the package is broken for consumers
      # in ways no test in this repository would notice.
      - name: Check the wheel carries py.typed and the licence
        run: |
          set -euo pipefail
          module="$(echo "${{ steps.resolve.outputs.package }}" | tr '-' '_')"
          contents="$(unzip -Z1 dist/${module}-*.whl)"
          echo "$contents"
          echo "$contents" | grep -qx "${module}/py.typed"
          echo "$contents" | grep -q "\.dist-info/licenses/LICENSE"

      # The admit check only asks whether the ceiling permits this version; it never runs the
      # dependent. Install the candidate core wheel beside each admitting published version of
      # each dependent and confirm it still imports, so a removed name is caught before the core
      # ships — including an old version with a loose ceiling that the latest has moved off. Only
      # for the core on the real index: a dependent's own release is what fixes such a break, and a
      # TestPyPI rehearsal stays frictionless.
      - name: Verify the published dependents import against this core
        id: work_check
        if: >-
          steps.resolve.outputs.package == 'maf-sandbox'
          && steps.resolve.outputs.target == 'pypi'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          output="$(python3 scripts/check_published_dependents_work.py "$VERSION" \
            dist/maf_sandbox-${VERSION}-py3-none-any.whl \
            --emit-snapshot admitting-snapshot.json)"
          echo "$output"
          # The script prints `live_check=run` when it tested at least one admitting dependent
          # and every one imported, or `live_check=skip` when none admits the candidate yet — the
          # #273 window. This is the build-time reading only; the post-upload dispatch job emits
          # the dispatch verdict, because the `pypi` environment can hold while the index moves
          # and the upload itself is a window, so a `skip` reached here can be stale by the time
          # the core is public (#337, #443). A break exits 1 and fails this step before the
          # dispatch is decided.
          verdict="$(printf '%s\n' "$output" | grep -m1 '^live_check=' || true)"
          case "$verdict" in
            live_check=run|live_check=skip) ;;
            *) echo "::error::work check printed no live_check verdict" >&2; exit 1 ;;
          esac
          if [ "$verdict" = "live_check=skip" ]; then
            {
              echo "### No published dependent admits \`maf-sandbox\` ${VERSION} yet (build-time reading)"
              echo
              echo "The post-upload dispatch job decides whether the live check runs, because a dependent can admit in the approval window or during the upload. If one does, the check runs; otherwise it is skipped, and the dependents' own publishes dispatch it. See [#273](https://github.com/sokolaidev/maf-extensions/issues/273), [#337](https://github.com/sokolaidev/maf-extensions/issues/337) and [#443](https://github.com/sokolaidev/maf-extensions/issues/443)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The snapshot of (distribution, version) pairs this build tested, for the upload job to
      # diff against. Only the core on the real index emits one, matching the gated check above.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: >-
          steps.resolve.outputs.package == 'maf-sandbox'
          && steps.resolve.outputs.target == 'pypi'
        with:
          name: admitting-snapshot
          path: admitting-snapshot.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ steps.resolve.outputs.package }}
          path: dist/

  # Installs the built wheel into a throwaway environment and uses it — proving the
  # artifact itself, deliberately with no registry involved.
  smoke:
    name: Install + use the built wheel
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ needs.build.outputs.package }}
          path: dist/

      # Resolves from the real index with NO local fallback — deliberately opposite of
      # tests.yml's copy of this gate. Stops a release whose dependency isn't published yet.
      - name: Install the wheel into a clean environment
        run: |
          set -euo pipefail
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          uv pip list --python /tmp/smoke/bin/python

      - name: Use it
        run: /tmp/smoke/bin/python scripts/smoke_install.py ${{ needs.build.outputs.package }}

  # Runs the dependent's own suite against every *published* core its range admits. `tests.yml`
  # runs the same suite against the workspace core, which is not a pairing anybody installs —
  # the consumer gets this wheel beside a core from the index. Nothing checked that combination
  # before the upload, and the range said so without ever being asked to prove it (#628).
  #
  # Every step is gated on the package rather than the job, because a job that skips takes
  # `publish` with it: `needs:` treats a skipped dependency as a reason not to run.
  published-cores:
    name: Run its suite against the published cores it admits
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ needs.build.outputs.package != 'maf-sandbox' }}

      - name: Install uv
        if: ${{ needs.build.outputs.package != 'maf-sandbox' }}
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ needs.build.outputs.package != 'maf-sandbox' }}
        with:
          name: dist-${{ needs.build.outputs.package }}
          path: dist/

      # The siblings are this repository's code, not published artifacts, so they are built here:
      # `maf-sandbox-codeact`'s e2e module imports `maf_sandbox_docker`, and
      # `maf-sandbox-docker`'s parity test asserts `maf-sandbox-wslc` is importable rather than
      # skipping. The package under test keeps the artifact that will actually be uploaded.
      - name: Build the sibling wheels
        if: ${{ needs.build.outputs.package != 'maf-sandbox' }}
        env:
          PACKAGE: ${{ needs.build.outputs.package }}
        run: |
          set -euo pipefail
          for sibling in maf-sandbox-acas maf-sandbox-bicep maf-sandbox-codeact \
                         maf-sandbox-docker maf-sandbox-wslc; do
            if [ "$sibling" != "$PACKAGE" ]; then
              uv build --package "$sibling" --out-dir dist/
            fi
          done

      - name: Run the suite against every published core the wheel admits
        if: ${{ needs.build.outputs.package != 'maf-sandbox' }}
        env:
          PACKAGE: ${{ needs.build.outputs.package }}
        run: |
          set -euo pipefail
          wheel="$(ls dist/"${PACKAGE//-/_}"-*.whl)"
          python3 scripts/check_dependent_works_with_published_cores.py "$PACKAGE" "$wheel"

      # The other half of the same question: this candidate has to be installable *beside* the
      # rest of the family, which is how the samples use it. Asked of the resolver rather than
      # by intersecting ranges, because these packages also carry agent-framework and the Azure
      # libraries and can collide there while their core ranges agree (#628).
      #
      # This half fails. A release whose own packages cannot share an environment is a range
      # that moved past a sibling, and no later publish repairs it.
      - name: The release's own packages install together
        if: ${{ needs.build.outputs.package != 'maf-sandbox' }}
        run: |
          set -euo pipefail
          python3 scripts/check_suite_installs_together.py --whole-set --dist-dir dist

      # This half warns. The candidate is pinned to the built wheel and nobody else pins it, so
      # a combination it cannot find is one the resolver reaches by taking an older sibling —
      # and publishing adds a version to the index, it never removes a set that already
      # resolved. The report goes to the job summary and the release goes ahead.
      - name: The candidate beside the published suite
        if: ${{ needs.build.outputs.package != 'maf-sandbox' }}
        run: |
          set -euo pipefail
          python3 scripts/check_suite_installs_together.py --dist-dir dist

  # A core release runs the dependents' suites rather than importing them. The import check
  # beside it proves a name still resolves; this proves the behaviour behind the name, which is
  # the half a changed signature or a moved default walks straight through (#541, #628).
  #
  # Two halves, and their disagreement is the signal: `published` is what is installed today,
  # recovered from each version's release tag because no sdist ships tests; `branch` is what is
  # about to be. Published failing while branch passes says the break is real and already
  # handled — those packages have to publish. Both failing says nothing has handled it yet.
  core-against-dependents:
    name: Run the dependents' suites against this core
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the published half recovers each version's suite with
      # `git archive <tag>`, and a shallow clone carries no tags to archive from.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ needs.build.outputs.package == 'maf-sandbox' }}
        with:
          fetch-depth: 0

      - name: Install uv
        if: ${{ needs.build.outputs.package == 'maf-sandbox' }}
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ needs.build.outputs.package == 'maf-sandbox' }}
        with:
          name: dist-${{ needs.build.outputs.package }}
          path: dist/

      - name: Build the dependents' wheels
        if: ${{ needs.build.outputs.package == 'maf-sandbox' }}
        run: |
          set -euo pipefail
          for dependent in maf-sandbox-acas maf-sandbox-bicep maf-sandbox-codeact \
                           maf-sandbox-docker maf-sandbox-wslc; do
            uv build --package "$dependent" --out-dir dist/
          done

      - name: Run every dependent's suite against this core
        if: ${{ needs.build.outputs.package == 'maf-sandbox' }}
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/check_core_against_dependents.py \
            "$VERSION" dist/maf_sandbox-"$VERSION"-py3-none-any.whl

  publish:
    # The row a reviewer approves, so it names the resolved package and version rather than
    # the requested one: these come from the build's own outputs, which is what will actually
    # be uploaded, and an upload is immutable.
    name: Publish ${{ needs.build.outputs.package }} ${{ needs.build.outputs.version }} to ${{ needs.build.outputs.target }}
    needs: [build, smoke, published-cores, core-against-dependents]
    runs-on: ubuntu-latest
    # Half of the trusted-publisher identity PyPI checks; must match what's registered
    # there. Also where a required reviewer can be configured.
    environment: ${{ needs.build.outputs.target }}
    permissions:
      # Mints the OIDC token that IS the credential. No secrets involved.
      id-token: write
      # A job-level block replaces the workflow's outright, so anything unlisted here is
      # `none` — without this the sparse checkout below cannot read the repository.
      contents: read
    steps:
      # Into a subdirectory of its own, and before the artifact arrives. `actions/checkout`
      # cleans the directory it checks out, so a checkout at the workspace root — in any
      # position — is one reordering away from deleting the `dist/` this job exists to
      # upload. `path:` puts that beyond reach rather than relying on step order.
      #
      # Sparse, because this job mints the publishing credential: the two paths the check
      # reads, and nothing else.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: >-
          needs.build.outputs.package == 'maf-sandbox'
          && needs.build.outputs.target == 'pypi'
        with:
          path: release-guard
          sparse-checkout: |
            scripts
            packages/*/pyproject.toml
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ needs.build.outputs.package }}
          path: dist/

      # The build job recorded which (distribution, version) pairs it tested; the import re-check
      # below diffs the current admitting set against it. Only the core on the real index uploaded
      # one, so this download is gated to match — download-artifact errors if the artifact is absent.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: >-
          needs.build.outputs.package == 'maf-sandbox'
          && needs.build.outputs.target == 'pypi'
        with:
          name: admitting-snapshot
          path: .

      # The build job ran this too. Re-read here because the `pypi` environment holds for as
      # long as a reviewer takes and the index moves under a verdict reached before the wait —
      # so the line printed beside the upload describes the index as it is at the upload.
      - name: Re-report which published dependents exclude this, at upload time
        if: >-
          needs.build.outputs.package == 'maf-sandbox'
          && needs.build.outputs.target == 'pypi'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: python3 release-guard/scripts/check_published_dependents_admit.py "$VERSION"

      # Only the import re-check below needs uv; the admit re-check above is metadata-only.
      - name: Install uv
        if: >-
          needs.build.outputs.package == 'maf-sandbox'
          && needs.build.outputs.target == 'pypi'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      # Break refusal only — does NOT decide the dispatch. A version that admitted since build
      # and no longer imports exits 1, and `set -e` fails this step before the upload is reached.
      # A dependent can still admit during the upload window (between this re-check and `Publish`
      # completing), so the dispatch verdict is the post-upload dispatch job's, not this step's
      # (#443). Only versions admitting now that were not in the build snapshot are re-tested; a
      # published wheel is immutable, so build-tested versions import the same now. See #337.
      - name: Re-verify only newly admitting published versions import against this core
        id: recheck
        if: >-
          needs.build.outputs.package == 'maf-sandbox'
          && needs.build.outputs.target == 'pypi'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          python3 release-guard/scripts/check_published_dependents_work.py "$VERSION" \
            dist/maf_sandbox-${VERSION}-py3-none-any.whl \
            --since-snapshot admitting-snapshot.json

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: ${{ needs.build.outputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          print-hash: true

      - name: Summary
        run: |
          {
            echo "### Published \`${{ needs.build.outputs.package }}\` ${{ needs.build.outputs.version }}"
            echo
            if [ "${{ needs.build.outputs.target }}" = "testpypi" ]; then
              echo "- https://test.pypi.org/project/${{ needs.build.outputs.package }}/${{ needs.build.outputs.version }}/"
              echo "- Install: \`pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ ${{ needs.build.outputs.package }}==${{ needs.build.outputs.version }}\`"
            else
              echo "- https://pypi.org/project/${{ needs.build.outputs.package }}/${{ needs.build.outputs.version }}/"
              echo "- Install: \`pip install ${{ needs.build.outputs.package }}==${{ needs.build.outputs.version }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The dispatch verdict the downstream jobs gate on, decided once the upload is complete so a
  # dependent that admits during the upload window is counted rather than racing a `skip` frozen
  # before it (#443). The local core wheel is what gets imported, so this does not wait for index
  # propagation. This is a separate job from `publish` on purpose: the check installs and imports
  # newly-published dependents from PyPI, running their module-level code, so it must not hold the
  # `id-token: write` that `publish` mints the publishing credential with — a dependent that
  # appeared in the upload window could otherwise request and exfiltrate that token. The job runs
  # for every PyPI publish; the check itself is gated to maf-sandbox, so a dependent's own publish
  # leaves the output empty, and empty means "go" (#337, #443).
  dispatch:
    name: Decide the live-check dispatch
    needs: [build, publish]
    if: needs.build.outputs.target == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      # Read-only, and deliberately no `id-token: write` — see the job comment above. This job
      # imports newly-published dependent code, so it must not hold the publishing credential.
      contents: read
    outputs:
      live_check: ${{ steps.decide.outputs.live_check }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.build.outputs.package == 'maf-sandbox'
        with:
          path: release-guard
          sparse-checkout: |
            scripts
            packages/*/pyproject.toml
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.build.outputs.package == 'maf-sandbox'
        with:
          name: dist-${{ needs.build.outputs.package }}
          path: dist/

      # Only the core on the real index uploaded one; download-artifact errors if absent, so this
      # download is gated to match.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.build.outputs.package == 'maf-sandbox'
        with:
          name: admitting-snapshot
          path: .

      - name: Install uv
        if: needs.build.outputs.package == 'maf-sandbox'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Decide the live-check dispatch after the upload
        id: decide
        if: >-
          needs.build.outputs.package == 'maf-sandbox'
          && needs.build.outputs.target == 'pypi'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          status=0
          output="$(python3 release-guard/scripts/check_published_dependents_work.py "$VERSION" \
            dist/maf_sandbox-${VERSION}-py3-none-any.whl \
            --since-snapshot admitting-snapshot.json --dispatch 2>dispatch-break.txt)" || status=$?
          echo "$output"
          # A break exits 0 under `--dispatch`, so a non-zero status is the check unable to
          # answer at all — an unreachable index, a missing wheel, an unreadable snapshot.
          # Its reason is on stderr, which this step redirects into the file below, so
          # replaying it is all that stands between that red and a step failing silently.
          if [ "$status" -ne 0 ]; then
            cat dispatch-break.txt >&2
            exit "$status"
          fi
          verdict="$(printf '%s\n' "$output" | grep -m1 '^live_check=' || true)"
          case "$verdict" in
            live_check=run|live_check=skip) ;;
            *) echo "::error::post-upload dispatch check printed no live_check verdict" >&2; exit 1 ;;
          esac
          echo "$verdict" >> "$GITHUB_OUTPUT"
          if [ -s dispatch-break.txt ]; then
            # A dependent admitted and broke during the upload window. The upload is immutable, so
            # the release ships; surface the break as a red annotation and dispatch the live check
            # (the verdict is run). See #443.
            while IFS= read -r line; do
              if [ -n "$line" ]; then
                echo "::error::${line}"
              fi
            done < dispatch-break.txt
            {
              echo "### A dependent broke after the upload"
              echo
              echo "A published dependent that admitted \`maf-sandbox\` ${VERSION} during the upload window breaks at import time. The upload is immutable, so the release ships and the live check is dispatched rather than the release refused. The break is real and needs a follow-up release that keeps the dependent importing. See [#443](https://github.com/sokolaidev/maf-extensions/issues/443)."
              echo
              echo '<details><summary>The import failures</summary>'
              echo
              echo '```'
              cat dispatch-break.txt
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$verdict" = "live_check=skip" ]; then
            {
              echo "### The live check is being skipped"
              echo
              echo "No published dependent admits \`maf-sandbox\` ${VERSION} after the upload, so a live run would go red for the ordering of the release train rather than for the code. The dependents' own publishes dispatch it, which is when its answer starts meaning something. See [#273](https://github.com/sokolaidev/maf-extensions/issues/273)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Only reached by a hand-pushed tag: an automated release already has its Release, made by
  # release-please when its PR merged. See docs/maintainers.md for why that order is forced.
  release:
    name: Record the release
    needs: [build, publish]
    # Real releases only, however they were started. A TestPyPI run is a rehearsal, and a
    # rehearsal is not a release.
    if: needs.build.outputs.target == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      # Scoped to this job alone; every other job in this workflow stays read-only.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The changelog entry is the release notes; a missing section fails the job rather
      # than shipping a Release with no notes.
      - name: Extract the changelog section
        id: notes
        env:
          PACKAGE: ${{ needs.build.outputs.package }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          changelog="packages/${PACKAGE}/CHANGELOG.md"
          # From this version's heading up to (not including) the next one.
          section="$(awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' "$changelog")"
          if [ -z "$(echo "$section" | tr -d '[:space:]')" ]; then
            echo "::error::no '## [${VERSION}]' section in ${changelog} — add the entry before tagging"
            exit 1
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$section"
            echo "Install: \`pip install ${PACKAGE}==${VERSION}\`"
            echo "PyPI: https://pypi.org/project/${PACKAGE}/${VERSION}/"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # Idempotent on purpose: create the Release if this tag has none, and otherwise bring
      # its notes in line with the changelog rather than failing on the one that exists.
      - name: Record the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # Derived, not `github.ref_name`: this job also runs from a dispatch, where the ref
          # is whatever was dispatched. `--verify-tag` still refuses a tag that isn't there.
          TAG: ${{ needs.build.outputs.package }}-v${{ needs.build.outputs.version }}
          PACKAGE: ${{ needs.build.outputs.package }}
          VERSION: ${{ needs.build.outputs.version }}
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "${PACKAGE} ${VERSION}" --notes "$NOTES"
            echo "updated the existing release for ${TAG}"
          else
            gh release create "$TAG" \
              --title "${PACKAGE} ${VERSION}" \
              --notes "$NOTES" \
              --verify-tag
          fi

  # Poll the installer-facing Simple API (what uv resolves through, not the metadata JSON
  # endpoint, which is cached separately) until the just-published version is not merely listed
  # but *installable*, before the verify call — so verify-live resolves the version that was
  # actually just published rather than the one before it (#563).
  #
  # Three things it requires, each closing a way a listing check passes while a verify runner
  # still resolves the previous version:
  #   - it fetches the version's wheel AND sdist, not just reads the version list, so the window
  #     where the listing has updated but the artifact is not yet served at this edge does not
  #     pass, and a resolver cannot find only the sdist and build from source;
  #   - every request is cache-busted (a unique query plus no-cache), so a pass reflects fresh
  #     origin state rather than this edge's own warm 200;
  #   - it requires the version to stay installable *continuously for a settle window* before it
  #     releases downstream, so an edge mid-purge does not pass on a single flicker and the CDN
  #     has time to converge.
  #
  # The residual is honest and is why #563 stays open: this runs on one runner and cannot see
  # the edge a verify runner will hit, so it lowers the failure rate rather than removing it —
  # the hard fix is a resolve-retry on each verify runner, deliberately out of scope here. Still
  # a poll, not a fixed sleep: propagation lag is not bounded, and a sleep is both slow when the
  # index is quick and unreliable when it is not. Gated identically to `verify` and to
  # `train-status` so it is never skipped when either would run, which lets both simply `needs:`
  # it — keep the three `if:` blocks the same text. (#271, #563.)
  wait-for-propagation:
    name: Wait for the index to show the new version
    needs: [build, dispatch]
    if: >-
      needs.build.outputs.target == 'pypi'
      && needs.dispatch.outputs.live_check != 'skip'
      && contains(fromJSON('["maf-sandbox", "maf-sandbox-acas", "maf-sandbox-bicep", "maf-sandbox-codeact", "maf-sandbox-docker"]'), needs.build.outputs.package)
    runs-on: ubuntu-latest
    steps:
      - name: Poll PyPI until the just-published version is installable
        env:
          PACKAGE: ${{ needs.build.outputs.package }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.parse, urllib.request

          PACKAGE = os.environ["PACKAGE"]
          VERSION = os.environ["VERSION"]
          MODULE = PACKAGE.replace("-", "_")
          SIMPLE = f"https://pypi.org/simple/{PACKAGE}/"

          DEADLINE = time.monotonic() + 900  # 15 min, the outer bound on one publish's propagation
          SETTLE = 60                         # must stay installable continuously this long
          INTERVAL = 15

          def cache_busted(url):
              # The query goes *before* the fragment. A Simple-API artifact URL ends in
              # `#sha256=…`, so appending the query to the whole string buries it inside the
              # fragment — which the client strips before the request, leaving the server the
              # same URL every time and the check reading this edge's warm 200 after all.
              split = urllib.parse.urlsplit(url)
              query = f"{split.query}&" if split.query else ""
              return urllib.parse.urlunsplit(
                  split._replace(query=f"{query}_cb={int(time.time() * 1000)}")
              )

          def fresh_get(url, *, accept=None, first_byte_only=False):
              # Cache-busting: a unique query and no-cache headers, so a pass reflects fresh
              # origin state rather than this edge's own warm 200.
              busted = cache_busted(url)
              headers = {"Cache-Control": "no-cache", "Pragma": "no-cache"}
              if accept:
                  headers["Accept"] = accept
              if first_byte_only:
                  headers["Range"] = "bytes=0-0"
              req = urllib.request.Request(busted, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as resp:
                  return resp.status, resp.read()

          def installable():
              # Listed AND every artifact for the version fetchable — the wheel a resolver
              # installs and the sdist beside it, both uploaded in the same publish.
              try:
                  _, body = fresh_get(SIMPLE, accept="application/vnd.pypi.simple.v1+json")
                  data = json.loads(body)
              except (urllib.error.URLError, TimeoutError, OSError) as error:
                  return False, f"index unreachable: {error}"
              except json.JSONDecodeError as error:
                  # A 200 carrying truncated or malformed JSON is an edge mid-write, which is
                  # the condition this poll exists for. Raising here would end the job on the
                  # symptom it is meant to wait out; resetting the window is the answer.
                  return False, f"index returned unparseable JSON: {error}"
              if VERSION not in data.get("versions", []):
                  return False, "version not listed"
              wheel_prefix = f"{MODULE}-{VERSION}-"
              sdist_name = f"{MODULE}-{VERSION}.tar.gz"
              names = [f.get("filename", "") for f in data.get("files", [])]
              # Both kinds, not either: they upload as one publish but appear independently, and
              # a resolver that finds only the sdist builds from source where it should have
              # taken the wheel. Counting a non-empty list would pass on whichever landed first.
              wheels = [n for n in names if n.startswith(wheel_prefix) and n.endswith(".whl")]
              if not wheels:
                  return False, "no wheel for this version yet"
              if sdist_name not in names:
                  return False, f"{sdist_name} not listed yet"
              want = [
                  f
                  for f in data.get("files", [])
                  if f.get("filename", "") in {*wheels, sdist_name}
              ]
              for f in want:
                  try:
                      code, _ = fresh_get(f["url"], first_byte_only=True)
                  except (urllib.error.URLError, TimeoutError, OSError) as error:
                      return False, f"{f['filename']} not fetchable: {error}"
                  if code not in (200, 206):
                      return False, f"{f['filename']} returned {code}"
              return True, ", ".join(sorted(f["filename"] for f in want))

          stable_since = None
          while time.monotonic() < DEADLINE:
              ok, detail = installable()
              now = time.monotonic()
              if ok:
                  if stable_since is None:
                      stable_since = now
                      print(f"{PACKAGE} {VERSION} installable ({detail}); confirming for {SETTLE}s")
                  held = int(now - stable_since)
                  if now - stable_since >= SETTLE:
                      print(f"{PACKAGE} {VERSION} installable for {held}s straight; releasing verify")
                      sys.exit(0)
                  print(f"still installable ({held}s/{SETTLE}s)")
              else:
                  if stable_since is not None:
                      print(f"regressed before settling ({detail}); restarting the window")
                  else:
                      print(f"not installable yet: {detail}")
                  stable_since = None
              time.sleep(INTERVAL)

          print(
              f"::error::{PACKAGE} {VERSION} was not continuously installable on PyPI within the deadline",
              file=sys.stderr,
          )
          sys.exit(1)
          PY

  # A live red during a drain is about the order of the train rather than the code, and this
  # says so in the run summary. It annotates and never gates: gating the dispatch on a coarser
  # signal is what #337 removed, and #512 carries the case.
  #
  # Gated exactly as `verify` is, and waiting on the same propagation job — there is no red to
  # explain where no live check runs, and an index that has not caught up would misreport which
  # dependents are behind, in either direction.
  train-status:
    name: Say whether the release train has drained
    needs: [build, dispatch, wait-for-propagation]
    if: >-
      needs.build.outputs.target == 'pypi'
      && needs.dispatch.outputs.live_check != 'skip'
      && contains(fromJSON('["maf-sandbox", "maf-sandbox-acas", "maf-sandbox-bicep", "maf-sandbox-codeact", "maf-sandbox-docker"]'), needs.build.outputs.package)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            scripts
            packages/*/pyproject.toml
          sparse-checkout-cone-mode: false

      # Never fails the run. The upload has already happened by the time this executes, and a
      # detector that cannot reach the index has nothing to say — colouring a shipped release
      # over a missing annotation would be worse than the missing annotation.
      - name: Note whether a live red would be about ordering
        continue-on-error: true
        env:
          PACKAGE: ${{ needs.build.outputs.package }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if ! output="$(python3 scripts/check_release_train_drained.py)"; then
            echo "::warning::could not read whether the release train has drained"
            exit 0
          fi
          echo "$output"
          if [ "$(printf '%s\n' "$output" | head -n1)" != "train=draining" ]; then
            exit 0
          fi
          {
            echo "### The release train is still draining"
            echo
            echo "\`${PACKAGE}\` ${VERSION} published and the live check runs. At least one published dependent has not gone out since this core, so the index does not yet resolve as the set the samples were tested against — a red in the live check is more likely the order of the train than the code. Re-run it from Actions → **Verify (live)** → **Run workflow** once every dependent has published, and read that run instead. See [#512](https://github.com/sokolaidev/maf-extensions/issues/512)."
            echo
            echo '<details><summary>Which dependents have not published since the core</summary>'
            echo
            echo '```'
            printf '%s\n' "$output" | tail -n +2
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

  # The happy-path half of issue #33: once a real publish lands, run the samples verify-live.yml
  # covers — 01_acas_bicep, 03_acas_codeact, 06_docker_codeact and 08_docker_codeact_files —
  # against a live sandbox at the just-released version, proving router, backend, image and
  # workload agree. This job's own `if:` is gated to the packages any of those samples exercises;
  # a maf-sandbox-wslc release touches none, so it triggers nothing. Which samples actually run
  # is the called workflow's decision: `package` tells it which package was just released, and
  # each job runs only if that release could affect it — so a maf-sandbox-docker release runs
  # both docker jobs (neither creates a billable sandbox) and not the ACAS ones. A batch release
  # calls this once per package; per-package concurrency keeps those calls independent (#325).
  #
  # `live_check != 'skip'` is the dispatch decision, read off the post-upload dispatch job: a
  # release dispatches the live check unless no published dependent admits the core after the
  # upload, which is the one window where a red would be about the ordering of the train rather
  # than the code. The verdict is measured after the upload, not at build, because the `pypi`
  # environment can hold while the index moves and the upload itself is a window — a dependent can
  # admit in the approval window or during the upload, and a `skip` frozen at build would wrongly
  # suppress the check (#337, #443). A breaking release whose dependents still import runs all the
  # same, and the changelog's breaking flag is context for that run, not the dispatch. A
  # dependent's own publish leaves the output empty, and empty means "go".
  verify:
    name: Verify against a live sandbox
    needs: [build, dispatch, wait-for-propagation]
    if: >-
      needs.build.outputs.target == 'pypi'
      && needs.dispatch.outputs.live_check != 'skip'
      && contains(fromJSON('["maf-sandbox", "maf-sandbox-acas", "maf-sandbox-bicep", "maf-sandbox-codeact", "maf-sandbox-docker"]'), needs.build.outputs.package)
    uses: ./.github/workflows/verify-live.yml
    with:
      package: ${{ needs.build.outputs.package }}
      version: ${{ needs.build.outputs.version }}
    permissions:
      # Passed down to the called workflow, which mints the Azure OIDC token.
      id-token: write
      contents: read

  # A live check that never started cannot say so itself: a run displaced from its concurrency
  # group is cancelled while still pending, before a single step executes. Nor can the cancellation
  # be softened here — `continue-on-error` is not among the keys a job that `uses:` a reusable
  # workflow accepts — so the run is coloured cancelled either way. Keying that group per package
  # (#325) makes the displacement rare rather than impossible, since two runs for the *same* package
  # still share a group, and the damage when it happens is a lost signal and nothing more: the
  # upload has already happened and been recorded by the time this runs. So say that, rather than
  # leave a cancelled called workflow reading as a release that broke.
  verify-superseded:
    name: Explain a live check that did not run
    needs: [build, verify]
    if: always() && needs.verify.result == 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Say the live check was superseded
        env:
          PACKAGE: ${{ needs.build.outputs.package }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo "### The live check did not run"
            echo
            echo "\`${PACKAGE}\` ${VERSION} published successfully — the upload happens before this check and is untouched by it. The check itself was superseded by a later live run for the same package and cancelled while it was still queued, so it never started. Re-run it from Actions → **Verify (live)** → **Run workflow** with \`package: ${PACKAGE}\`. See [#325](https://github.com/sokolaidev/maf-extensions/issues/325)."
          } >> "$GITHUB_STEP_SUMMARY"
