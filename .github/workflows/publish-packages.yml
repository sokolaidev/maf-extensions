name: Publish

# Six packages share this workflow, so the run's own title has to say which one. Without a
# `run-name` every run is called "Publish", and a deployment-review prompt — in the mobile
# app especially, where the reviewer sees the title and the job list and nothing else — asks
# for approval to upload without naming what.
#
# Inputs first, mirroring the resolve step below rather than reading the ref: a dispatch is
# authoritative on its `package`, and the automated path dispatches *at the tag*, so a
# ref-derived title could name a different package than the one that publishes. Only a tag
# push falls through to the ref, and then the whole tag is the best label there is. The
# version is deliberately absent — it is not known until the build resolves it, and the job
# below carries it.
run-name: Publish ${{ inputs.package || github.ref_name }} to ${{ inputs.target || 'pypi' }}

# One package per tag (`maf-sandbox-v0.1.0` -> packages/maf-sandbox), published with
# Trusted Publishing — no token anywhere. Registration values: docs/maintainers.md.
on:
  push:
    tags:
      - "maf-sandbox-v*"
      - "maf-sandbox-acas-v*"
      - "maf-sandbox-bicep-v*"
      - "maf-sandbox-codeact-v*"
      - "maf-sandbox-docker-v*"
      - "maf-sandbox-wslc-v*"
  # Rehearsal path: publish any package to TestPyPI without cutting a real tag.
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        options:
          - maf-sandbox
          - maf-sandbox-acas
          - maf-sandbox-bicep
          - maf-sandbox-codeact
          - maf-sandbox-docker
          - maf-sandbox-wslc
      target:
        description: "Registry"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build + verify
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.resolve.outputs.package }}
      version: ${{ steps.resolve.outputs.version }}
      target: ${{ steps.resolve.outputs.target }}
      # Context only — a breaking release whose dependents still import runs the live check
      # all the same. The dispatch decision is `live_check` on the publish job below, read off
      # the upload-time re-check (the `pypi` environment can hold while the index moves, so a
      # verdict frozen here at build can be stale by upload). See #337 for why the changelog
      # flag is not the gate.
      breaking: ${{ steps.breaking.outputs.breaking }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        # Pinned to the commit v5 resolves to: a moving tag is a supply-chain hole, and
        # this workflow mints a publishing credential.
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      # Which package, which version, which registry — derived once so every later step
      # agrees. A tag drives a real release; a manual run is a rehearsal.
      - name: Resolve the release
        id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            package="$INPUT_PACKAGE"
            target="$INPUT_TARGET"
            version="$(grep -m1 '^version = ' "packages/${package}/pyproject.toml" | cut -d'"' -f2)"
          else
            # Strip the trailing -v<version>; what remains is the package directory name.
            package="${REF_NAME%-v*}"
            version="${REF_NAME##*-v}"
            target="pypi"
          fi
          if [ ! -f "packages/${package}/pyproject.toml" ]; then
            echo "::error::tag '${REF_NAME}' resolves to package '${package}', which does not exist under packages/"
            exit 1
          fi
          echo "package=${package}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "target=${target}" >> "$GITHUB_OUTPUT"
          echo "publishing ${package} ${version} to ${target}"

      # The changelog's breaking flag is informational: it does not identify whether published
      # dependents are stranded. The work check below makes the live-check dispatch decision;
      # this step only adds context to the run summary. See #337.
      #
      # Core releases only — a dependent's own publish strands nothing above it — and only for
      # the real index, matching the work check's own gate. A detector that cannot answer writes
      # `breaking=false` and a warning rather than failing the release: the dispatch is not this
      # step's to make, and a guess is not worth refusing an upload over.
      - name: Check whether this release is breaking
        id: breaking
        if: >-
          steps.resolve.outputs.package == 'maf-sandbox'
          && steps.resolve.outputs.target == 'pypi'
        env:
          PACKAGE: ${{ steps.resolve.outputs.package }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          verdict=false
          if answer="$(python3 scripts/check_release_is_breaking.py "$PACKAGE" "$VERSION")"; then
            if [ "$answer" = "breaking=true" ]; then
              verdict=true
            fi
          else
            echo "::warning::could not read whether ${PACKAGE} ${VERSION} declares breaking changes; the dispatch is unaffected"
          fi
          echo "breaking=${verdict}" >> "$GITHUB_OUTPUT"
          if [ "$verdict" = true ]; then
            {
              echo "### This release declares breaking changes"
              echo
              echo "\`${PACKAGE}\` ${VERSION} declares breaking changes in its changelog. Whether that strands the published dependents is a separate question the work check in this job answers; if they still import, the live check runs all the same. See [#337](https://github.com/sokolaidev/maf-extensions/issues/337)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Fails the run rather than the release: PyPI uploads are immutable, so a mismatched
      # tag can't be corrected after the fact.
      # Covers a dispatch at a tag as well as a tag push — the automated path is the former,
      # where package comes from the input and version from the manifest at that commit.
      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
          PACKAGE: ${{ steps.resolve.outputs.package }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          expected="${PACKAGE}-v${VERSION}"
          if [ "$REF_NAME" != "$expected" ]; then
            echo "::error::tag ${REF_NAME} disagrees with ${PACKAGE} ${VERSION}; expected ${expected}"
            exit 1
          fi

      # The published dependents cannot be edited after the fact, so a core release they
      # exclude leaves the index unresolvable as a set until every one of them ships again.
      # RELEASING.md orders the releases so that never happens; this is what enforces it.
      # Only for maf-sandbox — a dependent's own release is what closes such a window — and
      # only for the real index, so a TestPyPI rehearsal stays frictionless.
      - name: Check the published dependents admit this version
        if: >-
          steps.resolve.outputs.package == 'maf-sandbox'
          && steps.resolve.outputs.target == 'pypi'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: python3 scripts/check_published_dependents_admit.py "$VERSION"

      # The full gate again, on the exact commit being released. The Tests workflow already
      # ran it on the branch, but a tag can point anywhere.
      - name: Sync workspace
        run: uv sync --locked

      - name: Tests
        run: uv run pytest -q

      - name: Types
        run: uv run pyright -p packages/${{ steps.resolve.outputs.package }}

      - name: Build
        run: uv build --package ${{ steps.resolve.outputs.package }} --out-dir dist

      # Guards against a stale dist/ or a glob that swept up a sibling package: exactly one
      # sdist and one wheel, both named for the package being released.
      - name: Check the artifacts are this package's, and only this package's
        run: |
          set -euo pipefail
          module="$(echo "${{ steps.resolve.outputs.package }}" | tr '-' '_')"
          version="${{ steps.resolve.outputs.version }}"
          ls -la dist/
          count="$(ls dist | wc -l)"
          if [ "$count" -ne 2 ]; then
            echo "::error::expected exactly one sdist and one wheel in dist/, found ${count}"
            exit 1
          fi
          test -f "dist/${module}-${version}.tar.gz"
          test -f "dist/${module}-${version}-py3-none-any.whl"

      - name: Check metadata
        run: uv run twine check dist/*

      # py.typed and the licence travel in the wheel or the package is broken for consumers
      # in ways no test in this repository would notice.
      - name: Check the wheel carries py.typed and the licence
        run: |
          set -euo pipefail
          module="$(echo "${{ steps.resolve.outputs.package }}" | tr '-' '_')"
          contents="$(unzip -Z1 dist/${module}-*.whl)"
          echo "$contents"
          echo "$contents" | grep -qx "${module}/py.typed"
          echo "$contents" | grep -q "\.dist-info/licenses/LICENSE"

      # The admit check only asks whether the ceiling permits this version; it never runs the
      # dependent. Install the candidate core wheel beside each admitting published version of
      # each dependent and confirm it still imports, so a removed name is caught before the core
      # ships — including an old version with a loose ceiling that the latest has moved off. Only
      # for the core on the real index: a dependent's own release is what fixes such a break, and a
      # TestPyPI rehearsal stays frictionless.
      - name: Verify the published dependents import against this core
        id: work_check
        if: >-
          steps.resolve.outputs.package == 'maf-sandbox'
          && steps.resolve.outputs.target == 'pypi'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          output="$(python3 scripts/check_published_dependents_work.py "$VERSION" \
            dist/maf_sandbox-${VERSION}-py3-none-any.whl \
            --emit-snapshot admitting-snapshot.json)"
          echo "$output"
          # The script prints `live_check=run` when it tested at least one admitting dependent
          # and every one imported, or `live_check=skip` when none admits the candidate yet — the
          # #273 window. This is the build-time reading only; the upload-time re-check in the
          # publish job emits the dispatch verdict, because the `pypi` environment can hold while
          # the index moves, so a `skip` reached here can be stale by upload (#337). A break exits
          # 1 and fails this step before the dispatch is decided.
          verdict="$(printf '%s\n' "$output" | grep -m1 '^live_check=' || true)"
          case "$verdict" in
            live_check=run|live_check=skip) ;;
            *) echo "::error::work check printed no live_check verdict" >&2; exit 1 ;;
          esac
          if [ "$verdict" = "live_check=skip" ]; then
            {
              echo "### No published dependent admits \`maf-sandbox\` ${VERSION} yet (build-time reading)"
              echo
              echo "The upload-time re-check in the publish job decides whether the live check runs, because a dependent can admit in the approval window. If one does, the check runs; otherwise it is skipped, and the dependents' own publishes dispatch it. See [#273](https://github.com/sokolaidev/maf-extensions/issues/273) and [#337](https://github.com/sokolaidev/maf-extensions/issues/337)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The snapshot of (distribution, version) pairs this build tested, for the upload job to
      # diff against. Only the core on the real index emits one, matching the gated check above.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: >-
          steps.resolve.outputs.package == 'maf-sandbox'
          && steps.resolve.outputs.target == 'pypi'
        with:
          name: admitting-snapshot
          path: admitting-snapshot.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ steps.resolve.outputs.package }}
          path: dist/

  # Installs the built wheel into a throwaway environment and uses it — proving the
  # artifact itself, deliberately with no registry involved.
  smoke:
    name: Install + use the built wheel
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ needs.build.outputs.package }}
          path: dist/

      # Resolves from the real index with NO local fallback — deliberately opposite of
      # tests.yml's copy of this gate. Stops a release whose dependency isn't published yet.
      - name: Install the wheel into a clean environment
        run: |
          set -euo pipefail
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          uv pip list --python /tmp/smoke/bin/python

      - name: Use it
        run: /tmp/smoke/bin/python scripts/smoke_install.py ${{ needs.build.outputs.package }}

  publish:
    # The row a reviewer approves, so it names the resolved package and version rather than
    # the requested one: these come from the build's own outputs, which is what will actually
    # be uploaded, and an upload is immutable.
    name: Publish ${{ needs.build.outputs.package }} ${{ needs.build.outputs.version }} to ${{ needs.build.outputs.target }}
    needs: [build, smoke]
    runs-on: ubuntu-latest
    # Half of the trusted-publisher identity PyPI checks; must match what's registered
    # there. Also where a required reviewer can be configured.
    environment: ${{ needs.build.outputs.target }}
    permissions:
      # Mints the OIDC token that IS the credential. No secrets involved.
      id-token: write
      # A job-level block replaces the workflow's outright, so anything unlisted here is
      # `none` — without this the sparse checkout below cannot read the repository.
      contents: read
    outputs:
      # The dispatch verdict the downstream jobs gate on, read off the upload-time re-check below.
      # The re-check only runs for a real core release, so this is empty for any other publish; a
      # dependent's own PyPI publish leaves it empty, and empty means "go", so it still dispatches.
      # A TestPyPI rehearsal never reaches the gate — both downstream jobs require target == 'pypi'
      # first. See #337.
      live_check: ${{ steps.recheck.outputs.live_check }}
    steps:
      # Into a subdirectory of its own, and before the artifact arrives. `actions/checkout`
      # cleans the directory it checks out, so a checkout at the workspace root — in any
      # position — is one reordering away from deleting the `dist/` this job exists to
      # upload. `path:` puts that beyond reach rather than relying on step order.
      #
      # Sparse, because this job mints the publishing credential: the two paths the check
      # reads, and nothing else.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: >-
          needs.build.outputs.package == 'maf-sandbox'
          && needs.build.outputs.target == 'pypi'
        with:
          path: release-guard
          sparse-checkout: |
            scripts
            packages/*/pyproject.toml
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ needs.build.outputs.package }}
          path: dist/

      # The build job recorded which (distribution, version) pairs it tested; the import re-check
      # below diffs the current admitting set against it. Only the core on the real index uploaded
      # one, so this download is gated to match — download-artifact errors if the artifact is absent.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: >-
          needs.build.outputs.package == 'maf-sandbox'
          && needs.build.outputs.target == 'pypi'
        with:
          name: admitting-snapshot
          path: .

      # The build job ran this too, to fail before a human is asked to approve. This is the
      # one that decides: the `pypi` environment holds here for as long as a reviewer takes,
      # and the index can move under a verdict reached before the wait.
      - name: Re-check the published dependents at upload time
        if: >-
          needs.build.outputs.package == 'maf-sandbox'
          && needs.build.outputs.target == 'pypi'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: python3 release-guard/scripts/check_published_dependents_admit.py "$VERSION"

      # Only the import re-check below needs uv; the admit re-check above is metadata-only.
      - name: Install uv
        if: >-
          needs.build.outputs.package == 'maf-sandbox'
          && needs.build.outputs.target == 'pypi'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      # The build job ran the thorough all-versions check and recorded the pairs it tested; this
      # re-check emits the dispatch verdict the downstream jobs gate on. The `pypi` environment
      # holds here for as long as a reviewer takes, and the index can move under the verdict the
      # build run reached before the wait — a dependent can upload a new version, or a yanked
      # version can be unyanked, in that window — so the dispatch is decided now, at upload, not
      # frozen at build. A published wheel is immutable, so a version build already tested imports
      # the same now and is not re-run; only versions admitting now that were not in the build
      # snapshot are re-tested. The common case, where nothing new appeared, installs nothing.
      # See #337.
      - name: Re-verify only newly admitting published versions import against this core
        id: recheck
        if: >-
          needs.build.outputs.package == 'maf-sandbox'
          && needs.build.outputs.target == 'pypi'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          output="$(python3 release-guard/scripts/check_published_dependents_work.py "$VERSION" \
            dist/maf_sandbox-${VERSION}-py3-none-any.whl \
            --since-snapshot admitting-snapshot.json)"
          echo "$output"
          verdict="$(printf '%s\n' "$output" | grep -m1 '^live_check=' || true)"
          case "$verdict" in
            live_check=run|live_check=skip) ;;
            *) echo "::error::upload-time re-check printed no live_check verdict" >&2; exit 1 ;;
          esac
          echo "$verdict" >> "$GITHUB_OUTPUT"
          if [ "$verdict" = "live_check=skip" ]; then
            {
              echo "### The live check is being skipped"
              echo
              echo "No published dependent admits \`maf-sandbox\` ${VERSION} at upload time, so a live run would go red for the ordering of the release train rather than for the code. The dependents' own publishes dispatch it, which is when its answer starts meaning something. See [#273](https://github.com/sokolaidev/maf-extensions/issues/273)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: ${{ needs.build.outputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          print-hash: true

      - name: Summary
        run: |
          {
            echo "### Published \`${{ needs.build.outputs.package }}\` ${{ needs.build.outputs.version }}"
            echo
            if [ "${{ needs.build.outputs.target }}" = "testpypi" ]; then
              echo "- https://test.pypi.org/project/${{ needs.build.outputs.package }}/${{ needs.build.outputs.version }}/"
              echo "- Install: \`pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ ${{ needs.build.outputs.package }}==${{ needs.build.outputs.version }}\`"
            else
              echo "- https://pypi.org/project/${{ needs.build.outputs.package }}/${{ needs.build.outputs.version }}/"
              echo "- Install: \`pip install ${{ needs.build.outputs.package }}==${{ needs.build.outputs.version }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Only reached by a hand-pushed tag: an automated release already has its Release, made by
  # release-please when its PR merged. See docs/maintainers.md for why that order is forced.
  release:
    name: Record the release
    needs: [build, publish]
    # Real releases only, however they were started. A TestPyPI run is a rehearsal, and a
    # rehearsal is not a release.
    if: needs.build.outputs.target == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      # Scoped to this job alone; every other job in this workflow stays read-only.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The changelog entry is the release notes; a missing section fails the job rather
      # than shipping a Release with no notes.
      - name: Extract the changelog section
        id: notes
        env:
          PACKAGE: ${{ needs.build.outputs.package }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          changelog="packages/${PACKAGE}/CHANGELOG.md"
          # From this version's heading up to (not including) the next one.
          section="$(awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' "$changelog")"
          if [ -z "$(echo "$section" | tr -d '[:space:]')" ]; then
            echo "::error::no '## [${VERSION}]' section in ${changelog} — add the entry before tagging"
            exit 1
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$section"
            echo "Install: \`pip install ${PACKAGE}==${VERSION}\`"
            echo "PyPI: https://pypi.org/project/${PACKAGE}/${VERSION}/"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # Idempotent on purpose: create the Release if this tag has none, and otherwise bring
      # its notes in line with the changelog rather than failing on the one that exists.
      - name: Record the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # Derived, not `github.ref_name`: this job also runs from a dispatch, where the ref
          # is whatever was dispatched. `--verify-tag` still refuses a tag that isn't there.
          TAG: ${{ needs.build.outputs.package }}-v${{ needs.build.outputs.version }}
          PACKAGE: ${{ needs.build.outputs.package }}
          VERSION: ${{ needs.build.outputs.version }}
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "${PACKAGE} ${VERSION}" --notes "$NOTES"
            echo "updated the existing release for ${TAG}"
          else
            gh release create "$TAG" \
              --title "${PACKAGE} ${VERSION}" \
              --notes "$NOTES" \
              --verify-tag
          fi

  # Poll the installer-facing Simple API (what uv resolves through, not the metadata JSON
  # endpoint, which is cached separately) until the just-published version lists, before the
  # verify call — so verify-live resolves the version that was actually just published. A poll,
  # not a fixed sleep: the propagation lag is not bounded, and a sleep is both slow when the
  # index is quick and unreliable when it is not. Gated identically to `verify` so it is never
  # skipped when verify would run, which lets verify simply `needs:` it — keep the two `if:`
  # blocks the same text. (#271.)
  wait-for-propagation:
    name: Wait for the index to show the new version
    needs: [build, publish]
    if: >-
      needs.build.outputs.target == 'pypi'
      && needs.publish.outputs.live_check != 'skip'
      && contains(fromJSON('["maf-sandbox", "maf-sandbox-acas", "maf-sandbox-bicep", "maf-sandbox-codeact", "maf-sandbox-docker"]'), needs.build.outputs.package)
    runs-on: ubuntu-latest
    steps:
      - name: Poll PyPI until the just-published version is visible
        env:
          PACKAGE: ${{ needs.build.outputs.package }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          url="https://pypi.org/simple/${PACKAGE}/"
          deadline=$((SECONDS + 600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if python3 -c "import json,sys,urllib.request; r=urllib.request.Request('${url}',headers={'Accept':'application/vnd.pypi.simple.v1+json'}); d=json.loads(urllib.request.urlopen(r,timeout=15).read()); sys.exit(0 if '${VERSION}' in d['versions'] else 1)" 2>/dev/null; then
              echo "${PACKAGE} ${VERSION} is visible on the Simple index"
              exit 0
            fi
            echo "not visible yet; polling..."
            sleep 15
          done
          echo "::error::${PACKAGE} ${VERSION} did not appear on the Simple index within ten minutes"
          exit 1

  # The happy-path half of issue #33: once a real publish lands, run the samples verify-live.yml
  # covers — 01_acas_bicep, 03_acas_codeact, 06_docker_codeact and 08_docker_codeact_files —
  # against a live sandbox at the just-released version, proving router, backend, image and
  # workload agree. This job's own `if:` is gated to the packages any of those samples exercises;
  # a maf-sandbox-wslc release touches none, so it triggers nothing. Which samples actually run
  # is the called workflow's decision: `package` tells it which package was just released, and
  # each job runs only if that release could affect it — so a maf-sandbox-docker release runs
  # both docker jobs (neither creates a billable sandbox) and not the ACAS ones. A batch release
  # calls this once per package; per-package concurrency keeps those calls independent (#325).
  #
  # `live_check != 'skip'` is the dispatch decision, read off the upload-time re-check the publish
  # job runs: a release dispatches the live check unless no published dependent admits the core at
  # upload time, which is the one window where a red would be about the ordering of the train
  # rather than the code. The verdict is measured at upload, not build, because the `pypi`
  # environment can hold while the index moves — a dependent can admit in the approval window, and
  # a `skip` frozen at build would wrongly suppress the check (#337). A breaking release whose
  # dependents still import runs all the same, and the changelog's breaking flag is context for
  # that run, not the dispatch. A dependent's own publish leaves the output empty, and empty means
  # "go".
  verify:
    name: Verify against a live sandbox
    needs: [build, publish, wait-for-propagation]
    if: >-
      needs.build.outputs.target == 'pypi'
      && needs.publish.outputs.live_check != 'skip'
      && contains(fromJSON('["maf-sandbox", "maf-sandbox-acas", "maf-sandbox-bicep", "maf-sandbox-codeact", "maf-sandbox-docker"]'), needs.build.outputs.package)
    uses: ./.github/workflows/verify-live.yml
    with:
      package: ${{ needs.build.outputs.package }}
    permissions:
      # Passed down to the called workflow, which mints the Azure OIDC token.
      id-token: write
      contents: read

  # A live check that never started cannot say so itself: a run displaced from its concurrency
  # group is cancelled while still pending, before a single step executes. Nor can the cancellation
  # be softened here — `continue-on-error` is not among the keys a job that `uses:` a reusable
  # workflow accepts — so the run is coloured cancelled either way. Keying that group per package
  # (#325) makes the displacement rare rather than impossible, since two runs for the *same* package
  # still share a group, and the damage when it happens is a lost signal and nothing more: the
  # upload has already happened and been recorded by the time this runs. So say that, rather than
  # leave a cancelled called workflow reading as a release that broke.
  verify-superseded:
    name: Explain a live check that did not run
    needs: [build, verify]
    if: always() && needs.verify.result == 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Say the live check was superseded
        env:
          PACKAGE: ${{ needs.build.outputs.package }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo "### The live check did not run"
            echo
            echo "\`${PACKAGE}\` ${VERSION} published successfully — the upload happens before this check and is untouched by it. The check itself was superseded by a later live run for the same package and cancelled while it was still queued, so it never started. Re-run it from Actions → **Verify (live)** → **Run workflow** with \`package: ${PACKAGE}\`. See [#325](https://github.com/sokolaidev/maf-extensions/issues/325)."
          } >> "$GITHUB_STEP_SUMMARY"
