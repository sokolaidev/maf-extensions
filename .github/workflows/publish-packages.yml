name: Publish

# One package per tag (`maf-sandbox-v0.1.0` -> packages/maf-sandbox), published with
# Trusted Publishing — no token anywhere. Registration values: docs/maintainers.md.
on:
  push:
    tags:
      - "maf-sandbox-v*"
      - "maf-sandbox-aca-v*"
      - "maf-sandbox-bicep-v*"
      - "maf-sandbox-wslc-v*"
  # Rehearsal path: publish any package to TestPyPI without cutting a real tag.
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        options:
          - maf-sandbox
          - maf-sandbox-aca
          - maf-sandbox-bicep
          - maf-sandbox-wslc
      target:
        description: "Registry"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build + verify
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.resolve.outputs.package }}
      version: ${{ steps.resolve.outputs.version }}
      target: ${{ steps.resolve.outputs.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        # Pinned to the commit v5 resolves to: a moving tag is a supply-chain hole, and
        # this workflow mints a publishing credential.
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      # Which package, which version, which registry — derived once so every later step
      # agrees. A tag drives a real release; a manual run is a rehearsal.
      - name: Resolve the release
        id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            package="$INPUT_PACKAGE"
            target="$INPUT_TARGET"
            version="$(grep -m1 '^version = ' "packages/${package}/pyproject.toml" | cut -d'"' -f2)"
          else
            # Strip the trailing -v<version>; what remains is the package directory name.
            package="${REF_NAME%-v*}"
            version="${REF_NAME##*-v}"
            target="pypi"
          fi
          if [ ! -f "packages/${package}/pyproject.toml" ]; then
            echo "::error::tag '${REF_NAME}' resolves to package '${package}', which does not exist under packages/"
            exit 1
          fi
          echo "package=${package}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "target=${target}" >> "$GITHUB_OUTPUT"
          echo "publishing ${package} ${version} to ${target}"

      # Fails the run rather than the release: PyPI uploads are immutable, so a mismatched
      # tag can't be corrected after the fact.
      # Covers a dispatch at a tag as well as a tag push — the automated path is the former,
      # where package comes from the input and version from the manifest at that commit.
      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
          PACKAGE: ${{ steps.resolve.outputs.package }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          expected="${PACKAGE}-v${VERSION}"
          if [ "$REF_NAME" != "$expected" ]; then
            echo "::error::tag ${REF_NAME} disagrees with ${PACKAGE} ${VERSION}; expected ${expected}"
            exit 1
          fi

      # The full gate again, on the exact commit being released. The Tests workflow already
      # ran it on the branch, but a tag can point anywhere.
      - name: Sync workspace
        run: uv sync --locked

      - name: Tests
        run: uv run pytest -q

      - name: Types
        run: uv run pyright -p packages/${{ steps.resolve.outputs.package }}

      - name: Build
        run: uv build --package ${{ steps.resolve.outputs.package }} --out-dir dist

      # Guards against a stale dist/ or a glob that swept up a sibling package: exactly one
      # sdist and one wheel, both named for the package being released.
      - name: Check the artifacts are this package's, and only this package's
        run: |
          set -euo pipefail
          module="$(echo "${{ steps.resolve.outputs.package }}" | tr '-' '_')"
          version="${{ steps.resolve.outputs.version }}"
          ls -la dist/
          count="$(ls dist | wc -l)"
          if [ "$count" -ne 2 ]; then
            echo "::error::expected exactly one sdist and one wheel in dist/, found ${count}"
            exit 1
          fi
          test -f "dist/${module}-${version}.tar.gz"
          test -f "dist/${module}-${version}-py3-none-any.whl"

      - name: Check metadata
        run: uv run twine check dist/*

      # py.typed and the licence travel in the wheel or the package is broken for consumers
      # in ways no test in this repository would notice.
      - name: Check the wheel carries py.typed and the licence
        run: |
          set -euo pipefail
          module="$(echo "${{ steps.resolve.outputs.package }}" | tr '-' '_')"
          contents="$(unzip -Z1 dist/${module}-*.whl)"
          echo "$contents"
          echo "$contents" | grep -qx "${module}/py.typed"
          echo "$contents" | grep -q "\.dist-info/licenses/LICENSE"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ steps.resolve.outputs.package }}
          path: dist/

  # Installs the built wheel into a throwaway environment and uses it — proving the
  # artifact itself, deliberately with no registry involved.
  smoke:
    name: Install + use the built wheel
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ needs.build.outputs.package }}
          path: dist/

      # Resolves from the real index with NO local fallback — deliberately opposite of
      # tests.yml's copy of this gate. Stops a release whose dependency isn't published yet.
      - name: Install the wheel into a clean environment
        run: |
          set -euo pipefail
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          uv pip list --python /tmp/smoke/bin/python

      - name: Use it
        run: /tmp/smoke/bin/python scripts/smoke_install.py ${{ needs.build.outputs.package }}

  publish:
    name: Publish to ${{ needs.build.outputs.target }}
    needs: [build, smoke]
    runs-on: ubuntu-latest
    # Half of the trusted-publisher identity PyPI checks; must match what's registered
    # there. Also where a required reviewer can be configured.
    environment: ${{ needs.build.outputs.target }}
    permissions:
      # Mints the OIDC token that IS the credential. No secrets involved.
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ needs.build.outputs.package }}
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: ${{ needs.build.outputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          print-hash: true

      - name: Summary
        run: |
          {
            echo "### Published \`${{ needs.build.outputs.package }}\` ${{ needs.build.outputs.version }}"
            echo
            if [ "${{ needs.build.outputs.target }}" = "testpypi" ]; then
              echo "- https://test.pypi.org/project/${{ needs.build.outputs.package }}/${{ needs.build.outputs.version }}/"
              echo "- Install: \`pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ ${{ needs.build.outputs.package }}==${{ needs.build.outputs.version }}\`"
            else
              echo "- https://pypi.org/project/${{ needs.build.outputs.package }}/${{ needs.build.outputs.version }}/"
              echo "- Install: \`pip install ${{ needs.build.outputs.package }}==${{ needs.build.outputs.version }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Only reached by a hand-pushed tag: an automated release already has its Release, made by
  # release-please when its PR merged. See docs/maintainers.md for why that order is forced.
  release:
    name: Record the release
    needs: [build, publish]
    # Real releases only, however they were started. A TestPyPI run is a rehearsal, and a
    # rehearsal is not a release.
    if: needs.build.outputs.target == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      # Scoped to this job alone; every other job in this workflow stays read-only.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The changelog entry is the release notes; a missing section fails the job rather
      # than shipping a Release with no notes.
      - name: Extract the changelog section
        id: notes
        env:
          PACKAGE: ${{ needs.build.outputs.package }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          changelog="packages/${PACKAGE}/CHANGELOG.md"
          # From this version's heading up to (not including) the next one.
          section="$(awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' "$changelog")"
          if [ -z "$(echo "$section" | tr -d '[:space:]')" ]; then
            echo "::error::no '## [${VERSION}]' section in ${changelog} — add the entry before tagging"
            exit 1
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$section"
            echo "Install: \`pip install ${PACKAGE}==${VERSION}\`"
            echo "PyPI: https://pypi.org/project/${PACKAGE}/${VERSION}/"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # Idempotent on purpose: create the Release if this tag has none, and otherwise bring
      # its notes in line with the changelog rather than failing on the one that exists.
      - name: Record the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # Derived, not `github.ref_name`: this job also runs from a dispatch, where the ref
          # is whatever was dispatched. `--verify-tag` still refuses a tag that isn't there.
          TAG: ${{ needs.build.outputs.package }}-v${{ needs.build.outputs.version }}
          PACKAGE: ${{ needs.build.outputs.package }}
          VERSION: ${{ needs.build.outputs.version }}
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "${PACKAGE} ${VERSION}" --notes "$NOTES"
            echo "updated the existing release for ${TAG}"
          else
            gh release create "$TAG" \
              --title "${PACKAGE} ${VERSION}" \
              --notes "$NOTES" \
              --verify-tag
          fi
