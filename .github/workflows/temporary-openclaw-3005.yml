name: OpenClaw 3005 candidate proof
on:
  push:
    branches: [antsok-proof-openclaw-3005]
permissions:
  contents: read
jobs:
  openclaw-bicep:
    name: OpenClaw Gateway-to-Docker on native Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BICEP_IMAGE: ghcr.io/sokolaidev/maf-extensions/bicep-avm@sha256:b3f14b266052def3f7b5a7b6ca4fb38f06acdff0e99e7df2437dd4f0c6b0b82e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.5'
          python-version: '3.13.15'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.8.1'
      - name: Verify exact npm candidate metadata
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          with urllib.request.urlopen("https://registry.npmjs.org/openclaw/2026.11.10", timeout=30) as response:
              package = json.load(response)
          assert package["version"] == "2026.11.10"
          selected = {key: package[key] for key in ("name", "version", "engines", "dist")}
          text = "# Selected npm candidate\n\n\x60\x60\x60json\n" + json.dumps(selected, indent=2) + "\n\x60\x60\x60\n"
          (Path(os.environ["RUNNER_TEMP"]) / "openclaw-candidate.md").write_text(text)
          print(text)
          PY
      - name: Run the installed sample
        timeout-minutes: 18
        run: |
          uv run --no-project --python 3.13.15 samples/24_openclaw_bicep/agent.py \
            --output "$RUNNER_TEMP/openclaw-bicep-private"
      - name: Record bounded evidence and independently check owner scope
        if: always()
        run: |
          python3 scripts/report_openclaw_hosted.py --published --output "$RUNNER_TEMP/openclaw-bicep-evidence.md"
          cat "$RUNNER_TEMP/openclaw-bicep-evidence.md" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Record installed npm identity
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "openclaw-bicep-private/openclaw"
          metadata = root / "node_modules/openclaw/package.json"
          lock = root / "package-lock.json"
          observed = {"installed": metadata.exists(), "lock_exists": lock.exists()}
          if metadata.exists():
              package = json.loads(metadata.read_text())
              observed.update({key: package[key] for key in ("name", "version", "engines")})
          if lock.exists():
              observed["lock_sha256"] = hashlib.sha256(lock.read_bytes()).hexdigest()
              record = json.loads(lock.read_text())["packages"]["node_modules/openclaw"]
              observed["package"] = {key: record[key] for key in ("version", "resolved", "integrity")}
          text = "\n## Installed npm identity\n\n\x60\x60\x60json\n" + json.dumps(observed, indent=2) + "\n\x60\x60\x60\n"
          with (Path(os.environ["RUNNER_TEMP"]) / "openclaw-candidate.md").open("a") as target:
              target.write(text)
          print(text)
          PY
      - name: Retain bounded Markdown evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openclaw-bicep-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/openclaw-bicep-evidence.md
            ${{ runner.temp }}/openclaw-candidate.md
          if-no-files-found: error
          retention-days: 30

