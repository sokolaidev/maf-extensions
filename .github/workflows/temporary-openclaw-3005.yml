name: OpenClaw 3005 candidate proof
on:
  push:
    branches: [antsok-proof-openclaw-3005]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read retained bounded evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45919645274 --repo sokolaidev/maf-extensions --name openclaw-bicep-45919645274-1 --dir "$RUNNER_TEMP/prior"
          cat "$RUNNER_TEMP/prior/openclaw-bicep-evidence.md"
          sha256sum "$RUNNER_TEMP/prior/"*.md
