name: OpenClaw 3005 final tracker check
on:
  push:
    branches: [antsok-proof-openclaw-3005]
permissions:
  contents: read
jobs:
  trackers:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 785a3a1a15e5cf96009b73f5cfbe8de350fbd176
          persist-credentials: false
      - name: Verify documentation paths and promised issue closure
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: '3010'
        run: |
          python3 scripts/check_doc_paths.py
          python3 scripts/check_doc_trackers.py
