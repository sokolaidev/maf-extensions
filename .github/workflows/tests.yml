name: Package and Sandbox Validation

# The gate is sharded across parallel jobs, joined by the required
# `Python (pytest + ruff + pyright)` context. Docker live coverage runs after merge
# and daily in `docker-live.yml`; documentation checks live in `docs.yml`.
#
# **There are still no path filters on these triggers, and that is deliberate.** A
# workflow-level `paths-ignore` does not make a required check pass â€” it stops the workflow
# triggering, so the check never reports and the pull request is unmergeable for ever. Instead
# the `changes` job classifies the diff and the expensive steps skip on its verdict: the
# contexts still report, in seconds rather than minutes (#560). For the same reason no shard is
# skipped wholesale with a job-level `if:` â€” a genuine success is worth more than relying on a
# skipped job counting as one, and the join below refuses a shard that did not run.
on:
  push:
    branches: [main]
  pull_request:
    # `edited` is deliberately absent. It used to be here for one step â€” the release-order
    # report, which reads the pull request title â€” and every retitle then re-ran the whole
    # suite for a check that takes a second. That step lives in
    # `pr-title.yml` now, which already triggers on `edited` for the title checks proper.
    types: [opened, synchronize, reopened]
  # A bot-opened pull request does start this â€” and then stops at `action_required`, the
  # "Approve and run" gate, so the required check never reports until someone clears it.
  # Clearing it by hand is the only thing that does. Dispatching a second run here reports
  # the same contexts and leaves the held one blocking the merge anyway, which is why the
  # release workflow no longer tries (#196). This trigger is for re-running the suite at a
  # branch, not for that.
  workflow_dispatch:
    inputs:
      mxc_v1:
        description: 'MXC 1.0 spike: resolve dependency lock or qualify native migration'
        type: choice
        options: ['off', resolve-lock, qualify]
        default: 'off'
      mxc_recovery:
        description: "Qualify the experimental MXC checkpoint and host publication probes on KVM"
        type: boolean
        default: false
      mxc_durability:
        description: "Qualify format-4 native recovery on Linux KVM and Windows WHP"
        type: boolean
        default: false
      hyperlight_https:
        description: "Run Hyperlight HTTPS method conformance through a temporary public relay"
        type: boolean
        default: false

# Read-only by default: nothing here writes to the repository, and an unset block would
# inherit whatever the org default is (often write).
permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # One classification, read by every job below, so the rule lives in one place and is unit
  # tested rather than repeated as a shell pattern nobody can check.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff below needs the base commit, which a shallow clone does not have.
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Only a pull request has a base to diff against. A push to `main` and a manual
          # dispatch run everything, which is also what the script does with an empty diff.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA" HEAD |
            python3 scripts/changed_paths.py >> "$GITHUB_OUTPUT"

  # Repository and package tests have comparable measured work. Each gets its own
  # runner; pytest still discovers the whole suite before assigning every test.
  suite:
    name: Offline suite (${{ matrix.group }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [repository, packages]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        # Pinned to the commit v5 resolves to: a moving tag is a supply-chain hole, since
        # whoever can move it can run code in this workflow.
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Sync workspace
        if: needs.changes.outputs.code == 'true'
        # agent-framework-core resolves from PyPI at the released range â€” deliberately the
        # same artifact every consumer of the published wheels gets, not a git pin.
        #
        # `--locked` because a plain sync silently re-locks in the runner: a lockfile left
        # behind by a version bump would keep CI green and hand every contributor a dirty
        # tree on their first sync instead.
        run: uv sync --locked

      - name: Install Graphviz for draw.io layout tests
        if: needs.changes.outputs.code == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz

      - name: Tests
        if: needs.changes.outputs.code == 'true'
        env:
          OFFLINE_GROUP: ${{ matrix.group }}
        # Local `poe test` keeps running the complete suite serially.
        run: >-
          uv run python -m pytest -q -n auto -p scripts.offline_test_shards
          --offline-group "$OFFLINE_GROUP" --durations=40
          --junitxml="$RUNNER_TEMP/offline-suite.xml" -o junit_family=xunit1

      - name: Retain offline suite timings
        if: always() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-suite-timings-${{ matrix.group }}
          path: ${{ runner.temp }}/offline-suite.xml
          if-no-files-found: error
          retention-days: 14

  hyperlight-worker:
    name: Hyperlight worker safety (Windows)
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      MAF_HYPERLIGHT_LIVE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Sync workspace
        if: needs.changes.outputs.code == 'true'
        run: |
          uv sync --locked --python 3.13
          exit $LASTEXITCODE

      - name: Worker pipes, Windows jobs and lifecycle
        if: needs.changes.outputs.code == 'true'
        # Kernel job limits require Windows; these tests do not require nested virtualization.
        run: |
          uv run pytest -q packages/maf-sandbox-hyperlight/tests
          exit $LASTEXITCODE

  hyperlight-linux-worker:
    name: Hyperlight KVM and worker safety (Linux)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Sync workspace
        if: needs.changes.outputs.code == 'true'
        run: uv sync --locked --python 3.13

      - name: Check Hyperlight image dependency compatibility
        id: hyperlight-image
        if: needs.changes.outputs.code == 'true'
        run: uv run python scripts/check_hyperlight_image_compatibility.py >> "$GITHUB_OUTPUT"

      - name: Build and verify the Hyperlight runtime image
        if: needs.changes.outputs.code == 'true' && steps.hyperlight-image.outputs.build == 'true'
        run: uv run python scripts/build_hyperlight_aks_image.py --require-clean --output "$RUNNER_TEMP/hyperlight-image" --tag hyperlight-sandbox:ci

      - name: Retain Hyperlight image verification records
        if: needs.changes.outputs.code == 'true' && steps.hyperlight-image.outputs.build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hyperlight-image-verification
          path: |
            ${{ runner.temp }}/hyperlight-image/source.json
            ${{ runner.temp }}/hyperlight-image/build-inputs.json
            ${{ runner.temp }}/hyperlight-image/image-verification.json
          if-no-files-found: error
          retention-days: 14

      - name: Worker pipes, cgroups and lifetime
        if: needs.changes.outputs.code == 'true'
        # These real kernel checks require delegation, but no hypervisor.
        run: sudo python3 scripts/check_hyperlight_linux.py --python "$PWD/.venv/bin/python"

      - name: Prepare and record native KVM validation
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod g+rw /dev/kvm
          stat -c '%n %A %U:%G' /dev/kvm
          # The exact-host HTTP fixture binds port 80 as the unprivileged test owner.
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
          uv run python - <<'PY'
          import platform
          from importlib.metadata import version
          print("Distribution:", platform.freedesktop_os_release()["PRETTY_NAME"])
          print("Kernel:", platform.release())
          print("Architecture:", platform.machine())
          print("Host Python:", platform.python_version())
          for package in ("hyperlight-sandbox", "hyperlight-sandbox-backend-wasm", "hyperlight-sandbox-python-guest"):
              print(package + ":", version(package))
          PY

      - name: Real KVM guest conformance
        if: needs.changes.outputs.code == 'true'
        run: sudo python3 scripts/check_hyperlight_linux.py --live --python "$PWD/.venv/bin/python"

      - name: Download the pinned HTTPS test relay
        if: github.event_name == 'workflow_dispatch' && inputs.hyperlight_https
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/cloudflared" https://github.com/cloudflare/cloudflared/releases/download/2026.9.3/cloudflared-linux-amd64
          echo "77e26d8d900e0b8469f416239d14b5f296525fdf79fee6f511ef55609e3fbac2  $RUNNER_TEMP/cloudflared" | sha256sum --check
          chmod +x "$RUNNER_TEMP/cloudflared"

      - name: HTTPS method conformance on Linux KVM
        if: github.event_name == 'workflow_dispatch' && inputs.hyperlight_https
        run: |
          set -euo pipefail
          sudo env MAF_HYPERLIGHT_HTTPS_LIVE=1 MAF_HYPERLIGHT_CLOUDFLARED="$RUNNER_TEMP/cloudflared" python3 scripts/check_hyperlight_linux.py --live --python "$PWD/.venv/bin/python" -- -q -s packages/maf-sandbox-hyperlight/tests/test_hyperlight_https_live.py

      - name: CodeAct artifact delivery on Linux KVM
        if: needs.changes.outputs.code == 'true'
        run: sudo python3 scripts/check_hyperlight_linux.py --live --python "$PWD/.venv/bin/python" -- -q tests/test_hyperlight_codeact.py

      - name: CodeAct sample on Linux KVM
        if: needs.changes.outputs.code == 'true'
        run: sudo python3 scripts/check_hyperlight_linux.py --live --python "$PWD/.venv/bin/python" -- -q tests/test_sample_hyperlight_acas_live.py

  mxc-recovery:
    name: MXC checkpoint and publication (Linux KVM)
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_recovery
        with:
          persist-credentials: false

      - name: Require KVM and build prerequisites
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_recovery
        run: |
          set -euo pipefail
          test -c /dev/kvm
          printf 'KERNEL=="kvm", OWNER="%s", MODE="0600"\n' "$(id -un)" | sudo tee /etc/udev/rules.d/99-mxc-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm
          df -h "$RUNNER_TEMP"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/mxc/target" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libclang-dev
          rustup toolchain install 1.98.0 --profile minimal

      - name: Apply pinned MXC patch and build probe
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_recovery
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mxc"
          git clone --no-checkout https://github.com/microsoft/mxc.git "$RUNNER_TEMP/mxc/source"
          git -C "$RUNNER_TEMP/mxc/source" checkout 86fb3d2abaf9c431556692037bff881830b543a5
          python3 scripts/experiments/mxc_session_patch/patch.py apply --source "$RUNNER_TEMP/mxc/source"
          python3 scripts/experiments/mxc_session_patch/patch.py configure --source "$RUNNER_TEMP/mxc/source" --build-dir "$RUNNER_TEMP/mxc/build"
          cargo +1.98.0 test --locked --manifest-path "$RUNNER_TEMP/mxc/build/Cargo.toml"
          cargo +1.98.0 build --locked --manifest-path "$RUNNER_TEMP/mxc/build/Cargo.toml"
          "$CARGO_TARGET_DIR/debug/mxc-session-state-probe" --help

      - name: Prepare verified agent rootfs
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_recovery
        run: python3 scripts/experiments/mxc_session_patch/prepare_agent.py --destination "$RUNNER_TEMP/mxc/images/agent"

      - name: Native state and restart controls
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_recovery
        run: |
          set -euo pipefail
          python3 scripts/experiments/mxc_native_state_probe.py --helper "$CARGO_TARGET_DIR/debug/mxc-session-state-probe" --initrd "$RUNNER_TEMP/mxc/images/agent/initrd.cpio" --image-home "$RUNNER_TEMP/mxc/images" --state-dir "$RUNNER_TEMP/mxc/native"

      - name: Atomic publication and lost acknowledgments
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_recovery
        run: |
          set -euo pipefail
          python3 scripts/experiments/mxc_session_patch/host_probe.py --helper "$CARGO_TARGET_DIR/debug/mxc-session-state-probe" --startup "$RUNNER_TEMP/mxc/images/agent/snapshot" --state-dir "$RUNNER_TEMP/mxc/publication"

      - name: Native owner death and cancellation
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_recovery
        run: python3 scripts/experiments/mxc_session_patch/owner_probe.py --helper "$CARGO_TARGET_DIR/debug/mxc-session-state-probe" --startup "$RUNNER_TEMP/mxc/images/agent/snapshot" --state-dir "$RUNNER_TEMP/mxc/ownership"

      - name: Descriptor output alternatives and console truncation
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_recovery
        run: python3 scripts/experiments/mxc_session_patch/descriptor_probe.py --helper "$CARGO_TARGET_DIR/debug/mxc-session-state-probe" --startup "$RUNNER_TEMP/mxc/images/agent/snapshot" --state-dir "$RUNNER_TEMP/mxc/descriptors"

      - name: Apply bounded-output overlay and qualify truncation recovery
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_recovery
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/hyperlight-dev/hyperlight-unikraft.git "$RUNNER_TEMP/mxc/runtime"
          git -C "$RUNNER_TEMP/mxc/runtime" checkout 2b4790d1626e2645dd1f00469311424be8cb2f94
          python3 scripts/experiments/mxc_session_patch/output_patch.py apply --source "$RUNNER_TEMP/mxc/source" --runtime "$RUNNER_TEMP/mxc/runtime"
          python3 scripts/experiments/mxc_session_patch/output_patch.py configure --source "$RUNNER_TEMP/mxc/source" --runtime "$RUNNER_TEMP/mxc/runtime" --build-dir "$RUNNER_TEMP/mxc/bounded-build"
          rustc +1.98.0 --edition 2024 --test "$RUNNER_TEMP/mxc/runtime/src/output_capture.rs" -o "$RUNNER_TEMP/mxc/capture-tests"
          "$RUNNER_TEMP/mxc/capture-tests"
          cargo +1.98.0 test --locked --manifest-path "$RUNNER_TEMP/mxc/bounded-build/Cargo.toml"
          cargo +1.98.0 build --locked --manifest-path "$RUNNER_TEMP/mxc/bounded-build/Cargo.toml"
          python3 scripts/experiments/mxc_session_patch/bounded_probe.py --helper "$CARGO_TARGET_DIR/debug/mxc-session-state-probe" --startup "$RUNNER_TEMP/mxc/images/agent/snapshot" --state-dir "$RUNNER_TEMP/mxc/bounded"
          git clone --no-checkout https://github.com/hyperlight-dev/hyperlight.git "$RUNNER_TEMP/mxc/host"
          git -C "$RUNNER_TEMP/mxc/host" checkout 388ea8ebd88639a062f7a87f477db2930605a307
          python3 scripts/experiments/mxc_session_patch/storage_patch.py apply --source "$RUNNER_TEMP/mxc/source" --runtime "$RUNNER_TEMP/mxc/runtime" --host "$RUNNER_TEMP/mxc/host"
          python3 scripts/experiments/mxc_session_patch/storage_patch.py configure --source "$RUNNER_TEMP/mxc/source" --runtime "$RUNNER_TEMP/mxc/runtime" --host "$RUNNER_TEMP/mxc/host" --build-dir "$RUNNER_TEMP/mxc/storage-build"
          rustc +1.98.0 --edition 2024 --test "$RUNNER_TEMP/mxc/host/src/hyperlight_host/src/sandbox/snapshot/file/write_budget.rs" -o "$RUNNER_TEMP/mxc/storage-budget-tests"
          "$RUNNER_TEMP/mxc/storage-budget-tests"
          cargo +1.98.0 test --locked --manifest-path "$RUNNER_TEMP/mxc/storage-build/Cargo.toml"
          cargo +1.98.0 build --locked --manifest-path "$RUNNER_TEMP/mxc/storage-build/Cargo.toml"
          python3 -m scripts.experiments.mxc_session_patch.storage_probe --helper "$CARGO_TARGET_DIR/debug/mxc-session-state-probe" --startup "$RUNNER_TEMP/mxc/images/agent/snapshot" --state-dir "$RUNNER_TEMP/mxc/storage"
          python3 scripts/experiments/mxc_session_patch/storage_patch.py remove --source "$RUNNER_TEMP/mxc/source" --runtime "$RUNNER_TEMP/mxc/runtime" --host "$RUNNER_TEMP/mxc/host"
          python3 scripts/experiments/mxc_session_patch/storage_patch.py check --source "$RUNNER_TEMP/mxc/source" --runtime "$RUNNER_TEMP/mxc/runtime" --host "$RUNNER_TEMP/mxc/host"
          python3 scripts/experiments/mxc_session_patch/output_patch.py remove --source "$RUNNER_TEMP/mxc/source" --runtime "$RUNNER_TEMP/mxc/runtime"
          python3 scripts/experiments/mxc_session_patch/output_patch.py check --source "$RUNNER_TEMP/mxc/source" --runtime "$RUNNER_TEMP/mxc/runtime"
          python3 scripts/experiments/mxc_session_patch/patch.py check --source "$RUNNER_TEMP/mxc/source"

      - name: Verify both reports and record artifact identity
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_recovery
        run: |
          python3 - <<'PY'
          import hashlib, json, os, platform
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "mxc"
          native = json.loads((root / "native/result.json").read_text())
          publication = json.loads((root / "publication/result.json").read_text())
          assert native["seed_killed_after_save"] and native["snapshot_unchanged_after_restore"]
          assert native["refusals"] == dict.fromkeys(("truncated_index", "missing_blobs", "incompatible_key"), 1)
          for key in ("commit_barrier", "continuity", "fresh_control", "post_snapshot_mutation", "snapshot_saved", "stale_token_refused"):
              assert native["seed"][key] is True
          for key in ("close_refused_execution", "failed_capture_retired", "guest_failure_retired", "restored_state_verified", "timeout_retired"):
              assert native["restore"][key] is True
          assert publication["before_commit_keeps_previous_checkpoint"]
          assert publication["interrupted_call_refuses_replay"]
          assert publication["committed_result_redelivery_without_execution"] == {"after_commit": True, "before_ack": True}
          assert publication["csv_to_chart"] and publication["artifact_redelivery_identical"]
          ownership = json.loads((root / "ownership/result.json").read_text())
          assert {key: value["exit_code"] for key, value in ownership["controls"].items()} == {"owner_death": 74, "cancel": 74, "invalid_command": 75, "missing_owner": 74, "invalid_header": 75}
          assert native["helper_sha256"] == publication["helper_sha256"] == ownership["helper_sha256"]
          descriptors = json.loads((root / "descriptors/result.json").read_text())
          assert descriptors["helper_sha256"] == native["helper_sha256"]
          assert descriptors["assessment"]["satisfies_host_enforced_output_contract"] is False
          bounded = json.loads((root / "bounded/result.json").read_text())
          assert bounded["lost_ack_redelivery_identical"] and bounded["checkpoint_after_truncation"]
          assert bounded["guest_failure_and_timeout_refuse_publication"]
          storage = json.loads((root / "storage/result.json").read_text())
          for key in ("same_machine_restart_replay", "failed_exports_preserve_checkpoint", "interrupted_calls_refuse_reexecution", "scratch_reclaimed", "collected_checkpoint_preserves_delivery"):
              assert storage[key] is True
          record = {
              "storage_helper_sha256": storage["helper_sha256"], "bounded_storage_passed": True,
              "storage_overlay_sha256": hashlib.sha256(Path("scripts/experiments/mxc_session_patch/storage-patch.json").read_bytes()).hexdigest(),
              "source_commit": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"], "kernel": platform.release(),
              "architecture": platform.machine(), "host_python": platform.python_version(),
              "mxc_base": "86fb3d2abaf9c431556692037bff881830b543a5",
              "patch_sha256": hashlib.sha256(Path("scripts/experiments/mxc_session_patch/session-preview.patch").read_bytes()).hexdigest(),
              "bounded_helper_sha256": bounded["helper_sha256"], "bounded_output_passed": True,
              "output_overlay_sha256": hashlib.sha256(Path("scripts/experiments/mxc_session_patch/output-patch.json").read_bytes()).hexdigest(),
              "helper_sha256": native["helper_sha256"], "native_passed": True, "publication_passed": True, "ownership_passed": True, "descriptor_experiment_completed": True,
          }
          (root / "identity.json").write_text(json.dumps(record, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("MXC native recovery and atomic host publication passed on Linux/KVM.\n")
          PY

      - name: Record final KVM device access
        if: always() && (github.event_name == 'workflow_dispatch' && inputs.mxc_recovery)
        run: |
          id
          stat /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Retain MXC reports and diagnostics
        if: always() && (github.event_name == 'workflow_dispatch' && inputs.mxc_recovery)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mxc-linux-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mxc/identity.json
            ${{ runner.temp }}/mxc/native/*.json
            ${{ runner.temp }}/mxc/native/*.stdout
            ${{ runner.temp }}/mxc/native/*.stderr
            ${{ runner.temp }}/mxc/publication/*.json
            ${{ runner.temp }}/mxc/publication/*.log
            ${{ runner.temp }}/mxc/ownership/*.json
            ${{ runner.temp }}/mxc/ownership/*.stdout
            ${{ runner.temp }}/mxc/ownership/*.stderr
            ${{ runner.temp }}/mxc/descriptors/*.json
            ${{ runner.temp }}/mxc/descriptors/*.stdout
            ${{ runner.temp }}/mxc/descriptors/*.stderr
            ${{ runner.temp }}/mxc/bounded/*.json
            ${{ runner.temp }}/mxc/bounded/*.log
            ${{ runner.temp }}/mxc/storage/result.json
          if-no-files-found: error
          retention-days: 14


  mxc-durability:
    name: MXC format-4 durability (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - if: github.event_name == 'workflow_dispatch' && inputs.mxc_durability
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name == 'workflow_dispatch' && inputs.mxc_durability
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Permit runner-owned KVM access
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_durability && runner.os == 'Linux'
        run: |
          set -euo pipefail
          test -c /dev/kvm
          printf 'KERNEL=="kvm", OWNER="%s", MODE="0600"\n' "$(id -un)" | sudo tee /etc/udev/rules.d/99-mxc-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm
      - name: Require the native hypervisor
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_durability
        shell: bash
        run: uv run --no-project --python 3.12 python -m scripts.experiments.mxc_session_patch.qualification_runner --preflight --root "$RUNNER_TEMP/mxc-format4"
      - name: Install Linux build prerequisites
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_durability && runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libclang-dev
      - name: Install pinned Rust toolchain
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_durability
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Build and qualify native format-4 recovery
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_durability
        shell: bash
        run: uv run --no-project --python 3.12 python -m scripts.experiments.mxc_session_patch.qualification_runner --root "$RUNNER_TEMP/mxc-format4"
      - name: Retain qualification reports and logs
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mxc_durability
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mxc-format4-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mxc-format4/*.json
            ${{ runner.temp }}/mxc-format4/*.log
            ${{ runner.temp }}/mxc-format4/native/*.json
            ${{ runner.temp }}/mxc-format4/native/*.stdout
            ${{ runner.temp }}/mxc-format4/native/*.stderr
            ${{ runner.temp }}/mxc-format4/durability_probe/*.log
            ${{ runner.temp }}/mxc-format4/durability_probe/quota-*/*.log
            ${{ runner.temp }}/mxc-format4/durability_probe/result.json
            ${{ runner.temp }}/mxc-format4/storage_probe/result.json
          if-no-files-found: error
          retention-days: 14

  mxc-v1:
    name: MXC 1.0 migration (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - if: github.event_name == 'workflow_dispatch' && inputs.mxc_v1 != 'off'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name == 'workflow_dispatch' && inputs.mxc_v1 != 'off'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Permit runner-owned KVM access
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_v1 != 'off' && runner.os == 'Linux'
        run: |
          set -euo pipefail
          test -c /dev/kvm
          printf 'KERNEL=="kvm", OWNER="%s", MODE="0600"\n' "$(id -un)" | sudo tee /etc/udev/rules.d/99-mxc-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install Linux build prerequisites
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_v1 != 'off' && runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libclang-dev
      - name: Install pinned Rust toolchain
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_v1 != 'off'
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Build and qualify the MXC 1.0 migration
        if: github.event_name == 'workflow_dispatch' && inputs.mxc_v1 != 'off'
        shell: bash
        env:
          MXC_V1_MODE: ${{ inputs.mxc_v1 }}
        run: uv run --no-project --python 3.12 python -m scripts.experiments.mxc_v1_patch.qualification_runner --root "$RUNNER_TEMP/mxc-v1" --mode "$MXC_V1_MODE"
      - name: Retain qualification reports and logs
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mxc_v1 != 'off'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mxc-v1-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mxc-v1/*.json
            ${{ runner.temp }}/mxc-v1/*.log
            ${{ runner.temp }}/mxc-v1/build/Cargo.lock
            ${{ runner.temp }}/mxc-v1/bounded_probe/result.json
            ${{ runner.temp }}/mxc-v1/baseline/*.log
            ${{ runner.temp }}/mxc-v1/baseline/native/*.json
            ${{ runner.temp }}/mxc-v1/baseline/native/*.stderr
            ${{ runner.temp }}/mxc-v1/native/*.json
            ${{ runner.temp }}/mxc-v1/native/*.stdout
            ${{ runner.temp }}/mxc-v1/native/*.stderr
            ${{ runner.temp }}/mxc-v1/durability_probe/*.log
            ${{ runner.temp }}/mxc-v1/durability_probe/quota-*/*.log
            ${{ runner.temp }}/mxc-v1/durability_probe/result.json
            ${{ runner.temp }}/mxc-v1/storage_probe/result.json
          if-no-files-found: error
          retention-days: 14

  # Lint, format and the commit-msg tier: seconds in total, and a first answer while the
  # heavier shards are still installing.
  fast:
    name: Lint, format & commit-msg
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Sync workspace
        if: needs.changes.outputs.code == 'true'
        run: uv sync --locked

      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: uv run ruff check .

      - name: Format
        if: needs.changes.outputs.code == 'true'
        run: uv run ruff format --check .

      - name: Commas in collection literals
        if: needs.changes.outputs.code == 'true'
        # In this job rather than the suite that also runs it: two literals a reader would
        # restore a comma into are worth reporting in the seconds this job takes, not at the
        # end of the offline shard.
        run: uv run python scripts/check_implicit_concatenation.py

      - name: Pre-commit (commit-msg stage)
        if: needs.changes.outputs.code == 'true'
        # The commit-msg guard against a clean fixture message, so the stage's entry and
        # arguments are exercised through pre-commit the way an installed hook drives it.
        run: |
          printf 'ci: a fixture message for the commit-msg stage\n' > "$RUNNER_TEMP/ci-commit-msg"
          uv run pre-commit run --hook-stage commit-msg --commit-msg-filename "$RUNNER_TEMP/ci-commit-msg" no-origin-identifiers-msg

  # Both pre-commit tiers, driven through the framework the way a developer's commit and push
  # drive them. The pre-push tier runs the same pyright commands the `types` shard runs raw;
  # that duplication is the wiring guard (a hook whose entry rotted passes there and fails
  # here), and running the two shards side by side is what makes it cost no wall-clock.
  pre-commit:
    name: Pre-commit tiers
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Sync workspace
        if: needs.changes.outputs.code == 'true'
        run: uv sync --locked

      - name: Pre-commit (whole tree)
        if: needs.changes.outputs.code == 'true'
        # The pre-commit tier as a whole tree; no `--hook-stage` filter, so pre-commit uses
        # its default stage. A hook whose `stages` were dropped would run here, which is how
        # the wiring is caught (the suite's config test pins it too).
        env:
          # `main` is checked out as a local branch here, so the branch guard â€” a local
          # hook that keeps a commit on the protected branch â€” would fail the run.
          SKIP: no-commit-to-branch
        run: uv run pre-commit run --all-files

      - name: Pre-commit (pre-push stage, whole tree)
        if: needs.changes.outputs.code == 'true'
        # The whole tier through pre-commit, the way a developer's push runs it, so the
        # hooks' entries and arguments are exercised end to end; the `types` shard runs the
        # same pyright commands raw, outside the framework.
        run: uv run pre-commit run --hook-stage pre-push --all-files

  # The two raw pyright passes, outside pre-commit.
  types:
    name: Types (pyright)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Sync workspace
        if: needs.changes.outputs.code == 'true'
        run: uv sync --locked

      - name: Types (per-package strict configs)
        if: needs.changes.outputs.code == 'true'
        # One discovery implementation: the same `packages_with_pyright()` the local gate and
        # `tests/test_pr_gate_enumerates.py` use, run as a CLI so CI never re-parses the TOML
        # with a grep of its own. Enumerated rather than listed so a seventh package is
        # type-checked on the commit that adds it (#450).
        run: uv run python scripts/gate_tasks.py pyright-packages

      - name: Types (scripts, tests & samples)
        if: needs.changes.outputs.code == 'true'
        # scripts/, the test trees and samples/ belong to no package, so the per-package strict
        # pyright above does not see them. The root [tool.pyright] in pyproject.toml drives this
        # pass: scripts/ stays at full standard (it sits under no execution environment), and each
        # test tree is one that relaxes the four loose-fake rules to warnings so intentional fakes
        # do not block. The two InMemoryStoreâ†’AgentFileStore duck-types in smoke_install.py are
        # suppressed inline; everything outside those four rules is real drift. samples/ relaxes
        # nothing and suppresses inline instead â€” pyproject.toml says why (#334).
        run: uv run pyright

  # Wheel validation and sample compatibility run alongside dependent compatibility.
  packaging:
    name: Packaging & sample compatibility
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `check_core_against_dependents` recovers a published version's tests from its
          # release tag, which a shallow clone does not carry.
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Sync workspace
        if: needs.changes.outputs.code == 'true'
        run: uv sync --locked

      - name: Build + metadata check
        if: needs.changes.outputs.code == 'true'
        # Enumerated: the directory basename is the distribution name â€” an invariant
        # test_release_config.py pins â€” so a new package builds on the commit that adds it.
        run: |
          set -euo pipefail
          for package in packages/*/; do
            uv build --package "$(basename "$package")"
          done
          uv run twine check dist/*

      # `--find-links dist/` resolves intra-family deps against the wheels just built, not
      # PyPI â€” deliberately opposite of publish-packages.yml's copy of this gate.
      # The core this checkout built, named once. A dependent floored on the release this
      # branch cuts resolves against neither the index nor `dist/`, where the core still
      # carries its pre-bump version, so the steps below are handed it directly. The loop
      # bodies may not name a package (#450), which is why this is its own step.
      - name: Pin the core this checkout built
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          wheel="$(ls dist/maf_sandbox-*.whl)"
          override="$RUNNER_TEMP/core-override.txt"
          echo "maf-sandbox @ file://$(readlink -f "$wheel")" > "$override"
          echo "CORE_WHEEL=$wheel" >> "$GITHUB_ENV"
          echo "CORE_OVERRIDE=$override" >> "$GITHUB_ENV"

      - name: Install + use each wheel in a clean environment
        if: needs.changes.outputs.code == 'true'
        # The core is overridden to the one this checkout built. A dependent whose floor waits
        # on the release this branch cuts cannot resolve against the index or against `dist/`,
        # where the core still carries its pre-bump version â€” and what this step asks is
        # whether the wheel installs and works, not whether that number exists yet. Pairing
        # against a *published* core is the published-cores gate's question, and the upload is
        # checked without any of this.
        run: |
          set -euo pipefail
          for package_dir in packages/*/; do
            package="$(basename "$package_dir")"
            module="${package//-/_}"
            venv="/tmp/smoke-${package}"
            uv venv "$venv"
            uv pip install --python "$venv/bin/python" --find-links dist/ \
              --overrides "$CORE_OVERRIDE" dist/${module}-*.whl
            "$venv/bin/python" scripts/smoke_install.py "$package"
          done

      # Every wheel the build step produced, installed into one environment. The samples take
      # several of these together, so a range that moved past a *sibling* rather than past the
      # index leaves the family unresolvable â€” which no per-package check can see (#628).
      - name: The suite installs as a set
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          python3 scripts/check_suite_installs_together.py --whole-set --local-core

      # The same question asked of `samples/`, which declares a PEP 723 block rather than a
      # range and so is reached by no gate above (#725).
      #
      # `--local-core` on the same terms as the dependent checks, and it substitutes every wheel
      # `dist/` holds rather than the core alone. Passing it unconditionally means the second
      # refusal â€” a floor no published core satisfies â€” is not reachable here; a Release PR
      # merged and never published is `report_stuck_releases.py`'s signal, not this one's.
      # docs/release-compatibility.md carries both, and `poe sample-floors` is the flagless run.
      - name: Each sample against the core its own block names
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          python3 scripts/check_samples_against_declared_core.py --local-core "$CORE_WHEEL"

  # Each shard builds all siblings for the local-core fallback. Building locally avoids
  # an artifact-transfer dependency before compatibility checks can start.
  published-cores:
    name: Published-core compatibility (${{ matrix.shard }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Sync workspace
        if: needs.changes.outputs.code == 'true'
        run: uv sync --locked

      - name: Build every wheel for compatibility checks
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          for package in packages/*/; do
            uv build --package "$(basename "$package")"
          done

      # The checker still tests every admitted published core. Only when none is
      # admitted does it use the local core; the upload gate keeps refusing that case.
      - name: Each dependent against the published cores it admits
        if: needs.changes.outputs.code == 'true'
        env:
          SHARD_INDEX: ${{ strategy.job-index }}
          SHARD_COUNT: ${{ strategy.job-total }}
        run: >-
          python3 scripts/run_published_core_shard.py
          --shard "$SHARD_INDEX" --shards "$SHARD_COUNT"

  # The required aggregate context runs no checks of its own: it fails unless every
  # shard above succeeded.
  #
  # `always()` so this reports on a shard that failed or was cancelled â€” without it the join is
  # skipped, and a skipped required check never reports, which is the unmergeable-for-ever
  # state the trigger comment above describes. `success` is the only result accepted: a
  # `skipped` shard is refused too, because the shards skip *steps* on the `changes` verdict
  # and never themselves, so a skipped shard means something went wrong with the graph.
  tests:
    name: Python (pytest + ruff + pyright)
    needs: [changes, suite, hyperlight-worker, hyperlight-linux-worker, mxc-recovery, mxc-durability, mxc-v1, fast, pre-commit, types, packaging, published-cores]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "shard results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a shard of this gate did not succeed: $RESULTS"
              exit 1
            fi
          done
          echo "every shard succeeded"
