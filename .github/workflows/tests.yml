name: Tests

# The gate for every push and PR. The hermetic work is sharded across five jobs that run at
# once — fast gates, the offline suite, the pre-commit tiers, the type checks, and packaging —
# and `Python (pytest + ruff + pyright)` is now the join that reports their verdict as one
# required check. `docker-e2e` is the one integration suite, real containers on the runner's
# Docker daemon, kept separate so its distinct failure surface does not muddy the deterministic
# checks. The documentation checks live in `docs.yml`.
#
# **The shards are an implementation detail; the two required contexts are not.** `main`
# requires exactly `Python (pytest + ruff + pyright)` and `Docker backend live tests`. Keeping
# the join's name identical to the old single job is what lets the shards be renamed, split
# further or merged again without touching the branch ruleset — and what stops a rename here
# from making every open pull request unmergeable against a context that no longer reports.
#
# **There are still no path filters on these triggers, and that is deliberate.** A
# workflow-level `paths-ignore` does not make a required check pass — it stops the workflow
# triggering, so the check never reports and the pull request is unmergeable for ever. Instead
# the `changes` job classifies the diff and the expensive steps skip on its verdict: the
# contexts still report, in seconds rather than minutes (#560). For the same reason no shard is
# skipped wholesale with a job-level `if:` — a genuine success is worth more than relying on a
# skipped job counting as one, and the join below refuses a shard that did not run.
on:
  push:
    branches: [main]
  pull_request:
    # `edited` is deliberately absent. It used to be here for one step — the release-order
    # report, which reads the pull request title — and every retitle then re-ran the whole
    # suite and the Docker e2e for a check that takes a second. That step lives in
    # `pr-title.yml` now, which already triggers on `edited` for the title checks proper.
    types: [opened, synchronize, reopened]
  # A bot-opened pull request does start this — and then stops at `action_required`, the
  # "Approve and run" gate, so the required check never reports until someone clears it.
  # Clearing it by hand is the only thing that does. Dispatching a second run here reports
  # the same contexts and leaves the held one blocking the merge anyway, which is why the
  # release workflow no longer tries (#196). This trigger is for re-running the suite at a
  # branch, not for that.
  workflow_dispatch:

# Read-only by default: nothing here writes to the repository, and an unset block would
# inherit whatever the org default is (often write).
permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # One classification, read by every job below, so the rule lives in one place and is unit
  # tested rather than written six times as a shell pattern nobody can check.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The diff below needs the base commit, which a shallow clone does not have.
          fetch-depth: 0

      - name: Classify the changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Only a pull request has a base to diff against. A push to `main` and a manual
          # dispatch run everything, which is also what the script does with an empty diff.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA" HEAD |
            python3 scripts/changed_paths.py >> "$GITHUB_OUTPUT"

  # The offline suite. The long pole of the gate, so it shares its runner with nothing:
  # `-n auto` already saturates the CPUs, and a second workload here would slow it down.
  suite:
    name: Offline suite
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        # Pinned to the commit v5 resolves to: a moving tag is a supply-chain hole, since
        # whoever can move it can run code in this workflow.
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Sync workspace
        if: needs.changes.outputs.code == 'true'
        # agent-framework-core resolves from PyPI at the released range — deliberately the
        # same artifact every consumer of the published wheels gets, not a git pin.
        #
        # `--locked` because a plain sync silently re-locks in the runner: a lockfile left
        # behind by a version bump would keep CI green and hand every contributor a dirty
        # tree on their first sync instead.
        run: uv sync --locked

      - name: Tests
        if: needs.changes.outputs.code == 'true'
        # One worker per runner CPU: 74s to 37s here, and eight measured no better than four.
        # `poe test` stays serial, so an order-dependent test reds here rather than locally.
        run: uv run pytest -q -n auto

  # Lint, format and the commit-msg tier: seconds in total, and a first answer while the
  # heavier shards are still installing.
  fast:
    name: Lint, format & commit-msg
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Sync workspace
        if: needs.changes.outputs.code == 'true'
        run: uv sync --locked

      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: uv run ruff check .

      - name: Format
        if: needs.changes.outputs.code == 'true'
        run: uv run ruff format --check .

      - name: Pre-commit (commit-msg stage)
        if: needs.changes.outputs.code == 'true'
        # The commit-msg guard against a clean fixture message, so the stage's entry and
        # arguments are exercised through pre-commit the way an installed hook drives it.
        run: |
          printf 'ci: a fixture message for the commit-msg stage\n' > "$RUNNER_TEMP/ci-commit-msg"
          uv run pre-commit run --hook-stage commit-msg --commit-msg-filename "$RUNNER_TEMP/ci-commit-msg" no-origin-identifiers-msg

  # Both pre-commit tiers, driven through the framework the way a developer's commit and push
  # drive them. The pre-push tier runs the same pyright commands the `types` shard runs raw;
  # that duplication is the wiring guard (a hook whose entry rotted passes there and fails
  # here), and running the two shards side by side is what makes it cost no wall-clock.
  pre-commit:
    name: Pre-commit tiers
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Sync workspace
        if: needs.changes.outputs.code == 'true'
        run: uv sync --locked

      - name: Pre-commit (whole tree)
        if: needs.changes.outputs.code == 'true'
        # The pre-commit tier as a whole tree; no `--hook-stage` filter, so pre-commit uses
        # its default stage. A hook whose `stages` were dropped would run here, which is how
        # the wiring is caught (the suite's config test pins it too).
        env:
          # `main` is checked out as a local branch here, so the branch guard — a local
          # hook that keeps a commit on the protected branch — would fail the run.
          SKIP: no-commit-to-branch
        run: uv run pre-commit run --all-files

      - name: Pre-commit (pre-push stage, whole tree)
        if: needs.changes.outputs.code == 'true'
        # The whole tier through pre-commit, the way a developer's push runs it, so the
        # hooks' entries and arguments are exercised end to end; the `types` shard runs the
        # same pyright commands raw, outside the framework.
        run: uv run pre-commit run --hook-stage pre-push --all-files

  # The two raw pyright passes, outside pre-commit.
  types:
    name: Types (pyright)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Sync workspace
        if: needs.changes.outputs.code == 'true'
        run: uv sync --locked

      - name: Types (per-package strict configs)
        if: needs.changes.outputs.code == 'true'
        # One discovery implementation: the same `packages_with_pyright()` the local gate and
        # `tests/test_pr_gate_enumerates.py` use, run as a CLI so CI never re-parses the TOML
        # with a grep of its own. Enumerated rather than listed so a seventh package is
        # type-checked on the commit that adds it (#450).
        run: uv run python scripts/gate_tasks.py pyright-packages

      - name: Types (scripts, tests & samples)
        if: needs.changes.outputs.code == 'true'
        # scripts/, the test trees and samples/ belong to no package, so the per-package strict
        # pyright above does not see them. The root [tool.pyright] in pyproject.toml drives this
        # pass: scripts/ stays at full standard (it sits under no execution environment), and each
        # test tree is one that relaxes the four loose-fake rules to warnings so intentional fakes
        # do not block. The two InMemoryStore→AgentFileStore duck-types in smoke_install.py are
        # suppressed inline; everything outside those four rules is real drift. samples/ relaxes
        # nothing and suppresses inline instead — pyproject.toml says why (#334).
        run: uv run pyright

  # Everything that builds a wheel or reads the index. Its own shard because its failures are
  # a different class from the rest of this workflow: the last two steps read PyPI, so a red
  # here can be the *index's* state rather than this diff's — the same reasoning that keeps
  # `docker-e2e` separate. A packaging red should not read as "pytest failed".
  packaging:
    name: Packaging & published-index checks
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # `check_core_against_dependents` recovers a published version's tests from its
          # release tag, which a shallow clone does not carry.
          fetch-depth: 0

      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Sync workspace
        if: needs.changes.outputs.code == 'true'
        run: uv sync --locked

      - name: Build + metadata check
        if: needs.changes.outputs.code == 'true'
        # Enumerated: the directory basename is the distribution name — an invariant
        # test_release_config.py pins — so a new package builds on the commit that adds it.
        run: |
          set -euo pipefail
          for package in packages/*/; do
            uv build --package "$(basename "$package")"
          done
          uv run twine check dist/*

      # `--find-links dist/` resolves intra-family deps against the wheels just built, not
      # PyPI — deliberately opposite of publish-packages.yml's copy of this gate.
      # The core this checkout built, named once. A dependent floored on the release this
      # branch cuts resolves against neither the index nor `dist/`, where the core still
      # carries its pre-bump version, so the steps below are handed it directly. The loop
      # bodies may not name a package (#450), which is why this is its own step.
      - name: Pin the core this checkout built
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          wheel="$(ls dist/maf_sandbox-*.whl)"
          override="$RUNNER_TEMP/core-override.txt"
          echo "maf-sandbox @ file://$(readlink -f "$wheel")" > "$override"
          echo "CORE_WHEEL=$wheel" >> "$GITHUB_ENV"
          echo "CORE_OVERRIDE=$override" >> "$GITHUB_ENV"

      - name: Install + use each wheel in a clean environment
        if: needs.changes.outputs.code == 'true'
        # The core is overridden to the one this checkout built. A dependent whose floor waits
        # on the release this branch cuts cannot resolve against the index or against `dist/`,
        # where the core still carries its pre-bump version — and what this step asks is
        # whether the wheel installs and works, not whether that number exists yet. Pairing
        # against a *published* core is the published-cores gate's question, and the upload is
        # checked without any of this.
        run: |
          set -euo pipefail
          for package_dir in packages/*/; do
            package="$(basename "$package_dir")"
            module="${package//-/_}"
            venv="/tmp/smoke-${package}"
            uv venv "$venv"
            uv pip install --python "$venv/bin/python" --find-links dist/ \
              --overrides "$CORE_OVERRIDE" dist/${module}-*.whl
            "$venv/bin/python" scripts/smoke_install.py "$package"
          done

      # Every wheel the build step produced, installed into one environment. The samples take
      # several of these together, so a range that moved past a *sibling* rather than past the
      # index leaves the family unresolvable — which no per-package check can see (#628).
      - name: The suite installs as a set
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          python3 scripts/check_suite_installs_together.py --whole-set --local-core

      # The gate publish-packages.yml runs before an upload, brought forward to the pull
      # request. It reads each range off the wheel `dist/` already holds and runs that
      # package's suite against every published core the range admits — the pairing a consumer
      # gets, and the one the offline suite never exercises because `[tool.uv.sources]` points
      # `maf-sandbox` at the workspace (#628).
      #
      # On every code pull request rather than only on a Release PR: a Release PR is generated
      # from commits already merged, so a failure there is one whose fix is a *different* pull
      # request. Run here, the same failure is an edit to the pull request that caused it. A
      # Release PR changes a dependent's version and so reaches this too, which is where it is
      # the last word before a merge that publishes.
      - name: Each dependent against the published cores it admits
        if: needs.changes.outputs.code == 'true'
        # `--local-core` is the fallback when nothing published satisfies a dependent's range:
        # the suite runs against the core this checkout built instead of refusing. Only here.
        # publish-packages.yml passes no flag, so an upload still needs a published core.
        run: |
          set -euo pipefail
          for package_dir in packages/*/; do
            package="$(basename "$package_dir")"
            if [ "$package" != "maf-sandbox" ]; then
              python3 scripts/check_dependent_works_with_published_cores.py \
                "$package" dist/"${package//-/_}"-*.whl --local-core "$CORE_WHEEL"
            fi
          done

      # The same question asked of `samples/`, which declares a PEP 723 block rather than a
      # range and so is reached by no gate above (#725).
      #
      # `--local-core` on the same terms as the step above, and it substitutes every wheel
      # `dist/` holds rather than the core alone. Passing it unconditionally means the second
      # refusal — a floor no published core satisfies — is not reachable here; a Release PR
      # merged and never published is `report_stuck_releases.py`'s signal, not this one's.
      # docs/release-compatibility.md carries both, and `poe sample-floors` is the flagless run.
      - name: Each sample against the core its own block names
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          python3 scripts/check_samples_against_declared_core.py --local-core "$CORE_WHEEL"

  # The required context, and the only job here whose name `main`'s ruleset knows. It runs no
  # checks of its own: it fails unless every shard above succeeded, so the shards stay free to
  # be renamed or resharded without a ruleset edit.
  #
  # `always()` so this reports on a shard that failed or was cancelled — without it the join is
  # skipped, and a skipped required check never reports, which is the unmergeable-for-ever
  # state the trigger comment above describes. `success` is the only result accepted: a
  # `skipped` shard is refused too, because the shards skip *steps* on the `changes` verdict
  # and never themselves, so a skipped shard means something went wrong with the graph.
  tests:
    name: Python (pytest + ruff + pyright)
    needs: [changes, suite, fast, pre-commit, types, packaging]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "shard results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a shard of this gate did not succeed: $RESULTS"
              exit 1
            fi
          done
          echo "every shard succeeded"

  # A real Docker daemon on ubuntu-latest makes this the one place a live suite can run on a
  # pull request — wslc needs Windows, acas needs a billable Azure sandbox. Two suites run here
  # now: the docker backend's, and the CodeAct kind's against a real interpreter (#397), which
  # is where `CodeactOutputs.MANIFEST` and the collection's budget arithmetic are exercised —
  # every other live run of that kind is a sample with a model in the loop. It is an
  # integration test, so it lives in its own job rather than as a shard of the hermetic gate
  # above: it depends on the daemon, a network and an image registry, a different failure
  # class, and isolating it keeps a daemon or registry blip from reding the deterministic
  # checks — a red here names Docker, not pytest. It is a required context in its own right,
  # so it stays outside the join. The offline docker suite still runs in `suite`;
  # `test_docker_e2e.py` skips there (no env vars) and runs only here.
  docker-e2e:
    name: Docker backend live tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # A small MCR image (not Docker Hub, so a shared runner IP is not rate-limited) with sh,
      # cat, ln and curl — everything the round trip and the allowlist controls need. Setting
      # these two variables is what turns the module's skip guard off.
      MAF_SANDBOX_DOCKER_E2E_IMAGE: mcr.microsoft.com/azurelinux/base/core:3.0
      MAF_SANDBOX_DOCKER_E2E_PROXY_IMAGE: maf-sandbox-docker-proxy:ci
      # Five non-root guests, built below, varying along two axes. **Who owns what around
      # `work_dir`**: the image's build (as `images/bicep-sandbox/Dockerfile` leaves it), the
      # image's user (as the hardening advice that produces a non-root `USER` also asks for),
      # or that user all the way up to `/maf-sandbox` — which is the shape `reclaim` checks
      # for, since a guest that can write *above* `work_dir` can swap it. **How `USER` is
      # spelled**: a numeric pair is taken from `Config.User` as-is, while a name has to be
      # resolved against the container's own account files. The last carries no `work_dir` at
      # all, so the write has to send it. Their own column because every other image this
      # repository runs — here, in the samples, in verify-live — is root's, and which principal
      # a file-plane call acts as is invisible against those.
      MAF_SANDBOX_DOCKER_E2E_NONROOT_IMAGE: maf-sandbox-docker-nonroot:ci
      MAF_SANDBOX_DOCKER_E2E_GUEST_OWNED_IMAGE: maf-sandbox-docker-guest-owned:ci
      MAF_SANDBOX_DOCKER_E2E_LOOSE_PARENT_IMAGE: maf-sandbox-docker-loose-parent:ci
      MAF_SANDBOX_DOCKER_E2E_NAMED_USER_IMAGE: maf-sandbox-docker-named-user:ci
      MAF_SANDBOX_DOCKER_E2E_ABSENT_WORK_IMAGE: maf-sandbox-docker-absent-work:ci
      # The CodeAct kind runs a Python program in the guest, so it needs an interpreter the
      # backend suite's image does not carry. Same registry for the same reason — MCR rather
      # than Docker Hub, whose unauthenticated pull limit is per shared-runner IP — and the
      # smallest MCR python there is, 204 MB against the devcontainer image's gigabyte.
      MAF_SANDBOX_CODEACT_E2E_IMAGE: mcr.microsoft.com/azurelinux/base/python:3.12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Sync workspace
        if: needs.changes.outputs.code == 'true'
        run: uv sync --locked

      - name: Run the live suite
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          # Build the egress proxy from the package's own shipped context, so the allowlist
          # topology (internal network + dual-homed proxy) is exercised end to end, not only
          # asserted at the command-line level offline.
          docker build -t maf-sandbox-docker-proxy:ci \
            packages/maf-sandbox-docker/src/maf_sandbox_docker/_proxy
          # Explicitly, because the proxy image above is pinned by digest and the two builds
          # below are otherwise the first thing in this job to resolve the tag.
          docker pull "$MAF_SANDBOX_DOCKER_E2E_IMAGE"
          # Five non-root guests off that base, so each build adds a layer and no download.
          # They vary along two axes. **How `USER` is spelled**: a numeric pair is taken from
          # `Config.User` as-is, while a name has to be resolved against the container's own
          # account files, and only the named image reaches that code — it appends its account
          # rows directly, since this base carries no `useradd`, and its gid is not its uid, so
          # a gid that was read cannot pass for one guessed from the uid. **What the image
          # carries under `/maf-sandbox`**: the first three carry `work_dir` and a file in it —
          # the shape a kind's image has, so a reclaim can be shown to remove its own directory
          # and nothing beside it — and differ in how far up the chain the guest owns: nothing,
          # `work_dir`, or `/maf-sandbox` above it. The last carries no `work_dir` at all, which
          # is the one shape where `write_file` has to send `work_dir` itself as an entry rather
          # than let docker create it.
          printf 'FROM %s\nRUN mkdir -p /maf-sandbox/work && echo "{}" > /maf-sandbox/work/carried.json\nUSER 10001:10001\n' \
            "$MAF_SANDBOX_DOCKER_E2E_IMAGE" \
            | docker build -t "$MAF_SANDBOX_DOCKER_E2E_NONROOT_IMAGE" -
          printf 'FROM %s\nRUN mkdir -p /maf-sandbox/work && echo "{}" > /maf-sandbox/work/carried.json && chown -R 10001:10001 /maf-sandbox/work\nUSER 10001:10001\n' \
            "$MAF_SANDBOX_DOCKER_E2E_IMAGE" \
            | docker build -t "$MAF_SANDBOX_DOCKER_E2E_GUEST_OWNED_IMAGE" -
          printf 'FROM %s\nRUN mkdir -p /maf-sandbox/work && echo "{}" > /maf-sandbox/work/carried.json && chown -R 10001:10001 /maf-sandbox\nUSER 10001:10001\n' \
            "$MAF_SANDBOX_DOCKER_E2E_IMAGE" \
            | docker build -t "$MAF_SANDBOX_DOCKER_E2E_LOOSE_PARENT_IMAGE" -
          # `Config.User` as a name, so both halves come from the account files.
          printf 'FROM %s\nRUN mkdir -p /maf-sandbox/work && echo "{}" > /maf-sandbox/work/carried.json && echo "devs:x:20001:" >> /etc/group && echo "app:x:10001:20001::/home/app:/bin/sh" >> /etc/passwd\nUSER app\n' \
            "$MAF_SANDBOX_DOCKER_E2E_IMAGE" \
            | docker build -t "$MAF_SANDBOX_DOCKER_E2E_NAMED_USER_IMAGE" -
          # `/maf-sandbox` without `work_dir` under it: the branch that sends `work_dir`
          # itself as an explicit entry, which docker would otherwise create as root.
          printf 'FROM %s\nRUN mkdir -p /maf-sandbox && echo "devs:x:20001:" >> /etc/group && echo "app:x:10001:20001::/home/app:/bin/sh" >> /etc/passwd\nUSER app\n' \
            "$MAF_SANDBOX_DOCKER_E2E_IMAGE" \
            | docker build -t "$MAF_SANDBOX_DOCKER_E2E_ABSENT_WORK_IMAGE" -
          # Both live suites in one invocation: the backend's, and the CodeAct kind's on top of
          # it (#397). `-ra` because each skips itself when its image variable is empty, which
          # the env block above has already made impossible — a skip here is a bug, and without
          # the summary it reads exactly like a pass. Serial: one shared Docker daemon.
          uv run pytest -q -ra \
            packages/maf-sandbox-docker/tests/test_docker_e2e.py \
            packages/maf-sandbox-codeact/tests/test_codeact_e2e.py
