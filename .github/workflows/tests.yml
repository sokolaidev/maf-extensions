name: Tests

# The gate for every push and PR, in two parallel jobs: `tests` is the hermetic one — the
# offline suite, lint, format, each package's strict pyright, the wheel builds and their
# clean-env smoke; `docker-e2e` is the one integration suite, real containers on the runner's
# Docker daemon, kept separate so its distinct failure surface does not muddy the deterministic
# checks. The documentation checks used to be steps of `tests` and now live in `docs.yml`.
#
# **There are still no path filters on these triggers, and that is deliberate.** Both job names
# are required status checks on `main`. A workflow-level `paths-ignore` does not make a required
# check pass — it stops the workflow triggering, so the check never reports and the pull request
# is unmergeable for ever. Instead the `changes` job below classifies the diff and the expensive
# steps skip on its verdict: the contexts still report, in seconds rather than minutes (#560).
# For the same reason the jobs are never skipped wholesale with a job-level `if:` — a genuine
# success is worth more than relying on a skipped job counting as one.
on:
  push:
    branches: [main]
  pull_request:
    # `edited` is not a default activity type, and the release-order gate below reads the
    # pull request title. Without it a pull request goes green as `ci:`, is retitled to
    # `feat:`, and keeps the passing check: same head SHA, no re-run, gate bypassed.
    types: [opened, synchronize, reopened, edited]
  # A bot-opened pull request does start this — and then stops at `action_required`, the
  # "Approve and run" gate, so the required check never reports until someone clears it.
  # Clearing it by hand is the only thing that does. Dispatching a second run here reports
  # the same contexts and leaves the held one blocking the merge anyway, which is why the
  # release workflow no longer tries (#196). This trigger is for re-running the suite at a
  # branch, not for that.
  workflow_dispatch:

# Read-only by default: nothing here writes to the repository, and an unset block would
# inherit whatever the org default is (often write).
permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # One classification, read by both jobs below, so the rule lives in one place and is unit
  # tested rather than written twice as a shell pattern nobody can check.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The diff below needs the base commit, which a shallow clone does not have.
          fetch-depth: 0

      - name: Classify the changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Only a pull request has a base to diff against. A push to `main` and a manual
          # dispatch run everything, which is also what the script does with an empty diff.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA" HEAD |
            python3 scripts/changed_paths.py >> "$GITHUB_OUTPUT"

  tests:
    name: Python (pytest + ruff + pyright)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The release-order check below diffs against the base commit, which a shallow
          # clone does not have.
          fetch-depth: 0

      - name: Release order (a core minor needs its ceilings widened first)
        # First, because it costs a second and it is the one failure here whose fix is a
        # different pull request rather than an edit to this one. Only a pull request carries
        # the title release-please turns into a version, so it is the only event this reads.
        #
        # The `${{ }}` expression is assigned to an environment variable rather than
        # interpolated into this shell script. A pull request title is attacker-controlled
        # text, and interpolating it here would make it shell source; keep it out.
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD |
            python3 scripts/check_release_order.py "$PR_TITLE"

      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        # Pinned to the commit v5 resolves to: a moving tag is a supply-chain hole, since
        # whoever can move it can run code in this workflow.
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Sync workspace
        if: needs.changes.outputs.code == 'true'
        # agent-framework-core resolves from PyPI at the released range — deliberately the
        # same artifact every consumer of the published wheels gets, not a git pin.
        #
        # `--locked` because a plain sync silently re-locks in the runner: a lockfile left
        # behind by a version bump would keep CI green and hand every contributor a dirty
        # tree on their first sync instead.
        run: uv sync --locked

      - name: Pre-commit (whole tree)
        if: needs.changes.outputs.code == 'true'
        # The pre-commit tier as a whole tree; no `--hook-stage` filter, so pre-commit uses
        # its default stage. A hook whose `stages` were dropped would run here, which is how
        # the wiring is caught (the suite's config test pins it too).
        env:
          # `main` is checked out as a local branch here, so the branch guard — a local
          # hook that keeps a commit on the protected branch — would fail the run.
          SKIP: no-commit-to-branch
        run: uv run pre-commit run --all-files

      - name: Pre-commit (pre-push stage, whole tree)
        if: needs.changes.outputs.code == 'true'
        # The whole tier through pre-commit, the way a developer's push runs it, so the
        # hooks' entries and arguments are exercised end to end; the Types steps below run
        # the same pyright commands raw, outside the framework.
        run: uv run pre-commit run --hook-stage pre-push --all-files

      - name: Pre-commit (commit-msg stage)
        if: needs.changes.outputs.code == 'true'
        # The commit-msg guard against a clean fixture message, so the stage's entry and
        # arguments are exercised through pre-commit the way an installed hook drives it.
        run: |
          printf 'ci: a fixture message for the commit-msg stage\n' > "$RUNNER_TEMP/ci-commit-msg"
          uv run pre-commit run --hook-stage commit-msg --commit-msg-filename "$RUNNER_TEMP/ci-commit-msg" no-origin-identifiers-msg

      - name: Tests
        if: needs.changes.outputs.code == 'true'
        # One worker per runner CPU: 74s to 37s here, and eight measured no better than four.
        # `poe test` stays serial, so an order-dependent test reds here rather than locally.
        run: uv run pytest -q -n auto

      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: uv run ruff check .

      - name: Format
        if: needs.changes.outputs.code == 'true'
        run: uv run ruff format --check .

      - name: Types (per-package strict configs)
        if: needs.changes.outputs.code == 'true'
        # One discovery implementation: the same `packages_with_pyright()` the local gate and
        # `tests/test_pr_gate_enumerates.py` use, run as a CLI so CI never re-parses the TOML
        # with a grep of its own. Enumerated rather than listed so a seventh package is
        # type-checked on the commit that adds it (#450).
        run: uv run python scripts/gate_tasks.py pyright-packages

      - name: Types (scripts, tests & samples)
        if: needs.changes.outputs.code == 'true'
        # scripts/, the test trees and samples/ belong to no package, so the per-package strict
        # pyright above does not see them. The root [tool.pyright] in pyproject.toml drives this
        # pass: scripts/ stays at full standard (it sits under no execution environment), and each
        # test tree is one that relaxes the four loose-fake rules to warnings so intentional fakes
        # do not block. The two InMemoryStore→AgentFileStore duck-types in smoke_install.py are
        # suppressed inline; everything outside those four rules is real drift. samples/ relaxes
        # nothing and suppresses inline instead — pyproject.toml says why (#334).
        run: uv run pyright

      - name: Build + metadata check
        if: needs.changes.outputs.code == 'true'
        # Enumerated: the directory basename is the distribution name — an invariant
        # test_release_config.py pins — so a new package builds on the commit that adds it.
        run: |
          set -euo pipefail
          for package in packages/*/; do
            uv build --package "$(basename "$package")"
          done
          uv run twine check dist/*

      # `--find-links dist/` resolves intra-family deps against the wheels just built, not
      # PyPI — deliberately opposite of publish-packages.yml's copy of this gate.
      - name: Install + use each wheel in a clean environment
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          for package_dir in packages/*/; do
            package="$(basename "$package_dir")"
            module="${package//-/_}"
            venv="/tmp/smoke-${package}"
            uv venv "$venv"
            uv pip install --python "$venv/bin/python" --find-links dist/ dist/${module}-*.whl
            "$venv/bin/python" scripts/smoke_install.py "$package"
          done

      # The gate publish-packages.yml runs before an upload, brought forward to the pull
      # request. It reads each range off the wheel `dist/` already holds and runs that
      # package's suite against every published core the range admits — the pairing a consumer
      # gets, and the one the suite above never exercises because `[tool.uv.sources]` points
      # `maf-sandbox` at the workspace (#628).
      #
      # On every code pull request rather than only on a Release PR, and for the reason the
      # release-order step above gives about itself: a Release PR is generated from commits
      # already merged, so a failure there is one whose fix is a *different* pull request. Run
      # here, the same failure is an edit to the pull request that caused it. A Release PR
      # changes a dependent's version and so reaches this too, which is where it is the last
      # word before a merge that publishes.
      # Every wheel the build step produced, installed into one environment. The samples
      # take several of these together, so a range that moved past a *sibling* rather than past
      # the index leaves the family unresolvable — which no per-package check can see (#628).
      - name: The suite installs as a set
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          python3 scripts/check_suite_installs_together.py --whole-set

      - name: Each dependent against the published cores it admits
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          for package_dir in packages/*/; do
            package="$(basename "$package_dir")"
            if [ "$package" != "maf-sandbox" ]; then
              python3 scripts/check_dependent_works_with_published_cores.py \
                "$package" dist/"${package//-/_}"-*.whl
            fi
          done

  # A real Docker daemon on ubuntu-latest makes this the one place a live suite can run on a
  # pull request — wslc needs Windows, acas needs a billable Azure sandbox. Two suites run here
  # now: the docker backend's, and the CodeAct kind's against a real interpreter (#397), which
  # is where `CodeactOutputs.MANIFEST` and the collection's budget arithmetic are exercised —
  # every other live run of that kind is a sample with a model in the loop. It is an
  # integration test, so it lives in its own job rather than as a step of the hermetic
  # unit/lint/type job above: it depends on the daemon, a network and an image registry, a
  # different failure class, and isolating it keeps a daemon or registry blip from reding the
  # deterministic checks — a red here names Docker, not pytest. It runs in parallel with the job
  # above, so it adds no wall-clock to the gate. The offline docker suite still runs in `tests`;
  # `test_docker_e2e.py` skips there (no env vars) and runs only here.
  docker-e2e:
    name: Docker backend live tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # A small MCR image (not Docker Hub, so a shared runner IP is not rate-limited) with sh,
      # cat, ln and curl — everything the round trip and the allowlist controls need. Setting
      # these two variables is what turns the module's skip guard off.
      MAF_SANDBOX_DOCKER_E2E_IMAGE: mcr.microsoft.com/azurelinux/base/core:3.0
      MAF_SANDBOX_DOCKER_E2E_PROXY_IMAGE: maf-sandbox-docker-proxy:ci
      # The CodeAct kind runs a Python program in the guest, so it needs an interpreter the
      # backend suite's image does not carry. Same registry for the same reason — MCR rather
      # than Docker Hub, whose unauthenticated pull limit is per shared-runner IP — and the
      # smallest MCR python there is, 204 MB against the devcontainer image's gigabyte.
      MAF_SANDBOX_CODEACT_E2E_IMAGE: mcr.microsoft.com/azurelinux/base/python:3.12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Sync workspace
        if: needs.changes.outputs.code == 'true'
        run: uv sync --locked

      - name: Run the live suite
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          # Build the egress proxy from the package's own shipped context, so the allowlist
          # topology (internal network + dual-homed proxy) is exercised end to end, not only
          # asserted at the command-line level offline.
          docker build -t maf-sandbox-docker-proxy:ci \
            packages/maf-sandbox-docker/src/maf_sandbox_docker/_proxy
          # Both live suites in one invocation: the backend's, and the CodeAct kind's on top of
          # it (#397). `-ra` because each skips itself when its image variable is empty, which
          # the env block above has already made impossible — a skip here is a bug, and without
          # the summary it reads exactly like a pass. Serial: one shared Docker daemon.
          uv run pytest -q -ra \
            packages/maf-sandbox-docker/tests/test_docker_e2e.py \
            packages/maf-sandbox-codeact/tests/test_codeact_e2e.py
