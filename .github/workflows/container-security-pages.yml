name: Container security Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Container image monitor]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: container-security-pages
  queue: max
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'sokolaidev/maf-extensions' && github.ref == 'refs/heads/main' && vars.CONTAINER_IMAGE_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Export the current immutable catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python scripts/export_container_security_page.py --directory "$RUNNER_TEMP/security-page"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/security-page

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
