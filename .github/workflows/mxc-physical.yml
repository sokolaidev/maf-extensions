name: MXC physical storage safeguards

on:
  pull_request:
    paths:
      - '.github/workflows/mxc-physical.yml'
      - 'scripts/experiments/mxc_session_patch/**'
      - 'tests/test_mxc_physical.py'
      - 'uv.lock'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: SQLite capacity and recovery (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Record SQLite and Python versions
        run: uv run python -c "import platform, sqlite3; print(platform.platform()); print(platform.python_version()); print(sqlite3.sqlite_version)"
      - name: Exercise capacity refusal and retained recovery
        shell: bash
        run: uv run pytest -q tests/test_mxc_physical.py --junitxml="$RUNNER_TEMP/mxc-physical.xml"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mxc-physical-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mxc-physical.xml
          if-no-files-found: error
          retention-days: 14
