name: MXC storage and retention acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/mxc-physical.yml'
      - 'scripts/experiments/mxc_session_patch/**'
      - 'tests/test_mxc_shared_store.py'
      - 'tests/test_mxc_accounting.py'
      - 'tests/test_mxc_private_root.py'
      - 'tests/test_mxc_native_journal.py'
      - 'tests/test_mxc_idle.py'
      - 'tests/test_mxc_physical.py'
      - 'tests/test_mxc_prelaunch.py'
      - 'scripts/experiments/mxc_streams_patch/**'
      - 'scripts/experiments/mxc_files_patch/**'
      - 'uv.lock'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Storage and retention controls (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Record SQLite and Python versions
        run: >-
          uv run python -c "import json, os, platform, sqlite3; from pathlib import Path;
          report = dict(platform=platform.system(), python=platform.python_version(), sqlite=sqlite3.sqlite_version,
          source_commit=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT']);
          print(json.dumps(report));
          (Path(os.environ['RUNNER_TEMP']) / 'mxc-storage-runtime.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')"
      - name: Exercise storage, retention, collection and recovery
        shell: bash
        run: >-
          uv run pytest -q
          tests/test_mxc_shared_store.py tests/test_mxc_accounting.py
          tests/test_mxc_private_root.py tests/test_mxc_native_journal.py
          tests/test_mxc_idle.py tests/test_mxc_physical.py tests/test_mxc_prelaunch.py
          --junitxml="$RUNNER_TEMP/mxc-physical.xml"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mxc-physical-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mxc-physical.xml
            ${{ runner.temp }}/mxc-storage-runtime.json
          if-no-files-found: error
          retention-days: 14
