name: Image remediation

on:
  workflow_run:
    workflows: [Container image monitor]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "45 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-remediation
  cancel-in-progress: false

jobs:
  acquire:
    if: >-
      github.repository == 'sokolaidev/maf-extensions' && github.ref == 'refs/heads/main' &&
      (vars.IMAGE_REMEDIATION_ENABLED == 'true' || github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      source: ${{ steps.acquire.outputs.source }}
      updates: ${{ steps.acquire.outputs.updates }}
      providers: ${{ steps.acquire.outputs.providers }}
      go: ${{ steps.acquire.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Acquire authenticated current image evidence
        id: acquire
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python scripts/image_remediation.py acquire --work "$RUNNER_TEMP/remediation"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: remediation-plan
          path: ${{ runner.temp }}/remediation/
          overwrite: true
          if-no-files-found: warn
          retention-days: 30

  providers:
    needs: acquire
    if: needs.acquire.outputs.updates == 'true' && needs.acquire.outputs.providers != '[]'
    runs-on: ubuntu-latest-m
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(needs.acquire.outputs.providers) }}
    env:
      MAF_GO_BUILD_CONCURRENCY: ${{ vars.IMAGE_REMEDIATION_GO_CONCURRENCY || 'auto' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.acquire.outputs.source }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: remediation-plan
          path: ${{ runner.temp }}/remediation
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.acquire.outputs.go }}
          cache: false
      - name: Build one provider and regenerate its locks
        env:
          SHARD: ${{ matrix.shard }}
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
        run: uv run --locked python scripts/image_remediation.py provider --work "$RUNNER_TEMP/remediation" --shard "$SHARD" --results "$RUNNER_TEMP/provider-results"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remediation-provider-${{ matrix.shard }}
          path: ${{ runner.temp }}/provider-results/
          overwrite: true
          if-no-files-found: error
          retention-days: 30

  prepare:
    needs: [acquire, providers]
    if: >-
      !cancelled() && needs.acquire.result == 'success' && needs.acquire.outputs.updates == 'true' &&
      (needs.providers.result == 'success' || needs.providers.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      source: ${{ needs.acquire.outputs.source }}
      updates: ${{ needs.acquire.outputs.updates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.acquire.outputs.source }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: remediation-plan
          path: ${{ runner.temp }}/remediation
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.acquire.outputs.providers != '[]'
        with:
          pattern: remediation-provider-*
          merge-multiple: true
          path: ${{ runner.temp }}/provider-results
      - name: Assemble verified provider results
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python scripts/image_remediation.py prepare --work "$RUNNER_TEMP/remediation" --results "$RUNNER_TEMP/provider-results"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: remediation-inputs
          path: ${{ runner.temp }}/remediation/
          overwrite: true
          if-no-files-found: warn
          retention-days: 30

  scan:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.updates == 'true' }}
    runs-on: ubuntu-latest-m
    timeout-minutes: 300
    env:
      MAF_GO_BUILD_CONCURRENCY: ${{ vars.IMAGE_REMEDIATION_GO_CONCURRENCY || 'auto' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        variant: [baseline, candidate]
        profile: [terraform-random, opentofu-random, terraform-avm, opentofu-avm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: remediation-inputs
          path: ${{ runner.temp }}/remediation
      - uses: ./.github/actions/setup-classic-docker
      - name: Install pinned scanners
        run: python3 scripts/install_container_scanners.py --directory "$RUNNER_TEMP/scan-tools"
      - name: Build ordinary recipes, qualify runtime and rescan
        env:
          PROFILE: ${{ matrix.profile }}
          VARIANT: ${{ matrix.variant }}
        run: uv run --locked python scripts/image_remediation.py scan --work "$RUNNER_TEMP/remediation" --profile "$PROFILE" --variant "$VARIANT" --results "$RUNNER_TEMP/results/$VARIANT-$PROFILE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: remediation-${{ matrix.variant }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/results/
          overwrite: true
          if-no-files-found: warn
          retention-days: 30

  checks:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.updates == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: remediation-inputs
          path: ${{ runner.temp }}/remediation
      - name: Validate and apply the bounded proposal
        run: uv run --locked python scripts/image_remediation.py apply --work "$RUNNER_TEMP/remediation"
      - name: Run the source gate
        run: uv run --locked poe gate
      - name: Check Markdown examples and issue trackers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run --locked poe md-blocks
          uv run --locked poe doc-trackers

  publish:
    needs: [prepare, scan, checks]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.scan.result == 'success' &&
      needs.checks.result == 'success' && needs.prepare.outputs.updates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: remediation-inputs
          path: ${{ runner.temp }}/remediation
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: remediation-baseline-*
          merge-multiple: true
          path: ${{ runner.temp }}/results
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: remediation-candidate-*
          merge-multiple: true
          path: ${{ runner.temp }}/results
      - name: Verify all evidence and reject stale main
        id: qualify
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python scripts/image_remediation.py qualify --work "$RUNNER_TEMP/remediation" --results "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: retain
        with:
          name: remediation-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/remediation
            ${{ runner.temp }}/results
          if-no-files-found: error
          retention-days: 30
      - name: Mint the dedicated remediation identity
        id: app
        if: steps.qualify.outputs.ready == 'true' && vars.IMAGE_REMEDIATION_ENABLED == 'true' && vars.IMAGE_REMEDIATION_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.IMAGE_REMEDIATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.IMAGE_REMEDIATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: maf-extensions
          permission-contents: write
          permission-pull-requests: write
      - name: Open or refresh the owned remediation PR
        if: steps.app.outcome == 'success' && steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REMEDIATION_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
          ARTIFACT_ID: ${{ steps.retain.outputs.artifact-id }}
        run: uv run --locked python scripts/image_remediation_pr.py --work "$RUNNER_TEMP/remediation" --results "$RUNNER_TEMP/results" --bot "$BOT" --artifact-id "$ARTIFACT_ID"

  report-failure:
    needs: [acquire, providers, prepare, scan, checks, publish]
    if: always() && (needs.acquire.result == 'failure' || needs.providers.result == 'failure' || needs.prepare.result == 'failure' || needs.scan.result == 'failure' || needs.checks.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Report remediation failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/report_workflow_failure.py
          --marker '<!-- image-remediation-failure-tracker -->'
          --title 'Automatic image remediation needs attention'
          --reproduce 'Inspect the retained remediation inputs and baseline/candidate reports. Dispatch image-remediation.yml from current main for fresh evidence; retry interrupted PR delivery only while its recorded source and monitoring remain current.'
          --expected 'Every affected profile has complete build, runtime, inventory and rescan evidence, targeted findings are removed, and an owned PR can be delivered without changing human commits or published-image release requests.'
          --context 'Automation is opt-in. Configure the dedicated remediation App separately. A generated source fix does not establish image publication or production qualification.'
          --packages maf-sandbox maf-sandbox-docker maf-sandbox-terraform
