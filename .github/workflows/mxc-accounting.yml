name: MXC accounting scaling

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: Admission accounting (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Measure retained-history admission and audits
        shell: bash
        run: >-
          uv run --no-project --python 3.12 python
          -m scripts.experiments.mxc_session_patch.accounting_benchmark
          --history 0 1000 10000 --samples 50
          --output "$RUNNER_TEMP/mxc-accounting.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mxc-accounting-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mxc-accounting.json
          if-no-files-found: error
          retention-days: 14
