name: Temporary OpenClaw MXC Windows integration checks
on:
  push:
    branches: [antsok-openclaw-mxc-windows-integration-2104]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  integration:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CI: "true"
      OPENCLAW_VITEST_MAX_WORKERS: "1"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1
      - name: Prepare pinned upstream source and retained patch
        shell: pwsh
        run: |
          $subject = Join-Path $env:RUNNER_TEMP 'openclaw'
          $evidence = Join-Path $env:RUNNER_TEMP 'evidence'
          $archive = Join-Path $env:RUNNER_TEMP 'source.tar.gz'
          New-Item -ItemType Directory -Force -Path $subject, $evidence | Out-Null
          Invoke-WebRequest 'https://codeload.github.com/openclaw/openclaw/tar.gz/0cbf9b5481de42e1ea4207c1b27fd50441e51c0b' -OutFile $archive
          & "$env:SystemRoot/System32/tar.exe" -xzf $archive --strip-components=1 -C $subject
          if ($LASTEXITCODE -ne 0) { throw 'Source extraction failed' }
          Set-Location $subject
          git init -q
          git config core.autocrlf false
          git config core.longpaths true
          git add .
          if ($LASTEXITCODE -ne 0) { throw 'Source staging failed' }
          git -c user.name=Proof -c user.email=proof@example.invalid commit -qm baseline
          $patch = Join-Path $env:GITHUB_WORKSPACE 'scripts/experiments/openclaw_mxc_preflight/proposal.patch'
          git apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch check failed' }
          git apply $patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch application failed' }
          git add .
          Get-FileHash -Algorithm SHA256 $patch, 'extensions/mxc/src/mxc-spawn-launcher.mjs' | Format-List | Out-String | Tee-Object -FilePath (Join-Path $evidence 'artifact-hashes.txt')
          npm install --global --ignore-scripts --no-audit --no-fund pnpm@12.15.0
          if ($LASTEXITCODE -ne 0) { throw 'pnpm setup failed' }
      - name: Install frozen upstream workspace
        id: install
        timeout-minutes: 20
        working-directory: ${{ runner.temp }}/openclaw
        run: pnpm install --frozen-lockfile --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/evidence/install.txt"
      - name: Complete MXC plugin lane
        id: tests
        continue-on-error: true
        timeout-minutes: 15
        working-directory: ${{ runner.temp }}/openclaw
        run: pnpm test:extension mxc --maxWorkers=1 --exclude extensions/mxc/test/mxc-sdk-wire-contract.integration.test.ts 2>&1 | tee "$RUNNER_TEMP/evidence/plugin-tests.txt"
      - name: Replay actual launcher with inert fixtures
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}/openclaw
        run: |
          node "$GITHUB_WORKSPACE/scripts/experiments/openclaw_mxc_preflight/verify.mjs" extensions/mxc/src/mxc-spawn-launcher.mjs | tee "$RUNNER_TEMP/evidence/replay.txt"
          node "$GITHUB_WORKSPACE/scripts/experiments/openclaw_mxc_preflight/verify.mjs" extensions/mxc/src/mxc-spawn-launcher.mjs --cleanup-regression | tee "$RUNNER_TEMP/evidence/cleanup.txt"
      - name: Require plugin lane success
        if: always()
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
        run: test "$TEST_RESULT" = success
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: openclaw-mxc-windows-integration
          path: ${{ runner.temp }}/evidence/
          retention-days: 30
