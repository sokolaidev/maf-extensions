name: OpenClaw 3009 qualification
on:
  push:
    branches: [antsok-proof-openclaw-3009]
permissions:
  contents: read
concurrency:
  group: openclaw-bicep-live
  cancel-in-progress: false
jobs:
  openclaw-bicep:
    name: OpenClaw Gateway-to-Docker on native Linux

    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BICEP_IMAGE: ghcr.io/sokolaidev/maf-extensions/bicep-avm@sha256:b3f14b266052def3f7b5a7b6ca4fb38f06acdff0e99e7df2437dd4f0c6b0b82e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.5'
          python-version: '3.13.15'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.8.1'
      - name: Run the installed sample
        timeout-minutes: 18
        run: |
          uv run --no-project --python 3.13.15 samples/24_openclaw_bicep/agent.py \
            --output "$RUNNER_TEMP/openclaw-bicep-private"
      - name: Record bounded evidence and independently check owner scope
        if: always()
        run: |
          python3 scripts/report_openclaw_hosted.py --published --output "$RUNNER_TEMP/openclaw-bicep-evidence.md"
          cat "$RUNNER_TEMP/openclaw-bicep-evidence.md"
          cat "$RUNNER_TEMP/openclaw-bicep-evidence.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain bounded Markdown evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openclaw-bicep-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openclaw-bicep-evidence.md
          if-no-files-found: error
          retention-days: 30

  openclaw-bicep-model:
    name: OpenClaw real-model Gateway-to-Docker

    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: live-verify
    permissions:
      contents: read
      id-token: write
    env:
      BICEP_IMAGE: ghcr.io/sokolaidev/maf-extensions/bicep-avm@sha256:b3f14b266052def3f7b5a7b6ca4fb38f06acdff0e99e7df2437dd4f0c6b0b82e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.5'
          python-version: '3.13.15'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.8.1'
      - name: Check model configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_MODEL: ${{ vars.AZURE_OPENAI_CHAT_MODEL }}
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_OPENAI_ENDPOINT AZURE_OPENAI_CHAT_MODEL; do
            if [ -z "${!name}" ]; then
              echo "::error::live-verify is missing $name"
              exit 1
            fi
          done
      - name: Sign in to Azure with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Download verified published worker and prepared compiler
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openclaw-wheel"
          wheel="$RUNNER_TEMP/openclaw-wheel/maf_sandbox_mcp-0.3.1-py3-none-any.whl"
          curl --fail --silent --show-error --location \
            'https://files.pythonhosted.org/packages/b9/2f/7958be1bb8a8bcfdca8b14817f6ea8bc74a0e4bd432a24eb591c1c7a0a53/maf_sandbox_mcp-0.3.1-py3-none-any.whl' --output "$wheel"
          printf '%s  %s\n' '36d1af36ef6ed6fc174eeedc34a2c5f9a5e6a670134e0f6682d9c35955b079b1' "$wheel" | sha256sum --check --status
          docker pull "$BICEP_IMAGE"
      - name: Run the installed sample with Azure OpenAI
        timeout-minutes: 18
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_MODEL: ${{ vars.AZURE_OPENAI_CHAT_MODEL }}
        run: |
          set -euo pipefail
          export OPENAI_BASE_URL="${AZURE_OPENAI_ENDPOINT%/}/openai/v1"
          export OPENAI_MODEL="$AZURE_OPENAI_CHAT_MODEL"
          OPENAI_API_KEY="$(az account get-access-token --resource https://cognitiveservices.azure.com/ --query accessToken --output tsv)"
          test -n "$OPENAI_API_KEY"
          printf '::add-mask::%s\n' "$OPENAI_API_KEY"
          export OPENAI_API_KEY
          uv run --no-project --python 3.13.15 samples/experimental/openclaw_bicep_e2e/agent.py \
            --mode model --reasoning-effort none --wheel "$RUNNER_TEMP/openclaw-wheel/maf_sandbox_mcp-0.3.1-py3-none-any.whl" \
            --image "$BICEP_IMAGE" --output "$RUNNER_TEMP/openclaw-bicep-private"
      - name: Record bounded evidence and independently check owner scope
        if: always()
        run: |
          python3 scripts/report_openclaw_hosted.py --mode model --output "$RUNNER_TEMP/openclaw-bicep-evidence.md"
          cat "$RUNNER_TEMP/openclaw-bicep-evidence.md"
          cat "$RUNNER_TEMP/openclaw-bicep-evidence.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain bounded Markdown evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openclaw-bicep-model-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openclaw-bicep-evidence.md
          if-no-files-found: error
          retention-days: 30

  openclaw-owner-loss:
    name: OpenClaw Linux actor-loss recovery

    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BICEP_IMAGE: ghcr.io/sokolaidev/maf-extensions/bicep-avm@sha256:b3f14b266052def3f7b5a7b6ca4fb38f06acdff0e99e7df2437dd4f0c6b0b82e
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.5'
          python-version: '3.13.15'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.8.1'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Download verified published worker and prepared compiler
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openclaw-wheel"
          wheel="$RUNNER_TEMP/openclaw-wheel/maf_sandbox_mcp-0.3.1-py3-none-any.whl"
          curl --fail --silent --show-error --location \
            'https://files.pythonhosted.org/packages/b9/2f/7958be1bb8a8bcfdca8b14817f6ea8bc74a0e4bd432a24eb591c1c7a0a53/maf_sandbox_mcp-0.3.1-py3-none-any.whl' --output "$wheel"
          printf '%s  %s\n' '36d1af36ef6ed6fc174eeedc34a2c5f9a5e6a670134e0f6682d9c35955b079b1' "$wheel" | sha256sum --check --status
          docker pull "$BICEP_IMAGE"
          docker pull 'docker:29.8.2-dind@sha256:6316d612722fd7fb2bd7edf9fcbb4439d08915cfb2e0e0b28bf16675fc9f3314'
      - name: Run a fresh installed deterministic baseline
        timeout-minutes: 18
        run: |
          set -euo pipefail
          printf 'mcp==2.2.0\n' > "$RUNNER_TEMP/openclaw-constraints.txt"
          export UV_CONSTRAINT="$RUNNER_TEMP/openclaw-constraints.txt"
          uv run --no-project --python 3.13.15 samples/experimental/openclaw_bicep_e2e/agent.py \
            --wheel "$RUNNER_TEMP/openclaw-wheel/maf_sandbox_mcp-0.3.1-py3-none-any.whl" \
            --image "$BICEP_IMAGE" --output "$RUNNER_TEMP/openclaw-bicep-private"
      - name: Qualify the fixed Linux actor-loss cases
        timeout-minutes: 70
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/openclaw-bicep-private/worker/bin/python" -I -B -c \
            "import runpy,sys; sys.path.insert(0,sys.argv.pop(1)); runpy.run_module('openclaw_conformance.linux_owner_loss',run_name='__main__')" \
            "$GITHUB_WORKSPACE/scripts" run --prepared "$RUNNER_TEMP/openclaw-bicep-private" \
            --root "$RUNNER_TEMP/openclaw-owner-loss-private"
      - name: Re-evaluate and retain bounded actor-loss evidence
        if: always()
        run: |
          set -euo pipefail
          python="$RUNNER_TEMP/openclaw-bicep-private/worker/bin/python"
          if [ ! -x "$python" ]; then python=python3; fi
          "$python" -I -B -c \
            "import runpy,sys; sys.path.insert(0,sys.argv.pop(1)); runpy.run_module('openclaw_conformance.linux_owner_loss',run_name='__main__')" \
            "$GITHUB_WORKSPACE/scripts" collect --prepared "$RUNNER_TEMP/openclaw-bicep-private" \
            --root "$RUNNER_TEMP/openclaw-owner-loss-private" --output "$RUNNER_TEMP/openclaw-owner-loss.md"
          cat "$RUNNER_TEMP/openclaw-owner-loss.md"
          cat "$RUNNER_TEMP/openclaw-owner-loss.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain bounded Markdown evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openclaw-owner-loss-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openclaw-owner-loss.md
          if-no-files-found: error
          retention-days: 30

