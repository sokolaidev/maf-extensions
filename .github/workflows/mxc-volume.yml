name: MXC disposable filesystem exhaustion

on:
  pull_request:
    paths:
      - '.github/workflows/mxc-volume.yml'
      - '.github/actions/mxc-volume/**'
      - 'scripts/experiments/mxc_session_patch/**'
      - 'tests/test_mxc_volume_probe.py'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  volume:
    name: Full filesystem recovery (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - name: Create disposable filesystem
        uses: ./.github/actions/mxc-volume
        with:
          phase: create
      - name: Exhaust volume and verify recovered publication
        shell: bash
        run: uv run python -m scripts.experiments.mxc_session_patch.volume_probe "$MXC_VOLUME" "$RUNNER_TEMP/mxc-volume-results" "$MXC_VOLUME_TOKEN"
      - name: Detach and verify disposable filesystem cleanup
        if: always()
        uses: ./.github/actions/mxc-volume
        with:
          phase: cleanup
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mxc-volume-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mxc-volume-results/*.json
            ${{ runner.temp }}/mxc-volume-results/*.log
          if-no-files-found: error
          retention-days: 14
