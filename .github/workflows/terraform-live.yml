name: Terraform and OpenTofu (live)

# Follow the repository's real-engine policy: after merge, on a timer, or manual dispatch.
on:
  push:
    branches: [main]
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:
    inputs:
      platform:
        description: Build and validate the larger OpenTofu platform image
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: terraform-live
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      MAF_TERRAFORM_E2E_IMAGE: maf-terraform:ci
      MAF_OPENTOFU_E2E_IMAGE: maf-opentofu:ci
      MAF_TERRAFORM_PREPARED_IMAGE: maf-terraform:ci-prepared
      MAF_OPENTOFU_PREPARED_IMAGE: maf-opentofu:ci-prepared
      MAF_TERRAFORM_PREPARED_DIR: dist/dependencies/terraform
      MAF_OPENTOFU_PREPARED_DIR: dist/dependencies/opentofu
      MAF_TERRAFORM_AVM_IMAGE: maf-terraform:ci-avm
      MAF_TERRAFORM_AVM_DIR: dist/dependencies/terraform-avm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Sync workspace
        run: uv sync --locked
      - name: Build pinned engine and provider images
        run: |
          uv run python images/terraform-sandbox/build_image.py --engine terraform --profile random --tag "$MAF_TERRAFORM_E2E_IMAGE"
          uv run python images/terraform-sandbox/build_image.py --engine opentofu --profile random --tag "$MAF_OPENTOFU_E2E_IMAGE"
      - name: Validate and observe disposal
        run: uv run pytest -q packages/maf-sandbox-terraform/tests/test_terraform_docker.py
      - name: Build a prepared image of each engine and export its preparation
        run: |
          base=maf-terraform:ci-builtin
          image=$MAF_TERRAFORM_PREPARED_IMAGE
          directory=$MAF_TERRAFORM_PREPARED_DIR
          for engine in terraform opentofu; do
            if [ "$engine" = opentofu ]; then
              base=maf-opentofu:ci-builtin
              image=$MAF_OPENTOFU_PREPARED_IMAGE
              directory=$MAF_OPENTOFU_PREPARED_DIR
            fi
            uv run python images/terraform-sandbox/build_image.py --engine "$engine" --profile builtin --tag "$base"
            build=(docker build --platform linux/amd64 --build-context scripts=scripts --build-arg "BASE_IMAGE=$base" --build-arg "MANIFEST=dependencies.$engine.json" -f images/terraform-sandbox/prepared.Dockerfile)
            "${build[@]}" -t "$image" images/terraform-sandbox
            "${build[@]}" --target prepared --output "type=local,dest=$directory" images/terraform-sandbox
          done
      - name: Validate prepared providers and modules offline, and observe disposal
        run: uv run pytest -q tests/test_terraform_dependencies_docker.py
      - name: Build the prepared AVM image and export its preparation
        run: |
          build=(docker build --platform linux/amd64 --build-context scripts=scripts --build-arg BASE_IMAGE=maf-terraform:ci-builtin --build-arg MANIFEST=dependencies.terraform-avm-network.json -f images/terraform-sandbox/prepared.Dockerfile)
          "${build[@]}" -t "$MAF_TERRAFORM_AVM_IMAGE" images/terraform-sandbox
          "${build[@]}" --target prepared --output "type=local,dest=$MAF_TERRAFORM_AVM_DIR" images/terraform-sandbox
      - name: Validate the AVM graph offline and observe disposal
        id: avm
        env:
          MAF_TERRAFORM_DIAGNOSTICS_DIR: ${{ runner.temp }}/terraform-avm-diagnostics
        run: uv run pytest -q tests/test_terraform_avm_offline.py
      - name: Build and validate the OpenTofu AVM graph offline
        id: opentofu-avm
        env:
          MAF_AVM_ENGINE: opentofu
          MAF_OPENTOFU_AVM_IMAGE: maf-opentofu:ci-avm
          MAF_OPENTOFU_AVM_DIR: dist/dependencies/opentofu-avm
          MAF_TERRAFORM_DIAGNOSTICS_DIR: ${{ runner.temp }}/terraform-avm-diagnostics
        run: |
          build=(docker build --platform linux/amd64 --build-context scripts=scripts --build-arg BASE_IMAGE=maf-opentofu:ci-builtin --build-arg MANIFEST=dependencies.opentofu-avm-network.json -f images/terraform-sandbox/prepared.Dockerfile)
          "${build[@]}" -t "$MAF_OPENTOFU_AVM_IMAGE" images/terraform-sandbox
          "${build[@]}" --target prepared --output "type=local,dest=$MAF_OPENTOFU_AVM_DIR" images/terraform-sandbox
          uv run pytest -q tests/test_terraform_avm_offline.py
      - name: Retain AVM failure diagnostics
        if: failure() && (steps.avm.outcome == 'failure' || steps.opentofu-avm.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-avm-failure-diagnostics
          path: ${{ runner.temp }}/terraform-avm-diagnostics
          retention-days: 14

  opentofu-platform:
    if: github.event_name == 'workflow_dispatch' && inputs.platform
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAF_OPENTOFU_PLATFORM_IMAGE: maf-opentofu:ci-platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Sync workspace
        run: uv sync --locked
      - name: Check the pinned platform manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/terraform_manifest.py --policy images/terraform-sandbox/dependencies.opentofu-platform.policy.json --output images/terraform-sandbox/dependencies.opentofu-platform.json --check
      - name: Build the platform image
        run: |
          uv run python images/terraform-sandbox/build_image.py --engine opentofu --profile builtin --tag maf-opentofu:ci-platform-base
          docker build --platform linux/amd64 --build-context scripts=scripts --build-arg BASE_IMAGE=maf-opentofu:ci-platform-base --build-arg MANIFEST=dependencies.opentofu-platform.json -f images/terraform-sandbox/prepared.Dockerfile -t "$MAF_OPENTOFU_PLATFORM_IMAGE" images/terraform-sandbox
      - name: Validate platform resources offline and observe disposal
        run: uv run pytest -q tests/test_opentofu_platform_offline.py

  report-failure:
    name: Report Terraform live failure
    needs: [terraform, opentofu-platform]
    if: always() && (needs.terraform.result == 'failure' || needs.opentofu-platform.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open or notify the Terraform live tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/report_workflow_failure.py
          --marker '<!-- terraform-live-failure-tracker -->'
          --title 'Terraform and OpenTofu live checks failed'
          --reproduce 'Re-run the linked attempt, or dispatch terraform-live.yml against the failing commit. Inspect the first failed step for image, registry, daemon, or test failures.'
          --expected 'Both engine profiles, a prepared image of each engine, the pinned AVM graph, and the optional OpenTofu platform image (when platform=true) validate correctly offline and leave no workload containers.'
          --packages maf-sandbox maf-sandbox-docker maf-sandbox-terraform
