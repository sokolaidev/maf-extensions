name: Bicep diagnostic catalog

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bicep-diagnostic-catalog
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Generate catalogs from the latest stable release
        run: python3 scripts/update_bicep_catalog.py --body-file "$RUNNER_TEMP/bicep-catalog-pr.md"

      - name: Validate the catalogs and trusted summaries
        run: |
          uv sync --locked
          uv run pytest -q tests/test_update_bicep_catalog.py packages/maf-sandbox-bicep/tests/test_bicep_catalog.py packages/maf-sandbox-bicep/tests/test_bicep_workload.py

      - name: Propose the catalog update
        id: proposal
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: antsok-bicep-catalog-update
          title: "feat(bicep): refresh the packaged diagnostic catalog"
          commit-message: "feat(bicep): refresh the packaged diagnostic catalog"
          body-path: ${{ runner.temp }}/bicep-catalog-pr.md
          add-paths: |
            packages/maf-sandbox-bicep/src/maf_sandbox_bicep/bicepconfig.json
            packages/maf-sandbox-bicep/src/maf_sandbox_bicep/compiler_codes.json
            packages/maf-sandbox-bicep/src/maf_sandbox_bicep/catalog_source.json

      - name: Report the proposal
        if: steps.proposal.outputs.pull-request-url != ''
        env:
          PROPOSAL_URL: ${{ steps.proposal.outputs.pull-request-url }}
        run: |
          echo "Catalog proposal: $PROPOSAL_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Review the catalog diff and any required Approve and run gate. The workflow does not merge or publish." >> "$GITHUB_STEP_SUMMARY"

  propose-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Verify and propose the latest stable image compiler
        run: python3 scripts/update_bicep_images.py --body-file "$RUNNER_TEMP/bicep-images-pr.md"
      - name: Validate image update and release selection
        run: |
          uv sync --locked
          uv run pytest -q tests/test_update_bicep_images.py tests/test_bicep_cli_download.py tests/test_bicep_dependencies.py tests/test_select_image_security.py tests/test_image_release_needed.py
      - name: Propose the image compiler update
        id: proposal
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: antsok-bicep-image-update
          title: "build: update the Bicep compiler in sandbox images"
          commit-message: "build: update the Bicep compiler in sandbox images"
          body-path: ${{ runner.temp }}/bicep-images-pr.md
          add-paths: |
            images/bicep-sandbox/Dockerfile
            images/bicep-sandbox/dependencies.bicep-avm.policy.json
            images/bicep-sandbox/dependencies.bicep-avm.json
      - name: Report the image proposal
        if: steps.proposal.outputs.pull-request-url != ''
        env:
          PROPOSAL_URL: ${{ steps.proposal.outputs.pull-request-url }}
        run: |
          echo "Image compiler proposal: $PROPOSAL_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "After merge, reconcile image release requests and prepare candidates through the protected release gate." >> "$GITHUB_STEP_SUMMARY"

  report-failure:
    name: Report Bicep updater failure
    needs: [propose, propose-images]
    if: always() && (needs.propose.result == 'failure' || needs.propose-images.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open or notify the catalog failure tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/report_workflow_failure.py
          --marker '<!-- bicep-catalog-failure-tracker -->'
          --title 'Bicep weekly catalog or image update failed'
          --reproduce 'Re-run the linked attempt or dispatch bicep-catalog.yml against the failing commit. Run scripts/update_bicep_catalog.py or scripts/update_bicep_images.py locally for the failed proposal; then run its focused tests.'
          --expected 'The latest stable Bicep release produces verified catalog and image-pin proposals, focused tests pass, and each changed component has a separate pull request.'
          --packages maf-sandbox-bicep
