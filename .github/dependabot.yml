# Refresh framework locks, Actions, Dockerfiles and build-consumed native manifests.
# Image compatibility lines and manual exceptions are documented in images/DEPENDENCIES.md.
#
# **The uv entry is scoped by an allow list, to the framework only.** The dev group's `ruff`,
# `pyright` and `pytest` bands are pinned so a new lint minor cannot drift findings across
# unrelated pull requests; refreshing those is a decision, not maintenance a bot proposes.
#
# **Nothing here may move a range.** The uv updater rewrites `uv.lock` and any *pinned* version
# in a manifest, and every framework declaration here is a range, so none is in reach;
# `versioning-strategy` stays unset because `increase` is the value that would raise a floor.
#
# `.github/workflows/lock-drift.yml` is what reports whether the framework proposals arrive.

version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    # `all` rather than the default, which is direct dependencies only. `agent-framework-core`
    # is declared by the workspace members rather than by the root manifest this reads, so
    # whether it counts as direct here is Dependabot's judgement and not one worth betting on.
    allow:
      - dependency-name: "agent-framework-core"
        dependency-type: "all"
      - dependency-name: "agent-framework-openai"
        dependency-type: "all"
      - dependency-name: "agent-framework-foundry"
        dependency-type: "all"
      - dependency-name: "agent-framework-mistral"
        dependency-type: "all"
      - dependency-name: "agent-framework-ollama"
        dependency-type: "all"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      agent-framework:
        patterns: ["agent-framework-*"]
      agent-framework-security:
        applies-to: security-updates
        patterns: ["agent-framework-*"]
    open-pull-requests-limit: 5

  # Group all permitted versions; update-type filters can suppress unmatched majors
  # (dependabot-core#14202).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "04:00"
      timezone: "Etc/UTC"
    # A release has a week to be found bad before it is proposed. Security updates skip this.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "pip"
    directory: "/images/document-sandbox"
    schedule:
      interval: "weekly"
    groups:
      document-libraries:
        patterns: ["*"]
      document-libraries-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "docker"
    directories:
      - "/images/*"
      - "/images/shell-sandbox/fixtures"
      - "/packages/maf-sandbox-docker/tests/fixtures/missing-commands"
      - "/packages/maf-sandbox-wslc/tests/fixtures/*"
      - "/packages/maf-sandbox-docker-sbx/tests/images"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      wolfi-runtime:
        patterns: ["chainguard/wolfi-base"]
      go-toolchain:
        patterns: ["golang"]
      other-build-images:
        patterns: ["*"]
      build-images-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "build"

  - package-ecosystem: "docker"
    directories:
      - "/packages/maf-sandbox-docker/src/maf_sandbox_docker/_proxy"
      - "/packages/maf-sandbox-wslc/src/maf_sandbox_wslc/_proxy"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      proxy-images:
        patterns: ["*"]
      proxy-images-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "fix"

  - package-ecosystem: "pip"
    directory: "/images/drawio-export"
    schedule:
      interval: "weekly"
    groups:
      drawio-libraries:
        patterns: ["*"]
      drawio-libraries-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "build"

  - package-ecosystem: "nuget"
    directory: "/images/bicep-sandbox"
    schedule:
      interval: "weekly"
    groups:
      bicep-libraries:
        patterns: ["*"]
      bicep-libraries-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "build"

  - package-ecosystem: "gomod"
    directories:
      - "/packages/maf-sandbox-docker/src/maf_sandbox_docker/_proxy/dependencies"
      - "/packages/maf-sandbox-wslc/src/maf_sandbox_wslc/_proxy/dependencies"
    schedule:
      interval: "weekly"
    groups:
      proxy-modules:
        patterns: ["*"]
      proxy-modules-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "fix"
