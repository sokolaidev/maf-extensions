name: Set up Docker Sandboxes
description: >-
  Install sbx from Docker's apt repository, sign in, and leave the host in the state
  maf-sandbox-docker-sbx accepts: deny-all policy, SSH agent forwarding off. Also opts the rest
  of the job out of sbx telemetry. Linux runners only.
inputs:
  docker-username:
    description: Docker account the access token belongs to
    required: true
  docker-pat:
    description: Docker access token; read-only is enough
    required: true
runs:
  using: composite
  steps:
    - name: Install and prepare sbx
      shell: bash
      env:
        DOCKER_USERNAME: ${{ inputs.docker-username }}
        DOCKER_PAT: ${{ inputs.docker-pat }}
      run: |
        set -euo pipefail
        # Every later step of the caller's job runs sbx too.
        export SBX_NO_TELEMETRY=1
        echo "SBX_NO_TELEMETRY=1" >> "$GITHUB_ENV"
        if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PAT" ]; then
          echo "::error::DOCKER_USERNAME and DOCKER_PAT must be set to sign sbx in."
          exit 1
        fi
        # Docker's apt repository, the one `get.docker.com` with REPO_ONLY=1 configures.
        sudo install -m 0755 -d /etc/apt/keyrings
        sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        sudo chmod a+r /etc/apt/keyrings/docker.asc
        codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $codename stable" \
          | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
        sudo apt-get update -q
        sudo apt-get install -y -q docker-sbx
        sudo chmod 666 /dev/kvm
        sbx version
        printf '%s' "$DOCKER_PAT" | sbx login --username "$DOCKER_USERNAME" --password-stdin
        sbx policy init deny-all
        # The backend refuses a host that forwards its SSH agent into sandboxes.
        sbx settings set ssh.agentForwardingEnabled false
        sbx daemon restart
