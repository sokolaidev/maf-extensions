name: Set up WSLC
description: Ensure the qualified WSL release is available and verify the Windows container CLI.
runs:
  using: composite
  steps:
    - name: Ensure WSL 3.0.3
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $false
        $wslDirectory = Join-Path $env:ProgramFiles 'WSL'
        $env:PATH = "$wslDirectory;$env:PATH"
        $wslDirectory | Out-File -FilePath $env:GITHUB_PATH -Append

        function Get-WslcVersion {
          if (Get-Command wslc -ErrorAction SilentlyContinue) {
            $version = (wslc --version 2>&1 | Out-String).Replace("`0", '').Trim()
            if ($LASTEXITCODE -eq 0) { return $version }
          }
          return ''
        }

        $qualifiedVersion = 'wslc 3.0.3.0'
        if ((Get-WslcVersion) -eq $qualifiedVersion) {
          Write-Host "Reusing installed $qualifiedVersion"
        } else {
          $installer = Join-Path $env:RUNNER_TEMP 'wsl.3.0.3.0.x64.msi'
          $installLog = Join-Path $env:RUNNER_TEMP 'wsl-install.log'
          Invoke-WebRequest 'https://github.com/microsoft/WSL/releases/download/3.0.3/wsl.3.0.3.0.x64.msi' -OutFile $installer
          $expected = 'ae977286974255bd26bf925f00f40f5692c6b2084155cbc0563c09aea091f211'
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'WSL installer SHA-256 mismatch'
          }
          $install = Start-Process msiexec.exe -ArgumentList @('/i', "`"$installer`"", '/qn', '/norestart', '/L*v', "`"$installLog`"") -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) {
            throw "WSL installer returned exit $($install.ExitCode); expected 0 (no reboot required). See $installLog"
          }
        }
        wsl --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $version = Get-WslcVersion
        if ($version -ne $qualifiedVersion) { throw "Expected $qualifiedVersion; got '$version'" }
        Write-Host $version
    - name: Retain WSL installer diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: wsl-install-${{ github.job }}
        path: ${{ runner.temp }}/wsl-install.log
        if-no-files-found: ignore
