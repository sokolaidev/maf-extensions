# Workspace root for the maf-extensions monorepo — a *virtual* root: it is not itself a
# distribution, it only binds the packages under packages/* into one uv workspace with one
# lockfile and one dev toolchain. Each package is fully self-contained (its own metadata,
# ruff/pyright/pytest configuration, LICENSE and CHANGELOG) so it can be built, published
# and even extracted again without this file.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    # Pinned bands, not floors: an unpinned range resolves to whatever is newest at install
    # time, and a new minor can drift findings across unrelated PRs. Same rationale and the
    # same bands as the application these packages were extracted from.
    "ruff>=0.15.20,<0.16",
    "pyright>=1.1.411,<1.2",
    # Release checks (metadata validation of built sdists/wheels).
    "twine>=6,<7",
]

# Lint rules for the tree *outside* packages/* — samples/, tests/, scripts/, which belong to no
# package. ruff resolves [tool.ruff] per file from the nearest ancestor that has one, so each
# package still answers to its own section and nothing here reaches it; their self-containment is
# what it was. Those 43 files previously answered to ruff's defaults — no `UP` — which is how a
# quoted annotation in samples/07 outlived the same cleanup inside the packages.
#
# `UP` and nothing more, deliberately. No `line-length`: this tree is formatted at ruff's default
# width, and raising it to the packages' 100 would reformat 27 files to no purpose. `I` (13
# findings) and the `D` docstring rules (43) are a larger question than the one that added this,
# and a sample is not a package — whether it should document like one is worth deciding on its
# own rather than as a side effect.
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["UP"]

# From-the-root test runs. Each package also carries its own [tool.pytest.ini_options] for
# in-package runs; pytest binds exactly one rootdir per invocation, so running from here
# uses this list and running inside a package uses that package's own configuration.
[tool.pytest.ini_options]
testpaths = [
    # Repository-level wiring (release registration) — belongs to no single package.
    "tests",
    "packages/maf-sandbox/tests",
    "packages/maf-sandbox-acas/tests",
    "packages/maf-sandbox-bicep/tests",
    "packages/maf-sandbox-codeact/tests",
    "packages/maf-sandbox-docker/tests",
    "packages/maf-sandbox-wslc/tests",
]
faulthandler_timeout = 90.0
