# Workspace root for the maf-extensions monorepo — a *virtual* root: it is not itself a
# distribution, it only binds the packages under packages/* into one uv workspace with one
# lockfile and one dev toolchain. Each package is fully self-contained (its own metadata,
# ruff/pyright/pytest configuration, LICENSE and CHANGELOG) so it can be built, published
# and even extracted again without this file.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    # Pinned bands, not floors: an unpinned range resolves to whatever is newest at install
    # time, and a new minor can drift findings across unrelated PRs. Same rationale and the
    # same bands as the application these packages were extracted from.
    "ruff>=0.15.20,<0.16",
    "pyright>=1.1.411,<1.2",
    # Release checks (metadata validation of built sdists/wheels).
    "twine>=6,<7",
    # Task runner for the local gate (`uv run poe gate`): poe detects uv.lock and runs every
    # task through `uv run` itself, so the tasks below name bare commands. Root-only — the
    # packages stay self-contained and ship no tasks of their own.
    "poethepoet>=0.34,<1",
    # Runs the commit and push hooks — locally via `pre-commit install` and in CI as
    # `pre-commit run --all-files` (tests.yml), so the config cannot rot while every
    # local copy stays green.
    "pre-commit>=4.6.2,<4.7",
    # Every sample that talks to a model imports this, and nothing else here pulls it in.
    # Wide where the tooling bands are narrow, and deliberately: a sample declares it unpinned,
    # so a check held to an older minor would pass against a version no live run uses.
    "agent-framework-openai>=1.13.0,<2",
]

# Lint rules for the tree *outside* packages/* — samples/, tests/, scripts/, which belong to no
# package. ruff resolves [tool.ruff] per file from the nearest ancestor that has one, so this root
# section reaches that tree while each package still answers to its own; their self-containment is
# what it was. Without it these files would fall back to ruff's defaults — the gap #274 closed.
#
# The rules mirror every package's: `I`, `UP`, the `D100`/`D101`/`D103`/`D104` docstring rules,
# the length rules (`E501`, `W505` with `max-doc-length = 100`), and the hygiene pins (`TD`,
# `FIX`, `ERA001`), at `line-length = 100`. `tests/**` is ignored for `D101`/`D103` for the same
# reason each package ignores its own tests — the repo's `tests/` is repository-level wiring, no
# different in kind from a package's, not API surface. #292 and #454 carry the decisions and the
# measurements behind them.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP", "D100", "D101", "D103", "D104", "E501", "W505", "TD", "FIX", "ERA001"]

# Mirrors each package's tests/** ignore: repo-level tests/ is wiring, not API surface.
# Length rules join the docstring pair so fixtures that exercise live samples are exempt.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D101", "D103", "E501", "W505"]
"scripts/**" = ["E501", "W505"]
"samples/**" = ["E501", "W505"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

# Repo-level pyright for the code the per-package strict configs do not cover: scripts/, the
# test trees and samples/. Package src/ stays on its own per-package strict config (uv run
# pyright -p packages/<pkg>, include = ["src"]), which -p selects directly; this config never
# applies to src.
#
# samples/ is here because nothing else catches a sample naming an attribute another package
# deleted until the sample runs for real, which is `verify-live`, after a release.
[tool.pyright]
include = ["scripts", "tests", "samples", "packages/*/tests/**"]
typeCheckingMode = "standard"
# scripts/ is under no execution environment, so it stays at full standard — the phase-1
# behavior, unchanged. Each test tree is its own execution environment (root takes a single
# path, not a glob) that relaxes the four rules which fire on intentional loose fakes to
# warnings: protocol-skipping backends (reportArgumentType), Optional attribute access on fake
# returns (reportOptionalMemberAccess), fake subclasses overriding with incompatible signatures
# (reportIncompatibleMethodOverride), and `in`/`not in` on Optional results (reportOperatorIssue).
# They warn rather than error so the pass stays green on known fakes without going silent on
# them; every other rule stays an error and catches real drift. reportMissingImports is
# deliberately not relaxed. The tests/ env also puts sample 09 on extraPaths so pyright can
# resolve the runtime sys.path import in test_no_isolation_backend.py instead of suppressing it.
#
# **samples/ relaxes nothing** — a sample is code an adopter copies, and the two sites that would
# want those four are not loose fakes. They carry an inline `# pyright: ignore[...]` naming the
# reason. Its execution environment exists to *tighten*: reportUnnecessaryTypeIgnoreComment fails
# the build on a suppression that no longer suppresses anything, which is what makes suppressing
# inline safe. Scoped here rather than at the root, where the package test trees still carry
# stale ones.
executionEnvironments = [
  { root = "samples", reportUnnecessaryTypeIgnoreComment = "error" },
  { root = "tests", extraPaths = ["samples/09_inprocess_bicep", "scripts"], reportArgumentType = "warning", reportOptionalMemberAccess = "warning", reportIncompatibleMethodOverride = "warning", reportOperatorIssue = "warning" },
  { root = "packages/maf-sandbox/tests", reportArgumentType = "warning", reportOptionalMemberAccess = "warning", reportIncompatibleMethodOverride = "warning", reportOperatorIssue = "warning" },
  { root = "packages/maf-sandbox-acas/tests", reportArgumentType = "warning", reportOptionalMemberAccess = "warning", reportIncompatibleMethodOverride = "warning", reportOperatorIssue = "warning" },
  { root = "packages/maf-sandbox-bicep/tests", reportArgumentType = "warning", reportOptionalMemberAccess = "warning", reportIncompatibleMethodOverride = "warning", reportOperatorIssue = "warning" },
  { root = "packages/maf-sandbox-codeact/tests", reportArgumentType = "warning", reportOptionalMemberAccess = "warning", reportIncompatibleMethodOverride = "warning", reportOperatorIssue = "warning" },
  { root = "packages/maf-sandbox-docker/tests", reportArgumentType = "warning", reportOptionalMemberAccess = "warning", reportIncompatibleMethodOverride = "warning", reportOperatorIssue = "warning" },
  { root = "packages/maf-sandbox-wslc/tests", reportArgumentType = "warning", reportOptionalMemberAccess = "warning", reportIncompatibleMethodOverride = "warning", reportOperatorIssue = "warning" },
]

# From-the-root test runs. Each package also carries its own [tool.pytest.ini_options] for
# in-package runs; pytest binds exactly one rootdir per invocation, so running from here
# uses this list and running inside a package uses that package's own configuration.
[tool.pytest.ini_options]
# `slow` marks tests that spawn pyright (the markdown-block linter's drift
# round-trip) and so cost seconds each; they stay on by default, and `-m "not slow"`
# drops them for a fast local loop.
markers = [
    "slow: spawns pyright per block — keep on by default, deselect with -m 'not slow'",
]
testpaths = [
    # Repository-level wiring (release registration) — belongs to no single package.
    "tests",
    "packages/maf-sandbox/tests",
    "packages/maf-sandbox-acas/tests",
    "packages/maf-sandbox-bicep/tests",
    "packages/maf-sandbox-codeact/tests",
    "packages/maf-sandbox-docker/tests",
    "packages/maf-sandbox-wslc/tests",
]
faulthandler_timeout = 90.0

# The local gate, run as `uv run poe gate` — poe detects uv.lock and executes every task
# through `uv run` itself, so the commands below are bare. CI keeps its own explicit steps
# (per-step annotations, no indirection); this is the contributor-side one-command form of the
# same gate, and `scripts/gate_tasks.py` is the one discovery implementation both share —
# `poe types-packages` calls it, and `tests/test_pr_gate_enumerates.py` pins that CI's loops
# agree with it (#450).
[tool.poe.tasks]
test = "pytest -q"
lint = "ruff check ."
format = "ruff format --check ."
types = "pyright"

[tool.poe.tasks.types-packages]
help = "Every package's strict pyright pass, enumerated from the workspace"
script = "gate_tasks:pyright_packages"
env.PYTHONPATH = "scripts"

[tool.poe.tasks.md-blocks]
help = "Lint the python blocks in the markdown against the installed packages (report-only in CI)"
cmd = "python scripts/check_md_code_blocks.py README.md 'packages/*/README.md' 'samples/**/*.md' RELEASING.md"

[tool.poe.tasks.gate]
help = "The full pre-PR gate: tests, lint, format, both pyright passes"
sequence = ["test", "lint", "format", "types-packages", "types"]
