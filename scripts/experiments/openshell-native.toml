[openshell]
version = 2

[openshell.gateway]
bind_address = "127.0.0.1:19797"
log_level = "info"
compute_driver = "docker"
disable_tls = true

[openshell.gateway.auth]
allow_unauthenticated_users = true

[openshell.gateway.gateway_jwt]
signing_key_path = "/tmp/spike-signing.pem"
public_key_path = "/tmp/spike-public.pem"
kid_path = "/tmp/spike-kid"
gateway_id = "openshell-native-fixture"

[openshell.drivers.docker]
image_pull_policy = "never"
sandbox_label = "maf-openshell-1833"
sandbox_runtime_image = "ghcr.io/nvidia/openshell/sandbox@sha256:89819c03f291d9b909c3fc2962360e24af4516627422d18f3e681829f003f347"
supervisor_image = "ghcr.io/nvidia/openshell/supervisor@sha256:a07864bd0c546716039c2000a919f50ce8f7f1f67ba37dda350cf64d3a7cfb06"
app_armor_profile = "Unconfined"
