<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="flow-title flow-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="flow-title">How a sandbox workload attaches to a MAF agent</title>
  <desc id="flow-desc">Inside the host application, the agent produces untrusted code, which passes through middleware to a tool and then to the router. The router's right edge is the process boundary. Two arrows cross it: files in, to the sandbox, and result out, back again. The sandbox holds a work dir, the running code and a declared output, and has a single egress valve that is closed unless allowed.</desc>

  <defs>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c98a2e"/>
    </marker>
    <marker id="slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8694"/>
    </marker>
  </defs>

  <!-- ── host application ─────────────────────────────────────────────── -->
  <rect x="30" y="40" width="370" height="320" rx="14" fill="#8b7fd4" fill-opacity="0.10" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="215" y="66" text-anchor="middle" font-size="15" fill="#7d8694">host application</text>

  <rect x="85" y="86" width="170" height="40" rx="7" fill="#8b7fd4" fill-opacity="0.20" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="170" y="111" text-anchor="middle" font-size="14" fill="#7d8694">agent</text>

  <rect x="85" y="150" width="170" height="40" rx="7" fill="#8b7fd4" fill-opacity="0.20" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="170" y="175" text-anchor="middle" font-size="14" fill="#7d8694">middleware</text>

  <rect x="85" y="214" width="170" height="40" rx="7" fill="#8b7fd4" fill-opacity="0.20" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="170" y="239" text-anchor="middle" font-size="14" fill="#7d8694">tool</text>

  <rect x="85" y="278" width="170" height="62" rx="7" fill="#8b7fd4" fill-opacity="0.28" stroke="#8b7fd4" stroke-width="2"/>
  <text x="170" y="315" text-anchor="middle" font-size="15" fill="#7d8694">router</text>

  <line x1="170" y1="126" x2="170" y2="146" stroke="#7d8694" stroke-width="1.6" marker-end="url(#slate)"/>
  <line x1="170" y1="190" x2="170" y2="210" stroke="#7d8694" stroke-width="1.6" marker-end="url(#slate)"/>
  <line x1="170" y1="254" x2="170" y2="274" stroke="#7d8694" stroke-width="1.6" marker-end="url(#slate)"/>

  <!-- untrusted code, tagged onto what the agent produced -->
  <line x1="180" y1="136" x2="274" y2="136" stroke="#cf5a52" stroke-width="1" stroke-dasharray="3 2"/>
  <path d="M 286 124 l 3.2 7.4 l 8-1.6 l -4 6.2 l 6.4 5 l -8 0.6 l 0.8 8 l -6.4-4.8 l -6.4 4.8 l 0.8-8 l -8-0.6 l 6.4-5 l -4-6.2 l 8 1.6 z" fill="#cf5a52" fill-opacity="0.25" stroke="#cf5a52" stroke-width="1.2"/>
  <text x="304" y="133" font-size="11" fill="#cf5a52">untrusted</text>
  <text x="304" y="146" font-size="11" fill="#cf5a52">code</text>

  <text x="266" y="234" font-size="10.5" fill="#9aa1ac">the call</text>
  <text x="266" y="247" font-size="10.5" fill="#9aa1ac">stays here</text>

  <!-- ── the process boundary is the host's own right edge ─────────────── -->
  <line x1="400" y1="40" x2="400" y2="360" stroke="#7d8694" stroke-width="2.4" stroke-dasharray="7 5"/>
  <text x="400" y="28" text-anchor="middle" font-size="12.5" fill="#7d8694">process boundary</text>

  <!-- ── sandbox ──────────────────────────────────────────────────────── -->
  <rect x="520" y="150" width="390" height="210" rx="14" fill="#2fa8a0" fill-opacity="0.12" stroke="#2fa8a0" stroke-width="2.4"/>
  <rect x="527" y="157" width="376" height="196" rx="9" fill="none" stroke="#2fa8a0" stroke-width="1"/>
  <text x="715" y="182" text-anchor="middle" font-size="15" fill="#7d8694">sandbox</text>

  <!-- work dir -->
  <rect x="567" y="206" width="20" height="7" rx="2" fill="#2fa8a0" fill-opacity="0.35" stroke="#2fa8a0" stroke-width="1.3"/>
  <rect x="567" y="212" width="46" height="28" rx="3" fill="#2fa8a0" fill-opacity="0.25" stroke="#2fa8a0" stroke-width="1.3"/>
  <text x="590" y="262" text-anchor="middle" font-size="12" fill="#7d8694">work dir</text>

  <!-- the code runs here -->
  <circle cx="715" cy="224" r="15" fill="#2fa8a0" fill-opacity="0.25" stroke="#2fa8a0" stroke-width="1.3"/>
  <circle cx="715" cy="224" r="5" fill="none" stroke="#2fa8a0" stroke-width="1.3"/>
  <rect x="711" y="203" width="8" height="6" rx="1.5" fill="#2fa8a0" fill-opacity="0.5"/>
  <rect x="711" y="239" width="8" height="6" rx="1.5" fill="#2fa8a0" fill-opacity="0.5"/>
  <rect x="694" y="220" width="6" height="8" rx="1.5" fill="#2fa8a0" fill-opacity="0.5"/>
  <rect x="730" y="220" width="6" height="8" rx="1.5" fill="#2fa8a0" fill-opacity="0.5"/>
  <text x="715" y="262" text-anchor="middle" font-size="12" fill="#7d8694">the code</text>
  <text x="715" y="276" text-anchor="middle" font-size="12" fill="#7d8694">runs here</text>

  <!-- declared output -->
  <path d="M 824 204 h 24 l 10 10 v 26 a2 2 0 0 1 -2 2 h -32 a2 2 0 0 1 -2 -2 v -34 a2 2 0 0 1 2 -2 z" fill="#2fa8a0" fill-opacity="0.25" stroke="#2fa8a0" stroke-width="1.3"/>
  <path d="M 848 204 v 10 h 10" fill="none" stroke="#2fa8a0" stroke-width="1.3"/>
  <text x="840" y="262" text-anchor="middle" font-size="12" fill="#7d8694">declared</text>
  <text x="840" y="276" text-anchor="middle" font-size="12" fill="#7d8694">output</text>

  <!-- egress: one small valve, mostly shut -->
  <line x1="910" y1="196" x2="952" y2="196" stroke="#7d8694" stroke-width="1.8" marker-end="url(#slate)"/>
  <circle cx="922" cy="196" r="7.5" fill="#8b7fd4" fill-opacity="0.15" stroke="#7d8694" stroke-width="1.6"/>
  <line x1="922" y1="186" x2="922" y2="206" stroke="#7d8694" stroke-width="1.6"/>
  <text x="992" y="224" text-anchor="end" font-size="11" fill="#7d8694">egress: closed</text>
  <text x="992" y="238" text-anchor="end" font-size="11" fill="#7d8694">unless allowed</text>

  <!-- ── the two crossings, and nothing else crosses ───────────────────── -->
  <line x1="258" y1="296" x2="514" y2="296" stroke="#c98a2e" stroke-width="3" marker-end="url(#amber)"/>
  <text x="330" y="287" text-anchor="middle" font-size="12.5" fill="#c98a2e">files in</text>

  <line x1="514" y1="326" x2="258" y2="326" stroke="#c98a2e" stroke-width="3" marker-end="url(#amber)"/>
  <text x="330" y="346" text-anchor="middle" font-size="12.5" fill="#c98a2e">result out</text>
</svg>
