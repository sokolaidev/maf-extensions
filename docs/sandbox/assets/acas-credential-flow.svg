<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 665" width="1180" height="665" role="img" aria-labelledby="acas-credential-flow-title acas-credential-flow-desc" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, Helvetica, Arial, sans-serif">
  <title id="acas-credential-flow-title">ACAS credentials: capture requests, recover cleanup</title>
  <desc id="acas-credential-flow-desc">Active requests select an authority binding from trusted host context. Later dispose and scope-purge operations recover a binding through durable host policy based on the target key or scope. The resolver returns authority, generation and a fresh-credential factory. SDK clients are pooled by event loop, authority and generation, then authenticate calls to ACAS. An acquired wrapper retains its binding despite ambient context changes. Guest group identity is separate and these credentials never enter the guest.</desc>
  <defs>
    <marker id="acas-credential-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8694"/></marker>
  </defs>
  <rect width="1180" height="665" rx="16" fill="#ffffff"/>
  <text x="32" y="43" font-size="25" font-weight="600" fill="#243040">ACAS credentials: capture requests, recover cleanup</text>
  <text x="32" y="76" font-size="17" font-weight="400" fill="#526072">All credentials shown here belong to the host&#x27;s service API access.</text>
  <rect x="32" y="126" width="336" height="127" rx="12" fill="#f3f0fb" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="52" y="159" font-size="21" font-weight="600" fill="#243040">Active request</text>
  <text x="52" y="190" font-size="17" font-weight="400" fill="#526072">Trusted request context</text>
  <text x="52" y="216" font-size="17" font-weight="400" fill="#526072">Capture its grant on acquire</text>
  <rect x="32" y="327" width="336" height="127" rx="12" fill="#f3f0fb" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="52" y="360" font-size="21" font-weight="600" fill="#243040">Later cleanup</text>
  <text x="52" y="391" font-size="17" font-weight="400" fill="#526072">Target scope / thread / key</text>
  <text x="52" y="417" font-size="17" font-weight="400" fill="#526072">Durable host recovery policy</text>
  <rect x="441" y="224" width="302" height="159" rx="12" fill="#f3f0fb" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="461" y="257" font-size="21" font-weight="600" fill="#243040">Credential binding</text>
  <text x="461" y="288" font-size="17" font-weight="400" fill="#526072">Authority + generation</text>
  <text x="461" y="314" font-size="17" font-weight="400" fill="#526072">Fresh-credential factory</text>
  <text x="461" y="340" font-size="17" font-weight="400" fill="#526072">No fallback after failure</text>
  <rect x="818" y="224" width="330" height="159" rx="12" fill="#f4f5f7" stroke="#7d8694" stroke-width="1.5"/>
  <text x="838" y="257" font-size="21" font-weight="600" fill="#243040">SDK client pool</text>
  <text x="838" y="288" font-size="17" font-weight="400" fill="#526072">Key: loop + authority +</text>
  <text x="838" y="314" font-size="17" font-weight="400" fill="#526072">generation</text>
  <text x="838" y="340" font-size="17" font-weight="400" fill="#526072">Bounded capacity per loop</text>
  <path d="M 368 189 L 399 189 L 399 270 L 441 270" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#acas-credential-flow-arrow)"/>
  <path d="M 368 390 L 399 390 L 399 336 L 441 336" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#acas-credential-flow-arrow)"/>
  <path d="M 743 302 L 818 302" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#acas-credential-flow-arrow)"/>
  <rect x="441" y="480" width="302" height="115" rx="12" fill="#f4f5f7" stroke="#7d8694" stroke-width="1.5"/>
  <text x="461" y="513" font-size="21" font-weight="600" fill="#243040">Acquired wrapper</text>
  <text x="461" y="544" font-size="16" font-weight="400" fill="#526072">Keeps the captured binding</text>
  <text x="461" y="570" font-size="16" font-weight="400" fill="#526072">for later sandbox operations</text>
  <path d="M 592 383 L 592 480" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#acas-credential-flow-arrow)"/>
  <rect x="818" y="480" width="330" height="115" rx="12" fill="#f4f5f7" stroke="#7d8694" stroke-width="1.5"/>
  <text x="838" y="513" font-size="21" font-weight="600" fill="#243040">ACAS service</text>
  <text x="838" y="544" font-size="17" font-weight="400" fill="#526072">Host SDK authenticates here</text>
  <text x="838" y="570" font-size="17" font-weight="400" fill="#526072">Guest identity is separate</text>
  <path d="M 983 383 L 983 480" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#acas-credential-flow-arrow)"/>
  <text x="32" y="525" font-size="17" font-weight="400" fill="#526072">Factories recreate the captured</text>
  <text x="32" y="551" font-size="17" font-weight="400" fill="#526072">grant, not current ambient context.</text>
  <text x="32" y="630" font-size="17" font-weight="400" fill="#526072">aclose() drains and closes SDK resources. Sandbox disposal is a separate operation.</text>
</svg>
