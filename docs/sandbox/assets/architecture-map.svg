<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 755" width="1180" height="755" role="img" aria-labelledby="architecture-map-title architecture-map-desc" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, Helvetica, Arial, sans-serif">
  <title id="architecture-map-title">From a model call to sandbox work and labelled results</title>
  <desc id="architecture-map-desc">The model calls through framework middleware into a kind and its wrapper. The router checks the workload and selects a backend, which sends operations to the guest. Guest results return to the kind for output collection and result construction. Labelled content returns through the framework to the model; declared artifacts go to the host sink. An optional guest-to-host tool channel runs through the host registry and its own checks, bypassing the outer framework middleware.</desc>
  <defs>
    <marker id="architecture-map-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8694"/></marker>
  </defs>
  <rect width="1180" height="755" rx="16" fill="#ffffff"/>
  <text x="32" y="43" font-size="25" font-weight="600" fill="#243040">From a model call to sandbox work and labelled results</text>
  <text x="32" y="76" font-size="17" font-weight="400" fill="#526072">The host owns policy and storage. The backend owns the execution boundary.</text>
  <rect x="32" y="128" width="284" height="156" rx="12" fill="#f3f0fb" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="52" y="161" font-size="21" font-weight="600" fill="#243040">Model + middleware</text>
  <text x="52" y="192" font-size="16" font-weight="400" fill="#526072">Admit the tool call</text>
  <text x="52" y="218" font-size="16" font-weight="400" fill="#526072">Track content labels</text>
  <text x="52" y="244" font-size="16" font-weight="400" fill="#526072">Enforce destination policy</text>
  <rect x="375" y="128" width="284" height="156" rx="12" fill="#f4f5f7" stroke="#7d8694" stroke-width="1.5"/>
  <text x="395" y="161" font-size="21" font-weight="600" fill="#243040">Kind + wrapper</text>
  <text x="395" y="192" font-size="16" font-weight="400" fill="#526072">Derive the trusted key</text>
  <text x="395" y="218" font-size="16" font-weight="400" fill="#526072">Apply the workload spec</text>
  <text x="395" y="244" font-size="16" font-weight="400" fill="#526072">Own call state + cleanup</text>
  <rect x="720" y="128" width="428" height="156" rx="12" fill="#f4f5f7" stroke="#7d8694" stroke-width="1.5"/>
  <text x="740" y="161" font-size="21" font-weight="600" fill="#243040">Router + backend</text>
  <text x="740" y="192" font-size="16" font-weight="400" fill="#526072">Match declarations to requirements</text>
  <text x="740" y="218" font-size="16" font-weight="400" fill="#526072">Acquire and operate the sandbox</text>
  <text x="740" y="244" font-size="16" font-weight="400" fill="#526072">Enforce the backend contract</text>
  <path d="M 316 206 L 375 206" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#architecture-map-arrow)"/>
  <path d="M 659 206 L 720 206" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#architecture-map-arrow)"/>
  <rect x="720" y="358" width="428" height="156" rx="12" fill="#e7f5f3" stroke="#2fa8a0" stroke-width="1.5"/>
  <text x="740" y="391" font-size="21" font-weight="600" fill="#243040">Guest workload</text>
  <text x="740" y="422" font-size="16" font-weight="400" fill="#526072">Run commands or code</text>
  <text x="740" y="448" font-size="16" font-weight="400" fill="#526072">Read and write guest files</text>
  <text x="740" y="474" font-size="16" font-weight="400" fill="#526072">Use only provided channels</text>
  <path d="M 934 284 L 934 358" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#architecture-map-arrow)"/>
  <text x="947" y="326" font-size="16" font-weight="400" fill="#526072">Operations</text>
  <rect x="375" y="358" width="284" height="156" rx="12" fill="#f4f5f7" stroke="#7d8694" stroke-width="1.5"/>
  <text x="395" y="391" font-size="21" font-weight="600" fill="#243040">Collect and build</text>
  <text x="395" y="422" font-size="16" font-weight="400" fill="#526072">Check declared outputs</text>
  <text x="395" y="448" font-size="16" font-weight="400" fill="#526072">Construct result items</text>
  <text x="395" y="474" font-size="16" font-weight="400" fill="#526072">Apply content labels</text>
  <path d="M 720 436 L 659 436" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#architecture-map-arrow)"/>
  <path d="M 517 284 L 517 358" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#architecture-map-arrow)"/>
  <rect x="32" y="358" width="284" height="156" rx="12" fill="#f3f0fb" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="52" y="391" font-size="21" font-weight="600" fill="#243040">Content items</text>
  <text x="52" y="422" font-size="16" font-weight="400" fill="#526072">Guidance and derived data</text>
  <text x="52" y="448" font-size="16" font-weight="400" fill="#526072">Integrity + confidentiality</text>
  <text x="52" y="474" font-size="16" font-weight="400" fill="#526072">Back through middleware</text>
  <path d="M 375 436 L 316 436" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#architecture-map-arrow)"/>
  <path d="M 174 358 L 174 284" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#architecture-map-arrow)"/>
  <rect x="375" y="588" width="284" height="115" rx="12" fill="#f3f0fb" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="395" y="621" font-size="21" font-weight="600" fill="#243040">Host output sink</text>
  <text x="395" y="652" font-size="16" font-weight="400" fill="#526072">Stores checked artifacts</text>
  <text x="395" y="678" font-size="16" font-weight="400" fill="#526072">Host chooses destination</text>
  <path d="M 517 514 L 517 588" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#architecture-map-arrow)"/>
  <text x="531" y="557" font-size="16" font-weight="400" fill="#526072">Artifacts</text>
  <rect x="720" y="588" width="428" height="115" rx="12" fill="#fff5e7" stroke="#c88a37" stroke-width="1.5"/>
  <text x="740" y="621" font-size="21" font-weight="600" fill="#243040">Optional host-tool registry</text>
  <text x="740" y="652" font-size="16" font-weight="400" fill="#526072">Own gates, budgets and identity checks</text>
  <text x="740" y="678" font-size="16" font-weight="400" fill="#526072">Nested calls bypass outer middleware</text>
  <path d="M 934 514 L 934 588" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#architecture-map-arrow)"/>
  <text x="947" y="557" font-size="16" font-weight="400" fill="#526072">Host-tool calls</text>
</svg>
