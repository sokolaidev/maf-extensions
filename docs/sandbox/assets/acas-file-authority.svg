<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 565" width="1180" height="565" role="img" aria-labelledby="acas-file-authority-title acas-file-authority-desc" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, Helvetica, Arial, sans-serif">
  <title id="acas-file-authority-title">ACAS: writes and reads use different authority</title>
  <desc id="acas-file-authority-desc">Workload writes and removals run through guest execution with the guest&#x27;s permissions. Native read, stat and list operations use the service file API with host authority. Their path check and final access are separate, so a guest can replace a checked path between them. Working-directory setup and the removal probe also use the service file API. A successful probe does not grant atomic or guest-authority reads.</desc>
  <defs>
    <marker id="acas-file-authority-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8694"/></marker>
  </defs>
  <rect width="1180" height="565" rx="16" fill="#ffffff"/>
  <text x="32" y="43" font-size="25" font-weight="600" fill="#243040">ACAS: writes and reads use different authority</text>
  <text x="32" y="76" font-size="17" font-weight="400" fill="#526072">A successful path check does not hold the path still for the next operation.</text>
  <rect x="32" y="130" width="290" height="118" rx="12" fill="#f4f5f7" stroke="#7d8694" stroke-width="1.5"/>
  <text x="52" y="163" font-size="21" font-weight="600" fill="#243040">Write / remove</text>
  <text x="52" y="194" font-size="17" font-weight="400" fill="#526072">Workload file operations</text>
  <rect x="402" y="130" width="320" height="118" rx="12" fill="#e7f5f3" stroke="#2fa8a0" stroke-width="1.5"/>
  <text x="422" y="163" font-size="21" font-weight="600" fill="#243040">Guest execution</text>
  <text x="422" y="194" font-size="17" font-weight="400" fill="#526072">Guest permissions</text>
  <text x="422" y="220" font-size="17" font-weight="400" fill="#526072">No privileged write fallback</text>
  <rect x="822" y="187" width="326" height="208" rx="12" fill="#e7f5f3" stroke="#2fa8a0" stroke-width="1.5"/>
  <text x="842" y="220" font-size="21" font-weight="600" fill="#243040">Guest filesystem</text>
  <text x="842" y="251" font-size="16" font-weight="400" fill="#526072">Guest writes need permission</text>
  <text x="842" y="277" font-size="16" font-weight="400" fill="#526072">at the destination.</text>
  <text x="842" y="303" font-size="16" font-weight="400" fill="#526072"></text>
  <text x="842" y="329" font-size="16" font-weight="400" fill="#526072">Native reads use the</text>
  <text x="842" y="355" font-size="16" font-weight="400" fill="#526072">service&#x27;s authority.</text>
  <path d="M 322 189 L 402 189" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#acas-file-authority-arrow)"/>
  <path d="M 722 189 L 772 189 L 772 238 L 822 238" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#acas-file-authority-arrow)"/>
  <rect x="32" y="332" width="290" height="118" rx="12" fill="#f4f5f7" stroke="#7d8694" stroke-width="1.5"/>
  <text x="52" y="365" font-size="21" font-weight="600" fill="#243040">Read / stat / list</text>
  <text x="52" y="396" font-size="17" font-weight="400" fill="#526072">Native file operations</text>
  <rect x="402" y="332" width="320" height="118" rx="12" fill="#fff5e7" stroke="#c88a37" stroke-width="1.5"/>
  <text x="422" y="365" font-size="21" font-weight="600" fill="#243040">Service file API</text>
  <text x="422" y="396" font-size="16" font-weight="400" fill="#526072">Check path, then access</text>
  <text x="422" y="422" font-size="16" font-weight="400" fill="#526072">Guest may change it between</text>
  <path d="M 322 391 L 402 391" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#acas-file-authority-arrow)"/>
  <path d="M 722 391 L 772 391 L 772 349 L 822 349" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#acas-file-authority-arrow)"/>
  <text x="32" y="294" font-size="17" font-weight="400" fill="#526072">Base-directory setup and the removal probe also use the service file API.</text>
  <rect x="32" y="484" width="1116" height="60" rx="12" fill="#fff5e7" stroke="#c88a37" stroke-width="1.5"/>
  <text x="52" y="517" font-size="21" font-weight="600" fill="#243040">Read limits, timeouts and later disposal do not close the path-replacement window.</text>
</svg>
