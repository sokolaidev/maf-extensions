<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 914" width="1180" height="914" role="img" aria-labelledby="drawio-layout-flow-title drawio-layout-flow-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="drawio-layout-flow-title">draw.io: preserve complete geometry or choose automatic layout</title>
  <desc id="drawio-layout-flow-desc">First parse and validate the XML and page count. For each page, check cells, endpoints and geometry. If preserve_layout is true and geometry is complete, preserve it. Otherwise automatic layout is required. It accepts only the supported flat graphs within layout limits; nested groups, relative ports, edge labels, collapsed cells and detached edges need complete supplied geometry with preservation. An unsupported automatic-layout case is refused. After either preserving geometry or applying Graphviz layout, add missing edge geometry and check the page again. Continue for every page. Write diagram.drawio and deliver it through OutputSink only after every page succeeds and the output is within its size limit. Any invalid page, failed layout or exceeded limit stops delivery; there is no partial artifact.</desc>
  <defs>
    <marker id="drawio-layout-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8694"/>
    </marker>
  </defs>
  <rect width="1180" height="914" rx="16" fill="#ffffff"/>
  <text x="32" y="43" font-size="25" font-weight="600" fill="#243040">draw.io: preserve complete geometry or choose automatic layout</text>
  <text x="32" y="76" font-size="17" fill="#526072">The host selects preserve_layout. The converter makes this choice for each page.</text>
  <rect x="32" y="112" width="1116" height="93" rx="12" fill="#f4f5f7" stroke="#7d8694" stroke-width="1.5"/>
  <text x="52" y="145" font-size="21" font-weight="600" fill="#243040">Parse XML and check page count</text>
  <text x="52" y="175" font-size="17" fill="#526072">Reject malformed or unsupported input before processing pages.</text>
  <rect x="32" y="247" width="1116" height="463" rx="12" fill="#f4f5f7" stroke="#7d8694" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="54" y="279" font-size="21" font-weight="600" fill="#243040">For every page</text>
  <rect x="54" y="306" width="278" height="100" rx="12" fill="#f4f5f7" stroke="#7d8694" stroke-width="1.5"/>
  <text x="74" y="339" font-size="21" font-weight="600" fill="#243040">Check the page</text>
  <text x="74" y="369" font-size="16" fill="#526072">Cells, endpoints and geometry</text>
  <path d="M 573.0 296 L 743 363.0 L 573.0 430 L 403 363.0 Z" fill="#f3f0fb" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="573.0" y="356.0" font-size="17" text-anchor="middle" fill="#243040">Preserve enabled</text>
  <text x="573.0" y="382.0" font-size="17" text-anchor="middle" fill="#243040">and geometry complete?</text>
  <rect x="800" y="313" width="326" height="93" rx="12" fill="#e7f5f3" stroke="#2fa8a0" stroke-width="1.5"/>
  <text x="820" y="346" font-size="21" font-weight="600" fill="#243040">Keep supplied geometry</text>
  <text x="820" y="376" font-size="17" fill="#526072">No automatic layout needed.</text>
  <path d="M 280 205 V 294" fill="none" stroke="#7d8694" stroke-width="2" marker-end="url(#drawio-layout-flow-arrow)"/>
  <path d="M 332 363 H 391" fill="none" stroke="#7d8694" stroke-width="2" marker-end="url(#drawio-layout-flow-arrow)"/>
  <path d="M 743 363 H 788" fill="none" stroke="#7d8694" stroke-width="2" marker-end="url(#drawio-layout-flow-arrow)"/>
  <text x="759" y="346" font-size="16" fill="#526072">Yes</text>
  <path d="M 573.0 451 L 743 513.0 L 573.0 575 L 403 513.0 Z" fill="#f3f0fb" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="573.0" y="506.0" font-size="17" text-anchor="middle" fill="#243040">Automatic layout</text>
  <text x="573.0" y="532.0" font-size="17" text-anchor="middle" fill="#243040">supported?</text>
  <path d="M 573 430 V 439" fill="none" stroke="#7d8694" stroke-width="2" marker-end="url(#drawio-layout-flow-arrow)"/>
  <text x="590" y="446" font-size="16" fill="#526072">No</text>
  <rect x="54" y="466" width="278" height="110" rx="12" fill="#e7f5f3" stroke="#2fa8a0" stroke-width="1.5"/>
  <text x="74" y="499" font-size="21" font-weight="600" fill="#243040">Apply Graphviz layout</text>
  <text x="74" y="529" font-size="16" fill="#526072">Supported flat graph;</text>
  <text x="74" y="555" font-size="16" fill="#526072">within vertex and edge limits.</text>
  <rect x="800" y="466" width="326" height="110" rx="12" fill="#fff5e7" stroke="#c88a37" stroke-width="1.5"/>
  <text x="820" y="499" font-size="21" font-weight="600" fill="#243040">Refuse this page</text>
  <text x="820" y="529" font-size="17" fill="#526072">Unsupported automatic layout.</text>
  <text x="820" y="555" font-size="17" fill="#526072">Return an error; deliver no file.</text>
  <path d="M 403 513 H 344" fill="none" stroke="#7d8694" stroke-width="2" marker-end="url(#drawio-layout-flow-arrow)"/>
  <text x="354" y="495" font-size="16" fill="#526072">Yes</text>
  <path d="M 743 513 H 788" fill="none" stroke="#7d8694" stroke-width="2" marker-end="url(#drawio-layout-flow-arrow)"/>
  <text x="759" y="495" font-size="16" fill="#526072">No</text>
  <rect x="408" y="609" width="340" height="78" rx="12" fill="#f4f5f7" stroke="#7d8694" stroke-width="1.5"/>
  <text x="428" y="642" font-size="21" font-weight="600" fill="#243040">Check finished geometry</text>
  <text x="428" y="672" font-size="16" fill="#526072">Fill missing edge geometry; verify.</text>
  <path d="M 963 406 V 436 H 1136 V 648 H 760" fill="none" stroke="#7d8694" stroke-width="2" marker-end="url(#drawio-layout-flow-arrow)"/>
  <path d="M 193 576 V 648 H 396" fill="none" stroke="#7d8694" stroke-width="2" marker-end="url(#drawio-layout-flow-arrow)"/>
  <rect x="308" y="768" width="644" height="81" rx="12" fill="#f3f0fb" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="328" y="801" font-size="21" font-weight="600" fill="#243040">Write diagram.drawio and deliver to OutputSink</text>
  <text x="328" y="831" font-size="17" fill="#526072">Only after every page succeeds and the output fits the size limit.</text>
  <path d="M 578 687 V 756" fill="none" stroke="#7d8694" stroke-width="2" marker-end="url(#drawio-layout-flow-arrow)"/>
  <text x="591" y="742" font-size="16" fill="#526072">After all pages</text>
  <text x="32" y="884" font-size="16" fill="#526072">Any invalid page, failed layout or exceeded limit stops delivery. There is no partial artifact.</text>
</svg>
