<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 655" width="1180" height="655" role="img" aria-labelledby="file-provenance-title file-provenance-desc" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, Helvetica, Arial, sans-serif">
  <title id="file-provenance-title">Share one provenance record across writes and reads</title>
  <desc id="file-provenance-desc">One FileStoreProvenance record is supplied to write-observing middleware, file listings and sandboxed reads. Model-driven mutations lower recorded integrity to untrusted after the writing call returns. A read captures the record&#x27;s value and change counter before and after fetching bytes. Stable evidence combines with the listing&#x27;s integrity. Any intervening record change leaves the read unlabelled. An optional required-integrity setting refuses weaker evidence. Writes still in flight can precede their provenance record.</desc>
  <defs>
    <marker id="file-provenance-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8694"/></marker>
  </defs>
  <rect width="1180" height="655" rx="16" fill="#ffffff"/>
  <text x="32" y="43" font-size="25" font-weight="600" fill="#243040">Share one provenance record across writes and reads</text>
  <text x="32" y="76" font-size="17" font-weight="400" fill="#526072">A file-store path has evidence about integrity, not a permanent guarantee about its bytes.</text>
  <rect x="32" y="135" width="330" height="152" rx="12" fill="#f3f0fb" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="52" y="168" font-size="21" font-weight="600" fill="#243040">Observed write</text>
  <text x="52" y="199" font-size="16" font-weight="400" fill="#526072">Middleware records in finally</text>
  <text x="52" y="225" font-size="16" font-weight="400" fill="#526072">Record integrity: untrusted</text>
  <text x="52" y="251" font-size="16" font-weight="400" fill="#526072">One record per store</text>
  <rect x="425" y="135" width="320" height="152" rx="12" fill="#f4f5f7" stroke="#7d8694" stroke-width="1.5"/>
  <text x="445" y="168" font-size="21" font-weight="600" fill="#243040">Shared record</text>
  <text x="445" y="199" font-size="16" font-weight="400" fill="#526072">Path entries + change counter</text>
  <text x="445" y="225" font-size="16" font-weight="400" fill="#526072">Entry overrides host floor</text>
  <text x="445" y="251" font-size="16" font-weight="400" fill="#526072">Only the host can forget</text>
  <rect x="808" y="135" width="340" height="152" rx="12" fill="#f3f0fb" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="828" y="168" font-size="21" font-weight="600" fill="#243040">File listing</text>
  <text x="828" y="199" font-size="16" font-weight="400" fill="#526072">Fold the record into ListedFile</text>
  <text x="828" y="225" font-size="16" font-weight="400" fill="#526072">Pass the same record to</text>
  <text x="828" y="251" font-size="16" font-weight="400" fill="#526072">the sandboxed tool session</text>
  <path d="M 362 211 L 425 211" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#file-provenance-arrow)"/>
  <path d="M 745 211 L 808 211" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#file-provenance-arrow)"/>
  <rect x="32" y="373" width="330" height="141" rx="12" fill="#f4f5f7" stroke="#7d8694" stroke-width="1.5"/>
  <text x="52" y="406" font-size="21" font-weight="600" fill="#243040">Read bytes</text>
  <text x="52" y="437" font-size="15" font-weight="400" fill="#526072">State before → fetch → state after</text>
  <text x="52" y="463" font-size="15" font-weight="400" fill="#526072">Compare the change counter</text>
  <text x="52" y="489" font-size="15" font-weight="400" fill="#526072">and combine stable evidence</text>
  <path d="M 585 287 L 585 330 L 197 330 L 197 373" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#file-provenance-arrow)"/>
  <rect x="425" y="373" width="320" height="141" rx="12" fill="#e7f5f3" stroke="#2fa8a0" stroke-width="1.5"/>
  <text x="445" y="406" font-size="21" font-weight="600" fill="#243040">Stable evidence</text>
  <text x="445" y="437" font-size="15" font-weight="400" fill="#526072">Use the weaker read label</text>
  <text x="445" y="463" font-size="15" font-weight="400" fill="#526072">Apply requires_file_integrity</text>
  <text x="445" y="489" font-size="15" font-weight="400" fill="#526072">Deliver only admitted content</text>
  <rect x="808" y="373" width="340" height="141" rx="12" fill="#fff5e7" stroke="#c88a37" stroke-width="1.5"/>
  <text x="828" y="406" font-size="21" font-weight="600" fill="#243040">Record changed</text>
  <text x="828" y="437" font-size="16" font-weight="400" fill="#526072">Read remains unlabelled</text>
  <text x="828" y="463" font-size="16" font-weight="400" fill="#526072">Cannot meet an established</text>
  <text x="828" y="489" font-size="16" font-weight="400" fill="#526072">integrity requirement</text>
  <path d="M 362 423 L 425 423" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#file-provenance-arrow)"/>
  <path d="M 362 474 L 395 474 L 395 546 L 978 546 L 978 514" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#file-provenance-arrow)"/>
  <text x="32" y="610" font-size="17" font-weight="600" fill="#243040">A write still in flight can change bytes before middleware records it. A trusted floor includes this limit.</text>
</svg>
