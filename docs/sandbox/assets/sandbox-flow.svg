<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 670" width="1180" height="670" role="img" aria-labelledby="sandbox-flow-title sandbox-flow-desc" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, Helvetica, Arial, sans-serif">
  <title id="sandbox-flow-title">The tool call stays in the host; its work runs in the guest</title>
  <desc id="sandbox-flow-desc">The host application contains the agent, middleware, kind, tool wrapper and router. Middleware admits the call before the kind sends operations through the backend. Commands, code and files cross into the guest, which runs the program or runtime and has a storage base when required. Results return to the host for interpretation and labelled content construction. Outbound guest networking follows the selected policy. Optional guest-to-host tools use their own registry and are a separate channel.</desc>
  <defs>
    <marker id="sandbox-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8694"/></marker>
  </defs>
  <rect width="1180" height="670" rx="16" fill="#ffffff"/>
  <text x="32" y="43" font-size="25" font-weight="600" fill="#243040">The tool call stays in the host; its work runs in the guest</text>
  <text x="32" y="76" font-size="17" font-weight="400" fill="#526072">The backend provides the execution boundary and controls the crossings.</text>
  <rect x="32" y="130" width="490" height="417" rx="12" fill="#f3f0fb" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="52" y="163" font-size="21" font-weight="600" fill="#243040">Host application</text>
  <rect x="75" y="210" width="404" height="109" rx="12" fill="#f3f0fb" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="95" y="243" font-size="21" font-weight="600" fill="#243040">Agent + middleware</text>
  <text x="95" y="274" font-size="17" font-weight="400" fill="#526072">Read content and admit tool calls</text>
  <rect x="75" y="380" width="404" height="109" rx="12" fill="#f4f5f7" stroke="#7d8694" stroke-width="1.5"/>
  <text x="95" y="413" font-size="21" font-weight="600" fill="#243040">Kind + wrapper + router</text>
  <text x="95" y="444" font-size="17" font-weight="400" fill="#526072">Keep caller context and apply policy</text>
  <path d="M 277 319 L 277 380" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#sandbox-flow-arrow)"/>
  <rect x="658" y="130" width="490" height="417" rx="12" fill="#e7f5f3" stroke="#2fa8a0" stroke-width="1.5"/>
  <text x="678" y="163" font-size="21" font-weight="600" fill="#243040">Sandbox</text>
  <rect x="701" y="210" width="404" height="109" rx="12" fill="#e7f5f3" stroke="#2fa8a0" stroke-width="1.5"/>
  <text x="721" y="243" font-size="21" font-weight="600" fill="#243040">Program or runtime</text>
  <text x="721" y="274" font-size="17" font-weight="400" fill="#526072">Run the workload</text>
  <rect x="701" y="380" width="404" height="109" rx="12" fill="#e7f5f3" stroke="#2fa8a0" stroke-width="1.5"/>
  <text x="721" y="413" font-size="21" font-weight="600" fill="#243040">Guest storage</text>
  <text x="721" y="444" font-size="17" font-weight="400" fill="#526072">Storage base when the workload needs it</text>
  <path d="M 522 296 L 658 296" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#sandbox-flow-arrow)"/>
  <text x="538" y="281" font-size="16" font-weight="400" fill="#526072">Operations</text>
  <path d="M 658 433 L 522 433" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#sandbox-flow-arrow)"/>
  <text x="555" y="418" font-size="16" font-weight="400" fill="#526072">Results</text>
  <text x="32" y="602" font-size="18" font-weight="600" fill="#243040">Guest networking follows the selected egress mode. Host-tool calls use a separate registry.</text>
</svg>
