<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 545" width="1180" height="545" role="img" aria-labelledby="wslc-write-window-title wslc-write-window-desc" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, Helvetica, Arial, sans-serif">
  <title id="wslc-write-window-title">WSLC: a parent can change between check and copy</title>
  <desc id="wslc-write-window-desc">First, WSLC checks the existing parent path. A guest can then replace that parent with a symbolic link before the archive is submitted and extracted. The engine follows the changed parent with root authority and can place the upload in a protected directory inside the container. Guest uid and gid on archive entries affect result ownership, not placement authority. The supported interface has no constrained upload or container freeze to close this window.</desc>
  <defs>
    <marker id="wslc-write-window-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8694"/></marker>
  </defs>
  <rect width="1180" height="545" rx="16" fill="#ffffff"/>
  <text x="32" y="43" font-size="25" font-weight="600" fill="#243040">WSLC: a parent can change between check and copy</text>
  <text x="32" y="76" font-size="17" font-weight="400" fill="#526072">The upload is still performed with root authority inside the container.</text>
  <rect x="32" y="142" width="334" height="173" rx="12" fill="#f4f5f7" stroke="#7d8694" stroke-width="1.5"/>
  <text x="52" y="175" font-size="21" font-weight="600" fill="#243040">1. Check parent</text>
  <text x="52" y="206" font-size="17" font-weight="400" fill="#526072">Engine reports a directory.</text>
  <text x="52" y="232" font-size="17" font-weight="400" fill="#526072">The existing prefix is kept</text>
  <text x="52" y="258" font-size="17" font-weight="400" fill="#526072">out of the archive so its</text>
  <text x="52" y="284" font-size="17" font-weight="400" fill="#526072">metadata stays unchanged.</text>
  <rect x="423" y="142" width="334" height="173" rx="12" fill="#e7f5f3" stroke="#2fa8a0" stroke-width="1.5"/>
  <text x="443" y="175" font-size="21" font-weight="600" fill="#243040">2. Guest swaps parent</text>
  <text x="443" y="206" font-size="17" font-weight="400" fill="#526072">The guest replaces that</text>
  <text x="443" y="232" font-size="17" font-weight="400" fill="#526072">directory with a link before</text>
  <text x="443" y="258" font-size="17" font-weight="400" fill="#526072">the engine extracts the</text>
  <text x="443" y="284" font-size="17" font-weight="400" fill="#526072">submitted archive.</text>
  <rect x="814" y="142" width="334" height="173" rx="12" fill="#fff5e7" stroke="#c88a37" stroke-width="1.5"/>
  <text x="834" y="175" font-size="21" font-weight="600" fill="#243040">3. Engine copies as root</text>
  <text x="834" y="206" font-size="17" font-weight="400" fill="#526072">Extraction follows the</text>
  <text x="834" y="232" font-size="17" font-weight="400" fill="#526072">changed parent and may</text>
  <text x="834" y="258" font-size="17" font-weight="400" fill="#526072">write where the guest</text>
  <text x="834" y="284" font-size="17" font-weight="400" fill="#526072">has no write permission.</text>
  <path d="M 366 223 L 423 223" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#wslc-write-window-arrow)"/>
  <path d="M 757 223 L 814 223" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#wslc-write-window-arrow)"/>
  <rect x="32" y="370" width="1116" height="140" rx="12" fill="#fff5e7" stroke="#c88a37" stroke-width="1.5"/>
  <text x="52" y="403" font-size="21" font-weight="600" fill="#243040">Ownership does not establish placement authority</text>
  <text x="52" y="434" font-size="16" font-weight="400" fill="#526072">Guest uid/gid on the result does not prevent this redirection. Missing-child and base-directory creation share the window.</text>
  <text x="52" y="460" font-size="16" font-weight="400" fill="#526072">The demonstrated boundary is inside the container, not an escape into the Windows host filesystem.</text>
  <text x="52" y="486" font-size="16" font-weight="400" fill="#526072">No supported freeze or constrained upload closes it; choose another backend when this protection is required.</text>
</svg>
