<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 750" width="1180" height="750" role="img" aria-labelledby="drawio-title drawio-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="drawio-title">draw.io: artifact delivery and the text result are separate</title>
  <desc id="drawio-desc">The result contract gives draw.io trusted completion, verdict and fixed explanations, with separately labelled untrusted sink display or converter diagnostics. FIDES can hide untrusted items while leaving the verdict readable. Every item carries call confidentiality C: the host classification plus stricter argument confidentiality. Hidden text still contributes confidentiality. Later model-called tools enforce destination policy and host approvals. The artifact reaches the configured OutputSink during create_drawio.</desc>
  <defs>
    <marker id="drawio-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8694"/>
    </marker>
  </defs>
  <rect width="1180" height="750" rx="16" fill="#ffffff"/>
  <text x="32" y="43" font-size="25" font-weight="600" fill="#243040">draw.io: artifact delivery and the text result are separate</text>
  <text x="32" y="76" font-size="17" fill="#526072">The sink receives the file during create_drawio. The model receives separately labelled result items.</text>
  <rect x="32" y="112" width="340" height="300" rx="12" fill="#f4f5f7" stroke="#7d8694" stroke-width="1.5"/>
  <text x="52" y="148" font-size="22" font-weight="600" fill="#243040">Source tool</text>
  <text x="52" y="180" font-size="17" font-family="ui-monospace, Consolas, monospace" fill="#243040">create_drawio</text>
  <text x="52" y="244" font-size="16" font-family="ui-monospace, Consolas, monospace" fill="#243040">source_integrity</text>
  <text x="52" y="270" font-size="17" fill="#243040">trusted by the result contract</text>
  <text x="52" y="328" font-size="17" fill="#526072">Workload claim: untrusted</text>
  <text x="52" y="368" font-size="16" font-family="ui-monospace, Consolas, monospace" fill="#243040">confidentiality</text>
  <text x="52" y="394" font-size="17" fill="#526072">Host's result classification</text>
  <path d="M 372 260 H 410" fill="none" stroke="#7d8694" stroke-width="2" marker-end="url(#drawio-arrow)"/>
  <rect x="422" y="112" width="334" height="300" rx="12" fill="#f4f5f7" stroke="#7d8694" stroke-width="1.5"/>
  <text x="442" y="148" font-size="22" font-weight="600" fill="#243040">Content items</text>
  <text x="442" y="176" font-size="16" fill="#526072">Effective labels shown below</text>
  <rect x="442" y="190" width="294" height="88" rx="8" fill="#f3f0fb" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="456" y="214" font-size="17" font-weight="600" fill="#243040">Completion and verdict</text>
  <text x="456" y="238" font-size="15" fill="#526072">Plus any fixed explanation</text>
  <text x="456" y="263" font-size="17" font-family="ui-monospace, Consolas, monospace" fill="#243040">trusted / C</text>
  <rect x="442" y="290" width="294" height="74" rx="8" fill="#e7f5f3" stroke="#2fa8a0" stroke-width="1.5"/>
  <text x="456" y="318" font-size="17" font-weight="600" fill="#243040">Sink display or diagnostic</text>
  <text x="456" y="348" font-size="17" font-family="ui-monospace, Consolas, monospace" fill="#243040">untrusted / C</text>
  <text x="442" y="392" font-size="17" fill="#526072">No standing guidance</text>
  <path d="M 756 260 H 794" fill="none" stroke="#7d8694" stroke-width="2" marker-end="url(#drawio-arrow)"/>
  <text x="754" y="241" font-size="14" fill="#526072">FIDES</text>
  <rect x="806" y="112" width="342" height="300" rx="12" fill="#f3f0fb" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="826" y="148" font-size="22" font-weight="600" fill="#243040">Model</text>
  <text x="826" y="180" font-size="17" fill="#243040">Reads completion and verdict</text>
  <text x="826" y="207" font-size="16" fill="#526072">Output may be a hidden [var_…]</text>
  <text x="826" y="233" font-size="19" font-weight="600" fill="#243040">Conversation label</text>
  <text x="826" y="268" font-size="17" fill="#526072">Visible text affects integrity.</text>
  <text x="826" y="306" font-size="17" fill="#526072">Hidden content still counts</text>
  <text x="826" y="331" font-size="17" fill="#526072">toward confidentiality.</text>
  <text x="826" y="378" font-size="16" fill="#526072">References retain stored labels.</text>
  <path d="M 977 412 V 462" fill="none" stroke="#7d8694" stroke-width="2" marker-end="url(#drawio-arrow)"/>
  <text x="631" y="445" font-size="16" fill="#526072">Next model-called tool: text or a reference</text>
  <rect x="608" y="474" width="540" height="168" rx="12" fill="#f3f0fb" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="630" y="511" font-size="22" font-weight="600" fill="#243040">Framework policy</text>
  <text x="630" y="544" font-size="17" fill="#526072">Check conversation and argument labels.</text>
  <text x="630" y="574" font-size="17" fill="#526072">Apply the destination's limits and host approvals.</text>
  <text x="630" y="613" font-size="17" fill="#243040">Integrity opt-in does not waive confidentiality.</text>
  <path d="M 608 559 H 524" fill="none" stroke="#7d8694" stroke-width="2" marker-end="url(#drawio-arrow)"/>
  <text x="529" y="540" font-size="15" fill="#526072">If allowed</text>
  <rect x="32" y="474" width="480" height="168" rx="12" fill="#f3f0fb" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="52" y="511" font-size="22" font-weight="600" fill="#243040">Destination tools</text>
  <text x="52" y="541" font-size="17" fill="#526072">Later file readers, writers or other tools</text>
  <text x="52" y="580" font-size="16" font-family="ui-monospace, Consolas, monospace" fill="#243040">accepts_untrusted</text>
  <text x="52" y="613" font-size="16" font-family="ui-monospace, Consolas, monospace" fill="#243040">max_allowed_confidentiality</text>
  <text x="32" y="679" font-size="16" fill="#526072">C = call confidentiality: the host classification plus any stricter argument confidentiality.</text>
  <text x="32" y="706" font-size="16" fill="#526072">Hiding needs auto-hide and a trusted conversation. It does not apply to inspect_variable.</text>
  <text x="32" y="733" font-size="16" fill="#526072">The artifact goes directly to the configured OutputSink during create_drawio, before this next call.</text>
</svg>
