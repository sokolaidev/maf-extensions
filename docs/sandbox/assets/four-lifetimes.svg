<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 705" width="1180" height="705" role="img" aria-labelledby="four-lifetimes-title four-lifetimes-desc" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, Helvetica, Arial, sans-serif">
  <title id="four-lifetimes-title">A binding serves calls; sandbox lifetime follows policy</title>
  <desc id="four-lifetimes-desc">A binding lasts for the attached tool and serves multiple conversations. Conversation A and conversation B have separate sandboxes. Each call owns its own guest path. Only a call using the host-tools transport contains a run. Reuse across the illustrated calls requires explicit host permission and successful cleanup. With default disposal, a sandbox ends when its active calls drain. With call isolation, each call has its own sandbox.</desc>
  <defs>
    <marker id="four-lifetimes-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8694"/></marker>
  </defs>
  <rect width="1180" height="705" rx="16" fill="#ffffff"/>
  <text x="32" y="43" font-size="25" font-weight="600" fill="#243040">A binding serves calls; sandbox lifetime follows policy</text>
  <text x="32" y="76" font-size="17" font-weight="400" fill="#526072">This timeline shows conversation scope with reuse explicitly enabled and successful cleanup.</text>
  <rect x="32" y="120" width="1116" height="81" rx="12" fill="#f4f5f7" stroke="#7d8694" stroke-width="1.5"/>
  <text x="52" y="153" font-size="21" font-weight="600" fill="#243040">Binding: host configuration for one attached tool</text>
  <text x="52" y="184" font-size="16" font-weight="400" fill="#526072">Reads caller context on each call</text>
  <rect x="32" y="241" width="696" height="86" rx="12" fill="#e7f5f3" stroke="#2fa8a0" stroke-width="1.5"/>
  <text x="52" y="274" font-size="21" font-weight="600" fill="#243040">Sandbox A</text>
  <text x="52" y="305" font-size="16" font-weight="400" fill="#526072">One conversation key + kind</text>
  <rect x="32" y="369" width="190" height="109" rx="12" fill="#fff5e7" stroke="#c88a37" stroke-width="1.5"/>
  <text x="52" y="402" font-size="21" font-weight="600" fill="#243040">Call A1</text>
  <text x="52" y="433" font-size="16" font-weight="400" fill="#526072">Own guest path</text>
  <rect x="269" y="369" width="211" height="109" rx="12" fill="#fff5e7" stroke="#c88a37" stroke-width="1.5"/>
  <text x="289" y="402" font-size="21" font-weight="600" fill="#243040">Call A2</text>
  <text x="289" y="433" font-size="16" font-weight="400" fill="#526072">Own guest path</text>
  <text x="289" y="459" font-size="16" font-weight="400" fill="#526072">Includes a run</text>
  <rect x="527" y="369" width="201" height="109" rx="12" fill="#fff5e7" stroke="#c88a37" stroke-width="1.5"/>
  <text x="547" y="402" font-size="21" font-weight="600" fill="#243040">Call A3</text>
  <text x="547" y="433" font-size="16" font-weight="400" fill="#526072">Own guest path</text>
  <path d="M 127 327 L 127 369" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#four-lifetimes-arrow)"/>
  <path d="M 374 327 L 374 369" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#four-lifetimes-arrow)"/>
  <path d="M 627 327 L 627 369" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#four-lifetimes-arrow)"/>
  <rect x="784" y="241" width="364" height="86" rx="12" fill="#e7f5f3" stroke="#2fa8a0" stroke-width="1.5"/>
  <text x="804" y="274" font-size="21" font-weight="600" fill="#243040">Sandbox B</text>
  <text x="804" y="305" font-size="16" font-weight="400" fill="#526072">A different conversation key</text>
  <rect x="857" y="369" width="218" height="109" rx="12" fill="#fff5e7" stroke="#c88a37" stroke-width="1.5"/>
  <text x="877" y="402" font-size="21" font-weight="600" fill="#243040">Call B1</text>
  <text x="877" y="433" font-size="16" font-weight="400" fill="#526072">Own guest path</text>
  <path d="M 966 327 L 966 369" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#four-lifetimes-arrow)"/>
  <rect x="32" y="525" width="536" height="125" rx="12" fill="#f4f5f7" stroke="#7d8694" stroke-width="1.5"/>
  <text x="52" y="558" font-size="21" font-weight="600" fill="#243040">Default: DISPOSE</text>
  <text x="52" y="589" font-size="16" font-weight="400" fill="#526072">Stop new admission when cleanup is queued.</text>
  <text x="52" y="615" font-size="16" font-weight="400" fill="#526072">Delete after active calls drain.</text>
  <rect x="612" y="525" width="536" height="125" rx="12" fill="#f3f0fb" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="632" y="558" font-size="21" font-weight="600" fill="#243040">CALL scope</text>
  <text x="632" y="589" font-size="16" font-weight="400" fill="#526072">Each call receives a separate sandbox.</text>
  <text x="632" y="615" font-size="16" font-weight="400" fill="#526072">Dispose that instance at the end of its call.</text>
</svg>
