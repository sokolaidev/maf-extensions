<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 590" width="1180" height="590" role="img" aria-labelledby="component-types-title component-types-desc" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, Helvetica, Arial, sans-serif">
  <title id="component-types-title">From a MAF application to a sandbox</title>
  <desc id="component-types-desc">The application calls a kind through the MAF adapter. The kind calls the router, which delegates to a backend that manages the sandbox. A kind declares a spec with requirements checked by the router. Kinds and the router use the protocol, which backends implement. An optional observer receives router events. Solid arrows show calls, requirements or events; dashed lines show the shared contract.</desc>
  <defs>
    <marker id="component-types-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8694"/></marker>
  </defs>
  <rect width="1180" height="590" rx="16" fill="#ffffff"/>
  <text x="24" y="42" font-size="25" font-weight="600" fill="#243040">From a MAF application to a sandbox</text>

  <g fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#component-types-arrow)">
    <path d="M 194 322 H 216"/>
    <path d="M 386 322 H 408"/>
    <path d="M 578 322 H 600"/>
    <path d="M 770 322 H 792"/>
    <path d="M 962 322 H 984"/>
    <path d="M 493 270 V 174"/>
    <path d="M 578 132 H 685 V 270"/>
    <path d="M 735 270 V 132 H 792"/>
  </g>
  <g font-size="15" fill="#526072">
    <text x="502" y="223">declares</text>
    <text x="591" y="118">requirements</text>
    <text x="744" y="223">events</text>
  </g>

  <rect x="408" y="90" width="170" height="84" rx="12" fill="#f4f5f7" stroke="#7d8694" stroke-width="1.5"/>
  <text x="428" y="122" font-size="21" font-weight="600" fill="#243040">Spec</text>
  <text x="428" y="151" font-size="16" fill="#526072">Workload needs</text>
  <rect x="792" y="90" width="170" height="84" rx="12" fill="#f3f0fb" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="812" y="122" font-size="21" font-weight="600" fill="#243040">Observer</text>
  <text x="812" y="151" font-size="16" fill="#526072">Optional telemetry</text>

  <rect x="24" y="270" width="170" height="104" rx="12" fill="#f4f5f7" stroke="#7d8694" stroke-width="1.5"/>
  <text x="44" y="305" font-size="21" font-weight="600" fill="#243040">Application</text>
  <text x="44" y="335" font-size="16" fill="#526072">MAF agent</text>
  <text x="44" y="358" font-size="16" fill="#526072">and middleware</text>
  <rect x="216" y="270" width="170" height="104" rx="12" fill="#f3f0fb" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="236" y="305" font-size="21" font-weight="600" fill="#243040">Adapter</text>
  <text x="236" y="335" font-size="16" fill="#526072">MAF tool binding</text>
  <text x="236" y="358" font-size="16" fill="#526072">and result labels</text>
  <rect x="408" y="270" width="170" height="104" rx="12" fill="#f3f0fb" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="428" y="305" font-size="21" font-weight="600" fill="#243040">Kind</text>
  <text x="428" y="335" font-size="16" fill="#526072">Tool workload</text>
  <rect x="600" y="270" width="170" height="104" rx="12" fill="#f4f5f7" stroke="#7d8694" stroke-width="1.5"/>
  <text x="620" y="305" font-size="21" font-weight="600" fill="#243040">Router</text>
  <text x="620" y="335" font-size="16" fill="#526072">Policy checks</text>
  <text x="620" y="358" font-size="16" fill="#526072">and routing</text>
  <rect x="792" y="270" width="170" height="104" rx="12" fill="#e7f5f3" stroke="#2fa8a0" stroke-width="1.5"/>
  <text x="812" y="305" font-size="21" font-weight="600" fill="#243040">Backend</text>
  <text x="812" y="335" font-size="16" fill="#526072">Provider access</text>
  <text x="812" y="358" font-size="16" fill="#526072">and enforcement</text>
  <rect x="984" y="270" width="170" height="104" rx="12" fill="#e7f5f3" stroke="#2fa8a0" stroke-width="1.5"/>
  <text x="1004" y="305" font-size="21" font-weight="600" fill="#243040">Sandbox</text>
  <text x="1004" y="335" font-size="16" fill="#526072">Guest execution</text>

  <g fill="none" stroke="#7d8694" stroke-width="2" stroke-dasharray="6 5">
    <path d="M 493 374 V 450"/>
    <path d="M 685 374 V 450"/>
    <path d="M 877 374 V 450"/>
  </g>
  <text x="426" y="418" font-size="15" fill="#526072">uses</text>
  <text x="619" y="418" font-size="15" fill="#526072">uses</text>
  <text x="885" y="418" font-size="15" fill="#526072">implements</text>
  <rect x="408" y="450" width="554" height="84" rx="12" fill="#f4f5f7" stroke="#7d8694" stroke-width="1.5"/>
  <text x="428" y="482" font-size="21" font-weight="600" fill="#243040">Protocol</text>
  <text x="428" y="511" font-size="16" fill="#526072">Shared interfaces for sandbox operations and lifecycle</text>
  <text x="24" y="568" font-size="16" fill="#526072">Solid arrows: calls, requirements or events. Dashed lines: shared contract.</text>
</svg>
