<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 670" width="1180" height="670" role="img" aria-labelledby="suite-shape-title suite-shape-desc" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, Helvetica, Arial, sans-serif">
  <title id="suite-shape-title">One contract connects kinds to compatible backends</title>
  <desc id="suite-shape-desc">Bicep, CodeAct, draw.io and Terraform or OpenTofu kinds use the shared SandboxSpec and router contract. ACAS, Docker, WSLC, Hyperlight and the in-process test fake implement backend contracts. Kinds and backends do not import one another. A backend serves a kind only when its declarations and acquired environment satisfy the workload. Shell and language-runtime paths have different requirements.</desc>
  <defs>
    <marker id="suite-shape-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8694"/></marker>
  </defs>
  <rect width="1180" height="670" rx="16" fill="#ffffff"/>
  <text x="32" y="43" font-size="25" font-weight="600" fill="#243040">One contract connects kinds to compatible backends</text>
  <text x="32" y="76" font-size="17" font-weight="400" fill="#526072">Kinds describe the workload. Backends provide execution and enforce their declared limits.</text>
  <rect x="32" y="126" width="252" height="106" rx="12" fill="#f3f0fb" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="52" y="159" font-size="21" font-weight="600" fill="#243040">Bicep</text>
  <text x="52" y="190" font-size="16" font-weight="400" fill="#526072">Compile templates</text>
  <path d="M 158 232 L 158 291" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#suite-shape-arrow)"/>
  <rect x="320" y="126" width="252" height="106" rx="12" fill="#f3f0fb" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="340" y="159" font-size="21" font-weight="600" fill="#243040">CodeAct</text>
  <text x="340" y="190" font-size="16" font-weight="400" fill="#526072">Run model-written code</text>
  <path d="M 446 232 L 446 291" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#suite-shape-arrow)"/>
  <rect x="608" y="126" width="252" height="106" rx="12" fill="#f3f0fb" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="628" y="159" font-size="21" font-weight="600" fill="#243040">draw.io</text>
  <text x="628" y="190" font-size="16" font-weight="400" fill="#526072">Export diagrams</text>
  <path d="M 734 232 L 734 291" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#suite-shape-arrow)"/>
  <rect x="896" y="126" width="252" height="106" rx="12" fill="#f3f0fb" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="916" y="159" font-size="21" font-weight="600" fill="#243040">Terraform / OpenTofu</text>
  <text x="916" y="190" font-size="16" font-weight="400" fill="#526072">Validate configuration</text>
  <path d="M 1022 232 L 1022 291" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#suite-shape-arrow)"/>
  <rect x="32" y="291" width="1116" height="127" rx="12" fill="#f4f5f7" stroke="#7d8694" stroke-width="1.5"/>
  <text x="52" y="324" font-size="21" font-weight="600" fill="#243040">SandboxSpec + router</text>
  <text x="52" y="355" font-size="17" font-weight="400" fill="#526072">Match isolation, operations, guest family, limits, network, sharing and authority.</text>
  <text x="52" y="381" font-size="17" font-weight="400" fill="#526072">Kinds and backends depend on core; they do not import one another.</text>
  <path d="M 136 418 L 136 477" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#suite-shape-arrow)"/>
  <rect x="32" y="477" width="208" height="106" rx="12" fill="#e7f5f3" stroke="#2fa8a0" stroke-width="1.5"/>
  <text x="52" y="510" font-size="21" font-weight="600" fill="#243040">ACAS</text>
  <text x="52" y="541" font-size="16" font-weight="400" fill="#526072">Service micro-VM</text>
  <path d="M 363 418 L 363 477" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#suite-shape-arrow)"/>
  <rect x="259" y="477" width="208" height="106" rx="12" fill="#e7f5f3" stroke="#2fa8a0" stroke-width="1.5"/>
  <text x="279" y="510" font-size="21" font-weight="600" fill="#243040">Docker</text>
  <text x="279" y="541" font-size="16" font-weight="400" fill="#526072">Container</text>
  <path d="M 590 418 L 590 477" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#suite-shape-arrow)"/>
  <rect x="486" y="477" width="208" height="106" rx="12" fill="#e7f5f3" stroke="#2fa8a0" stroke-width="1.5"/>
  <text x="506" y="510" font-size="21" font-weight="600" fill="#243040">WSLC</text>
  <text x="506" y="541" font-size="16" font-weight="400" fill="#526072">Linux container</text>
  <path d="M 817 418 L 817 477" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#suite-shape-arrow)"/>
  <rect x="713" y="477" width="208" height="106" rx="12" fill="#e7f5f3" stroke="#2fa8a0" stroke-width="1.5"/>
  <text x="733" y="510" font-size="21" font-weight="600" fill="#243040">Hyperlight</text>
  <text x="733" y="541" font-size="16" font-weight="400" fill="#526072">Python micro-VM</text>
  <path d="M 1044 418 L 1044 477" fill="none" stroke="#7d8694" stroke-width="2" stroke-linejoin="round" marker-end="url(#suite-shape-arrow)"/>
  <rect x="940" y="477" width="208" height="106" rx="12" fill="#e7f5f3" stroke="#2fa8a0" stroke-width="1.5"/>
  <text x="960" y="510" font-size="21" font-weight="600" fill="#243040">In-process</text>
  <text x="960" y="541" font-size="16" font-weight="400" fill="#526072">Test fake</text>
  <text x="32" y="634" font-size="18" font-weight="600" fill="#243040">Compatibility is checked. A shell workload cannot use a runtime-only backend unchanged.</text>
</svg>
