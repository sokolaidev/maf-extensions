<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 280" width="1160" height="280" role="img" aria-labelledby="tool-call-overview-title tool-call-overview-desc" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, Helvetica, Arial, sans-serif">
  <title id="tool-call-overview-title">One tool call through maf-sandbox</title>
  <desc id="tool-call-overview-desc">The agent calls a sandboxed tool. Its kind and wrapper send work through the router and backend to the sandbox. Output returns along the same path. The wrapper completes cleanup before returning the tool result to the agent.</desc>
  <defs>
    <marker id="tool-call-overview-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8694"/></marker>
  </defs>
  <rect width="1160" height="280" rx="16" fill="#ffffff"/>
  <text x="24" y="43" font-size="25" font-weight="600" fill="#243040">One tool call through maf-sandbox</text>
  <rect x="24" y="96" width="224" height="108" rx="12" fill="#f3f0fb" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="44" y="135" font-size="21" font-weight="600" fill="#243040">Agent</text>
  <text x="44" y="169" font-size="16" fill="#526072">Calls an attached tool</text>
  <rect x="308" y="96" width="224" height="108" rx="12" fill="#f3f0fb" stroke="#8b7fd4" stroke-width="1.5"/>
  <text x="328" y="135" font-size="21" font-weight="600" fill="#243040">Sandboxed tool</text>
  <text x="328" y="169" font-size="16" fill="#526072">Kind + wrapper</text>
  <rect x="592" y="96" width="224" height="108" rx="12" fill="#f4f5f7" stroke="#7d8694" stroke-width="1.5"/>
  <text x="612" y="135" font-size="21" font-weight="600" fill="#243040">Router + backend</text>
  <text x="612" y="169" font-size="16" fill="#526072">Connect work to a guest</text>
  <rect x="876" y="96" width="260" height="108" rx="12" fill="#e7f5f3" stroke="#2fa8a0" stroke-width="1.5"/>
  <text x="896" y="135" font-size="21" font-weight="600" fill="#243040">Sandbox</text>
  <text x="896" y="169" font-size="16" fill="#526072">Executes the workload</text>
  <g fill="none" stroke="#7d8694" stroke-width="2" marker-end="url(#tool-call-overview-arrow)">
    <path d="M 248 132 H 308"/>
    <path d="M 532 132 H 592"/>
    <path d="M 816 132 H 876"/>
    <path d="M 308 176 H 248"/>
    <path d="M 592 176 H 532"/>
    <path d="M 876 176 H 816"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#526072">
    <text x="278" y="120">Call</text>
    <text x="562" y="120">Work</text>
    <text x="846" y="120">Work</text>
    <text x="278" y="197">Result</text>
    <text x="562" y="197">Output</text>
    <text x="846" y="197">Output</text>
  </g>
  <text x="24" y="252" font-size="17" fill="#526072">The wrapper completes cleanup before returning the tool result.</text>
</svg>
