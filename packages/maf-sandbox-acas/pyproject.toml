[project]
name = "maf-sandbox-acas"
version = "0.6.2"
description = "Azure Container Apps Sandboxes as a sandbox backend for Microsoft Agent Framework agents — reference implementation of agent-framework#7568."
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{ name = "SOKOLAI BV", email = "info@sokolai.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "azure",
    "container-apps",
    "sandbox",
    "agent-framework",
    "microsoft-agent-framework",
    "isolation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
# azure-containerapps-sandbox is now a HARD dependency (a dependency-honesty flip): the old
# `[aca]` extra that gated it here is retired, and the host's own optionality moved one
# layer up, to a `bicep-sandbox` extra in the host application's own root pyproject.toml
# that pulls this whole package in. A host that installs maf-sandbox-acas at all wants it
# to work; a host that does not configure a sandbox group should not install this package
# in the first place, not install it crippled.
dependencies = [
    # The backend protocol and the router this backend registers with. Floored like
    # maf-sandbox-bicep's copy: unversioned, the published wheel would accept any
    # maf-sandbox ever released, including one from before this protocol existed.
    # Upper-bounded too: maf-sandbox has not yet reached a stable API, so every release
    # before 1.0.0 may include breaking changes (see its CHANGELOG). Moving either end of
    # this range has an order to it — see RELEASING.md.
    # The floor tracks the release carrying the FILES_OUT vocabulary this backend imports at
    # module scope (SandboxEntry, EntryKind, SandboxLimits, TransferLimits); admit anything
    # older and the clean-env wheel smoke resolves it and dies on ImportError. The number
    # itself is below, and `scripts/bump_dependents_floor.py` moves it — so this says which
    # release the floor is for, never which release that is.
    "maf-sandbox>=0.8.0,<0.10",
    # DefaultAzureCredential for the sandbox data plane.
    "azure-identity>=1.25.1,<2",
    # The ACA Sandboxes data-plane SDK — still 0.1.0bN. The version pin lives here and
    # nowhere else; a host reaches it by installing this package (or its `bicep-sandbox`
    # extra), not by naming the SDK itself.
    "azure-containerapps-sandbox>=0.1.0b3,<0.2",
]

[project.urls]
Homepage = "https://www.sokol.ai"
Source = "https://github.com/sokolaidev/maf-extensions"
Issues = "https://github.com/sokolaidev/maf-extensions/issues"

[tool.uv.sources]
maf-sandbox = { workspace = true }

[tool.uv.build-backend]
module-name = "maf_sandbox_acas"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP", "D100", "D101", "D103", "D104"]
ignore = ["UP037"]

[tool.ruff.lint.per-file-ignores]
# ruff resolves [tool.ruff] per file by the NEAREST ancestor pyproject.toml that has one —
# once this package gained its own [tool.ruff] section, the host application's root
# pyproject.toml per-file-ignore entry for this package's tests stopped reaching these
# files, so this package carries its own copy.
"tests/**" = ["D101", "D103"]

# Self-contained type checking, scoped to this package — strict, unlike the host
# application's root config, which runs its own type checker in basic mode. `scripts` is
# included alongside `src` because import_disk_image.py is a standalone operator script
# that ships beside the package, not inside it — the host application's root config
# includes it the same way. `tests/` stays out (fixtures and hand-rolled Azure-SDK-shaped
# fakes, not signal for a strict checker).
[tool.pyright]
include = ["src", "scripts"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"
