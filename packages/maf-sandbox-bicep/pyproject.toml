[project]
name = "maf-sandbox-bicep"
version = "0.9.0"
description = "Sandboxed Bicep validation (bicep build + bicep lint) as a Microsoft Agent Framework tool — reference implementation of agent-framework#7568 — written against maf-sandbox so it runs on any sandbox backend."
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{ name = "SOKOLAI BV", email = "info@sokolai.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "bicep",
    "azure",
    "infrastructure-as-code",
    "sandbox",
    "agent-framework",
    "microsoft-agent-framework",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    # The sandbox protocol this workload is written against — its ONLY infrastructure
    # dependency. No Azure import, no backend import; a test enforces both.
    # Upper-bounded too: maf-sandbox has not yet reached a stable API, so every release
    # before 1.0.0 may include breaking changes (see its CHANGELOG). Moving either end of
    # this range has an order to it — see RELEASING.md.
    "maf-sandbox>=0.19.0,<0.21",
    # The `@tool` decorator and AgentFileStore. MAF is a genuine dependency of the tool
    # itself, not of the host application.
    "agent-framework-core>=1.13.0,<2",
]

[project.urls]
Homepage = "https://www.sokol.ai"
Source = "https://github.com/sokolaidev/maf-extensions"
Issues = "https://github.com/sokolaidev/maf-extensions/issues"

# agent-framework-core is sourced from the monorepo `main` branch. Keep this in sync with
# agent-framework-core resolves from PyPI at the released range declared above — no git
# source in this repository, deliberately: the tests run against the same artifact every
# consumer of the published wheel gets. (maf-sandbox-acas carries no MAF dependency at all.)
[tool.uv.sources]
maf-sandbox = { workspace = true }

[tool.uv.build-backend]
module-name = "maf_sandbox_bicep"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP", "D100", "D101", "D103", "D104", "E501", "W505", "TD", "FIX", "ERA001"]

[tool.ruff.lint.per-file-ignores]
# ruff resolves [tool.ruff] per file by the NEAREST ancestor pyproject.toml that has one —
# once this package gained its own [tool.ruff] section, the host application's root
# pyproject.toml per-file-ignore entry for this package's tests stopped reaching these
# files, so this package carries its own. The length rules are excluded for the same
# reason: test fixtures are hand-shaped strings and calls, not lintable drift.
"tests/**" = ["D101", "D103", "E501", "W505"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

# Self-contained type checking, scoped to this package — strict, unlike the host
# application's root config, which runs its own type checker in basic mode. `tests/` stays
# out (fixtures, not signal for a strict checker).
[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"
