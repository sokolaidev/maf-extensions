[project]
name = "maf-aca-sandboxes"
version = "0.1.0"
description = "Azure Container Apps Sandboxes as a sandbox backend for Microsoft Agent Framework agents (issue #408)."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    # The backend protocol and the router this backend registers with.
    "sandbox-router",
    # DefaultAzureCredential for the sandbox data plane.
    "azure-identity>=1.25.1,<2",
]

[project.optional-dependencies]
# The ACA Sandboxes data-plane SDK — still 0.1.0bN, and only needed once a sandbox group is
# actually configured, so it stays optional and every entry point degrades without it. The
# pin lives here and nowhere else; a host reaches it through its own extra.
aca = [
    "azure-containerapps-sandbox==0.1.0b3",
]

[tool.uv.sources]
sandbox-router = { workspace = true }

[tool.uv.build-backend]
module-name = "maf_aca_sandboxes"
module-root = "src"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"
