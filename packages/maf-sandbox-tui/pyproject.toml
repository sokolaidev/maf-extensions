[project]
name = "maf-sandbox-tui"
version = "0.3.1"
description = "A local operator console for inspecting and disposing maf-sandbox instances."
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{ name = "SOKOLAI BV", email = "info@sokolai.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "tui",
    "sandbox",
    "hyperlight",
    "agent-framework",
    "microsoft-agent-framework",
    "monitoring",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "maf-sandbox>=0.44.0,<0.45",
    "packaging>=24,<27",
    "textual>=6,<8",
]

[project.scripts]
mst = "maf_sandbox_tui.cli:main"

[project.urls]
Homepage = "https://www.sokol.ai"
Source = "https://github.com/sokolaidev/maf-extensions"
Issues = "https://github.com/sokolaidev/maf-extensions/issues"

[tool.uv.sources]
maf-sandbox = { workspace = true }

[tool.uv.build-backend]
module-name = "maf_sandbox_tui"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP", "D100", "D101", "D103", "D104", "E501", "W505", "TD", "FIX", "ERA001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D101", "D103", "E501", "W505"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"
